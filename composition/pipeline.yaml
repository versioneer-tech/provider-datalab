apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: datalab
spec:
  compositeTypeRef:
    apiVersion: pkg.internal/v1
    kind: Datalab
  mode: Pipeline
  pipeline:
  - step: load-datalab-environment
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/load-datalab-environment.py
  - step: validate-data-exposure
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/validate-data-exposure.py
  - step: observe-connection-secrets
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/observe-connection-secrets.py
  - step: publish-service-connections
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/publish-service-connections.py
  - step: update-keycloak-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/update-keycloak-objects.py
  - step: update-oauth2-proxy-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/update-oauth2-proxy-secret.py
  - step: update-datalab-resources
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/update-datalab-resources.py
  - step: update-runtime-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/update-runtime-secret.py
  - step: update-vclusters
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/update-vclusters.py
  - step: update-data-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/update-data-objects.py
  - step: update-postgres-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/update-postgres-objects.py
  - step: update-mongodb-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/update-mongodb-objects.py
  - step: update-redis-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/update-redis-objects.py
  - step: publish-vcluster-connections
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/publish-vcluster-connections.py
  - step: bind-vcluster-secrets
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/bind-vcluster-secrets.py
  - step: encode-provider-secrets
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/encode-provider-secrets.py
  - step: protect-vcluster-resources
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      scriptFile: steps/protect-vcluster-resources.py
  - step: check-resource-readiness
    functionRef:
      name: crossplane-contrib-function-auto-ready
