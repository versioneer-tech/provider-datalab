apiVersion: versioneer.at/v1
kind: Datalab
metadata:
  name: s-joe
  namespace: workspace
spec:
  users: [joe]
  volumes:
    demo:
      backups: true
      storage: 1Gi
  vclusters:
    vc0:
      storage: 5Gi
      volumeBindings:
      - name: demo
        target:
          namespace: demo
          name: demo
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
      - name: cluster-admin
        namespace: "*"
        role: cluster-admin
  stores:
    pg0:
      type: postgres
      names: [catalog]
      storage: 5Gi
