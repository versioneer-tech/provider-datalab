apiVersion: v1
kind: Pod
metadata:
  name: volume-demo
  namespace: demo
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: files
    image: python:3.13-alpine
    command: [python, -c, 'import time; time.sleep(3600)']
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
    volumeMounts:
    - name: files
      mountPath: /data
  volumes:
  - name: files
    persistentVolumeClaim:
      claimName: demo
