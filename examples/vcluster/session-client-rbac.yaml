apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-client
  namespace: demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-client
  namespace: demo
rules:
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxclaims]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxtemplates, sandboxwarmpools]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods, persistentvolumeclaims]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods/portforward]
  verbs: [get, create]
- apiGroups: ['']
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-client
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-client
subjects:
- kind: ServiceAccount
  name: session-client
  namespace: demo
