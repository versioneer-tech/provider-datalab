apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: datalab
data:
  images:
    sandbox: registry.k8s.io/agent-sandbox/agent-sandbox-controller:v1.0.10
    sandboxd: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandboxd:v20261108-v1.0.10-23-g653e16f
  iam:
    realm: acme
    redirectURIs: []
    webOrigins: []
  ingress:
    class: nginx
    domain: lab.acme.com
    secret: wildcard-tls
  storage:
    endpoint: https://s3.acme.com
    forcePathStyle: 'true'
    provider: Other
    region: acme
    secretNamespace: datalab
    type: s3
  network:
    externalEgressCIDRs:
    - 0.0.0.0/0
    - ::/0
    serviceCIDR: 10.43.0.0/16
    podCIDRs:
    - 10.42.0.0/16
    blacklistIPs:
    - 169.254.169.254/32
    - fd00:ec2::254/128
    - 169.254.42.42/32
    - fd00:42::42/128
    internalEgress:
    - namespace: minio
      podSelector:
        matchLabels:
          v1.min.io/tenant: default
      ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 9000
    excludePolicies: []
  defaults:
    data:
      enabled: true
      readOnlyMount: false
    overallQuota:
      storage: 100Gi
      hard:
        requests.cpu: '4'
        requests.memory: 8Gi
        limits.cpu: '16'
        limits.memory: 32Gi
    limitRange:
      default:
        cpu: '1'
        memory: 512Mi
        ephemeral-storage: 8Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 3Gi
    security:
      policy: baseline
      externalEgress: true
  database:
    tlsRoute:
      parentName: default
      parentNamespace: projectcontour
      sectionName: postgres-passthrough
    storageClassName: ''
    backupStorageClassName: ''
  vcluster:
    storageClasses:
      allowed:
      - standard
      default: standard
