# Example platform-side protection for Educates workshop sessions rendered by
# Provider Datalab. This uses NGINX Ingress external auth annotations and a
# separately operated oauth2-proxy deployment.
#
# Adapt namespaces, issuer names, storage settings, and oauth2-proxy endpoints
# for your cluster.
# Requires the Kyverno policies.kyverno.io/v1 API.
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: datalab
data:
  iam:
    realm: acme
  ingress:
    class: nginx
    domain: lab.acme.com
    secret: wildcard-tls
  storage:
    endpoint: https://s3.acme.com
    provider: Other
    region: acme
    forcePathStyle: "true"
    secretNamespace: datalab
    type: s3
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: workspace-cert
  namespace: workspace
spec:
  dnsNames:
    - "*.lab.acme.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns-prod
  secretName: wildcard-tls
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: protect-workshop-sessions-nginx
spec:
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses
  matchConditions:
    - name: is-workshop-session
      expression: >-
        has(object.metadata.labels) &&
        'training.educates.dev/application' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/application'] == 'workshop' &&
        'training.educates.dev/component' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/component'] == 'session'
    - name: uses-nginx
      expression: >-
        has(object.spec.ingressClassName) &&
        object.spec.ingressClassName == 'nginx'
    - name: uses-datalab-domain
      expression: >-
        has(object.spec.rules) &&
        object.spec.rules.exists(rule, has(rule.host) && rule.host.endsWith('.lab.acme.com'))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              annotations: {
                "nginx.ingress.kubernetes.io/auth-url": "https://auth.lab.acme.com/oauth2/auth",
                "nginx.ingress.kubernetes.io/auth-signin": "https://auth.lab.acme.com/oauth2/start?rd=https://$host$escaped_request_uri",
                "nginx.ingress.kubernetes.io/auth-response-headers": "Authorization,X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
              }
            }
          }
