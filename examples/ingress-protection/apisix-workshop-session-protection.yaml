# Example platform-side protection for Educates workshop sessions rendered by
# Provider Datalab. This uses APISIX openid-connect, the APISIX OPA plugin,
# and a central platform OAuth client for shared browser session ingress.
#
# Adapt namespaces, issuer names, storage settings, and the OIDC discovery URL
# for your cluster. The important Datalab-side setting is auth.type: delegated.
# These CEL policies require Kyverno v1.19.1 or later.
#
# The generated <datalab>-oauth2-client Secret remains the Datalab-scoped
# machine credential for client-credentials automation and services owned by
# one Datalab. It is intentionally not used as the shared browser-ingress
# credential in this example.
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: datalab
data:
  iam:
    realm: acme
  auth:
    type: delegated
  ingress:
    class: apisix
    domain: lab.acme.org
    secret: workspace-tls
  storage:
    endpoint: https://s3.acme.org
    provider: Other
    region: acme
    force_path_style: "true"
    secretNamespace: workspace
    type: s3
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: workspace-cert
  namespace: workspace
spec:
  dnsNames:
    - "*.lab.acme.org"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns-prod
  secretName: workspace-tls
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:datalab-session-apisix-pluginconfigs
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups:
      - apisix.apache.org
    resources:
      - apisixpluginconfigs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-workshop-session-apisix-pluginconfigs
spec:
  evaluation:
    synchronize:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses
  matchConditions:
    - name: is-workshop-session
      expression: >-
        has(object.metadata.labels) &&
        'training.educates.dev/application' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/application'] == 'workshop' &&
        'training.educates.dev/component' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/component'] == 'session'
    - name: uses-apisix
      expression: >-
        has(object.spec.ingressClassName) &&
        object.spec.ingressClassName == 'apisix'
    - name: uses-datalab-domain
      expression: >-
        has(object.spec.rules) &&
        object.spec.rules.exists(rule, has(rule.host) && rule.host.endsWith('.lab.acme.org'))
    - name: has-datalab-name
      expression: >-
        'training.educates.dev/environment.name' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/environment.name'] != ''
  variables:
    - name: environmentName
      expression: object.metadata.labels['training.educates.dev/environment.name']
    - name: targetNamespace
      expression: object.metadata.namespace
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: apisix.apache.org/v2
          kind: ApisixPluginConfig
          metadata:
            name: datalab-session-oidc-(( variables.environmentName ))
            namespace: (( variables.targetNamespace ))
            labels:
              training.educates.dev/application: workshop
              training.educates.dev/component: session
              training.educates.dev/environment.name: (( variables.environmentName ))
          spec:
            plugins:
              - name: openid-connect
                enable: true
                config:
                  discovery: "https://iam-auth.acme.org/realms/acme/.well-known/openid-configuration"
                  use_jwks: true
                  bearer_only: false
                  scope: openid profile email roles
                  client_id: datalab-sessions
                  client_secret: ""
                  session:
                    secret: (( random.random('[A-Za-z0-9]{32}') ))
                  access_token_in_authorization_header: true
                  set_access_token_header: true
                  set_id_token_header: false
                  set_userinfo_header: false
                  set_refresh_token_header: false
              - name: opa
                enable: true
                config:
                  host: http://opa.iam:8181
                  policy: example/datalab/session
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: annotate-workshop-sessions-for-apisix
spec:
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses
  matchConditions:
    - name: is-workshop-session
      expression: >-
        has(object.metadata.labels) &&
        'training.educates.dev/application' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/application'] == 'workshop' &&
        'training.educates.dev/component' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/component'] == 'session'
    - name: uses-apisix
      expression: >-
        has(object.spec.ingressClassName) &&
        object.spec.ingressClassName == 'apisix'
    - name: uses-datalab-domain
      expression: >-
        has(object.spec.rules) &&
        object.spec.rules.exists(rule, has(rule.host) && rule.host.endsWith('.lab.acme.org'))
    - name: has-datalab-name
      expression: >-
        'training.educates.dev/environment.name' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/environment.name'] != ''
  variables:
    - name: environmentName
      expression: object.metadata.labels['training.educates.dev/environment.name']
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              annotations: {
                "k8s.apisix.apache.org/plugin-config-name": "datalab-session-oidc-" + variables.environmentName
              }
            }
          }
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: set-apisix-class-for-workspace-registries
spec:
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - ingresses
  matchConditions:
    - name: is-registry-session
      expression: >-
        has(object.metadata.labels) &&
        'training.educates.dev/application' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/application'] == 'registry' &&
        'training.educates.dev/component' in object.metadata.labels &&
        object.metadata.labels['training.educates.dev/component'] == 'session'
    - name: needs-apisix-class
      expression: >-
        !has(object.spec.ingressClassName) ||
        object.spec.ingressClassName != 'apisix'
    - name: uses-datalab-domain
      expression: >-
        has(object.spec.rules) &&
        object.spec.rules.exists(rule, has(rule.host) && rule.host.endsWith('.lab.acme.org'))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              ingressClassName: "apisix"
            }
          }
