# The custom environment supplies the workspace StorageClass and file bundles.
# John has both API keys. Each declared session keeps its PVC.
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: s-john
  annotations:
    datalabs.pkg.internal/environment: datalab-custom
spec:
  users:
  - john
  sessions:
  - name: default
  - name: analysis
    state: stopped
