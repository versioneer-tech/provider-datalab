apiVersion: versioneer.at/v1
kind: Datalab
metadata:
  name: s-jeff
spec:
  users:
    - jeff
    - jim
    - jane
  userOverrides:
    jim:
      grantedAt: "2025-01-10T19:00:00Z"
      role: admin
  stores:
    pg0:
      type: postgres
      names:
      - dev
      - prod
      storage: 1Gi
      backups: true
    cache:
      type: redis
      names: [prod]
      storage: 1Gi
      backups: true
