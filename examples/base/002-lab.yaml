# The default environment supplies baseline session settings. This example
# requests shared stores and writable Data without a session.
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: s-jeff
spec:
  users:
    - jeff
    - jim
    - jane
  userOverrides:
    jim:
      grantedAt: "2025-01-10T19:00:00Z"
      role: admin
  secretName: s-jeff
  documentStores:
    prod:
      type: mongo
      storage: 1Gi
      backupStorage: 3Gi
  cacheStores:
    prod:
      type: redis
      storage: 1Gi
      backupStorage: 3Gi
  databases:
    pg0:
      type: postgres
      names:
      - dev
      - prod
      storage: 1Gi
      backupStorage: 3Gi
