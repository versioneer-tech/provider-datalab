# The custom environment sets service, storage, and network policy.
apiVersion: versioneer.at/v1
kind: Datalab
metadata:
  name: s-jane
spec:
  environmentName: datalab-custom
  users:
    - jane
  volumes:
    analysis:
      backups: true
      storage: 2Gi
  vclusters:
    vc0:
      storage: 1Gi
      volumeBindings:
      - name: analysis
        target:
          namespace: demo
          name: analysis
      secretBindings:
      - type: postgres
        name: pg0
        target:
          namespace: applications
          name: database-credentials
      - type: custom
        name: apikey-1
        target:
          namespace: applications
          name: apikey-1
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
  stores:
    pg0:
      type: postgres
      names:
      - analytics
      storage: 1Gi
      backups: true
