# The custom environment sets service, storage, and network policy.
apiVersion: versioneer.at/v1
kind: Datalab
metadata:
  name: s-jane
  annotations:
    datalabs.versioneer.at/environment: datalab-custom
spec:
  users:
    - jane
  sessions:
  - name: analysis
    vcluster: vc0
    namespace: demo
    pvcSize: 2Gi
  databases:
    pg0:
      names:
      - analytics
      storage: 1Gi
      backupStorage: 3Gi
  vclusters:
    vc0:
      storage: 1Gi
      secretBindings:
      - type: postgres
        name: pg0
        target:
          namespace: applications
          name: database-credentials
      - type: custom
        name: apikey-1
        target:
          namespace: applications
          name: apikey-1
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
