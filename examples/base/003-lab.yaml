# quotas, vCluster, and Gateway access. Jane requests PostgreSQL.
apiVersion: pkg.internal/v1
kind: Datalab
metadata:
  name: s-jane
  annotations:
    datalabs.pkg.internal/environment: datalab-custom
spec:
  users:
    - jane
  secretName: s-jane
  databases:
    pg0:
      names:
      - analytics
      storage: 1Gi
      backupStorage: 3Gi
  vclusters:
    vc0:
      secretBindings:
        catalog-database:
          export: analytics-reader
          target:
            namespace: demo
            name: catalog-database
          keys:
            url: DATABASE_URL
      storage: 1Gi
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
      - name: cluster-admin
        namespace: "*"
        role: cluster-admin
