# The custom environment supplies privileged sessions, registry, file bundles,
# quotas, vCluster, and Gateway access. Jane requests PostgreSQL.
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: s-jane
  annotations:
    datalabs.pkg.internal/environment: datalab-custom
spec:
  users:
    - jane
  secretName: s-jane
  sessions:
    - name: default
      state: started
  databases:
    pg0:
      names:
      - analytics
      storage: 1Gi
      backupStorage: 3Gi
