# The custom environment supplies privileged sessions, registry, file bundles,
# quotas, vCluster, and Gateway access. Jane uses PostgreSQL and apikey-1.
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: s-jane
  annotations:
    datalabs.pkg.internal/environment: datalab-custom
spec:
  users:
    - jane
  sessions:
    - name: default
      state: started
  databases:
    pg0:
      names:
      - analytics
      storage: 1Gi
      backupStorage: 3Gi
  vclusters:
    vc0:
      storage: 1Gi
      secretBindings:
      - type: postgres
        name: pg0
        target:
          namespace: applications
          name: database-credentials
      - type: custom
        name: apikey-1
        target:
          namespace: applications
          name: apikey-1
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
