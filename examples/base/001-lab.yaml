# Joe gets a personal datalab s-joe with no pre-created session.
# He must explicitly declare and start a session himself. The shared Data service
# still runs because the Data component is enabled by default.
# The custom environment enables Gateway exposure and experimental read-only S3.
# The composed S3 policy permits IAM egress. Public CORS permits all origins.
# No vcluster is provisioned and no workshop files are attached.
# Credentials to storage are expected to exist in a secret "s-joe" in the same namespace.
# A Keycloak group, role, and client are created; user "joe" must exist in the configured Keycloak realm.
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: s-joe
  annotations:
    datalabs.pkg.internal/environment: datalab-custom
spec:
  users:
  - joe
  secretName: s-joe
