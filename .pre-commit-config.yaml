default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: composition-current
        name: Generated composition is current
        entry: python scripts/build-composition.py --check
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(composition/|templates/|scripts/vcluster-credentials.py|scripts/build-composition.py|scripts/requirements.txt|composition.yaml)
      - id: copyright-header
        name: Copyright header
        entry: ./scripts/copyright.py
        language: system
        types_or: [yaml]
