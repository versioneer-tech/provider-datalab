            initContainers:
            - args:
              - |
                set -eu

                database=/state/package-r.db
                work_database=/state/package-r.db.new

                rm -f "$work_database"
                export PACKAGE_R_DATABASE="$work_database"

                /package-r config init   --address=0.0.0.0   --port=8888   --auth.method=proxy   --auth.header=X-Forwarded-Preferred-Username   --auth.mapper=

