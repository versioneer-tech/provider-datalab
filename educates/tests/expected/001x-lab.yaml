apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: workshop-s-joe
  labels:
    crossplane.io/composite: s-joe
  name: workshop-s-joe
  namespace: default
  ownerReferences:
  - apiVersion: pkg.internal/v1beta2
    blockOwnerDeletion: true
    controller: true
    kind: Datalab
    name: s-joe
    uid: 31b8ad0c-a886-53dd-b8b9-5188f2bb2235
spec:
  forProvider:
    manifest:
      apiVersion: training.educates.dev/v1beta1
      kind: Workshop
      metadata:
        name: s-joe
      spec:
        description: A default DataLab environment.
        environment:
          objects:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: deny-egress
            spec:
              egress: []
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-namespace-egress
            spec:
              egress:
              - to:
                - podSelector: {}
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-dns-egress
            spec:
              egress:
              - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
                to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-external-egress
            spec:
              egress:
              - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
                    except:
                    - 169.254.169.254/32
                    - 169.254.42.42/32
                    - 10.42.0.0/16
                    - 10.43.0.0/16
              - to:
                - ipBlock:
                    cidr: ::/0
                    except:
                    - fd00:ec2::254/128
                    - fd00:42::42/128
              podSelector: {}
              policyTypes:
              - Egress
          secrets:
          - name: s-joe-datalab
            namespace: default
        session:
          applications:
            console:
              enabled: false
            editor:
              enabled: true
            slides:
              enabled: false
            terminal:
              enabled: true
            vcluster:
              enabled: false
              services:
                fromHost: []
              version: "1.34"
            workshop:
              enabled: false
          dashboards:
          - name: Data
            url: https://s-joe.lab.acme.com/
          envFrom:
          - secretRef:
              name: s-joe-datalab
          ingresses: []
          namespaces:
            budget: medium
            role: edit
            security:
              policy: baseline
              token:
                enabled: true
          objects: []
          resources:
            memory: 2Gi
            storage: 1Gi
        title: Default DataLab
        version: "1.0"
        workshop:
          files: []
          packages:
          - files:
            - image:
                url: ghcr.io/versioneer-tech/educates-extension-packages/awscli:v2.29.0
            name: awscli
          - files:
            - image:
                url: ghcr.io/versioneer-tech/educates-extension-packages/rclone:v1.71.0
            name: rclone
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
---
