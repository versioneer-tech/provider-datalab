apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  annotations:
    crossplane.io/composition-resource-name: workshop-s-john
  labels:
    crossplane.io/composite: s-john
  name: workshop-s-john
  namespace: default
  ownerReferences:
  - apiVersion: pkg.internal/v1beta2
    blockOwnerDeletion: true
    controller: true
    kind: Datalab
    name: s-john
    uid: 84a7f8c4-468a-5af5-9db5-ed1902b1000c
spec:
  forProvider:
    manifest:
      apiVersion: training.educates.dev/v1beta1
      kind: Workshop
      metadata:
        name: s-john
      spec:
        description: A default DataLab environment.
        environment:
          objects:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: deny-egress
            spec:
              egress: []
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-namespace-egress
            spec:
              egress:
              - to:
                - podSelector: {}
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-dns-egress
            spec:
              egress:
              - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
                to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-external-egress
            spec:
              egress:
              - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
                    except:
                    - 169.254.169.254/32
                    - 169.254.42.42/32
                    - 10.42.0.0/16
                    - 10.43.0.0/16
              - to:
                - ipBlock:
                    cidr: ::/0
                    except:
                    - fd00:ec2::254/128
                    - fd00:42::42/128
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-internal-egress
            spec:
              egress:
              - ports:
                - port: 443
                  protocol: TCP
                - port: 9000
                  protocol: TCP
                to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: minio
                  podSelector:
                    matchLabels:
                      v1.min.io/tenant: default
              podSelector: {}
              policyTypes:
              - Egress
          secrets:
          - name: s-john-datalab
            namespace: default
        session:
          applications:
            console:
              enabled: false
            editor:
              enabled: true
            slides:
              enabled: false
            terminal:
              enabled: true
            vcluster:
              enabled: false
              services:
                fromHost: []
              version: "1.34"
            workshop:
              enabled: true
          dashboards:
          - name: Data
            url: $(ingress_protocol)://data-$(session_name).$(ingress_domain)/
          envFrom:
          - secretRef:
              name: s-john-datalab
          ingresses:
          - authentication:
              type: session
            headers:
            - name: X-Package-R-User
              value: datalab
            host: package-r.$(workshop_namespace).svc.$(cluster_domain)
            name: data
            port: 8888
            protocol: http
          namespaces:
            budget: medium
            role: edit
            security:
              policy: baseline
              token:
                enabled: true
          objects: []
          resources:
            memory: 2Gi
            volume:
              name: $(session_name)-persistent
        title: Default DataLab
        version: "1.0"
        workshop:
          files:
          - git:
              ref: origin/main
              url: https://github.com/versioneer-tech/datalab-example
            includePaths:
            - /workshop/**
            - /data/**
            - /README.md
            path: .
          packages:
          - files:
            - image:
                url: ghcr.io/versioneer-tech/educates-extension-packages/awscli:v2.29.0
            name: awscli
          - files:
            - image:
                url: ghcr.io/versioneer-tech/educates-extension-packages/rclone:v1.71.0
            name: rclone
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
---
