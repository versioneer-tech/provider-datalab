    crossplane.io/composite: s-john
  name: data-deployment-s-john
  namespace: default
  ownerReferences:
  - apiVersion: pkg.internal/v1beta2
    blockOwnerDeletion: true
    controller: true
    kind: Datalab
    name: s-john
    uid: 84a7f8c4-468a-5af5-9db5-ed1902b1000c
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          app.kubernetes.io/instance: s-john
          app.kubernetes.io/name: package-r
        name: package-r
        namespace: s-john
      spec:
        replicas: 1
        revisionHistoryLimit: 2
        selector:
          matchLabels:
            app.kubernetes.io/instance: s-john
            app.kubernetes.io/name: package-r
        strategy:
          type: Recreate
        template:
          metadata:
            annotations:
              datalabs.pkg.internal/storage-secret-checksum: 7c21af0ce164252960c22e7ea6aba8992d11e70d137a8c9a0ead0a8a76face50
            labels:
              app.kubernetes.io/instance: s-john
              app.kubernetes.io/name: package-r
          spec:
            automountServiceAccountToken: false
            containers:
            - env:
              - name: HOME
                value: /tmp
              - name: PACKAGE_R_DATABASE
                value: /state/package-r.db
              - name: PACKAGE_R_ADDRESS
                value: 0.0.0.0
              - name: PACKAGE_R_PORT
                value: "8888"
              - name: PACKAGE_R_ROOT
                value: /
              - name: PACKAGE_R_BUCKETS
                value: ""
              - name: XDG_CACHE_HOME
                value: /cache
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    key: AWS_ACCESS_KEY_ID
                    name: s-john-datalab
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    key: AWS_SECRET_ACCESS_KEY
                    name: s-john-datalab
              - name: AWS_SESSION_TOKEN
                valueFrom:
                  secretKeyRef:
                    key: AWS_SESSION_TOKEN
                    name: s-john-datalab
                    optional: true
              - name: AWS_ENDPOINT_URL
                valueFrom:
                  secretKeyRef:
                    key: AWS_ENDPOINT_URL
                    name: s-john-datalab
              - name: AWS_REGION
                valueFrom:
                  secretKeyRef:
                    key: AWS_REGION
                    name: s-john-datalab
              image: ghcr.io/versioneer-tech/package-r:vnext.1.1.0
              imagePullPolicy: IfNotPresent
              livenessProbe:
                httpGet:
                  path: /health
                  port: package-r
                periodSeconds: 20
              name: package-r
              ports:
              - containerPort: 8888
                name: package-r
                protocol: TCP
              readinessProbe:
                httpGet:
                  path: /health
                  port: package-r
                periodSeconds: 10
              resources:
                limits:
                  cpu: "2"
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 100
                runAsUser: 1000
              startupProbe:
                failureThreshold: 30
                httpGet:
                  path: /health
                  port: package-r
                periodSeconds: 5
              volumeMounts:
              - mountPath: /state
                name: state
              - mountPath: /cache
                name: cache
              - mountPath: /tmp
                name: tmp
            initContainers:
            - args:
              - |
                set -eu

                database=/state/package-r.db
                work_database=/state/package-r.db.new

                rm -f "$work_database"
                export PACKAGE_R_DATABASE="$work_database"

                /package-r config init   --address=0.0.0.0   --port=8888   --auth.method=proxy   --auth.header=X-Forwarded-Preferred-Username   --auth.mapper=

                /package-r users add default ""
                /package-r users add datalab '' --perm.create=true --perm.delete=true --perm.modify=true --perm.rename=true
                /package-r users add john '' --perm.create=true --perm.delete=true --perm.modify=true --perm.rename=true
                /package-r shares add default public /s-john/public   --password=""   --description="default public share"   --catalog-name=catalog.parquet

                mv "$work_database" "$database"
              command:
              - /bin/sh
              - -ec
              image: ghcr.io/versioneer-tech/package-r:vnext.1.1.0
              imagePullPolicy: IfNotPresent
              name: prepare-database
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 100
                runAsUser: 1000
              volumeMounts:
              - mountPath: /state
                name: state
              - mountPath: /tmp
                name: tmp
            nodeSelector:
              kubernetes.io/arch: amd64
            securityContext:
              fsGroup: 100
              fsGroupChangePolicy: OnRootMismatch
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            terminationGracePeriodSeconds: 30
            volumes:
            - emptyDir:
                sizeLimit: 64Mi
              name: state
            - emptyDir:
                sizeLimit: 10Gi
              name: cache
            - emptyDir:
                sizeLimit: 256Mi
              name: tmp
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration
      >= object.metadata.generation && has(object.status.availableReplicas) && object.status.availableReplicas
      >= 1
    policy: DeriveFromCelQuery
  watch: true
