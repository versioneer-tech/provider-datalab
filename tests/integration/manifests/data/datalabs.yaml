apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: __ENABLED_DATALAB__
  namespace: __WORKSPACE_NAMESPACE__
  annotations:
    datalabs.pkg.internal/environment: datalab-minio
spec:
  users: []
  secretName: __ENABLED_STORAGE_SECRET__
  sessions: []
  data:
    enabled: true
    readOnlyMount: false
  registry:
    enabled: false
  security:
    kubernetesAccess: false
    externalEgress: false
---
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: __DISABLED_DATALAB__
  namespace: __WORKSPACE_NAMESPACE__
  annotations:
    datalabs.pkg.internal/environment: datalab-minio
spec:
  users: []
  secretName: __DISABLED_STORAGE_SECRET__
  sessions: []
  data:
    enabled: false
  registry:
    enabled: false
  security:
    kubernetesAccess: false
    externalEgress: false
