apiVersion: v1
kind: Pod
metadata:
  name: __PROBE_NAME__
  namespace: __PROBE_NAMESPACE__
  labels:
    training.educates.dev/application: workshop
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: __CLIENT_IMAGE__
      env:
        - name: DATA_READ_ONLY
          value: "__DATA_READ_ONLY__"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: __DATALAB_SECRET__
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: __DATALAB_SECRET__
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: __DATALAB_SECRET__
              key: AWS_ENDPOINT_URL
      command:
        - /bin/sh
        - -ec
      args:
        - |
          endpoint=http://package-r:8888
          curl --fail --silent --show-error "${endpoint}/health"
          token="$(curl --fail --silent --show-error \
            --request POST \
            --header 'X-Forwarded-Preferred-Username: datalab' \
            "${endpoint}/api/login")"
          test -n "${token}"
          bucket=xyz-datalab-verify
          payload=xyz-datalab-probe
          if [ "${DATA_READ_ONLY}" = false ]; then
            # Object-storage buckets are a prerequisite supplied outside Datalab.
            status="$(curl --silent --show-error --output /tmp/xyz-bucket-response \
              --write-out '%{http_code}' --request PUT --data '' \
              --aws-sigv4 'aws:amz:us-east-1:s3' \
              --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
              "${AWS_ENDPOINT_URL}/${bucket}")"
            case "${status}" in
              200|409) ;;
              *) cat /tmp/xyz-bucket-response; exit 1 ;;
            esac
            curl --fail --silent --show-error --head \
              --aws-sigv4 'aws:amz:us-east-1:s3' \
              --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
              "${AWS_ENDPOINT_URL}/${bucket}" >/dev/null
            curl --fail --silent --show-error --request POST \
              --header "X-Auth: ${token}" --data-binary "${payload}" \
              "${endpoint}/api/resources/${bucket}/probe.txt?override=true"
          fi
          listing="$(curl --fail --silent --show-error \
            --header "X-Auth: ${token}" "${endpoint}/api/resources/")"
          printf '%s' "${listing}" | grep -Fq "${bucket}"
          resource="$(curl --fail --silent --show-error \
            --header "X-Auth: ${token}" \
            "${endpoint}/api/resources/${bucket}/probe.txt")"
          printf '%s' "${resource}" | grep -Fq "${payload}"
          if [ "${DATA_READ_ONLY}" = true ]; then
            status="$(curl --silent --show-error --output /tmp/xyz-write-response \
              --write-out '%{http_code}' --request POST \
              --header "X-Auth: ${token}" --data-binary "${payload}" \
              "${endpoint}/api/resources/${bucket}/denied.txt")"
            test "${status}" = 403
          fi
          printf 'PASS Data bucket discovery, file read, and read-only=%s permissions\n' "${DATA_READ_ONLY}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
