apiVersion: v1
kind: Pod
metadata:
  name: __PROBE_NAME__
  namespace: __PROBE_NAMESPACE__
  labels:
    training.educates.dev/application: workshop
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: __CLIENT_IMAGE__
      command:
        - /bin/sh
        - -ec
      args:
        - |
          endpoint=http://package-r:8888
          curl --fail --silent --show-error "${endpoint}/health"
          token="$(curl --fail --silent --show-error \
            --request POST \
            --header 'X-Forwarded-Preferred-Username: datalab' \
            "${endpoint}/api/login")"
          test -n "${token}"
          curl --fail --silent --show-error \
            --header "X-Auth: ${token}" \
            "${endpoint}/api/resources/"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
