# Fixed credentials for MinIO in the disposable integration cluster.
apiVersion: v1
kind: Secret
metadata:
  name: __ENABLED_STORAGE_SECRET__
  namespace: __WORKSPACE_NAMESPACE__
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_ENDPOINT_URL: __PACKAGE_R_ENDPOINT__
  AWS_REGION: us-east-1
  AWS_S3_FORCE_PATH_STYLE: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: __DISABLED_STORAGE_SECRET__
  namespace: __WORKSPACE_NAMESPACE__
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_ENDPOINT_URL: __PACKAGE_R_ENDPOINT__
  AWS_REGION: us-east-1
  AWS_S3_FORCE_PATH_STYLE: "true"
