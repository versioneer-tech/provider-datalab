# The pinned Educates controllers use Kopf CRD discovery at startup.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: educates-crd-discovery
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: educates-crd-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: educates-crd-discovery
subjects:
  - kind: ServiceAccount
    name: secrets-manager
    namespace: educates
  - kind: ServiceAccount
    name: session-manager
    namespace: educates
