apiVersion: v1
kind: Pod
metadata:
  name: __PROBE_NAME__
  namespace: __PROBE_NAMESPACE__
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: registry-check
      image: __CLIENT_IMAGE__
      env:
        - name: REGISTRY_URL
          value: __REGISTRY_URL__
        - name: REGISTRY_USERNAME
          valueFrom:
            secretKeyRef:
              name: __SESSION_SECRET__
              key: registry_username
        - name: REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __SESSION_SECRET__
              key: registry_password
      command:
        - sh
        - -c
        - |
          set -eu
          repository=provider-datalab-verification
          payload=datalab-registry-check
          digest="sha256:$(printf '%s' "${payload}" | sha256sum | cut -d ' ' -f 1)"

          unauthenticated_code="$(curl --silent --output /dev/null \
            --write-out '%{http_code}' "${REGISTRY_URL}/v2/")"
          test "${unauthenticated_code}" = 401

          authenticated_code="$(curl --silent --output /dev/null \
            --write-out '%{http_code}' \
            --user "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            "${REGISTRY_URL}/v2/")"
          test "${authenticated_code}" = 200

          headers=/tmp/registry-upload-headers
          upload_code="$(curl --silent --dump-header "${headers}" \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --user "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            "${REGISTRY_URL}/v2/${repository}/blobs/uploads/")"
          test "${upload_code}" = 202
          location="$(awk 'BEGIN {IGNORECASE=1} /^Location:/ {print $2}' \
            "${headers}" | tr -d '\r' | tail -n 1)"
          test -n "${location}"
          location_path="$(printf '%s' "${location}" | \
            sed -E 's#^https?://[^/]+##')"
          case "${location_path}" in
            *\?*) separator='&' ;;
            *) separator='?' ;;
          esac

          write_code="$(curl --silent --output /dev/null \
            --write-out '%{http_code}' --request PUT \
            --user "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "${payload}" \
            "${REGISTRY_URL}${location_path}${separator}digest=${digest}")"
          test "${write_code}" = 201

          actual="$(curl --fail --silent --show-error \
            --user "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            "${REGISTRY_URL}/v2/${repository}/blobs/${digest}")"
          test "${actual}" = "${payload}"

          printf 'PASS registry authentication and blob write/read verification\n'
