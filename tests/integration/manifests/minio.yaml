# These fixed credentials are only for MinIO in the isolated integration cluster.
apiVersion: v1
kind: Secret
metadata:
  name: default-env-configuration
  namespace: minio
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  accesskey: minioadmin
  secretkey: minioadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: default
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-datalab-minio-it
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provider-datalab-minio-it
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args:
            - server
            - /data
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: default-env-configuration
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: default-env-configuration
                  key: secretkey
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: default-hl
  namespace: minio
spec:
  selector:
    app.kubernetes.io/name: provider-datalab-minio-it
  ports:
    - name: api
      port: 9000
      targetPort: api

