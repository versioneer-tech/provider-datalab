apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: storage-ovh
data:
  storage:
    endpoint: __OVH_ENDPOINT__
    force_path_style: "true"
    provider: Other
    region: __OVH_REGION__
    serviceName: __OVH_PROJECT_ID__
    type: s3

