apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: datalab
  labels:
    datalabs.pkg.internal/name: datalab
data:
  images:
    packageR: ghcr.io/versioneer-tech/package-r:vnext.1.2.0
    registry: registry:3.1.2
    rclone: rclone/rclone:1.76.0
    valkey: valkey/valkey:9.2.0-alpine
    oauth2Proxy: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
  cacheStore:
    maxSnapshots: 2
  iam:
    realm: integration
  ingress:
    class: nginx
    domain: lab.acme.com
    secret: wildcard-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  oauth2Proxy:
    upstreamTimeout: 3600s
  storage:
    endpoint: http://default-hl.minio:9000
    forcePathStyle: "true"
    provider: Minio
    region: us-east-1
    secretNamespace: workspace
  network:
    externalEgressCIDRs:
      - 0.0.0.0/0
    serviceCIDR: 10.96.0.0/16
    podCIDRs:
      - 10.244.0.0/16
    blacklistIPs:
      - 169.254.169.254/32
    internalIngress:
      - namespace: workspace
        podSelector:
          matchLabels:
            app.kubernetes.io/name: datalab-service-probe
        ports:
          - {protocol: TCP, port: 5432}
          - {protocol: TCP, port: 27017}
          - {protocol: TCP, port: 6379}
    internalEgress:
      - namespace: minio
        podSelector:
          matchLabels:
            app.kubernetes.io/name: provider-datalab-minio-it
        ports:
          - protocol: TCP
            port: 9000
  registry:
    enabled: false
  packageR:
    enabled: false
    readOnlyMount: false
  overallQuota:
    storage: 100Gi
  security:
    externalEgress: true
---
