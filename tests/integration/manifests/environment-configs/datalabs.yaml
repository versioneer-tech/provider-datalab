apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: datalab
data:
  images:
    packageR: ghcr.io/versioneer-tech/package-r:vnext.1.1.0
    registry: registry:3.1.2
    rclone: rclone/rclone:1.71.0
    mongo: quay.io/mongodb/mongodb-community-server:8.0.12-ubi8
    mongoBackup: mongo:8.0.12
    redis: quay.io/opstree/redis:v7.0.15
    redisBackup: redis:7.0.15
    oauth2Proxy: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
  iam:
    realm: integration
  ingress:
    class: nginx
    domain: lab.acme.com
    secret: wildcard-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  oauth2Proxy:
    upstreamTimeout: 3600s
  storage:
    endpoint: http://default-hl.minio:9000
    forcePathStyle: "true"
    provider: Minio
    region: us-east-1
    secretNamespace: workspace
    type: s3
  storageClasses:
    allowed:
      - standard
  network:
    externalEgressCIDRs:
      - 0.0.0.0/0
    serviceCIDR: 10.96.0.0/16
    podCIDRs:
      - 10.244.0.0/16
    blacklistIPs:
      - 169.254.169.254/32
    internalEgress:
      - namespace: minio
        podSelector:
          matchLabels:
            app.kubernetes.io/name: provider-datalab-minio-it
        ports:
          - protocol: TCP
            port: 9000
  defaults:
    vcluster:
      enabled: false
    registry:
      enabled: false
    data:
      enabled: false
      readOnlyMount: false
    overallQuota:
      storage: 100Gi
    security:
      kubernetesAccess: false
      externalEgress: true
---
