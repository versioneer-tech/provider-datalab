# Fixed credentials for the disposable in-cluster MinIO prerequisite.
apiVersion: v1
kind: Secret
metadata:
  name: verify-network-closed
  namespace: workspace
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_ENDPOINT_URL: http://default-hl.minio:9000
  AWS_REGION: us-east-1
  AWS_S3_FORCE_PATH_STYLE: "true"
---
