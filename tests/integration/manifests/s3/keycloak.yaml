apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-realm
  namespace: keycloak
data:
  integration-realm.json: |
    {"realm":"integration","enabled":true,"accessTokenLifespan":3600,"users":[{"username":"verify-s3","enabled":true}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.8.1
        args: [start-dev, --import-realm]
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: integration-admin
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: integration-admin
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: JAVA_OPTS_KC_HEAP
          value: -Xms128m -Xmx384m
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /realms/integration
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 768Mi
        volumeMounts:
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
      volumes:
      - name: realm
        configMap:
          name: integration-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: workspace
stringData:
  credentials: |
    {"client_id":"admin-cli","username":"integration-admin","password":"integration-admin","url":"http://keycloak.keycloak:8080","base_path":"","realm":"master"}
---
apiVersion: keycloak.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: provider-keycloak
  namespace: workspace
spec:
  credentialsSecretRef:
    name: keycloak-secret
    key: credentials
