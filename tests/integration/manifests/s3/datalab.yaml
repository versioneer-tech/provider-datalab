apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: verify-s3
  namespace: workspace
  annotations:
    datalabs.pkg.internal/environment: datalab-s3-it
spec:
  users: [verify-s3]
  secretName: verify-s3
  sessions: []
  data:
    enabled: true
  security:
    kubernetesAccess: false
    externalEgress: false
---
apiVersion: v1
kind: Secret
metadata:
  name: verify-s3
  namespace: workspace
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_ENDPOINT_URL: http://default-hl.minio:9000
  AWS_REGION: us-east-1
