apiVersion: versioneer.at/v1
kind: Datalab
metadata:
  name: verify-s3
  namespace: workspace
  annotations:
    datalabs.versioneer.at/environment: datalab-custom
spec:
  users: [verify-s3]
---
apiVersion: v1
kind: Secret
metadata:
  name: verify-s3
  namespace: workspace
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_ENDPOINT_URL: http://default-hl.minio:9000
  AWS_REGION: us-east-1
