apiVersion: versioneer.at/v1
kind: Datalab
metadata:
  name: __DATALAB_NAME__
  namespace: __WORKSPACE_NAMESPACE__
spec:
  environmentName: datalab
  users: [verify-s3]
  stores:
    pg0:
      type: postgres
      names:
        - verify
        - reporting
      storage: 1Gi
      backups: __BACKUPS_ENABLED__
    pg1:
      type: postgres
      names:
      - verify
      storage: 1Gi
      backups: false
