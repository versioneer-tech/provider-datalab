apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-joe
  namespace: workspace
  annotations:
    storages.pkg.internal/environment: storage-aws
spec:
  principal: s-joe
  providerIdentity: s-joe
  buckets:
    - bucketName: __AWS_BUCKET_NAME__
      discoverable: true
  crossplane:
    compositionSelector:
      matchLabels:
        provider: aws

