apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-john
  namespace: workspace
  annotations:
    storages.pkg.internal/environment: storage-ovh
spec:
  principal: s-john
  providerIdentity: s-john
  buckets:
    - bucketName: ovh-__OVH_PROJECT_PREFIX__-s-john
      discoverable: true
  crossplane:
    compositionSelector:
      matchLabels:
        provider: ovh

