apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-jeff
  namespace: workspace
  annotations:
    storages.pkg.internal/environment: storage-minio
spec:
  principal: s-jeff
  providerIdentity: s-jeff
  buckets:
    - bucketName: s-jeff
      discoverable: true
  crossplane:
    compositionSelector:
      matchLabels:
        provider: minio
---
apiVersion: pkg.internal/v1beta1
kind: Storage
metadata:
  name: s-jane
  namespace: workspace
  annotations:
    storages.pkg.internal/environment: storage-minio
spec:
  principal: s-jane
  providerIdentity: s-jane
  buckets:
    - bucketName: s-jane
      discoverable: true
  crossplane:
    compositionSelector:
      matchLabels:
        provider: minio

