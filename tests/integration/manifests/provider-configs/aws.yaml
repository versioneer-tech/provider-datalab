apiVersion: aws.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: provider-aws
  namespace: __WORKSPACE_NAMESPACE__
spec:
  credentials:
    source: Secret
    secretRef:
      name: aws-provider-creds
      namespace: __WORKSPACE_NAMESPACE__
      key: credentials
  assumeRoleChain:
    - roleARN: __AWS_RUNTIME_ROLE_ARN__
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: provider-kubernetes
  namespace: __WORKSPACE_NAMESPACE__
spec:
  credentials:
    source: InjectedIdentity

