apiVersion: ovh.m.edixos.io/v1beta1
kind: ProviderConfig
metadata:
  name: provider-ovh
  namespace: __WORKSPACE_NAMESPACE__
spec:
  credentials:
    source: Secret
    secretRef:
      name: ovh-provider-creds
      namespace: __WORKSPACE_NAMESPACE__
      key: credentials
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: provider-kubernetes
  namespace: __WORKSPACE_NAMESPACE__
spec:
  credentials:
    source: InjectedIdentity

