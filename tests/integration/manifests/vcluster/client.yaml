apiVersion: v1
kind: Pod
metadata:
  name: verify-vcluster-client
  namespace: workspace
spec:
  automountServiceAccountToken: false
  containers:
  - name: client
    image: __CLIENT_IMAGE__
    command: [sleep, infinity]
    volumeMounts:
    - name: test
      mountPath: /test
      readOnly: true
    - name: administrator
      mountPath: /profiles/administrator
      readOnly: true
    - name: editor
      mountPath: /profiles/editor
      readOnly: true
    - name: other
      mountPath: /profiles/other
      readOnly: true
    - name: oauth
      mountPath: /oauth
      readOnly: true
    - name: postgres
      mountPath: /postgres
      readOnly: true
  volumes:
  - name: test
    configMap:
      name: verify-vcluster-client
  - name: administrator
    secret:
      secretName: __ADMINISTRATOR_SECRET__
      defaultMode: 256
  - name: editor
    secret:
      secretName: __EDITOR_SECRET__
      defaultMode: 256
  - name: other
    secret:
      secretName: __OTHER_SECRET__
      defaultMode: 256
  - name: postgres
    secret:
      secretName: verify-vcluster-postgres-pg0
      defaultMode: 256
  - name: oauth
    secret:
      secretName: verify-vcluster-oauth-client
      defaultMode: 256
