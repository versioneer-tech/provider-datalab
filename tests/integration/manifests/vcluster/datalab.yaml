apiVersion: versioneer.at/v1
kind: Datalab
metadata:
  name: verify-vcluster
  namespace: workspace
spec:
  crossplane:
    compositionRef: {name: test-datalab}
  environmentName: datalab-vcluster-it
  users:
  - verify-s3
  - verify-vcluster-member
  volumes:
    demo:
      backups: true
      storage: 1Gi
  vclusters:
    vc0:
      storage: 1Gi
      volumeBindings:
      - name: demo
        target:
          namespace: demo
          name: demo
      secretBindings:
      - type: postgres
        name: pg0
        target:
          namespace: demo
          name: postgres-connection
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
    vc1:
      storage: 1Gi
      groups:
      - name: namespace-other
        namespace: other
        role: view
  stores:
    pg0:
      type: postgres
      storage: 1Gi
      names:
      - catalog
