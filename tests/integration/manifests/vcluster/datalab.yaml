apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: verify-vcluster
  namespace: workspace
  annotations:
    datalabs.pkg.internal/environment: datalab-vcluster-it
spec:
  users:
  - verify-s3
  sessions: []
  databases:
    pg0:
      type: postgres
      storage: 1Gi
      names:
      - catalog
  vclusters:
    vc0:
      storage: 1Gi
      secretBindings:
      - type: postgres
        name: pg0
        target:
          namespace: demo
          name: postgres-connection
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
    vc1:
      storage: 1Gi
