apiVersion: versioneer.at/v1
kind: Datalab
metadata:
  name: verify-vcluster
  namespace: workspace
  annotations:
    datalabs.versioneer.at/environment: datalab-vcluster-it
spec:
  sessions:
  - name: analysis
    vcluster: vc0
    namespace: demo
    pvcSize: 1Mi
  users:
  - verify-s3
  - verify-vcluster-member
  databases:
    pg0:
      type: postgres
      storage: 1Gi
      names:
      - catalog
  vclusters:
    vc0:
      storage: 1Gi
      secretBindings:
      - type: postgres
        name: pg0
        target:
          namespace: demo
          name: postgres-connection
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
    vc1:
      storage: 1Gi
      groups:
      - name: namespace-other
        namespace: other
        role: view
