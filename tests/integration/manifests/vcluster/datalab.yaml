apiVersion: pkg.internal/v1
kind: Datalab
metadata:
  name: verify-vcluster
  namespace: workspace
  annotations:
    datalabs.pkg.internal/environment: datalab-vcluster-it
spec:
  users:
  - verify-s3
  secretName: verify-vcluster
  databases:
    pg0:
      type: postgres
      storage: 1Gi
      names:
      - catalog
  vclusters:
    vc0:
      secretBindings:
        catalog-settings:
          export: catalog-settings
          target:
            namespace: connections
            name: catalog-settings
          keys:
            endpoint: CATALOG_ENDPOINT
        catalog-initialization:
          export: catalog-initialization
          target:
            namespace: demo
            name: catalog-postgres-admin
          keys:
            host: PGHOST
            port: PGPORT
            user: PGUSER
            password: PGPASSWORD
      storage: 1Gi
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
      - name: cluster-admin
        namespace: '*'
        role: cluster-admin
    vc1:
      storage: 1Gi
      groups:
      - name: cluster-admin
        namespace: '*'
        role: cluster-admin
