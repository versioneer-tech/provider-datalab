apiVersion: v1
kind: Pod
metadata:
  name: __PROBE_NAME__
  namespace: __PROBE_NAMESPACE__
  labels:
    app.kubernetes.io/name: datalab-service-probe
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: redis-check
      image: __CLIENT_IMAGE__
      imagePullPolicy: IfNotPresent
      env:
        - name: REDIS_PREFIX
          value: "__KEY_PREFIX__"
        - name: REDIS_OTHER_PREFIX
          value: "__OTHER_KEY_PREFIX__"
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: __CONNECTION_SECRET__
              key: host
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: __CONNECTION_SECRET__
              key: port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __CONNECTION_SECRET__
              key: password
      command:
        - sh
        - -c
        - |
          set -eu
          expected=__PROBE_VALUE__
          # Service routing can lag behind the Pod rollout.
          remaining=30
          until test "$(REDISCLI_AUTH="${REDIS_PASSWORD}" timeout 2 redis-cli \
            -h "${REDIS_HOST}" -p "${REDIS_PORT}" --raw PING 2>/dev/null)" = PONG; do
            remaining=$((remaining - 1))
            if test "${remaining}" -eq 0; then
              printf 'Redis service did not become ready.\n' >&2
              exit 1
            fi
            sleep 2
          done
          test -z "$(REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli \
            -h "${REDIS_HOST}" -p "${REDIS_PORT}" --raw GET recovered-only)"
          REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli \
            -h "${REDIS_HOST}" -p "${REDIS_PORT}" \
            SET "${REDIS_PREFIX}provider-datalab:verify" "${expected}" >/dev/null
          REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli \
            -h "${REDIS_HOST}" -p "${REDIS_PORT}" \
            SET "${REDIS_OTHER_PREFIX}provider-datalab:verify" "${expected}-other" >/dev/null
          actual="$(REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli \
            -h "${REDIS_HOST}" -p "${REDIS_PORT}" --raw \
            GET "${REDIS_PREFIX}provider-datalab:verify")"
          test "${actual}" = "${expected}"
          actual="$(REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli \
            -h "${REDIS_HOST}" -p "${REDIS_PORT}" --raw \
            GET "${REDIS_OTHER_PREFIX}provider-datalab:verify")"
          test "${actual}" = "${expected}-other"
          printf 'PASS Datalab Redis write/read through both published key prefixes\n'
