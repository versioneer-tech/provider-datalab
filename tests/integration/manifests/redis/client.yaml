apiVersion: v1
kind: Pod
metadata:
  name: __PROBE_NAME__
  namespace: __PROBE_NAMESPACE__
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: redis-check
      image: __CLIENT_IMAGE__
      imagePullPolicy: IfNotPresent
      env:
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: __DATALAB_SECRET__
              key: REDIS_VERIFY_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: __DATALAB_SECRET__
              key: REDIS_VERIFY_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: __DATALAB_SECRET__
              key: REDIS_VERIFY_PASSWORD
      command:
        - sh
        - -c
        - |
          set -eu
          expected=__PROBE_VALUE__
          # Service routing can lag behind the Pod rollout.
          remaining=30
          until test "$(REDISCLI_AUTH="${REDIS_PASSWORD}" timeout 2 redis-cli \
            -h "${REDIS_HOST}" -p "${REDIS_PORT}" --raw PING 2>/dev/null)" = PONG; do
            remaining=$((remaining - 1))
            if test "${remaining}" -eq 0; then
              printf 'Redis service did not become ready.\n' >&2
              exit 1
            fi
            sleep 2
          done
          REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli \
            -h "${REDIS_HOST}" -p "${REDIS_PORT}" \
            SET provider-datalab:verify "${expected}" >/dev/null
          actual="$(REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli \
            -h "${REDIS_HOST}" -p "${REDIS_PORT}" --raw \
            GET provider-datalab:verify)"
          test "${actual}" = "${expected}"
          printf 'PASS Datalab Redis internal write/read verification\n'
