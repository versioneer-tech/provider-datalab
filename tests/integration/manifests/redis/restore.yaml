apiVersion: v1
kind: Pod
metadata:
  name: __PROBE_NAME__
  namespace: __STORE_NAMESPACE__
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: restore
    image: __CLIENT_IMAGE__
    command: [/bin/sh, -ec]
    args:
    - |
      redis-check-rdb /data/dump.rdb
      # Load the saved RDB file, then build a new AOF from the recovered data.
      rm -rf /data/appendonlydir
      redis-server --bind 127.0.0.1 --dir /data --appendonly no --save '' \
        --daemonize yes --logfile /tmp/redis.log --pidfile /tmp/redis.pid
      trap 'redis-cli shutdown nosave' EXIT
      for attempt in $(seq 1 30); do
        if redis-cli ping >/dev/null 2>&1; then break; fi
        sleep 1
      done
      test "$(redis-cli --raw GET '__KEY_PREFIX__provider-datalab:verify')" = '__PROBE_VALUE__'
      test "$(redis-cli --raw GET '__OTHER_KEY_PREFIX__provider-datalab:verify')" = '__PROBE_VALUE__-other'
      redis-cli SET recovered-only independent
      redis-cli CONFIG SET appendonly yes
      for attempt in $(seq 1 60); do
        if redis-cli INFO persistence | tr -d '\r' | grep -qx 'aof_rewrite_in_progress:0'; then break; fi
        sleep 1
      done
      redis-cli INFO persistence | tr -d '\r' | grep -qx 'aof_rewrite_in_progress:0'
      redis-cli shutdown
      redis-server --bind 127.0.0.1 --dir /data --appendonly yes --save '' \
        --daemonize yes --logfile /tmp/redis.log --pidfile /tmp/redis.pid
      for attempt in $(seq 1 30); do
        if redis-cli ping >/dev/null 2>&1; then break; fi
        sleep 1
      done
      test "$(redis-cli --raw GET recovered-only)" = independent
      test "$(redis-cli --raw GET '__KEY_PREFIX__provider-datalab:verify')" = '__PROBE_VALUE__'
      printf 'PASS Redis CSI recovery loads both logical stores and persists independent writes after an AOF restart\n'
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: test-redis-recovery
