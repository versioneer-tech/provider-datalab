apiVersion: versioneer.at/v1
kind: Datalab
metadata:
  name: __DATALAB_NAME__
  namespace: __WORKSPACE_NAMESPACE__
spec:
  environmentName: datalab
  users: []
  stores:
    verify:
      type: redis
      names: [sessions, jobs]
      storage: 1Gi
      backups: false
