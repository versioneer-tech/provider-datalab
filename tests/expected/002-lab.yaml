apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: redis-backup-cronjob-s-jeff-prod
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: redis-prod-backup
        namespace: s-jeff
      spec:
        concurrencyPolicy: Forbid
        failedJobsHistoryLimit: 1
        jobTemplate:
          spec:
            activeDeadlineSeconds: 3600
            backoffLimit: 2
            template:
              spec:
                automountServiceAccountToken: false
                containers:
                - args:
                  - |
                    umask 077
                    archive="/backup/dump-$(date -u +%Y%m%dT%H%M%SZ).rdb"
                    partial="/backup/dump.partial"
                    trap 'rm -f "$partial"' EXIT
                    redis-cli -h "$BACKUP_HOST" --user backup --rdb "$partial"
                    redis-check-rdb "$partial"
                    mv "$partial" "$archive"
                    find /backup -maxdepth 1 -type f -name 'dump-*.rdb' -printf '%f\n' \
                      | sort -r | tail -n +5 | while IFS= read -r old; do rm "/backup/$old"; done
                  command:
                  - /bin/sh
                  - -ec
                  env:
                  - name: BACKUP_HOST
                    value: prod
                  - name: REDISCLI_AUTH
                    valueFrom:
                      secretKeyRef:
                        key: password
                        name: prod-redis-backup-auth
                  image: redis:7.0.15
                  name: backup
                  resources:
                    limits:
                      memory: 512Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                  - mountPath: /backup
                    name: backup
                restartPolicy: Never
                securityContext:
                  fsGroup: 999
                  runAsGroup: 999
                  runAsNonRoot: true
                  runAsUser: 999
                  seccompProfile:
                    type: RuntimeDefault
                volumes:
                - name: backup
                  persistentVolumeClaim:
                    claimName: redis-prod-backup
        schedule: 0 1 * * *
        startingDeadlineSeconds: 3600
        successfulJobsHistoryLimit: 1
        timeZone: Etc/UTC
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
