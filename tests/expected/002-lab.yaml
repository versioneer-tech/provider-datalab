---
apiVersion: pkg.internal/v1
kind: Datalab
metadata:
  name: s-jeff
spec:
  cacheStores:
    prod:
      backupStorage: 3Gi
      storage: 1Gi
      type: redis
  databases:
    pg0:
      backupStorage: 3Gi
      names:
      - dev
      - prod
      storage: 1Gi
      type: postgres
  documentStores:
    prod:
      backupStorage: 3Gi
      storage: 1Gi
      type: mongo
  secretName: s-jeff
  userOverrides:
    jim:
      grantedAt: '2025-01-10T19:00:00Z'
      role: admin
  users:
  - jeff
  - jim
  - jane
status:
  connections:
  - name: s3
    ready: false
    secretRef:
      name: s-jeff-s3
      namespace: default
    type: s3
  - endpoint: pg0-primary.s-jeff.svc
    name: postgres-pg0
    ready: false
    secretRef:
      name: s-jeff-postgres-pg0
      namespace: default
    type: postgres
  - endpoint: mongodb-prod-svc.s-jeff.svc
    name: mongo-prod
    ready: false
    secretRef:
      name: s-jeff-mongo-prod
      namespace: default
    type: mongo
  - endpoint: prod.s-jeff.svc
    name: redis-prod
    ready: false
    secretRef:
      name: s-jeff-redis-prod
      namespace: default
    type: redis
  secretBindings: []
---
