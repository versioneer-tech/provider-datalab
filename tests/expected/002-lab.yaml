apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: db-configmap-s-jeff-pg0
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: v1
      data:
        init.sql: |
          \set ON_ERROR_STOP on
          \connect postgres
      kind: ConfigMap
      metadata:
        name: pg0-init-sql
        namespace: s-jeff
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: db-postgrescluster-s-jeff-pg0
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: postgres-operator.crunchydata.com/v1
      kind: PostgresCluster
      metadata:
        name: pg0
        namespace: s-jeff
      spec:
        backups:
          pgbackrest:
            global:
              repo1-path: /pgbackrest/repo1
              repo1-retention-full: '4'
              repo1-retention-full-type: count
            repos:
            - name: repo1
              schedules:
                differential: 0 1 * * 1-6
                full: 0 1 * * 0
              volume:
                volumeClaimSpec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 3Gi
        databaseInitSQL:
          key: init.sql
          name: pg0-init-sql
        instances:
        - dataVolumeClaimSpec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
          name: primary
          replicas: 1
        postGISVersion: '3.5'
        postgresVersion: 17
        users:
        - databases:
          - dev
          - prod
          name: postgres
        - name: jeff
        - name: jim
        - name: jane
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.instances) && object.status.instances.exists(i, i.name ==
      'primary' && has(i.readyReplicas) && i.readyReplicas >= 1) && has(object.status.pgbackrest) && has(object.status.pgbackrest.repoHost)
      && object.status.pgbackrest.repoHost.ready == true
    policy: DeriveFromCelQuery
  watch: true
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: db-tlsroute-s-jeff-pg0
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: gateway.networking.k8s.io/v1
      kind: TLSRoute
      metadata:
        name: pg0
        namespace: s-jeff
      spec:
        hostnames:
        - pg0-s-jeff.lab.acme.com
        parentRefs:
        - name: default
          namespace: projectcontour
          sectionName: postgres-passthrough
        rules:
        - backendRefs:
          - name: pg0-primary
            port: 5432
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.parents) && object.status.parents.exists(p, has(p.conditions)
      && p.conditions.exists(c, c.type == 'Accepted' && c.status == 'True') && p.conditions.exists(c, c.type ==
      'ResolvedRefs' && c.status == 'True'))
    policy: DeriveFromCelQuery
  watch: true
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  annotations:
    crossplane.io/composition-resource-name: keycloak-client-s-jeff
  labels:
    crossplane.io/claim-name: s-jeff
  name: s-jeff
  namespace: default
spec:
  forProvider:
    accessType: CONFIDENTIAL
    adminUrl: https://s-jeff.lab.acme.com
    clientId: s-jeff
    directAccessGrantsEnabled: false
    fullScopeAllowed: false
    implicitFlowEnabled: false
    name: s-jeff
    oauth2DeviceAuthorizationGrantEnabled: false
    realmId: acme
    rootUrl: https://s-jeff.lab.acme.com
    serviceAccountsEnabled: true
    standardFlowEnabled: true
    validRedirectUris:
    - https://s-jeff.lab.acme.com/*
    - http://localhost:*
    webOrigins:
    - https://s-jeff.lab.acme.com/*
    - http://localhost:*
  providerConfigRef:
    kind: ProviderConfig
    name: provider-keycloak
  writeConnectionSecretToRef:
    name: s-jeff-oauth-client
