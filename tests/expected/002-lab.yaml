apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: s-jeff
spec:
  cacheStores:
    prod:
      backupStorage: 3Gi
      storage: 1Gi
      type: redis
  databases:
    pg0:
      backupStorage: 3Gi
      names:
      - dev
      - prod
      storage: 1Gi
      type: postgres
  documentStores:
    prod:
      backupStorage: 3Gi
      storage: 1Gi
      type: mongo
  secretName: s-jeff
  userOverrides:
    jim:
      grantedAt: '2025-01-10T19:00:00Z'
      role: admin
  users:
  - jeff
  - jim
  - jane
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: db-configmap-s-jeff-pg0
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: v1
      data:
        init.sql: |
          \set ON_ERROR_STOP on
          \connect postgres
      kind: ConfigMap
      metadata:
        name: pg0-init-sql
        namespace: s-jeff
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: db-postgrescluster-s-jeff-pg0
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: postgres-operator.crunchydata.com/v1
      kind: PostgresCluster
      metadata:
        name: pg0
        namespace: s-jeff
      spec:
        backups:
          pgbackrest:
            global:
              repo1-path: /pgbackrest/repo1
              repo1-retention-full: '4'
              repo1-retention-full-type: count
            repos:
            - name: repo1
              schedules:
                differential: 0 1 * * 1-6
                full: 0 1 * * 0
              volume:
                volumeClaimSpec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 3Gi
        databaseInitSQL:
          key: init.sql
          name: pg0-init-sql
        instances:
        - dataVolumeClaimSpec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
          name: primary
          replicas: 1
        postGISVersion: '3.5'
        postgresVersion: 17
        users:
        - databases:
          - dev
          - prod
          name: postgres
        - name: jeff
        - name: jim
        - name: jane
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.instances) && object.status.instances.exists(i, i.name ==
      'primary' && has(i.readyReplicas) && i.readyReplicas >= 1) && has(object.status.pgbackrest) && has(object.status.pgbackrest.repoHost)
      && object.status.pgbackrest.repoHost.ready == true
    policy: DeriveFromCelQuery
  watch: true
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: db-tlsroute-s-jeff-pg0
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: gateway.networking.k8s.io/v1
      kind: TLSRoute
      metadata:
        name: pg0
        namespace: s-jeff
      spec:
        hostnames:
        - pg0-s-jeff.lab.acme.com
        parentRefs:
        - name: default
          namespace: projectcontour
          sectionName: postgres-passthrough
        rules:
        - backendRefs:
          - name: pg0-primary
            port: 5432
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.parents) && object.status.parents.exists(p, has(p.conditions)
      && p.conditions.exists(c, c.type == 'Accepted' && c.status == 'True') && p.conditions.exists(c, c.type ==
      'ResolvedRefs' && c.status == 'True'))
    policy: DeriveFromCelQuery
  watch: true
