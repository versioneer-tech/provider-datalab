                name: data-volume
              spec:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
        type: ReplicaSet
        users:
        - db: admin
          name: prod-app
          passwordSecretRef:
            key: password
            name: prod-mongodb-auth
          roles:
          - db: prod
            name: readWrite
          - db: prod
            name: dbAdmin
          scramCredentialsSecretName: prod-app-scram
        - db: admin
          name: prod-backup
          passwordSecretRef:
            key: password
            name: prod-mongodb-backup-auth
          roles:
          - db: admin
            name: backup
          scramCredentialsSecretName: prod-backup-scram
        version: 8.0.12
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && object.status.phase == 'Running' && has(object.status.currentMongoDBMembers)
      && object.status.currentMongoDBMembers >= 1 && has(object.status.currentStatefulSetReplicas) && object.status.currentStatefulSetReplicas
      >= 1
