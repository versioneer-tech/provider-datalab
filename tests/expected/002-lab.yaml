apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: mongodb-backup-cronjob-s-jeff-prod
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: mongodb-prod-backup
        namespace: s-jeff
      spec:
        concurrencyPolicy: Forbid
        failedJobsHistoryLimit: 1
        jobTemplate:
          spec:
            activeDeadlineSeconds: 3600
            backoffLimit: 2
            template:
              spec:
                automountServiceAccountToken: false
                containers:
                - args:
                  - |
                    umask 077
                    archive="/backup/dump-$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
                    partial="/backup/dump.partial"
                    trap 'rm -f "$partial"' EXIT
                    mongodump --host="$BACKUP_HOST" --username="$BACKUP_USER" \
                      --authenticationDatabase=admin --config=/auth/config.yaml \
                      --oplog --gzip --archive="$partial"
                    mv "$partial" "$archive"
                    find /backup -maxdepth 1 -type f -name 'dump-*.archive.gz' -printf '%f\n' \
                      | sort -r | tail -n +5 | while IFS= read -r old; do rm "/backup/$old"; done
                  command:
                  - /bin/sh
                  - -ec
                  env:
                  - name: BACKUP_HOST
                    value: mongodb-prod/mongodb-prod-0.mongodb-prod-svc:27017
                  - name: BACKUP_USER
                    value: prod-backup
                  image: mongo:8.0.12
                  name: backup
                  resources:
                    limits:
                      memory: 512Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                  - mountPath: /backup
                    name: backup
                  - mountPath: /auth
                    name: auth
                    readOnly: true
                restartPolicy: Never
                securityContext:
                  fsGroup: 999
                  runAsGroup: 999
                  runAsNonRoot: true
                  runAsUser: 999
                  seccompProfile:
                    type: RuntimeDefault
                volumes:
                - name: backup
                  persistentVolumeClaim:
                    claimName: mongodb-prod-backup
                - name: auth
                  secret:
                    defaultMode: 288
                    items:
                    - key: config.yaml
                      path: config.yaml
                    secretName: prod-mongodb-backup-auth
        schedule: 0 1 * * *
        startingDeadlineSeconds: 3600
        successfulJobsHistoryLimit: 1
        timeZone: Etc/UTC
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
