---
apiVersion: pkg.internal/v1
kind: Datalab
metadata:
  annotations:
    datalabs.pkg.internal/environment: datalab-custom
  name: s-john
spec:
  secretName: s-john
  users:
  - john
status:
  connections:
  - name: s3
    ready: false
    secretRef:
      name: s-john-s3
      namespace: default
    type: s3
  secretBindings: []
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: data-deployment-s-john
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          app.kubernetes.io/instance: s-john
          app.kubernetes.io/name: package-r
        name: package-r
        namespace: s-john
      spec:
        replicas: 1
        revisionHistoryLimit: 2
        selector:
          matchLabels:
            app.kubernetes.io/instance: s-john
            app.kubernetes.io/name: package-r
        strategy:
          type: Recreate
        template:
          metadata:
            annotations:
              datalabs.pkg.internal/storage-secret-checksum: e82525376bdef67fe9224fbf1d48e923712012f517d3b372156910fe74d4647e
            labels:
              app.kubernetes.io/instance: s-john
              app.kubernetes.io/name: package-r
          spec:
            automountServiceAccountToken: false
            containers:
            - env:
              - name: HOME
                value: /tmp
              - name: PACKAGE_R_DATABASE
                value: /state/package-r.db
              - name: PACKAGE_R_ADDRESS
                value: 0.0.0.0
              - name: PACKAGE_R_PORT
                value: '8888'
              - name: PACKAGE_R_ROOT
                value: /
              - name: PACKAGE_R_BUCKETS
                value: ''
              - name: XDG_CACHE_HOME
                value: /cache
              - name: AWS_SHARED_CREDENTIALS_FILE
                value: /var/run/datalab/storage/aws-credentials
              - name: AWS_ENDPOINT_URL
                valueFrom:
                  secretKeyRef:
                    key: AWS_ENDPOINT_URL
                    name: s-john-storage
              - name: AWS_REGION
                valueFrom:
                  secretKeyRef:
                    key: AWS_REGION
                    name: s-john-storage
              image: ghcr.io/versioneer-tech/package-r:vnext.1.1.0
              imagePullPolicy: IfNotPresent
              livenessProbe:
                httpGet:
                  path: /health
                  port: package-r
                periodSeconds: 20
              name: package-r
              ports:
              - containerPort: 8888
                name: package-r
                protocol: TCP
              readinessProbe:
                httpGet:
                  path: /health
                  port: package-r
                periodSeconds: 10
              resources:
                limits:
                  cpu: '2'
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 100
                runAsUser: 1000
              startupProbe:
                failureThreshold: 30
                httpGet:
                  path: /health
                  port: package-r
                periodSeconds: 5
              volumeMounts:
              - mountPath: /state
                name: state
              - mountPath: /cache
                name: cache
              - mountPath: /tmp
                name: tmp
              - mountPath: /var/run/datalab/storage
                name: storage-credentials
                readOnly: true
            - args:
              - --http-address=0.0.0.0:4180
              - --metrics-address=127.0.0.1:44180
              - --provider=keycloak-oidc
              - --provider-display-name=acme realm
              - --client-id=s-john
              - --client-secret-file=/var/run/datalab/oauth2/client_secret
              - --cookie-secret-file=/var/run/datalab/oauth2/cookie_secret
              - --oidc-issuer-url=https://identity.acme.com/realms/acme
              - --skip-oidc-discovery=true
              - --login-url=https://identity.acme.com/realms/acme/protocol/openid-connect/auth
              - --redeem-url=http://keycloak.keycloak:8080/realms/acme/protocol/openid-connect/token
              - --oidc-jwks-url=http://keycloak.keycloak:8080/realms/acme/protocol/openid-connect/certs
              - --profile-url=http://keycloak.keycloak:8080/realms/acme/protocol/openid-connect/userinfo
              - --insecure-oidc-skip-nonce=false
              - --scope=openid email profile
              - --code-challenge-method=S256
              - --redirect-url=https://s-john.lab.acme.com/oauth2/callback
              - --upstream=http://127.0.0.1:8888/
              - --email-domain=*
              - --allowed-group=s-john
              - --reverse-proxy=true
              - --trusted-proxy-ip=10.42.0.0/16
              - --whitelist-domain=s-john.lab.acme.com
              - --pass-basic-auth=false
              - --pass-access-token=false
              - --pass-authorization-header=false
              - --pass-user-headers=true
              - --skip-provider-button=true
              - --cookie-name=__Host-s-john
              - --cookie-secure=true
              - --cookie-httponly=true
              - --cookie-samesite=lax
              - --cookie-refresh=1h
              - --cookie-expire=8h
              - --cookie-csrf-per-request=true
              - --cookie-csrf-per-request-limit=5
              - --skip-auth-route=GET=^/api/public(/|$)
              - --skip-auth-route=HEAD=^/api/public(/|$)
              - --skip-auth-route=OPTIONS=^/api/public(/|$)
              - --skip-auth-route=GET=^/public(/|$)
              - --skip-auth-route=HEAD=^/public(/|$)
              - --skip-auth-route=OPTIONS=^/public(/|$)
              - --skip-auth-route=GET=^/share(/|$)
              - --skip-auth-route=HEAD=^/share(/|$)
              - --skip-auth-route=OPTIONS=^/share(/|$)
              - --skip-auth-route=GET=^/static(/|$)
              - --skip-auth-route=HEAD=^/static(/|$)
              - --skip-auth-route=OPTIONS=^/static(/|$)
              - --silence-ping-logging=true
              image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
              imagePullPolicy: IfNotPresent
              livenessProbe:
                httpGet:
                  path: /ping
                  port: auth-proxy
                periodSeconds: 20
              name: oauth2-proxy
              ports:
              - containerPort: 4180
                name: auth-proxy
                protocol: TCP
              readinessProbe:
                httpGet:
                  path: /ready
                  port: auth-proxy
                periodSeconds: 10
              resources:
                limits:
                  cpu: 250m
                  memory: 128Mi
                requests:
                  cpu: 20m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsUser: 65532
              volumeMounts:
              - mountPath: /tmp
                name: tmp
              - mountPath: /var/run/datalab/oauth2
                name: oauth2-credentials
                readOnly: true
            initContainers:
            - args:
              - |
                set -eu

                database=/state/package-r.db
                work_database=/state/package-r.db.new

                rm -f "$work_database"
                export PACKAGE_R_DATABASE="$work_database"

                /package-r config init   --address=0.0.0.0   --port=8888   --cors-allowed-origins='*'   --auth.method=proxy   --auth.header=X-Forwarded-Preferred-Username   --auth.mapper=

                /package-r users add default ""
                /package-r users add john ''
                /package-r shares add default public /s-john/public   --password=""   --description="default public share"   --catalog-name=catalog.parquet

                mv "$work_database" "$database"
              command:
              - /bin/sh
              - -ec
              image: ghcr.io/versioneer-tech/package-r:vnext.1.1.0
              imagePullPolicy: IfNotPresent
              name: prepare-database
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 100
                runAsUser: 1000
              volumeMounts:
              - mountPath: /state
                name: state
              - mountPath: /tmp
                name: tmp
            nodeSelector:
              kubernetes.io/arch: amd64
            securityContext:
              fsGroup: 100
              fsGroupChangePolicy: OnRootMismatch
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            terminationGracePeriodSeconds: 30
            volumes:
            - emptyDir:
                sizeLimit: 64Mi
              name: state
            - emptyDir:
                sizeLimit: 10Gi
              name: cache
            - emptyDir:
                sizeLimit: 256Mi
              name: tmp
            - name: storage-credentials
              secret:
                defaultMode: 288
                items:
                - key: aws-credentials
                  path: aws-credentials
                secretName: s-john-storage
            - name: oauth2-credentials
              secret:
                defaultMode: 288
                items:
                - key: client_secret
                  path: client_secret
                - key: cookie_secret
                  path: cookie_secret
                secretName: s-john-oauth2-client
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration >=
      object.metadata.generation && has(object.status.availableReplicas) && object.status.availableReplicas >= 1
    policy: DeriveFromCelQuery
  watch: true
