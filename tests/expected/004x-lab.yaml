  name: data-route-s-john
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: data
        namespace: s-john
      spec:
        hostnames:
        - s-john.lab.acme.com
        parentRefs:
        - name: default
          namespace: contour
          sectionName: workspaces-https
        rules:
        - backendRefs:
          - name: data-s3
            port: 8080
          matches:
          - headers:
            - name: User-Agent
              type: RegularExpression
