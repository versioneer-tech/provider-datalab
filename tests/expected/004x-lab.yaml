        name: data
        namespace: s-john
      spec:
        hostnames:
        - s-john.lab.acme.com
        parentRefs:
        - name: default
          namespace: contour
          sectionName: workspaces-https
        rules:
        - backendRefs:
          - name: data-s3
            port: 8080
          matches:
