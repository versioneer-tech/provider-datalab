metadata:
  annotations:
    crossplane.io/composition-resource-name: workshop-s-jane
  labels:
    crossplane.io/composite: s-jane
  name: workshop-s-jane
  namespace: default
  ownerReferences:
  - apiVersion: pkg.internal/v1beta2
    blockOwnerDeletion: true
    controller: true
    kind: Datalab
    name: s-jane
    uid: 791f1847-08cf-5ec4-be12-97ab3e552087
spec:
  forProvider:
    manifest:
      apiVersion: training.educates.dev/v1beta1
      kind: Workshop
      metadata:
        name: s-jane
      spec:
        description: A default DataLab environment.
        environment:
          objects:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: deny-egress
            spec:
              egress: []
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-namespace-egress
            spec:
              egress:
              - to:
                - podSelector: {}
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-vcluster-egress
            spec:
              egress:
              - ports:
                - port: 443
                  protocol: TCP
                - port: 8443
                  protocol: TCP
                to:
                - namespaceSelector:
                    matchLabels:
                      training.educates.dev/environment.name: s-jane
                      training.educates.dev/session.objects: "true"
                  podSelector:
                    matchLabels:
                      app: vcluster
                      release: my-vcluster
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-dns-egress
            spec:
              egress:
              - ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
                to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-external-egress
            spec:
              egress:
              - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
                    except:
                    - 169.254.169.254/32
                    - 169.254.42.42/32
                    - 10.42.0.0/16
                    - 10.43.0.0/16
              - to:
                - ipBlock:
                    cidr: ::/0
                    except:
                    - fd00:ec2::254/128
                    - fd00:42::42/128
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-internal-egress
            spec:
              egress:
              - ports:
                - port: 443
                  protocol: TCP
                - port: 9000
                  protocol: TCP
                to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: minio
                  podSelector:
                    matchLabels:
                      v1.min.io/tenant: default
              podSelector: {}
              policyTypes:
              - Egress
          secrets:
          - name: s-jane-datalab
            namespace: default
        session:
          applications:
            console:
              enabled: false
            docker:
              enabled: true
              storage: 20Gi
            editor:
              enabled: true
            registry:
              enabled: true
              storage: 3Gi
            slides:
              enabled: false
            terminal:
              enabled: true
            vcluster:
              enabled: true
              services:
                fromHost:
                - from: $(workshop_namespace)/pg0-primary
                  to: $(workshop_namespace)/pg0-primary
              version: "1.34"
            workshop:
              enabled: true
          dashboards:
          - name: Data
            url: https://s-jane.lab.acme.com/
          envFrom:
          - secretRef:
              name: s-jane-datalab
          ingresses: []
          namespaces:
            budget: x-large
            role: admin
            security:
              policy: privileged
              token:
                enabled: true
          objects:
          - apiVersion: v1
            data:
              cidr: 10.43.0.0/16
            kind: ConfigMap
            metadata:
              name: vc-cidr-my-vcluster
              namespace: $(session_namespace)-vc
          resources:
            memory: 4Gi
            volume:
              name: $(session_name)-persistent
        title: Default DataLab
        version: "1.0"
        workshop:
          files:
          - git:
              ref: origin/main
              url: https://github.com/versioneer-tech/datalab-example
            includePaths:
            - /workshop/**
            - /data/**
            - /README.md
            path: .
          packages:
          - files:
            - image:
                url: ghcr.io/versioneer-tech/educates-extension-packages/awscli:v2.29.0
            name: awscli
          - files:
            - image:
                url: ghcr.io/versioneer-tech/educates-extension-packages/rclone:v1.71.0
            name: rclone
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
