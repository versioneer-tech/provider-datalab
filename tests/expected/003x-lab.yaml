      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: data-https-redirect
        namespace: s-jane
      spec:
        hostnames:
        - s-jane.lab.acme.com
        parentRefs:
        - name: default
          namespace: contour
          sectionName: workspaces-http
        rules:
        - filters:
          - requestRedirect:
              scheme: https
              statusCode: 301
            type: RequestRedirect
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.parents) && object.status.parents.exists(p, p.parentRef.name
      == "default" && has(p.parentRef.namespace) && p.parentRef.namespace == "contour" && has(p.parentRef.sectionName)
      && p.parentRef.sectionName == object.spec.parentRefs[0].sectionName && has(p.conditions) && p.conditions.exists(c,
      c.type == 'Accepted' && c.status == 'True' && c.observedGeneration == object.metadata.generation) && p.conditions.exists(c,
      c.type == 'ResolvedRefs' && c.status == 'True' && c.observedGeneration == object.metadata.generation))
    policy: DeriveFromCelQuery
  watch: true
