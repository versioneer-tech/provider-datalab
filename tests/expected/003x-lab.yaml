                    name: s-jane-datalab
              image: rclone/rclone:1.71.0
              imagePullPolicy: IfNotPresent
              name: s3
              readinessProbe:
                exec:
                  command:
                  - rclone
                  - lsf
                  - ':s3:'
                  - --config=/dev/null
                  - --s3-provider=Other
                  - --s3-endpoint=http://127.0.0.1:8081
                  - --s3-access-key-id=s-jane
                  - --s3-secret-access-key=s-jane
                  - --s3-env-auth=false
                periodSeconds: 30
                timeoutSeconds: 20
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
              - mountPath: /cache
                name: cache
              - mountPath: /tmp
                name: tmp
              - mountPath: /var/run/datalab/storage
                name: storage-credentials
                readOnly: true
            - args:
              - --metrics-address=127.0.0.1:44180
              - --provider=keycloak-oidc
              - --provider-display-name=acme realm
              - --client-id=s-jane
              - --client-secret-file=/var/run/datalab/oauth2/client_secret
              - --cookie-secret-file=/var/run/datalab/oauth2/cookie_secret
              - --oidc-issuer-url=https://identity.acme.com/realms/acme
              - --skip-oidc-discovery=true
              - --login-url=https://identity.acme.com/realms/acme/protocol/openid-connect/auth
              - --redeem-url=http://keycloak.keycloak:8080/realms/acme/protocol/openid-connect/token
              - --oidc-jwks-url=http://keycloak.keycloak:8080/realms/acme/protocol/openid-connect/certs
              - --profile-url=http://keycloak.keycloak:8080/realms/acme/protocol/openid-connect/userinfo
              - --insecure-oidc-skip-nonce=false
              - --scope=openid email profile
              - --code-challenge-method=S256
              - --redirect-url=https://s-jane.lab.acme.com/oauth2/callback
              - --email-domain=*
              - --reverse-proxy=true
              - --trusted-proxy-ip=10.42.0.0/16
              - --whitelist-domain=s-jane.lab.acme.com
              - --pass-basic-auth=false
              - --pass-access-token=false
              - --pass-authorization-header=false
              - --pass-user-headers=true
              - --skip-provider-button=true
              - --cookie-name=__Host-s-jane
              - --cookie-secure=true
              - --cookie-httponly=true
              - --cookie-samesite=lax
              - --cookie-refresh=1h
              - --cookie-expire=8h
              - --cookie-csrf-per-request=true
              - --cookie-csrf-per-request-limit=5
              - --silence-ping-logging=true
              - --http-address=127.0.0.1:4180
              - --upstream=static://202
              - --skip-jwt-bearer-tokens=true
              - --bearer-token-login-fallback=false
              - --insecure-oidc-allow-unverified-email=true
              - --allowed-role=s-jane:ws_access
              - --allowed-role=s-jane:ws_admin
              - --allowed-role=s-jane:ws_api
              - --request-logging=false
              - --auth-logging=false
              image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
              imagePullPolicy: IfNotPresent
              name: oauth2-proxy
              resources:
                limits:
                  cpu: 250m
                  memory: 128Mi
                requests:
                  cpu: 20m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsUser: 65532
              volumeMounts:
              - mountPath: /tmp
                name: tmp
              - mountPath: /var/run/datalab/oauth2
                name: oauth2-credentials
                readOnly: true
            - args:
              - -g
              - daemon off;
              command:
              - nginx
              image: nginxinc/nginx-unprivileged:1.28-alpine
              name: gateway
              ports:
              - containerPort: 8080
                name: s3-gateway
              readinessProbe:
