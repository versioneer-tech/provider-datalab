apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: data-route-s-jane
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: data
        namespace: s-jane
      spec:
        hostnames:
        - s-jane.lab.acme.com
        parentRefs:
        - name: default
          namespace: contour
          sectionName: workspaces-https
        rules:
        - backendRefs:
          - name: data-s3
            port: 8080
          matches:
          - headers:
            - name: User-Agent
              type: RegularExpression
              value: ^aws-cli/.*
          - headers:
            - name: Authorization
              type: RegularExpression
              value: ^AWS4-HMAC-SHA256 .*
          - queryParams:
            - name: X-Amz-Algorithm
              value: AWS4-HMAC-SHA256
          timeouts:
            request: 3600s
        - backendRefs:
          - name: package-r
            port: 4180
          timeouts:
            request: 3600s
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.parents) && object.status.parents.exists(p, p.parentRef.name
      == "default" && has(p.parentRef.namespace) && p.parentRef.namespace == "contour" && has(p.parentRef.sectionName)
      && p.parentRef.sectionName == object.spec.parentRefs[0].sectionName && has(p.conditions) && p.conditions.exists(c,
      c.type == 'Accepted' && c.status == 'True' && c.observedGeneration == object.metadata.generation) && p.conditions.exists(c,
      c.type == 'ResolvedRefs' && c.status == 'True' && c.observedGeneration == object.metadata.generation))
    policy: DeriveFromCelQuery
  watch: true
