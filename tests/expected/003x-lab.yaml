apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: data-s3-config-s-jane
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: v1
      data:
        nginx.conf: |
          pid /tmp/nginx.pid;
          error_log /dev/stderr warn;
          events { worker_connections 1024; }
          http {
            access_log off;
            client_body_temp_path /tmp/body; proxy_temp_path /tmp/proxy;
            fastcgi_temp_path /tmp/fastcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;
            map $http_authorization $tenant_valid {
              default 0;
              ~^AWS4-HMAC-SHA256\s+Credential=s-jane/ 1;
            }
            server {
              listen 8080;
              location = /_ready { proxy_pass http://127.0.0.1:4180/ready; }
              location / {
                if ($tenant_valid = 0) { return 403; }
                if ($http_x_amz_security_token = "") { return 403; }
                limit_except GET { deny all; }
                auth_request /_s3_auth;
                proxy_set_header Host $http_host;
                proxy_buffering off; proxy_read_timeout 3600s;
                proxy_pass http://127.0.0.1:8081;
              }
              location = /_s3_auth {
                internal; proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                proxy_set_header Cookie "";
                proxy_set_header Authorization "Bearer $http_x_amz_security_token";
                proxy_pass http://127.0.0.1:4180/oauth2/auth?;
              }
            }
          }
      kind: ConfigMap
      metadata:
        name: data-s3
        namespace: s-jane
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: data-s3-deployment-s-jane
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          app.kubernetes.io/instance: s-jane
          app.kubernetes.io/name: data-s3
        name: data-s3
        namespace: s-jane
      spec:
        replicas: 1
        revisionHistoryLimit: 2
        selector:
          matchLabels:
            app.kubernetes.io/instance: s-jane
            app.kubernetes.io/name: data-s3
        template:
          metadata:
            annotations:
