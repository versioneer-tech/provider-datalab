              datalabs.pkg.internal/oauth2-cookie-checksum: 0a54310cd42983aaa9388e08066b195548cb42c3e474db950ec352c9c839a63f
              datalabs.pkg.internal/storage-secret-checksum: 800e67d2821909a1bf41c8ad32f56395b41288df4801433c909a164e56f863df
            labels:
              app.kubernetes.io/instance: s-jane
              app.kubernetes.io/name: data-s3
          spec:
