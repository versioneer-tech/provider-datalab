        egress:
        - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
          to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
          - ipBlock:
              cidr: 10.43.0.0/16
        podSelector: {}
        policyTypes:
