---
apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  name: s-joe
spec:
  users:
  - joe
status:
  connections:
  - name: primary
    ready: false
    secretRef:
      name: s-joe
      namespace: datalab
    type: s3
  oauth2: []
  sessions: []
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: data-deployment-s-joe
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          app.kubernetes.io/instance: s-joe
          app.kubernetes.io/name: package-r
        name: package-r
        namespace: s-joe
      spec:
        replicas: 1
        revisionHistoryLimit: 2
        selector:
          matchLabels:
            app.kubernetes.io/instance: s-joe
            app.kubernetes.io/name: package-r
        strategy:
          type: Recreate
        template:
          metadata:
            annotations:
              datalabs.pkg.internal/storage-secret-checksum: e01ad97cf43e8017f25e556499ab29692d8acb1be986597f0423485c3a4fe82f
            labels:
              app.kubernetes.io/instance: s-joe
              app.kubernetes.io/name: package-r
          spec:
            automountServiceAccountToken: false
            containers:
            - env:
              - name: HOME
                value: /tmp
              - name: PACKAGE_R_DATABASE
                value: /state/package-r.db
              - name: PACKAGE_R_ADDRESS
                value: 0.0.0.0
              - name: PACKAGE_R_PORT
                value: '8888'
              - name: PACKAGE_R_ROOT
                value: /
              - name: PACKAGE_R_BUCKETS
                value: ''
              - name: XDG_CACHE_HOME
                value: /cache
              - name: AWS_SHARED_CREDENTIALS_FILE
                value: /var/run/datalab/storage/aws-credentials
              - name: AWS_ENDPOINT_URL
                valueFrom:
                  secretKeyRef:
                    key: AWS_ENDPOINT_URL
                    name: s-joe-datalab
              - name: AWS_REGION
                valueFrom:
                  secretKeyRef:
                    key: AWS_REGION
                    name: s-joe-datalab
              image: ghcr.io/versioneer-tech/package-r:vnext.1.1.0
              imagePullPolicy: IfNotPresent
              livenessProbe:
                httpGet:
                  path: /health
                  port: package-r
                periodSeconds: 20
              name: package-r
              ports:
              - containerPort: 8888
                name: package-r
                protocol: TCP
              readinessProbe:
                httpGet:
                  path: /health
                  port: package-r
                periodSeconds: 10
              resources:
                limits:
                  cpu: '2'
                  memory: 1Gi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 100
                runAsUser: 1000
              startupProbe:
                failureThreshold: 30
                httpGet:
                  path: /health
                  port: package-r
                periodSeconds: 5
              volumeMounts:
              - mountPath: /state
                name: state
              - mountPath: /cache
                name: cache
              - mountPath: /tmp
                name: tmp
              - mountPath: /var/run/datalab/storage
                name: storage-credentials
                readOnly: true
            initContainers:
            - args:
              - |
                set -eu

                database=/state/package-r.db
                work_database=/state/package-r.db.new

                rm -f "$work_database"
                export PACKAGE_R_DATABASE="$work_database"

                /package-r config init   --address=0.0.0.0   --port=8888   --cors-allowed-origins='*'   --auth.method=proxy   --auth.header=X-Forwarded-Preferred-Username   --auth.mapper=

                /package-r users add default ""
                /package-r users add datalab '' --perm.create=true --perm.delete=true --perm.modify=true --perm.rename=true
                /package-r users add joe '' --perm.create=true --perm.delete=true --perm.modify=true --perm.rename=true
                /package-r shares add default public /s-joe/public   --password=""   --description="default public share"   --catalog-name=catalog.parquet

                mv "$work_database" "$database"
              command:
              - /bin/sh
              - -ec
              image: ghcr.io/versioneer-tech/package-r:vnext.1.1.0
              imagePullPolicy: IfNotPresent
              name: prepare-database
              resources:
                limits:
                  cpu: 500m
                  memory: 256Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 100
                runAsUser: 1000
              volumeMounts:
              - mountPath: /state
                name: state
              - mountPath: /tmp
                name: tmp
            nodeSelector:
              kubernetes.io/arch: amd64
            securityContext:
              fsGroup: 100
              fsGroupChangePolicy: OnRootMismatch
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            terminationGracePeriodSeconds: 30
            volumes:
            - emptyDir:
                sizeLimit: 64Mi
              name: state
            - emptyDir:
                sizeLimit: 10Gi
              name: cache
            - emptyDir:
                sizeLimit: 256Mi
              name: tmp
            - name: storage-credentials
              secret:
                defaultMode: 288
                items:
                - key: aws-credentials
                  path: aws-credentials
                secretName: s-joe-datalab
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration >=
      object.metadata.generation && has(object.status.availableReplicas) && object.status.availableReplicas >= 1
    policy: DeriveFromCelQuery
  watch: true
