metadata:
  name: redis-cache-s-jeff-prod
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: redis.redis.opstreelabs.in/v1beta2
      kind: Redis
      metadata:
        annotations:
          datalabs.versioneer.at/redis-acl-checksum: 51b2df2ef6452aae4bafd5faa377b6115b82e3fa4b3b5f79431317adec2c917a
        name: prod
        namespace: s-jeff
      spec:
        acl:
          secret:
            secretName: prod-redis-acl
        initContainer:
          args:
          - mkdir -p /data/appendonlydir && chmod 0777 /data /data/appendonlydir
          command:
          - sh
          - -c
          enabled: true
          image: quay.io/opstree/redis:v7.0.15
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
        kubernetesConfig:
          image: quay.io/opstree/redis:v7.0.15
          imagePullPolicy: IfNotPresent
          redisSecret:
            key: password
            name: prod-redis-auth
          updateStrategy: {}
        storage:
          volumeClaimTemplate:
            metadata: {}
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
          volumeMount: {}
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: '!has(object.metadata.deletionTimestamp)'
    policy: DeriveFromCelQuery
  watch: true
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: redis-pod-s-jeff-prod
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Pod
      metadata:
        name: prod-0
        namespace: s-jeff
  managementPolicies:
  - Observe
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: has(object.status) && has(object.status.conditions) && object.status.conditions.exists(c, c.type ==
      'Ready' && c.status == 'True')
    policy: DeriveFromCelQuery
  watch: true
---
