                      memory: 32Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                  - mountPath: /var/run/valkey-backup
                    name: password
                    readOnly: true
                  - mountPath: /opt/backup
                    name: script
                    readOnly: true
                restartPolicy: Never
                securityContext:
                  runAsGroup: 65532
                  runAsNonRoot: true
                  runAsUser: 65532
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: valkey-cache-backup
                volumes:
                - name: password
                  secret:
                    items:
                    - key: password
                      path: password
                    secretName: valkey-cache-backup-auth
                - configMap:
                    name: valkey-cache-backup
                  name: script
        schedule: 0 1 * * *
        startingDeadlineSeconds: 3600
        successfulJobsHistoryLimit: 1
        suspend: true
        timeZone: Etc/UTC
