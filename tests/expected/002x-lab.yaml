            app.kubernetes.io/instance: cache
            app.kubernetes.io/name: valkey
        serviceName: cache
        template:
          metadata:
            annotations:
              datalabs.versioneer.at/valkey-acl-checksum: 29b713768461030e66ba1bb6991fc8174a084fcffb51015839eabe5e9c97698d
            labels:
              app.kubernetes.io/instance: cache
              app.kubernetes.io/name: valkey
          spec:
            automountServiceAccountToken: false
            containers:
            - args:
              - valkey-server
              - --bind
              - 0.0.0.0
              - --protected-mode
              - 'yes'
              - --dir
              - /data
              - --appendonly
              - 'yes'
              - --appendfsync
              - everysec
              - --save
              - ''
              - --aclfile
              - /etc/valkey/user.acl
              env:
              - name: VALKEYCLI_AUTH
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: cache-valkey-auth
              image: valkey/valkey:9.2.0-alpine
              livenessProbe:
                exec:
                  command:
                  - sh
                  - -ec
                  - test "$(valkey-cli -h 127.0.0.1 ping)" = PONG
                failureThreshold: 6
                periodSeconds: 10
                timeoutSeconds: 3
              name: valkey
              ports:
              - containerPort: 6379
                name: valkey
              readinessProbe:
                exec:
                  command:
                  - sh
                  - -ec
                  - test "$(valkey-cli -h 127.0.0.1 ping)" = PONG
                periodSeconds: 5
                timeoutSeconds: 3
              resources:
                limits:
                  cpu: '1'
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              startupProbe:
                exec:
                  command:
                  - sh
                  - -ec
                  - test "$(valkey-cli -h 127.0.0.1 ping)" = PONG
                failureThreshold: 120
                periodSeconds: 5
                timeoutSeconds: 3
              volumeMounts:
              - mountPath: /data
                name: data
              - mountPath: /etc/valkey
                name: acl
                readOnly: true
