  name: s-jeff-postgres-pg0
  namespace: default
stringData:
  databases: dev,prod
  dev_url: postgresql://postgres:pg-secret@pg0-rw.s-jeff.svc:5432/dev
  dev_url_external: postgresql://postgres:pg-secret@pg0-s-jeff.lab.acme.com:443/dev?sslmode=require&sslnegotiation=direct
