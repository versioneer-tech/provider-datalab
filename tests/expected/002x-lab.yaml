                  datalabs.versioneer.at/valkey-backup: cache
              spec:
                automountServiceAccountToken: true
                containers:
                - args:
                  - s-jeff
                  - cache
                  - unbound
                  - workspace-snapshots
                  - '4'
                  - --server
                  - valkey-cache
                  command:
                  - python
                  - -B
                  - /opt/backup/valkey-snapshot.py
                  image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
