apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: valkey-cache-s-jeff-cache
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: valkey-cache
        namespace: s-jeff
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/instance: cache
            app.kubernetes.io/name: valkey
        serviceName: valkey-cache
        template:
          metadata:
            annotations:
              datalabs.versioneer.at/valkey-acl-checksum: 95e6a457b1a87b860e9d39b10336a5936758584dc889f531e12e86ec0ca180bd
            labels:
              app.kubernetes.io/instance: cache
              app.kubernetes.io/name: valkey
          spec:
            automountServiceAccountToken: false
            containers:
            - args:
              - valkey-server
              - --bind
              - 0.0.0.0
              - --protected-mode
              - 'yes'
              - --dir
              - /data
              - --maxmemory
              - 256mb
              - --maxmemory-policy
              - noeviction
              - --appendonly
              - 'yes'
              - --appendfsync
              - everysec
              - --save
              - ''
              - --aclfile
              - /etc/valkey/user.acl
              env:
              - name: VALKEYCLI_AUTH
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: valkey-cache-auth
              image: valkey/valkey:9.2.0-alpine
              livenessProbe:
                exec:
                  command:
                  - sh
                  - -ec
                  - test "$(valkey-cli -h 127.0.0.1 ping)" = PONG
                failureThreshold: 6
                periodSeconds: 10
                timeoutSeconds: 3
              name: valkey
              ports:
              - containerPort: 6379
                name: valkey
              readinessProbe:
                exec:
                  command:
                  - sh
                  - -ec
                  - test "$(valkey-cli -h 127.0.0.1 ping)" = PONG
                periodSeconds: 5
                timeoutSeconds: 3
              resources:
                limits:
                  cpu: '1'
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              startupProbe:
                exec:
                  command:
                  - sh
                  - -ec
                  - test "$(valkey-cli -h 127.0.0.1 ping)" = PONG
                failureThreshold: 120
                periodSeconds: 5
                timeoutSeconds: 3
              volumeMounts:
              - mountPath: /data
                name: data
              - mountPath: /etc/valkey
                name: acl
                readOnly: true
            initContainers:
            - command:
              - sh
              - -ec
              - |
                attempt=0
                while [ "$attempt" -lt 180 ]; do
                  actual="$(base64 "$2" | tr -d '\n' | sha256sum)"
                  [ "${actual%% *}" != "$1" ] || exit 0
                  attempt=$((attempt + 1))
                  sleep 1
                done
                printf 'The current Valkey ACL was not mounted before the deadline.\n' >&2
                exit 1
              - wait-for-acl
              - 95e6a457b1a87b860e9d39b10336a5936758584dc889f531e12e86ec0ca180bd
              - /etc/valkey/user.acl
              image: valkey/valkey:9.2.0-alpine
              name: wait-for-acl
              resources:
                limits:
                  cpu: 100m
                  memory: 32Mi
                requests:
                  cpu: 10m
                  memory: 16Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
              - mountPath: /etc/valkey
                name: acl
                readOnly: true
            securityContext:
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            terminationGracePeriodSeconds: 60
            volumes:
            - name: data
              persistentVolumeClaim:
                claimName: valkey-cache-data
            - name: acl
              secret:
                secretName: valkey-cache-acl
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    celQuery: '!has(object.metadata.deletionTimestamp) && has(object.status) && has(object.status.observedGeneration)
      && object.status.observedGeneration >= object.metadata.generation && has(object.status.readyReplicas) && object.status.readyReplicas
      == 1 && has(object.status.currentRevision) && has(object.status.updateRevision) && object.status.currentRevision
      == object.status.updateRevision'
    policy: DeriveFromCelQuery
  watch: true
