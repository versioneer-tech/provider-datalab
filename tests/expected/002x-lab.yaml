metadata:
  name: db-backup-s-jeff-postgres-pg0-schedule-dcf6c9c0a4
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: postgresql.cnpg.io/v1
      kind: ScheduledBackup
      metadata:
        name: postgres-snapshot-pg0
        namespace: s-jeff
      spec:
        backupOwnerReference: cluster
        cluster:
          name: postgres-pg0
        method: volumeSnapshot
        online: false
        schedule: 0 0 1 * * *
        target: primary
