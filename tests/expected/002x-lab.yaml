  host_external: pg0-s-jeff.lab.acme.com
  names: '["dev", "prod"]'
  password: pg-secret
  port: '5432'
  prod_url: postgresql://postgres:pg-secret@postgres-pg0-rw.s-jeff.svc:5432/prod
