apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: valkey-backup-script-s-jeff-cache
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: v1
      data:
        valkey-snapshot.py: |
          #!/usr/bin/env python3

          """Save Valkey data and capture its PVC during a bounded write pause."""

          import argparse
          from contextlib import closing
          from pathlib import Path
          import runpy
          import socket
          import time
          from urllib.parse import quote

          snapshots = runpy.run_path(str(Path(__file__).with_name("volume-snapshot.py")))
          LABEL = "datalabs.versioneer.at/valkey"
          VERIFIED = "datalabs.versioneer.at/valkey-snapshot-verified"


          class Valkey:
              def __init__(self, host, password):
                  self.socket = socket.create_connection((host, 6379), timeout=60)
                  self.stream = self.socket.makefile("rb")
                  self.command("AUTH", "backup", password)

              def close(self):
                  self.stream.close()
                  self.socket.close()

              def command(self, *arguments):
                  values = [str(value).encode() for value in arguments]
                  self.socket.sendall(b"*%d\r\n" % len(values) + b"".join(
                      b"$%d\r\n" % len(value) + value + b"\r\n" for value in values))
                  line = self.stream.readline()
                  if not line.endswith(b"\r\n"):
                      raise RuntimeError("Valkey closed the backup connection.")
                  kind, value = line[:1], line[1:-2]
                  if kind == b"+":
                      return value.decode()
                  if kind == b"$" and int(value) >= 0:
                      data = self.stream.read(int(value) + 2)
                      if len(data) != int(value) + 2 or not data.endswith(b"\r\n"):
                          raise RuntimeError("Valkey returned an incomplete response.")
                      return data[:-2].decode()
                  # Server errors can contain command arguments; do not put them in Job logs.
                  raise RuntimeError("Valkey rejected the backup command.")


          def capture(api, valkey, namespace, store, claim, snapshot_class, retention, timeout=540, server=None):
              pod_path = "/api/v1/namespaces/" + quote(namespace, safe="") + "/pods/" + quote((server or store) + "-0", safe="")
              pause_until = 0
              identity = {}

              def check_pod():
                  pod = api.call("GET", pod_path)
                  volumes = {v["name"]: v.get("persistentVolumeClaim", {}).get("claimName")
                             for v in pod["spec"].get("volumes", [])}
                  claims = {volumes.get(mount["name"]) for container in pod["spec"]["containers"]
                            for mount in container.get("volumeMounts", []) if mount["mountPath"] == "/data"}
                  if (claims != {claim} or pod["metadata"].get("deletionTimestamp")
                          or not any(c["type"] == "Ready" and c["status"] == "True"
                                     for c in pod.get("status", {}).get("conditions", []))):
                      raise RuntimeError("The Valkey Pod must be ready and use the selected data PVC.")
                  return pod["metadata"]["uid"]

              def info(section):
                  return dict(line.split(":", 1) for line in valkey.command("INFO", section).splitlines()
                              if ":" in line and not line.startswith("#"))

              def run_id():
                  fields = info("server")
                  if not fields.get("run_id"):
                      raise RuntimeError("Valkey did not report its server identity.")
                  return fields["run_id"]

              def prepare():
                  nonlocal pause_until
                  identity["pod"] = check_pod()
                  identity["server"] = run_id()
                  # Valkey also stops eviction and expiry during this pause. It expires after a killed Job.
                  pause_until = time.monotonic() + 660
                  if valkey.command("CLIENT", "PAUSE", 660000, "WRITE") != "OK":
                      raise RuntimeError("Valkey did not pause writes.")
                  if valkey.command("BGSAVE") != "Background saving started":
                      raise RuntimeError("Valkey did not start its RDB save.")
                  save_deadline = time.monotonic() + 90
                  while True:
                      persistence = info("persistence")
                      if persistence.get("rdb_bgsave_in_progress") == "0":
                          if persistence.get("rdb_last_bgsave_status") != "ok":
                              raise RuntimeError("Valkey failed to save its RDB file.")
                          break
                      if time.monotonic() >= save_deadline:
                          raise RuntimeError("Valkey did not finish its RDB save before the deadline.")
                      time.sleep(1)
                  validate()

              def validate():
                  if (check_pod() != identity["pod"] or run_id() != identity["server"]
                          or time.monotonic() >= pause_until):
                      raise RuntimeError("The Valkey server changed or its write pause expired during capture.")

              try:
                  snapshots["backup"](api, namespace, store, claim, snapshot_class, retention,
                                      timeout=timeout, label=LABEL, prepare=prepare, validate=validate,
                                      verified_label=VERIFIED)
              finally:
                  if pause_until:
                      valkey.command("CLIENT", "UNPAUSE")


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              for argument in ("namespace", "store", "claim", "snapshot_class"):
                  parser.add_argument(argument)
              parser.add_argument("retention", type=int)
              parser.add_argument("--server")
              args = parser.parse_args()
              if not 1 <= args.retention <= 100:
                  parser.error("retention must be from 1 to 100")
              password = Path("/var/run/valkey-backup/password").read_text()
              with closing(Valkey(args.server or args.store, password)) as valkey:
                  capture(snapshots["API"](), valkey, args.namespace, args.store, args.claim,
                          args.snapshot_class, args.retention, server=args.server)


          if __name__ == "__main__":
              main()
        volume-snapshot.py: |
          #!/usr/bin/env python3

          """Create a volume snapshot and prune older completed snapshots."""

          import argparse
          import json
          from pathlib import Path
          import ssl
          import time
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          LABEL = "datalabs.versioneer.at/volume"
          SOURCE = "datalabs.versioneer.at/source-pvc-uid"


          class API:
              def __init__(self):
                  account = Path("/var/run/secrets/kubernetes.io/serviceaccount")
                  self.token = account / "token"
                  self.context = ssl.create_default_context(cafile=str(account / "ca.crt"))

              def call(self, method, path, body=None):
                  request = Request(
                      "https://kubernetes.default.svc" + path,
                      data=None if body is None else json.dumps(body).encode(),
                      method=method,
                      headers={"Authorization": "Bearer " + self.token.read_text().strip(),
                               "Content-Type": "application/merge-patch+json" if method == "PATCH" else "application/json"},
                  )
                  with urlopen(request, context=self.context, timeout=30) as result:
                      return json.load(result)


          def backup(api, namespace, volume, claim, snapshot_class, retention, timeout=600,
                     label=LABEL, prepare=None, validate=None, verified_label=None):
              core = "/api/v1/namespaces/" + quote(namespace, safe="")
              path = "/apis/snapshot.storage.k8s.io/v1/namespaces/" + quote(namespace, safe="") + "/volumesnapshots"
              volume_class = api.call("GET", "/apis/snapshot.storage.k8s.io/v1/volumesnapshotclasses/" + quote(snapshot_class, safe=""))
              if volume_class.get("deletionPolicy") != "Delete":
                  raise RuntimeError("The snapshot class must use deletion policy Delete for retention.")
              pvc = api.call("GET", core + "/persistentvolumeclaims/" + quote(claim, safe=""))
              if pvc.get("status", {}).get("phase") != "Bound" or pvc["metadata"].get("deletionTimestamp"):
                  raise RuntimeError("The source PVC must be bound and must not be deleting.")
              uid = pvc["metadata"]["uid"]
              selector = urlencode({"labelSelector": f"{label}={volume},{SOURCE}={uid}"})

              def owned_snapshots():
                  return [item for item in api.call("GET", path + "?" + selector)["items"]
                          if item["metadata"].get("labels", {}).get(label) == volume
                          and item["metadata"].get("labels", {}).get(SOURCE) == uid
                          and item.get("spec", {}).get("source", {}).get("persistentVolumeClaimName") == claim]

              def remove(item):
                  metadata = item["metadata"]
                  preconditions = {"uid": metadata["uid"]}
                  if metadata.get("resourceVersion"):
                      preconditions["resourceVersion"] = metadata["resourceVersion"]
                  api.call("DELETE", path + "/" + quote(metadata["name"], safe=""),
                           {"apiVersion": "v1", "kind": "DeleteOptions", "preconditions": preconditions})

              snapshots = owned_snapshots()
              def verified(item):
                  return not verified_label or item["metadata"].get("labels", {}).get(verified_label) == "true"

              incomplete = [item for item in snapshots
                            if item.get("status", {}).get("readyToUse") is not True or not verified(item)]
              for item in incomplete:
                  if not item["metadata"].get("deletionTimestamp"):
                      remove(item)
              if incomplete:
                  snapshots = owned_snapshots()
              # A stopped Job can leave a snapshot behind. Finish cleanup before allocating another.
              if any(item["metadata"].get("deletionTimestamp")
                     or item.get("status", {}).get("readyToUse") is not True or not verified(item) for item in snapshots):
                  raise RuntimeError("Waiting for previous snapshot cleanup before creating another backup.")

              if prepare:
                  prepare()
              created = api.call("POST", path, {
                  "apiVersion": "snapshot.storage.k8s.io/v1", "kind": "VolumeSnapshot",
                  "metadata": {"generateName": ("volume-" if label == LABEL else "valkey-") + volume + "-",
                               "labels": {label: volume, SOURCE: uid}},
                  "spec": {"volumeSnapshotClassName": snapshot_class,
                           "source": {"persistentVolumeClaimName": claim}},
              })
              name = created["metadata"]["name"]
              deadline = time.monotonic() + timeout
              while True:
                  current = api.call("GET", path + "/" + quote(name, safe=""))
                  state = current.get("status", {})
                  if state.get("error"):
                      raise RuntimeError("The CSI driver reported a snapshot error.")
                  if state.get("readyToUse") is True:
                      break
                  if time.monotonic() >= deadline:
                      raise RuntimeError("The volume snapshot did not become ready before the deadline.")
                  time.sleep(3)

              source = api.call("GET", core + "/persistentvolumeclaims/" + quote(claim, safe=""))
              if source["metadata"]["uid"] != uid:
                  raise RuntimeError("The source PVC changed while the snapshot was being taken.")

              if validate:
                  try:
                      validate()
                  except Exception:
                      # Do not retain a capture made after the write pause expired or the server changed.
                      remove(current)
                      raise

              if verified_label:
                  metadata = current["metadata"]
                  api.call("PATCH", path + "/" + quote(name, safe=""), {"metadata": {
                      "uid": metadata["uid"], "resourceVersion": metadata["resourceVersion"],
                      "labels": {verified_label: "true"},
                  }})

              completed = sorted(
                  (item for item in owned_snapshots()
                   if item.get("status", {}).get("readyToUse") is True
                   and verified(item)
                   and not item["metadata"].get("deletionTimestamp")),
                  key=lambda item: (item["metadata"]["creationTimestamp"], item["metadata"]["name"]),
                  reverse=True,
              )
              # A failed or incomplete backup must not remove a usable recovery point.
              for item in completed[retention:]:
                  remove(item)
              print("Volume snapshot is ready: " + name, flush=True)


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("namespace")
              parser.add_argument("volume")
              parser.add_argument("claim")
              parser.add_argument("snapshot_class")
              parser.add_argument("retention", type=int)
              args = parser.parse_args()
              if args.retention < 1:
                  parser.error("retention must be at least one")
              backup(API(), args.namespace, args.volume, args.claim, args.snapshot_class, args.retention)


          if __name__ == "__main__":
              main()
      kind: ConfigMap
      metadata:
        name: valkey-cache-backup
        namespace: s-jeff
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
