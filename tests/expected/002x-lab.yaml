    names:
    - dev
    - prod
    ready: false
    secretRef:
      name: s-jeff-postgres-pg0-connection-7625037fbd
      namespace: default
    type: postgres
  - name: cache
    names:
    - prod
    ready: false
    secretRef:
      name: s-jeff-valkey-cache-connection-f93fe2a7e0
      namespace: default
    type: valkey
  - endpoint: http://registry.s-jeff.svc:5000/v2/
    name: primary
    ready: false
    secretRef:
      name: s-jeff-registry-primary-connection-37485a31d8
      namespace: default
    type: registry
  oauth2: []
  volumes: []
---
