apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: workshop-s-john
  namespace: default
spec:
  forProvider:
    manifest:
      apiVersion: training.educates.dev/v1beta1
      kind: Workshop
      metadata:
        name: s-john
      spec:
        description: A default DataLab environment.
        environment:
          objects:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: deny-egress
            spec:
              egress: []
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-namespace-egress
            spec:
              egress:
              - to:
                - podSelector: {}
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-vcluster-egress
            spec:
              egress:
              - ports:
                - port: 443
                  protocol: TCP
                - port: 8443
                  protocol: TCP
                to:
                - namespaceSelector:
                    matchLabels:
                      training.educates.dev/environment.name: s-john
                      training.educates.dev/session.objects: 'true'
                  podSelector:
                    matchLabels:
                      app: vcluster
                      release: my-vcluster
              podSelector: {}
              policyTypes:
              - Egress
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-dns-egress
            spec:
              egress:
