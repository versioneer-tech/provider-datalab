apiVersion: pkg.internal/v1beta2
kind: Datalab
metadata:
  annotations:
    datalabs.pkg.internal/environment: datalab-custom
  name: s-jane
spec:
  databases:
    pg0:
      backupStorage: 3Gi
      names:
      - analytics
      storage: 1Gi
  sessions:
  - name: default
    state: started
  users:
  - jane
  vclusters:
    vc0:
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
      secretBindings:
      - name: pg0
        target:
          name: database-credentials
          namespace: applications
        type: postgres
      - name: apikey-1
        target:
          name: apikey-1
          namespace: applications
        type: custom
      storage: 1Gi
status:
  connections:
  - endpoint: https://s-jane.lab.acme.com/.vc0
    group: cluster-admin
    instance: vc0
    name: vcluster-vc0-cluster-admin-7ad833319f
    ready: false
    role: cluster-admin
    secretRef:
      name: s-jane-vcluster-vc0-cluster-admin-connection-07f6306630
      namespace: default
    targetNamespace: '*'
    type: vcluster
  - endpoint: https://s-jane.lab.acme.com/.vc0
    group: namespace-demo
    instance: vc0
    name: vcluster-vc0-namespace-demo-b2157b3b79
    ready: false
    role: edit
    secretRef:
      name: s-jane-vcluster-vc0-namespace-demo-connection-768a47880a
      namespace: default
    targetNamespace: demo
    type: vcluster
  oauth2: []
  sessions:
  - name: default
    pvcRef:
      name: s-jane-default-persistent
      namespace: s-jane
    pvcSize: 40Gi
    state: started
