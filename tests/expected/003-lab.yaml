---
apiVersion: pkg.internal/v1
kind: Datalab
metadata:
  annotations:
    datalabs.pkg.internal/environment: datalab-custom
  name: s-jane
spec:
  databases:
    pg0:
      backupStorage: 3Gi
      names:
      - analytics
      storage: 1Gi
  secretName: s-jane
  users:
  - jane
  vclusters:
    vc0:
      groups:
      - name: namespace-demo
        namespace: demo
        role: edit
      - name: cluster-admin
        namespace: '*'
        role: cluster-admin
      secretBindings:
        catalog-database:
          export: analytics-reader
          keys:
            url: DATABASE_URL
          target:
            name: catalog-database
            namespace: demo
      storage: 1Gi
status:
  connections:
  - name: s3
    ready: false
    secretRef:
      name: s-jane-s3
      namespace: default
    type: s3
  - endpoint: pg0-primary.s-jane.svc
    name: postgres-pg0
    ready: false
    secretRef:
      name: s-jane-postgres-pg0
      namespace: default
    type: postgres
  - endpoint: https://s-jane.lab.acme.com/.vc0
    group: cluster-admin
    instance: vc0
    name: vcluster-vc0-cluster-admin-7ad833319f
    ready: false
    role: cluster-admin
    secretRef:
      name: s-jane-vcluster-vc0-cluster-admin-03a1ba3651
      namespace: default
    targetNamespace: '*'
    type: vcluster
  - endpoint: https://s-jane.lab.acme.com/.vc0
    group: namespace-demo
    instance: vc0
    name: vcluster-vc0-namespace-demo-b2157b3b79
    ready: false
    role: edit
    secretRef:
      name: s-jane-vcluster-vc0-namespace-demo-6eaa08d412
      namespace: default
    targetNamespace: demo
    type: vcluster
  secretBindings:
  - export: analytics-reader
    instance: vc0
    name: catalog-database
    ready: false
    reason: SourceNotReady
    target:
      name: catalog-database
      namespace: demo
---
