                containers:
                - args:
                  - s-jane
                  - analysis
                  - volume-analysis
                  - workspace-snapshots
                  - '2'
                  command:
                  - python
                  - -B
                  - /opt/backup/backup.py
                  image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
                  name: backup
                  resources:
                    limits:
                      cpu: 100m
                      memory: 128Mi
                    requests:
                      cpu: 20m
                      memory: 32Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                  - mountPath: /opt/backup
                    name: script
                    readOnly: true
                restartPolicy: Never
                securityContext:
                  runAsGroup: 65532
                  runAsNonRoot: true
                  runAsUser: 65532
                  seccompProfile:
                    type: RuntimeDefault
                serviceAccountName: volume-snapshot-analysis
                volumes:
                - configMap:
                    name: volume-snapshot-analysis
                  name: script
        schedule: 0 1 * * *
        startingDeadlineSeconds: 3600
        successfulJobsHistoryLimit: 1
        timeZone: Etc/UTC
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
