              - 169.254.169.254/32
              - 169.254.42.42/32
              - 10.42.0.0/16
              - 10.43.0.0/16
        - to:
          - ipBlock:
              cidr: ::/0
              except:
              - fd00:ec2::254/128
              - fd00:42::42/128
        podSelector: {}
        policyTypes:
        - Egress
  providerConfigRef:
    kind: ProviderConfig
    name: provider-kubernetes
  readiness:
    policy: SuccessfulCreate
  watch: true
