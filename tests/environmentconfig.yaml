apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: datalab
  labels:
    datalabs.pkg.internal/name: datalab
data:
  images:
    packageR: ghcr.io/versioneer-tech/package-r:vnext.1.2.0
    registry: registry:3.1.2
    rclone: rclone/rclone:1.76.0
    redis: quay.io/opstree/redis:v7.2.17
    oauth2Proxy: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
  iam:
    realm: acme
    redirectURIs:
    - http://localhost:8080/callback
  ingress:
    class: nginx
    domain: lab.acme.com
    secret: wildcard-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  oauth2Proxy:
    upstreamTimeout: 3600s
  storage:
    endpoint: https://s3.acme.com
    forcePathStyle: "true"
    provider: Other
    region: acme
    secretNamespace: datalab
  network:
    externalEgressCIDRs:
    - 0.0.0.0/0
    - ::/0
    serviceCIDR: "10.43.0.0/16"
    podCIDRs:
    - 10.42.0.0/16
    blacklistIPs:
    - 169.254.169.254/32
    - fd00:ec2::254/128
    - 169.254.42.42/32
    - fd00:42::42/128
    internalEgress:
    - namespace: minio
      podSelector:
        matchLabels:
          v1.min.io/tenant: default
      ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 9000
    excludePolicies: []
  registry:
    enabled: true
  packageR:
    enabled: true
    readOnlyMount: false
  overallQuota:
    storage: 100Gi
  security:
    policy: baseline
    externalEgress: true
  cacheStore:
    snapshotClassName: workspace-snapshots
  database:
    tlsRoute:
      parentName: default
      parentNamespace: projectcontour
      sectionName: postgres-passthrough
    storageClassName: ""
    snapshotClassName: workspace-snapshots
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: datalab-custom
  labels:
    datalabs.pkg.internal/name: datalab-custom
data:
  images:
    packageR: ghcr.io/versioneer-tech/package-r:vnext.1.2.0
    registry: registry:3.1.2
    rclone: rclone/rclone:1.76.0
    redis: quay.io/opstree/redis:v7.2.17
    oauth2Proxy: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
  customSecrets:
  - name: apikey-1
  - name: apikey-2
  vcluster:
    storage: 5Gi
  volumes:
    snapshotClassName: workspace-snapshots
    storageClasses:
      allowed: [sbs-default, sbs-default-retain]
      default: sbs-default
  iam:
    realm: acme
    redirectURIs:
    - http://localhost:8080/callback
    issuerURL: https://identity.acme.com/realms/acme
    internalURL: http://keycloak.keycloak:8080/realms/acme
    extraAudiences:
    - datalab-service-custom
  ingress:
    enabled: false
    class: nginx
    domain: lab.acme.com
    secret: wildcard-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  httpRoute:
    enabled: true
    enableS3: true
    parentName: default
    parentNamespace: contour
    sectionName: workspaces-https
    httpSectionName: workspaces-http
    timeouts:
      request: 3600s
      backendRequest: 3600s
  oauth2Proxy:
    upstreamTimeout: 3600s
  storage:
    endpoint: https://s3.acme.com
    forcePathStyle: 'true'
    provider: Other
    region: acme
    secretNamespace: datalab
  network:
    internalIngress:
    - namespace: operations
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
      targetPodSelector:
        matchLabels:
          app.kubernetes.io/name: package-r
      ports:
      - protocol: TCP
        port: 8888
    externalEgressCIDRs:
    - 0.0.0.0/0
    - ::/0
    serviceCIDR: 10.43.0.0/16
    podCIDRs:
    - 10.42.0.0/16
    blacklistIPs:
    - 169.254.169.254/32
    - fd00:ec2::254/128
    - 169.254.42.42/32
    - fd00:42::42/128
    excludePolicies: []
    internalEgress:
    - namespace: minio
      podSelector:
        matchLabels:
          v1.min.io/tenant: default
      ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 9000
  packageR:
    enabled: true
    readOnlyMount: true
  overallQuota:
    storage: 200Gi
  security:
    policy: privileged
    externalEgress: true
  registry:
    enabled: true
  cacheStore:
    snapshotClassName: workspace-snapshots
    storageClassName: sbs-default-retain
  database:
    tlsRoute:
      parentName: default
      parentNamespace: projectcontour
      sectionName: postgres-passthrough
    storageClassName: sbs-default-retain
    snapshotClassName: workspace-snapshots
