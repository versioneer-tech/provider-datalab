apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: datalab
data:
  images:
    packageR: ghcr.io/versioneer-tech/package-r:vnext.1.1.0
    registry: registry:3.1.2
    rclone: rclone/rclone:1.71.0
    mongo: quay.io/mongodb/mongodb-community-server:8.0.12-ubi8
    mongoBackup: mongo:8.0.12
    redis: quay.io/opstree/redis:v7.0.15
    redisBackup: redis:7.0.15
    oauth2Proxy: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
  iam:
    realm: acme
  ingress:
    class: nginx
    domain: lab.acme.com
    secret: wildcard-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  oauth2Proxy:
    upstreamTimeout: 3600s
  storage:
    endpoint: https://s3.acme.com
    forcePathStyle: "true"
    provider: Other
    region: acme
    secretNamespace: datalab
    type: s3
  storageClasses:
    allowed:
    - sbs-default
    - sbs-default-retain
  network:
    externalEgressCIDRs:
    - 0.0.0.0/0
    - ::/0
    serviceCIDR: "10.43.0.0/16"
    podCIDRs:
    - 10.42.0.0/16
    blacklistIPs:
    - 169.254.169.254/32
    - fd00:ec2::254/128
    - 169.254.42.42/32
    - fd00:42::42/128
    internalEgress:
    - namespace: minio
      podSelector:
        matchLabels:
          v1.min.io/tenant: default
      ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 9000
    excludePolicies: []
  packages:
    - name: awscli
      files:
        - image:
            url: ghcr.io/versioneer-tech/educates-extension-packages/awscli:v2.29.0
    - name: rclone
      files:
        - image:
            url: ghcr.io/versioneer-tech/educates-extension-packages/rclone:v1.71.0
  defaults:
    vcluster:
      enabled: true
    registry:
      enabled: true
    data:
      enabled: true
      readOnlyMount: false
    quota:
      memory: 2Gi
      storage: 1Gi
      budget: medium
    overallQuota:
      storage: 100Gi
    security:
      policy: baseline
      kubernetesAccess: true
      kubernetesRole: edit
      externalEgress: true
  database:
    tlsRoute:
      parentName: default
      parentNamespace: projectcontour
      sectionName: postgres-passthrough
    storageClassName: ""
    backupStorageClassName: ""
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: datalab-custom
data:
  images:
    packageR: ghcr.io/versioneer-tech/package-r:vnext.1.1.0
    registry: registry:3.1.2
    rclone: rclone/rclone:1.71.0
    mongo: quay.io/mongodb/mongodb-community-server:8.0.12-ubi8
    mongoBackup: mongo:8.0.12
    redis: quay.io/opstree/redis:v7.0.15
    redisBackup: redis:7.0.15
    oauth2Proxy: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
  customSecrets:
  - name: apikey-1
  - name: apikey-2
  vcluster:
    storage: 5Gi
    storageClasses:
      allowed: [sbs-default, sbs-default-retain]
      default: sbs-default
  iam:
    realm: acme
    issuerURL: https://identity.acme.com/realms/acme
    internalURL: http://keycloak.keycloak:8080/realms/acme
    extraAudiences:
    - datalab-service-custom
  ingress:
    enabled: false
    class: nginx
    domain: lab.acme.com
    secret: wildcard-tls
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  httpRoute:
    enabled: true
    enableS3: true
    parentName: default
    parentNamespace: contour
    sectionName: workspaces-https
    httpSectionName: workspaces-http
    timeouts:
      request: 3600s
      backendRequest: 3600s
  oauth2Proxy:
    upstreamTimeout: 3600s
  storage:
    endpoint: https://s3.acme.com
    forcePathStyle: 'true'
    provider: Other
    region: acme
    secretNamespace: datalab
    type: s3
  storageClasses:
    allowed:
    - sbs-default
    - sbs-default-retain
  network:
    internalIngress:
    - namespace: operations
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
      targetPodSelector:
        matchLabels:
          app.kubernetes.io/name: package-r
      ports:
      - protocol: TCP
        port: 8888
    externalEgressCIDRs:
    - 0.0.0.0/0
    - ::/0
    serviceCIDR: 10.43.0.0/16
    podCIDRs:
    - 10.42.0.0/16
    blacklistIPs:
    - 169.254.169.254/32
    - fd00:ec2::254/128
    - 169.254.42.42/32
    - fd00:42::42/128
    excludePolicies: []
    internalEgress:
    - namespace: minio
      podSelector:
        matchLabels:
          v1.min.io/tenant: default
      ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 9000
  packages:
  - name: awscli
    files:
    - image:
        url: ghcr.io/versioneer-tech/educates-extension-packages/awscli:v2.29.0
  - name: rclone
    files:
    - image:
        url: ghcr.io/versioneer-tech/educates-extension-packages/rclone:v1.71.0
  defaults:
    data:
      enabled: true
      readOnlyMount: true
    vcluster:
      enabled: true
    quota:
      memory: 4Gi
      storage: 40Gi
      budget: x-large
    overallQuota:
      storage: 200Gi
    security:
      policy: privileged
      kubernetesAccess: true
      kubernetesRole: admin
      externalEgress: true
    registry:
      enabled: true
    persistence:
      storageClassName: sbs-default-retain
    files:
    - git:
        url: https://github.com/versioneer-tech/datalab-example
        ref: origin/main
      includePaths:
      - /workshop/**
      - /data/**
      - /README.md
      path: .
  database:
    tlsRoute:
      parentName: default
      parentNamespace: projectcontour
      sectionName: postgres-passthrough
    storageClassName: sbs-default-retain
    backupStorageClassName: sbs-default-retain
  documentStore:
    storageClassName: sbs-default-retain
  cacheStore:
    storageClassName: sbs-default-retain
