apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-keycloak
spec:
  deploymentTemplate:
    metadata:
      labels:
        runtime: provider-keycloak
    spec:
      replicas: 1
      selector:
        matchLabels:
          runtime: provider-keycloak
      template:
        metadata:
          labels:
            runtime: provider-keycloak
        spec:
          serviceAccountName: provider-keycloak
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: package-runtime
            # This provider exposes metrics but has no separate health listener.
            startupProbe:
              httpGet:
                path: /metrics
                port: 8080
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60
            readinessProbe:
              httpGet:
                path: /metrics
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 3
            livenessProbe:
              httpGet:
                path: /metrics
                port: 8080
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            args:
            - --max-reconcile-rate=3
            - --max-concurrent-reconciles=1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  deploymentTemplate:
    metadata:
      labels:
        runtime: provider-kubernetes
    spec:
      replicas: 1
      selector:
        matchLabels:
          runtime: provider-kubernetes
      template:
        metadata:
          labels:
            runtime: provider-kubernetes
        spec:
          serviceAccountName: provider-kubernetes
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: package-runtime
            startupProbe:
              httpGet:
                path: /healthz
                port: 8081
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60
            readinessProbe:
              httpGet:
                path: /readyz
                port: 8081
              periodSeconds: 10
              timeoutSeconds: 3
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8081
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            args:
            - --enable-watches
            - --poll=5m
            - --max-reconcile-rate=10
            - --sanitize-secrets
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 1Gi
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: function-python
spec:
  deploymentTemplate:
    metadata:
      labels:
        runtime: function-python
    spec:
      replicas: 1
      selector:
        matchLabels:
          runtime: function-python
      template:
        metadata:
          labels:
            runtime: function-python
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: package-runtime
            # The function listener requires TLS; native gRPC probes cannot use it.
            startupProbe:
              tcpSocket:
                port: 9443
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60
            readinessProbe:
              tcpSocket:
                port: 9443
              periodSeconds: 10
              timeoutSeconds: 3
            livenessProbe:
              tcpSocket:
                port: 9443
              periodSeconds: 20
              timeoutSeconds: 3
              failureThreshold: 3
            # Pipeline requests contain desired and observed virtual cluster configuration.
            args:
            - --max-recv-message-size=64
            - --max-send-message-size=64
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
---
