  - step: update-registry-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import base64

        import hashlib

        import re

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _boolish(value):
            if isinstance(value, bool):
                return value
            return str(value).lower() in ("true", "1", "yes", "on")

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        def _duration_milliseconds(value, setting):
            text = _safe_str(value)
            if not re.fullmatch(r"(?:[0-9]{1,5}(?:ms|h|m|s)){1,4}", text):
                raise ValueError(f"{setting} must be a duration, such as 3600s, 1h30m, or 0s.")
            units = {"h": 3600000, "m": 60000, "s": 1000, "ms": 1}
            return sum(int(number) * units[unit] for number, unit in re.findall(r"([0-9]+)(ms|h|m|s)", text))

        def _http_route_timeouts(environment):
            configured = (environment.get("httpRoute") or {}).get("timeouts")
            if configured is None:
                configured = {}
            if not isinstance(configured, dict):
                raise ValueError("httpRoute.timeouts must contain request and backendRequest durations.")
            request_timeout = _safe_str(configured.get("request", "3600s"))
            timeouts = {"request": request_timeout,
                        "backendRequest": _safe_str(configured.get("backendRequest", request_timeout))}
            request, backend = (
                _duration_milliseconds(timeouts[key], f"httpRoute.timeouts.{key}")
                for key in ("request", "backendRequest")
            )
            if request and backend > request:
                raise ValueError("httpRoute.timeouts.backendRequest must not exceed request; use request: 0s for no request timeout.")
            return timeouts

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_data(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return (
                manifest.get("data")
                or manifest.get("stringData")
                or raw_manifest.get("data")
                or raw_manifest.get("stringData")
                or {}
            )

        def _b64get_any(data, keys):
            if not data:
                return None
            for key in keys:
                value = data.get(key)
                if value is None:
                    continue
                try:
                    return base64.b64decode(value, validate=True).decode("utf-8")
                except Exception:
                    return str(value)
            return None

        def _strong_token(seed, *, suffix=":provider-datalab", length=32):
            # Keep each service's existing seed and length to prevent credential changes.
            digest = hashlib.sha256((seed + suffix).encode("utf-8")).digest()
            return base64.urlsafe_b64encode(digest).decode("ascii").rstrip("=")[:length]

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import hashlib
        import json



        def compose(req, rsp):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            meta = xr["metadata"]
            name, namespace = meta["name"], meta.get("namespace") or "default"
            env = _to_dict(req.context).get("apiextensions.crossplane.io/environment") or {}
            registry_image = _safe_str((env.get("images") or {}).get("registry")) or "registry:3.1.2"
            if not _boolish(((env.get("defaults") or {}).get("registry") or {}).get("enabled", True)):
                return
            observed = req.observed.resources
            runtime_namespace = name

            def emit(suffix, manifest, readiness=None):
                key = f"registry-{suffix}-{name}"
                rsp.desired.resources[key].resource.update(_render_template(
                    req, "common/object", key=key, xr_namespace=namespace, manifest=manifest,
                    readiness=readiness or {"policy": "SuccessfulCreate"},
                ))

            auth = {"user": name, "password": _strong_token(f"{name}:registry", length=28),
                    "http-secret": _strong_token(f"{name}:registry:http")}
            emit("auth-secret", {
                "apiVersion": "v1", "kind": "Secret",
                "metadata": {"name": "registry-auth", "namespace": runtime_namespace},
                "type": "Opaque", "stringData": auth,
            })
            storage_data = _extract_data(observed.get(f"observe-runtime-storage-secret-{name}"))
            if not _b64get_any(storage_data, ["aws-credentials"]):
                return
            storage = env.get("storage") or {}
            endpoint = _b64get_any(storage_data, ["AWS_ENDPOINT_URL"]) or storage.get("endpoint", "")
            config = {
                "version": 0.1,
                "log": {"level": "info"},
                "storage": {
                    "s3": {"bucket": name, "region": _b64get_any(storage_data, ["AWS_REGION"]) or storage.get("region") or "us-east-1",
                           "forcepathstyle": _boolish(
                               _b64get_any(storage_data, ["AWS_S3_FORCE_PATH_STYLE"]) or storage.get("forcePathStyle", True)),
                           "secure": not endpoint.startswith("http://")},
                    # Keep downloads on the authenticated registry route.
                    "redirect": {"disable": True},
                },
                "http": {"addr": "0.0.0.0:5000", "relativeurls": True,
                         "debug": {"addr": "0.0.0.0:5001"}},
                "auth": {"htpasswd": {"realm": "Datalab registry", "path": "/auth/htpasswd"}},
                "health": {"storagedriver": {"enabled": True, "interval": "10s", "threshold": 3}},
            }
            config_text = json.dumps(config, indent=2, sort_keys=True)
            checksum = hashlib.sha256(json.dumps([storage_data, auth, config_text], sort_keys=True).encode()).hexdigest()
            labels = {"app.kubernetes.io/name": "registry", "app.kubernetes.io/instance": name}
            emit("config", _render_template(req, "registry/config", runtime_namespace=runtime_namespace, config=config_text))
            emit("deployment", _render_template(
                req, "registry/deployment", runtime_namespace=runtime_namespace, labels=labels,
                registry_image=registry_image,
                checksum=checksum, storage_secret_name=f"{name}-storage",
            ), {"policy": "DeriveFromCelQuery", "celQuery":
                "has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration >= object.metadata.generation && has(object.status.availableReplicas) && object.status.availableReplicas >= 1"})
            emit("service", _render_template(req, "registry/service", runtime_namespace=runtime_namespace, labels=labels))
            emit("networkpolicy", {
                "apiVersion": "networking.k8s.io/v1", "kind": "NetworkPolicy",
                "metadata": {"name": "registry", "namespace": runtime_namespace},
                "spec": {"podSelector": {"matchLabels": labels}, "policyTypes": ["Ingress"],
                         "ingress": [{"ports": [{"protocol": "TCP", "port": 5000}]}]},
            })
            ingress, gateway = env.get("ingress") or {}, env.get("httpRoute") or {}
            hostname = f"{name}.{ingress.get('domain', 'default')}"
            backend = {"name": "registry", "port": 5000}
            if _boolish(gateway.get("enabled")):
                parent = {"name": gateway["parentName"], "namespace": gateway["parentNamespace"],
                          "sectionName": gateway["sectionName"]}
                emit("route", {
                    "apiVersion": "gateway.networking.k8s.io/v1", "kind": "HTTPRoute",
                    "metadata": {"name": "registry", "namespace": runtime_namespace},
                    "spec": {"parentRefs": [parent], "hostnames": [hostname], "rules": [
                        {"matches": [{"path": {"type": "PathPrefix", "value": "/v2"}}],
                         "backendRefs": [backend], "timeouts": _http_route_timeouts(env)},
                    ]},
                }, {"policy": "DeriveFromCelQuery", "celQuery":
                    f"has(object.status) && has(object.status.parents) && object.status.parents.exists(p, p.parentRef.name == {json.dumps(parent['name'])} && has(p.parentRef.namespace) && p.parentRef.namespace == {json.dumps(parent['namespace'])} && has(p.parentRef.sectionName) && p.parentRef.sectionName == {json.dumps(parent['sectionName'])} && has(p.conditions) && p.conditions.exists(c, c.type == 'Accepted' && c.status == 'True' && c.observedGeneration == object.metadata.generation) && p.conditions.exists(c, c.type == 'ResolvedRefs' && c.status == 'True' && c.observedGeneration == object.metadata.generation))"})
            elif _boolish(ingress.get("enabled")):
                emit("ingress", {
                    "apiVersion": "networking.k8s.io/v1", "kind": "Ingress",
                    "metadata": {"name": "registry", "namespace": runtime_namespace,
                                 "annotations": ingress.get("annotations") or {}},
                    "spec": {"ingressClassName": ingress.get("class", ""), "rules": [{"host": hostname,
                        "http": {"paths": [{"path": "/v2", "pathType": "Prefix", "backend": {
                            "service": {"name": "registry", "port": {"number": 5000}}}}]}}],
                        "tls": [{"hosts": [hostname], "secretName": ingress.get("secret", "wildcard-tls")}]},
                })
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        registry/config:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: registry
            namespace: ${runtime_namespace}
          data:
            config.yml: ${config}
        registry/deployment:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: registry
            namespace: ${runtime_namespace}
            labels: ${labels}
          spec:
            replicas: 1
            selector:
              matchLabels: ${labels}
            template:
              metadata:
                labels: ${labels}
                annotations:
                  datalabs.versioneer.at/registry-checksum: ${checksum}
              spec:
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                initContainers:
                - name: prepare-auth
                  image: httpd:2.4.69-alpine
                  command:
                  - /bin/sh
                  - -ec
                  args:
                  - |
                    umask 077
                    printf '%s\n' "$REGISTRY_PASSWORD" | htpasswd -Bin "$REGISTRY_USER" > /auth/htpasswd
                  env:
                  - name: REGISTRY_USER
                    valueFrom:
                      secretKeyRef:
                        name: registry-auth
                        key: user
                  - name: REGISTRY_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: registry-auth
                        key: password
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop:
                      - ALL
                  resources:
                    requests:
                      cpu: 50m
                      memory: 32Mi
                    limits:
                      cpu: 500m
                      memory: 64Mi
                  volumeMounts:
                  - name: auth
                    mountPath: /auth
                containers:
                - name: registry
                  image: ${registry_image}
                  command:
                  - /bin/registry
                  args:
                  - serve
                  - /etc/distribution/config.yml
                  env:
                  - name: AWS_SHARED_CREDENTIALS_FILE
                    value: /var/run/datalab/storage/aws-credentials
                  - name: AWS_EC2_METADATA_DISABLED
                    value: 'true'
                  - name: AWS_REGION
                    valueFrom:
                      secretKeyRef:
                        name: ${storage_secret_name}
                        key: AWS_REGION
                  - name: AWS_ENDPOINT_URL
                    valueFrom:
                      secretKeyRef:
                        name: ${storage_secret_name}
                        key: AWS_ENDPOINT_URL
                  - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
                    value: $(AWS_ENDPOINT_URL)
                  - name: REGISTRY_HTTP_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: registry-auth
                        key: http-secret
                  - name: OTEL_TRACES_EXPORTER
                    value: none
                  ports:
                  - name: registry
                    containerPort: 5000
                  - name: health
                    containerPort: 5001
                  startupProbe:
                    httpGet:
                      path: /debug/health
                      port: health
                    periodSeconds: 5
                    failureThreshold: 30
                  readinessProbe:
                    httpGet:
                      path: /debug/health
                      port: health
                    periodSeconds: 10
                  livenessProbe:
                    tcpSocket:
                      port: registry
                    periodSeconds: 20
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop:
                      - ALL
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: '2'
                      memory: 512Mi
                  volumeMounts:
                  - name: config
                    mountPath: /etc/distribution
                    readOnly: true
                  - name: auth
                    mountPath: /auth
                    readOnly: true
                  - name: storage-credentials
                    mountPath: /var/run/datalab/storage
                    readOnly: true
                  - name: tmp
                    mountPath: /tmp
                volumes:
                - name: config
                  configMap:
                    name: registry
                - name: auth
                  emptyDir:
                    medium: Memory
                    sizeLimit: 1Mi
                - name: storage-credentials
                  secret:
                    secretName: ${storage_secret_name}
                    defaultMode: 288
                    items:
                    - key: aws-credentials
                      path: aws-credentials
                - name: tmp
                  emptyDir:
                    sizeLimit: 64Mi
        registry/service:
          apiVersion: v1
          kind: Service
          metadata:
            name: registry
            namespace: ${runtime_namespace}
            labels: ${labels}
          spec:
            selector: ${labels}
            ports:
            - name: registry
              port: 5000
              targetPort: registry
  - step: update-postgres-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import re

        from decimal import Decimal

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _string_value(value):
            """Keep the literal string for null values in existing resource settings."""
            return str(value).strip()

        def _backup_enabled(value):
            quantity = str(value or "0").strip()
            match = re.fullmatch(
                r"([+]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+))(?:[eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?",
                quantity,
            )
            if not match:
                raise ValueError("backupStorage must be a non-negative Kubernetes quantity")
            return Decimal(match[1]) > 0

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            db_hosts = spec.get("databases") or {}
            if not isinstance(db_hosts, dict) or not db_hosts:
                return

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}

            ingress_env = environment.get("ingress") or {}
            ingress_domain = ingress_env.get("domain", "default")

            db_env = environment.get("database") or {}
            gateway_env = db_env.get("tlsRoute") or {}

            gateway_parent_name = _string_value(gateway_env.get("parentName") or "")
            gateway_parent_ns = _string_value(gateway_env.get("parentNamespace") or "")
            gateway_section = _string_value(gateway_env.get("sectionName") or "")
            has_gateway_parent = bool(
                gateway_parent_name and gateway_parent_ns and gateway_section
            )

            data_sc_default = _string_value(db_env.get("storageClassName") or "")
            backup_sc_default = _string_value(db_env.get("backupStorageClassName") or "")

            users = list(spec.get("users", []) or [])
            admin_user = "postgres"
            other_users = [
                u for u in users if _string_value(u) and _string_value(u) != admin_user
            ]
            users_all = [admin_user] + other_users

            runtime_namespace = xr_name

            def emit_obj(key, manifest, readiness=None, watch=True, management_policies=None):
                body = _render_template(
                    req,
                    "postgres/object",
                    key=key,
                    xr_namespace=xr_namespace,
                    manifest=manifest,
                    watch=watch,
                )
                if readiness is not None:
                    body["spec"]["readiness"] = readiness
                if management_policies:
                    body["spec"]["managementPolicies"] = management_policies
                rsp.desired.resources[key].resource.update(body)

            for host_key in sorted(list(db_hosts.keys())):
                if not isinstance(host_key, str) or not host_key.strip():
                    continue

                host_cfg = db_hosts.get(host_key) or {}
                if not isinstance(host_cfg, dict):
                    continue

                dbnames = list(host_cfg.get("names") or [])
                dbnames = [_string_value(x) for x in dbnames if _string_value(x)]
                if not dbnames:
                    continue

                db_storage = _string_value(host_cfg.get("storage") or "")
                backup_storage = _string_value(host_cfg.get("backupStorage") or "")
                if not db_storage:
                    continue
                backup_enabled = _backup_enabled(backup_storage)

                db_storage_class = _string_value(
                    host_cfg.get("storageClassName") or data_sc_default
                )
                backup_storage_class = _string_value(
                    host_cfg.get("backupStorageClassName") or backup_sc_default
                )

                cluster_name = f"{host_key.strip()}"
                cm_name = f"{cluster_name}-init-sql"
                init_sql = "\\set ON_ERROR_STOP on\n\\connect postgres\n"

                cm = _render_template(
                    req,
                    "postgres/init-sql",
                    cm_name=cm_name,
                    runtime_namespace=runtime_namespace,
                    init_sql=init_sql,
                )

                data_vcs = {
                    "accessModes": ["ReadWriteOnce"],
                    "resources": {"requests": {"storage": db_storage}},
                }
                if db_storage_class:
                    data_vcs["storageClassName"] = db_storage_class

                pg_cluster = _render_template(
                    req,
                    "postgres/postgres-cluster",
                    cluster_name=cluster_name,
                    runtime_namespace=runtime_namespace,
                    cm_name=cm_name,
                    data_vcs=data_vcs,
                )

                readiness_query = "has(object.status) && has(object.status.instances) && object.status.instances.exists(i, i.name == 'primary' && has(i.readyReplicas) && i.readyReplicas >= 1)"
                if backup_enabled:
                    repo_vcs = {
                        "accessModes": ["ReadWriteOnce"],
                        "resources": {"requests": {"storage": backup_storage}},
                    }
                    if backup_storage_class:
                        repo_vcs["storageClassName"] = backup_storage_class
                    pg_cluster["spec"]["backups"] = _render_template(
                        req, "postgres/backups", repo_vcs=repo_vcs
                    )
                    readiness_query += " && has(object.status.pgbackrest) && has(object.status.pgbackrest.repoHost) && object.status.pgbackrest.repoHost.ready == true"

                if users_all:
                    pg_cluster["spec"]["users"] = [
                        {"name": admin_user, "databases": dbnames}
                    ] + [{"name": u} for u in other_users]

                emit_obj(
                    f"db-configmap-{xr_name}-{cluster_name}",
                    cm,
                    readiness={"policy": "SuccessfulCreate"},
                    watch=True,
                )
                emit_obj(
                    f"db-postgrescluster-{xr_name}-{cluster_name}",
                    pg_cluster,
                    readiness={
                        "policy": "DeriveFromCelQuery",
                        "celQuery": readiness_query,
                    },
                    watch=True,
                )

                if not has_gateway_parent:
                    continue

                hostname = f"{cluster_name}-{runtime_namespace}.{ingress_domain}"
                route = _render_template(
                    req,
                    "postgres/route",
                    cluster_name=cluster_name,
                    runtime_namespace=runtime_namespace,
                    gateway_parent_name=gateway_parent_name,
                    gateway_parent_ns=gateway_parent_ns,
                    gateway_section=gateway_section,
                    hostname=hostname,
                    backend_service_name=f"{cluster_name}-primary",
                )

                emit_obj(
                    f"db-tlsroute-{xr_name}-{cluster_name}",
                    route,
                    readiness={
                        "policy": "DeriveFromCelQuery",
                        "celQuery": "has(object.status) && has(object.status.parents) && object.status.parents.exists(p, has(p.conditions) && p.conditions.exists(c, c.type == 'Accepted' && c.status == 'True') && p.conditions.exists(c, c.type == 'ResolvedRefs' && c.status == 'True'))",
                    },
                    watch=True,
                )
      templates:
        postgres/backups:
          pgbackrest:
            global:
              repo1-retention-full-type: count
              repo1-retention-full: '4'
              repo1-path: /pgbackrest/repo1
            repos:
            - name: repo1
              schedules:
                full: 0 1 * * 0
                differential: 0 1 * * 1-6
              volume:
                volumeClaimSpec: ${repo_vcs}
        postgres/init-sql:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${cm_name}
            namespace: ${runtime_namespace}
          data:
            init.sql: ${init_sql}
        postgres/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            watch: ${watch}
        postgres/postgres-cluster:
          apiVersion: postgres-operator.crunchydata.com/v1
          kind: PostgresCluster
          metadata:
            name: ${cluster_name}
            namespace: ${runtime_namespace}
          spec:
            postgresVersion: 17
            postGISVersion: '3.5'
            databaseInitSQL:
              name: ${cm_name}
              key: init.sql
            instances:
            - name: primary
              replicas: 1
              dataVolumeClaimSpec: ${data_vcs}
        postgres/route:
          apiVersion: gateway.networking.k8s.io/v1
          kind: TLSRoute
          metadata:
            name: ${cluster_name}
            namespace: ${runtime_namespace}
          spec:
            parentRefs:
            - name: ${gateway_parent_name}
              namespace: ${gateway_parent_ns}
              sectionName: ${gateway_section}
            hostnames:
            - ${hostname}
            rules:
            - backendRefs:
              - name: ${backend_service_name}
                port: 5432
  - step: update-mongodb-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import base64

        import hashlib

        import re

        from decimal import Decimal

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        def _string_value(value):
            """Keep the literal string for null values in existing resource settings."""
            return str(value).strip()

        def _backup_enabled(value):
            quantity = str(value or "0").strip()
            match = re.fullmatch(
                r"([+]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+))(?:[eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?",
                quantity,
            )
            if not match:
                raise ValueError("backupStorage must be a non-negative Kubernetes quantity")
            return Decimal(match[1]) > 0

        def _strong_token(seed, *, suffix=":provider-datalab", length=32):
            # Keep each service's existing seed and length to prevent credential changes.
            digest = hashlib.sha256((seed + suffix).encode("utf-8")).digest()
            return base64.urlsafe_b64encode(digest).decode("ascii").rstrip("=")[:length]

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import re

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            document_stores = spec.get("documentStores")
            if not isinstance(document_stores, dict) or not document_stores:
                return

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            mongo_env = environment.get("documentStore") or {}
            images = environment.get("images") or {}
            mongo_image = _safe_str(images.get("mongo"))
            version_tag = re.search(r":(\d+\.\d+\.\d+)(?:-[^@]+)?(?:@.*)?$", mongo_image)
            mongo_version = _safe_str(mongo_env.get("version")) or (version_tag[1] if version_tag else "8.0.12")
            mongo_image = mongo_image or f"quay.io/mongodb/mongodb-community-server:{mongo_version}-ubi8"
            backup_image = _safe_str(images.get("mongoBackup")) or f"mongo:{mongo_version}"
            mongo_storage_class = _string_value(mongo_env.get("storageClassName") or "")
            backup_storage_class = _string_value(mongo_env.get("backupStorageClassName") or "")

            runtime_namespace = xr_name

            # MongoDB operator expects these namespace-local prerequisites.
            prereqs = [
                (
                    f"mongodb-sa-appdb-{xr_name}",
                    _render_template(
                        req,
                        "mongodb/serviceaccount-mongodb-kubernetes-appdb",
                        runtime_namespace=runtime_namespace,
                    ),
                ),
                (
                    f"mongodb-sa-database-pods-{xr_name}",
                    _render_template(
                        req,
                        "mongodb/serviceaccount-mongodb-kubernetes-database-pods",
                        runtime_namespace=runtime_namespace,
                    ),
                ),
                (
                    f"mongodb-sa-ops-manager-{xr_name}",
                    _render_template(
                        req,
                        "mongodb/serviceaccount-mongodb-kubernetes-ops-manager",
                        runtime_namespace=runtime_namespace,
                    ),
                ),
                (
                    f"mongodb-role-appdb-{xr_name}",
                    _render_template(
                        req,
                        "mongodb/role-mongodb-kubernetes-appdb",
                        runtime_namespace=runtime_namespace,
                    ),
                ),
                (
                    f"mongodb-rb-appdb-{xr_name}",
                    _render_template(
                        req,
                        "mongodb/rolebinding-mongodb-kubernetes-appdb",
                        runtime_namespace=runtime_namespace,
                    ),
                ),
            ]
            for key, manifest in prereqs:
                body = _render_template(
                    req,
                    "common/object",
                    key=key,
                    xr_namespace=xr_namespace,
                    manifest=manifest,
                    readiness={"policy": "SuccessfulCreate"},
                )
                rsp.desired.resources[key].resource.update(body)

            for store_key in sorted(list(document_stores.keys())):
                if not isinstance(store_key, str) or not store_key.strip():
                    continue
                store_cfg = document_stores.get(store_key) or {}
                if not isinstance(store_cfg, dict):
                    continue

                mongo_storage = _string_value(store_cfg.get("storage") or "10Gi")
                if not mongo_storage:
                    continue
                pvc_spec = {
                    "accessModes": ["ReadWriteOnce"],
                    "resources": {"requests": {"storage": mongo_storage}},
                }
                if mongo_storage_class:
                    pvc_spec["storageClassName"] = mongo_storage_class

                store_name = store_key.strip()
                mongo_resource_name = f"mongodb-{store_name}"
                password_secret_name = f"{store_name}-mongodb-auth"
                app_username = f"{store_name}-app"
                mongo_password = _strong_token(f"{xr_name}:{store_name}:mongodb")
                password_secret = _render_template(
                    req,
                    "mongodb/auth-secret",
                    password_secret_name=password_secret_name,
                    runtime_namespace=runtime_namespace,
                    app_username=app_username,
                    mongo_password=mongo_password,
                )
                pwd_key = f"mongodb-auth-secret-{xr_name}-{store_name}"
                pwd_body = _render_template(
                    req,
                    "mongodb/auth-object",
                    pwd_key=pwd_key,
                    xr_namespace=xr_namespace,
                    password_secret=password_secret,
                )
                rsp.desired.resources[pwd_key].resource.update(pwd_body)

                mongo = _render_template(
                    req,
                    "mongodb/store",
                    mongo_version=mongo_version,
                    mongo_image=mongo_image,
                    mongo_resource_name=mongo_resource_name,
                    runtime_namespace=runtime_namespace,
                    app_username=app_username,
                    password_secret_name=password_secret_name,
                    store_name=store_name,
                    scram_secret_name=f"{store_name}-app-scram",
                    pvc_spec=pvc_spec,
                )
                backup_storage = _string_value(store_cfg.get("backupStorage") or "0")
                if _backup_enabled(backup_storage):
                    backup_name = f"{mongo_resource_name}-backup"
                    backup_secret_name = f"{store_name}-mongodb-backup-auth"
                    backup_username = f"{store_name}-backup"
                    backup_password = _strong_token(f"{xr_name}:{store_name}:mongodb:backup")
                    backup_secret = _render_template(
                        req,
                        "mongodb/backup-secret",
                        backup_secret_name=backup_secret_name,
                        runtime_namespace=runtime_namespace,
                        backup_password=backup_password,
                        backup_config=f"password: {backup_password}\n",
                    )
                    backup_vcs = {
                        "accessModes": ["ReadWriteOnce"],
                        "resources": {"requests": {"storage": backup_storage}},
                    }
                    if backup_storage_class:
                        backup_vcs["storageClassName"] = backup_storage_class
                    backup_pvc = _render_template(
                        req,
                        "mongodb/backup-pvc",
                        backup_name=backup_name,
                        runtime_namespace=runtime_namespace,
                        backup_vcs=backup_vcs,
                    )
                    backup_job = _render_template(
                        req,
                        "mongodb/backup-cronjob",
                        backup_name=backup_name,
                        runtime_namespace=runtime_namespace,
                        backup_secret_name=backup_secret_name,
                        backup_username=backup_username,
                        backup_host=f"{mongo_resource_name}/{mongo_resource_name}-0.{mongo_resource_name}-svc:27017",
                        mongo_image=backup_image,
                    )
                    mongo["spec"]["users"].append(
                        {
                            "name": backup_username,
                            "db": "admin",
                            "passwordSecretRef": {"name": backup_secret_name, "key": "password"},
                            "roles": [{"name": "backup", "db": "admin"}],
                            "scramCredentialsSecretName": f"{store_name}-backup-scram",
                        }
                    )
                    for resource_type, manifest in (
                        ("auth-secret", backup_secret),
                        ("pvc", backup_pvc),
                        ("cronjob", backup_job),
                    ):
                        backup_key = f"mongodb-backup-{resource_type}-{xr_name}-{store_name}"
                        backup_body = _render_template(
                            req,
                            "common/object",
                            key=backup_key,
                            xr_namespace=xr_namespace,
                            manifest=manifest,
                            readiness={"policy": "SuccessfulCreate"},
                        )
                        if resource_type == "pvc":
                            # Keep completed backups when the schedule is disabled.
                            backup_body["spec"]["managementPolicies"] = [
                                "Observe", "Create", "Update", "LateInitialize"
                            ]
                        rsp.desired.resources[backup_key].resource.update(backup_body)

                key = f"mongodb-community-{xr_name}-{store_name}"
                body = _render_template(
                    req,
                    "mongodb/store-object",
                    key=key,
                    xr_namespace=xr_namespace,
                    mongo=mongo,
                )
                rsp.desired.resources[key].resource.update(body)
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        mongodb/auth-object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${pwd_key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${pwd_key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${password_secret}
            readiness:
              policy: SuccessfulCreate
            watch: true
        mongodb/auth-secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${password_secret_name}
            namespace: ${runtime_namespace}
          type: Opaque
          stringData:
            user: ${app_username}
            password: ${mongo_password}
        mongodb/backup-cronjob:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: ${backup_name}
            namespace: ${runtime_namespace}
          spec:
            schedule: 0 1 * * *
            timeZone: Etc/UTC
            concurrencyPolicy: Forbid
            startingDeadlineSeconds: 3600
            successfulJobsHistoryLimit: 1
            failedJobsHistoryLimit: 1
            jobTemplate:
              spec:
                backoffLimit: 2
                activeDeadlineSeconds: 3600
                template:
                  spec:
                    restartPolicy: Never
                    automountServiceAccountToken: false
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 999
                      runAsGroup: 999
                      fsGroup: 999
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                    - name: backup
                      image: ${mongo_image}
                      command:
                      - /bin/sh
                      - -ec
                      args:
                      - |
                        umask 077
                        archive="/backup/dump-$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
                        partial="/backup/dump.partial"
                        trap 'rm -f "$partial"' EXIT
                        mongodump --host="$BACKUP_HOST" --username="$BACKUP_USER" \
                          --authenticationDatabase=admin --config=/auth/config.yaml \
                          --oplog --gzip --archive="$partial"
                        mv "$partial" "$archive"
                        find /backup -maxdepth 1 -type f -name 'dump-*.archive.gz' -printf '%f\n' \
                          | sort -r | tail -n +5 | while IFS= read -r old; do rm "/backup/$old"; done
                      env:
                      - name: BACKUP_HOST
                        value: ${backup_host}
                      - name: BACKUP_USER
                        value: ${backup_username}
                      resources:
                        requests:
                          cpu: 100m
                          memory: 128Mi
                        limits:
                          memory: 512Mi
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop:
                          - ALL
                      volumeMounts:
                      - name: backup
                        mountPath: /backup
                      - name: auth
                        mountPath: /auth
                        readOnly: true
                    volumes:
                    - name: backup
                      persistentVolumeClaim:
                        claimName: ${backup_name}
                    - name: auth
                      secret:
                        secretName: ${backup_secret_name}
                        defaultMode: 288
                        items:
                        - key: config.yaml
                          path: config.yaml
        mongodb/backup-pvc:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ${backup_name}
            namespace: ${runtime_namespace}
          spec: ${backup_vcs}
        mongodb/backup-secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${backup_secret_name}
            namespace: ${runtime_namespace}
          type: Opaque
          stringData:
            password: ${backup_password}
            config.yaml: ${backup_config}
        mongodb/role-mongodb-kubernetes-appdb:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: mongodb-kubernetes-appdb
            namespace: ${runtime_namespace}
          rules:
          - apiGroups:
            - ''
            resources:
            - secrets
            verbs:
            - get
          - apiGroups:
            - ''
            resources:
            - pods
            verbs:
            - patch
            - delete
            - get
        mongodb/rolebinding-mongodb-kubernetes-appdb:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: mongodb-kubernetes-appdb
            namespace: ${runtime_namespace}
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: mongodb-kubernetes-appdb
          subjects:
          - kind: ServiceAccount
            name: mongodb-kubernetes-appdb
            namespace: ${runtime_namespace}
        mongodb/serviceaccount-mongodb-kubernetes-appdb:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: mongodb-kubernetes-appdb
            namespace: ${runtime_namespace}
        mongodb/serviceaccount-mongodb-kubernetes-database-pods:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: mongodb-kubernetes-database-pods
            namespace: ${runtime_namespace}
        mongodb/serviceaccount-mongodb-kubernetes-ops-manager:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: mongodb-kubernetes-ops-manager
            namespace: ${runtime_namespace}
        mongodb/store:
          apiVersion: mongodbcommunity.mongodb.com/v1
          kind: MongoDBCommunity
          metadata:
            name: ${mongo_resource_name}
            namespace: ${runtime_namespace}
          spec:
            members: 1
            type: ReplicaSet
            version: ${mongo_version}
            security:
              authentication:
                modes:
                - SCRAM
                ignoreUnknownUsers: true
            users:
            - name: ${app_username}
              db: admin
              passwordSecretRef:
                name: ${password_secret_name}
                key: password
              roles:
              - name: readWrite
                db: ${store_name}
              - name: dbAdmin
                db: ${store_name}
              scramCredentialsSecretName: ${scram_secret_name}
            statefulSet:
              spec:
                template:
                  spec:
                    containers:
                    - name: mongod
                      image: ${mongo_image}
                volumeClaimTemplates:
                - metadata:
                    name: data-volume
                  spec: ${pvc_spec}
        mongodb/store-object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${mongo}
            readiness:
              policy: DeriveFromCelQuery
              celQuery: has(object.status) && object.status.phase == 'Running' && has(object.status.currentMongoDBMembers)
                && object.status.currentMongoDBMembers >= 1 && has(object.status.currentStatefulSetReplicas) &&
                object.status.currentStatefulSetReplicas >= 1
            watch: true
