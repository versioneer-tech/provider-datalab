        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def _string_list(v):
            if not isinstance(v, list):
                return []
            return [_string_value(item) for item in v if _string_value(item)]


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            sessions = [
                _session_name(session, stringify_none=True)
                for session in (spec.get("sessions") or [])
                if _session_name(session, stringify_none=True)
            ]
            started_sessions = [
                _session_name(session, stringify_none=True)
                for session in (spec.get("sessions") or [])
                if _session_name(session, stringify_none=True)
                and _session_state(session) == "started"
            ]
            db_service_names = []
            db_hosts = spec.get("databases") or {}
            if isinstance(db_hosts, dict):
                for host_key in sorted(list(db_hosts.keys())):
                    if not isinstance(host_key, str) or not host_key.strip():
                        continue
                    host_cfg = db_hosts.get(host_key) or {}
                    if not isinstance(host_cfg, dict):
                        continue
                    dbnames = [
                        _string_value(x)
                        for x in list(host_cfg.get("names") or [])
                        if _string_value(x)
                    ]
                    db_storage = _string_value(host_cfg.get("storage") or "")
                    if dbnames and db_storage:
                        db_service_names.append(f"{host_key.strip()}-primary")

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            defaults = environment.get("defaults") or {}
            vcluster = _boolish((defaults.get("vcluster") or {}).get("enabled", True))
            files = defaults.get("files") or []
            quota = defaults.get("quota") or {}
            overall_quota = defaults.get("overallQuota") or {}

            memory = quota.get("memory") or "2Gi"
            storage = quota.get("storage") or "1Gi"
            budget = quota.get("budget") or "medium"
            overall_storage = _string_value(overall_quota.get("storage") or "100Gi")

            env_security = defaults.get("security") or {}

            policy = env_security.get("policy") or "baseline"

            ka = env_security.get("kubernetesAccess")
            if ka is None:
                ka = True
            kubernetes_access = _boolish(ka)

            role = env_security.get("kubernetesRole") or "edit"

            data_cfg = defaults.get("data") or {}
            data_enabled = data_cfg.get("enabled")
            if data_enabled is None:
                data_enabled = True
            data_enabled = _boolish(data_enabled)

            registry_cfg = defaults.get("registry") or {}
            registry_enabled = registry_cfg.get("enabled")
            if registry_enabled is None:
                registry_enabled = True
            registry_enabled = _boolish(registry_enabled)

            persistence_cfg = defaults.get("persistence") or {}
            requested_storage_class = _string_value(
                persistence_cfg.get("storageClassName") or ""
            )

            ingress_env = environment.get("ingress") or {}
            storage_classes_env = environment.get("storageClasses") or {}
            allowed_storage_classes = [
                _string_value(sc)
                for sc in (storage_classes_env.get("allowed") or [])
                if _string_value(sc)
            ]
            packages = environment.get("packages") or []

            ingress_class = ingress_env.get("class", "")
            ingress_domain = ingress_env.get("domain", "default")
            ingress_secret = ingress_env.get("secret", "wildcard-tls")
            permanent_access = _boolish(ingress_env.get("enabled")) or _boolish(
                (environment.get("httpRoute") or {}).get("enabled")
            )

            storage_secret_name = f"{xr_name}-datalab"
            persistent_storage_class = ""
            if allowed_storage_classes:
                persistent_storage_class = (
                    requested_storage_class
                    if requested_storage_class in allowed_storage_classes
                    else allowed_storage_classes[0]
                )
            else:
                persistent_storage_class = requested_storage_class

            external_egress = env_security.get("externalEgress")
            if external_egress is None:
                external_egress = True
            external_egress = _boolish(external_egress)

            network_env = environment.get("network") or {}
            excluded_network_policies = set(
                _string_list(network_env.get("excludePolicies") or [])
            )
            blacklist_ips = _string_list(network_env.get("blacklistIPs") or [])
            external_egress_cidrs = _string_list(network_env.get("externalEgressCIDRs") or [])
            internal_egress = network_env.get("internalEgress", [])
            internal_ingress = network_env.get("internalIngress", [])
            internal_cidrs = _string_list(network_env.get("podCIDRs") or [])
            service_cidr = _string_value(network_env.get("serviceCIDR") or "")
            if service_cidr:
                internal_cidrs.append(service_cidr)

            def _dedupe(items):
                result = []
                for item in items:
                    if item not in result:
                        result.append(item)
                return result

            external_egress_exceptions = _dedupe(blacklist_ips + internal_cidrs)

            def _policy_enabled(name):
                return name not in excluded_network_policies

            def _network_policy(name, rules, direction="egress", pod_selector=None):
                return _render_template(
                    req,
                    "educates/network-policy",
                    name=name,
                    spec={
                        "podSelector": pod_selector or {},
                        "policyTypes": [direction.capitalize()],
                        direction: rules,
                    },
                )

            def _cidr_contains(cidr, child):
                try:
                    parent = _ipaddress.ip_network(cidr, strict=False)
                    candidate = _ipaddress.ip_network(child, strict=False)
                except Exception:
                    return False
                return parent.version == candidate.version and candidate.subnet_of(parent)

            def _exceptions_for(cidr):
                return [ip for ip in external_egress_exceptions if _cidr_contains(cidr, ip)]

            def _ip_block(cidr, exceptions):
                block = {"cidr": cidr}
                if exceptions:
                    block["except"] = exceptions
                return {"ipBlock": block}

            def _internal_ports(items):
                return [
                    {
                        key: item[key]
                        for key in ("port", "protocol", "endPort")
                        if item.get(key) is not None
                    }
                    for item in items
                ]

            def _internal_rules(items, peer_key):
                field = "internalIngress" if peer_key == "from" else "internalEgress"
                if not isinstance(items, list):
                    raise ValueError(f"network.{field} must be a list")
                rules = []
                for item in items:
                    if (
                        not isinstance(item, dict)
                        or not isinstance(item.get("namespace"), str)
                        or not item["namespace"].strip()
                    ):
                        raise ValueError(f"network.{field} entries require a namespace")
                    selector = item.get("podSelector", {})
                    ports = item.get("ports", [])
                    if not isinstance(selector, dict):
                        raise ValueError(f"network.{field} selectors must be objects")
                    if not isinstance(ports, list) or any(
                        not isinstance(port, dict) or port.get("port") is None for port in ports
                    ):
                        raise ValueError(
                            f"network.{field} ports must be a list of port objects"
                        )
                    peer = {
                        "namespaceSelector": {
                            "matchLabels": {
                                "kubernetes.io/metadata.name": item["namespace"].strip(),
                            }
                        }
                    }
                    if selector:
                        peer["podSelector"] = selector
                    rule = {peer_key: [peer]}
                    if ports:
                        rule["ports"] = _internal_ports(ports)
                    rules.append(rule)
                return rules

            def _add_policy(policies, name, rules):
                if _policy_enabled(name):
                    policies.append(_network_policy(name, rules))

            ingress_policies = {}
            for item, rule in zip(internal_ingress, _internal_rules(internal_ingress, "from")):
                target = item.get("targetPodSelector", {})
                if not isinstance(target, dict):
                    raise ValueError("network.internalIngress selectors must be objects")
                name = "allow-internal-ingress"
                if target:
                    selector = _json.dumps(target, sort_keys=True, separators=(",", ":"))
                    name += "-" + _hashlib.sha256(selector.encode()).hexdigest()[:10]
                ingress_policy = ingress_policies.setdefault(
                    name, _network_policy(name, [], "ingress", target)
                )
                if rule not in ingress_policy["spec"]["ingress"]:
                    ingress_policy["spec"]["ingress"].append(rule)

            network_policies = []
            _add_policy(network_policies, "deny-egress", [])
            _add_policy(
                network_policies, "allow-namespace-egress", [{"to": [{"podSelector": {}}]}]
            )

            if vcluster:
                _add_policy(
                    network_policies,
                    "allow-vcluster-egress",
                    [
                        {
                            "to": [
                                {
                                    "namespaceSelector": {
                                        "matchLabels": {
                                            "training.educates.dev/environment.name": xr_name,
                                            "training.educates.dev/session.objects": "true",
                                        }
                                    },
                                    "podSelector": {
                                        "matchLabels": {
                                            "app": "vcluster",
                                            "release": "my-vcluster",
                                        }
                                    },
                                }
                            ],
                            "ports": [
                                {"protocol": "TCP", "port": 443},
                                {"protocol": "TCP", "port": 8443},
                            ],
                        }
                    ],
                )

            if external_egress or vcluster or data_enabled or registry_enabled:
                _add_policy(
                    network_policies,
                    "allow-dns-egress",
                    [
                        {
                            "to": [
                                {
                                    "namespaceSelector": {
                                        "matchLabels": {
                                            "kubernetes.io/metadata.name": "kube-system"
                                        }
                                    }
                                }
                            ],
                            "ports": [
                                {"protocol": "UDP", "port": 53},
                                {"protocol": "TCP", "port": 53},
                            ],
                        }
                    ],
                )

            if external_egress:
                if external_egress_cidrs:
                    _add_policy(
                        network_policies,
                        "allow-external-egress",
                        [
                            {"to": [_ip_block(cidr, _exceptions_for(cidr))]}
                            for cidr in external_egress_cidrs
                        ],
                    )

            internal_egress_rules = _internal_rules(internal_egress, "to")
            if internal_egress_rules:
                _add_policy(network_policies, "allow-internal-egress", internal_egress_rules)

            vcluster_cfg = {
                "enabled": vcluster,
                "version": "1.34",
                "services": {
                    "fromHost": [
                        {
                            "from": f"$(workshop_namespace)/{host_svc_name}",
                            "to": f"$(workshop_namespace)/{host_svc_name}",
                        }
                        for host_svc_name in db_service_names
                    ]
                },
            }

            workshop = _render_template(
                req,
                "educates/workshop",
                xr_name=xr_name,
                vcluster_cfg=vcluster_cfg,
                workshop_enabled=bool(files),
                memory=memory,
                storage=storage,
                budget=budget,
                role=role,
                policy=policy,
                kubernetes_access=kubernetes_access,
                storage_secret_name=storage_secret_name,
                files=files,
                packages=packages,
                xr_namespace=xr_namespace,
                network_policies=network_policies,
            )

            if sessions:
                workshop["spec"]["session"]["resources"].pop("storage", None)
                workshop["spec"]["session"]["resources"]["volume"] = {
                    "name": "$(session_name)-persistent"
                }

            if data_enabled:
                if permanent_access:
                    workshop["spec"]["session"]["dashboards"].append(
                        {"name": "Data", "url": f"https://{xr_name}.{ingress_domain}/"}
                    )
                else:
                    workshop["spec"]["session"]["dashboards"].append(
                        {
                            "name": "Data",
                            "url": "$(ingress_protocol)://data-$(session_name).$(ingress_domain)/",
                        }
                    )
                    workshop["spec"]["session"]["ingresses"].append(
                        {
                            "name": "data",
                            "authentication": {"type": "session"},
                            "protocol": "http",
                            "host": "package-r.$(workshop_namespace).svc.$(cluster_domain)",
                            "port": 8888,
                            "headers": [{"name": "X-Package-R-User", "value": "datalab"}],
                        }
                    )

            if policy == "privileged":
                workshop["spec"]["session"]["applications"]["docker"] = {
                    "enabled": True,
                    "storage": "20Gi",
                }

            if vcluster and service_cidr:
                workshop["spec"]["session"]["objects"].append(
                    _render_template(
                        req,
                        "educates/vcluster-cidr",
                        service_cidr=service_cidr,
                    )
                )

            environment = _render_template(
                req,
                "educates/workshop-environment",
                xr_name=xr_name,
                ingress_class=ingress_class,
                ingress_domain=ingress_domain,
                ingress_secret=ingress_secret,
            )

            def emit(kind, manifest, key_suffix="", readiness=None):
                suffix = f"-{xr_name}{('-' + key_suffix) if key_suffix else ''}"
                key = f"{kind.lower()}{suffix}"
                body = _render_template(
                    req,
                    "common/object",
                    key=key,
                    xr_namespace=xr_namespace,
                    manifest=manifest,
                    readiness=readiness or {"policy": "SuccessfulCreate"},
                )
                rsp.desired.resources[key].resource.update(body)

            emit("Workshop", workshop)
            emit(
                "WorkshopEnvironment",
                environment,
                readiness={
                    "policy": "DeriveFromCelQuery",
                    "celQuery": "has(object.status) && has(object.status.educates) && object.status.educates.phase == 'Running'",
                },
            )

            observed_resources = getattr(req.observed, "resources", {}) or {}
            environment_manifest = _extract_manifest(
                observed_resources.get(f"workshopenvironment-{xr_name}")
            )
            workshop_namespace = _string_value(
                ((environment_manifest.get("status") or {}).get("educates") or {}).get(
                    "namespace"
                )
                or xr_name
            )

            runtime_namespace = (
                (environment_manifest.get("status") or {}).get("educates") or {}
            ).get("namespace")
            if runtime_namespace and _policy_enabled("allow-internal-ingress"):
                for name, manifest in sorted(ingress_policies.items()):
                    if _policy_enabled(name):
                        manifest["metadata"]["namespace"] = runtime_namespace
                        emit("NetworkPolicy", manifest, key_suffix=name)

            if workshop_namespace:
                emit(
                    "ResourceQuota",
                    _render_template(
                        req,
                        "educates/storage-quota",
                        workshop_ns=workshop_namespace,
                        overall_storage=overall_storage,
                    ),
                    key_suffix="overall-storage",
                )

                for sid in sessions:
                    persistent_pvc_name = f"{xr_name}-{sid}-persistent"
                    persistent_pvc_spec = {
                        "accessModes": ["ReadWriteOnce"],
                        "resources": {"requests": {"storage": storage}},
                    }
                    if persistent_storage_class:
                        persistent_pvc_spec["storageClassName"] = persistent_storage_class
                    emit(
                        "PersistentVolumeClaim",
                        _render_template(
                            req,
                            "educates/workspace-pvc",
                            persistent_pvc_name=persistent_pvc_name,
                            workshop_ns=workshop_namespace,
                            persistent_pvc_spec=persistent_pvc_spec,
                        ),
                        key_suffix=f"{sid}-persistent",
                    )

            for sid in started_sessions:
                session_manifest = _render_template(
                    req,
                    "educates/session",
                    metadata_name=f"{xr_name}-{sid}",
                    xr_name=xr_name,
                    session_id=str(sid),
                    ingress_domain=ingress_domain,
                    ingress_secret=ingress_secret,
                    session_environment=[
                        {"name": "SESSION_NAME", "value": f"{xr_name}-{sid}"},
                        {"name": "FRAME_ANCESTORS", "value": ""},
                    ]
                    + (
                        [{"name": "KUBECONFIG", "value": "/opt/kubeconfig/config"}]
                        if vcluster
                        else []
                    ),
                )
                emit(
                    "WorkshopSession",
                    session_manifest,
                    key_suffix=str(sid),
                    readiness={
                        "policy": "DeriveFromCelQuery",
                        "celQuery": "has(object.status) && has(object.status.educates) && object.status.educates.phase == 'Running'",
                    },
                )
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        educates/network-policy:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: ${name}
          spec: ${spec}
        educates/session:
          apiVersion: training.educates.dev/v1beta1
          kind: WorkshopSession
          metadata:
            name: ${metadata_name}
          spec:
            environment:
              name: ${xr_name}
            session:
              id: ${session_id}
              ingress:
                domain: ${ingress_domain}
                secret: ${ingress_secret}
              env: ${session_environment}
        educates/storage-quota:
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: overall-storage
            namespace: ${workshop_ns}
          spec:
            hard:
              requests.storage: ${overall_storage}
        educates/vcluster-cidr:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: vc-cidr-my-vcluster
            namespace: $(session_namespace)-vc
          data:
            cidr: ${service_cidr}
        educates/workshop:
          apiVersion: training.educates.dev/v1beta1
          kind: Workshop
          metadata:
            name: ${xr_name}
          spec:
            title: Default DataLab
            description: A default DataLab environment.
            version: '1.0'
            session:
              applications:
                console:
                  enabled: false
                editor:
                  enabled: true
                slides:
                  enabled: false
                terminal:
                  enabled: true
                vcluster: ${vcluster_cfg}
                workshop:
                  enabled: ${workshop_enabled}
              dashboards: []
              ingresses: []
              resources:
                memory: ${memory}
                storage: ${storage}
              namespaces:
                budget: ${budget}
                role: ${role}
                security:
                  policy: ${policy}
                  token:
                    enabled: ${kubernetes_access}
              envFrom:
              - secretRef:
                  name: ${storage_secret_name}
              objects: []
            workshop:
              files: ${files}
              packages: ${packages}
            environment:
              secrets:
              - name: ${storage_secret_name}
                namespace: ${xr_namespace}
              objects: ${network_policies}
        educates/workshop-environment:
          apiVersion: training.educates.dev/v1beta1
          kind: WorkshopEnvironment
          metadata:
            name: ${xr_name}
          spec:
            analytics:
              amplitude:
                trackingId: ''
            cookies: {}
            environment:
              objects: []
              secrets: []
            request:
              enabled: false
            session:
              ingress:
                class: ${ingress_class}
                domain: ${ingress_domain}
                secret: ${ingress_secret}
            theme:
              name: default-website-theme
            workshop:
              name: ${xr_name}
        educates/workspace-pvc:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ${persistent_pvc_name}
            namespace: ${workshop_ns}
          spec: ${persistent_pvc_spec}
  - step: update-vclusters
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import hashlib

        import json

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_manifest(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return manifest or raw_manifest

        def _resource_name(*parts, limit=63):
            name = "-".join(parts)
            if len(name) <= limit and (
                len(parts) == 1 or all("-" not in part for part in parts)
            ):
                return name
            # Keep component boundaries distinct when instance and profile names have hyphens.
            digest = hashlib.sha256(json.dumps(parts).encode()).hexdigest()[:10]
            return name[: limit - 11].rstrip("-") + "-" + digest

        def _vcluster_role(instance, group):
            return f"vcluster_{instance}_{group}"

        def _vcluster_groups(config):
            groups = {group["name"]: group for group in config.get("groups") or []}
            groups["cluster-admin"] = {
                "name": "cluster-admin", "namespace": "*", "role": "cluster-admin"
            }
            return [groups[name] for name in sorted(groups)]

        def _runtime_namespace(req, name):
            environment = _extract_manifest(
                req.observed.resources.get(f"workshopenvironment-{name}")
            )
            return ((environment.get("status") or {}).get("educates") or {}).get(
                "namespace"
            ) or ""

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import base64
        from collections import Counter
        import hashlib
        import json
        import re
        from crossplane.function import request, response


        def _secret_mappings(connections, bindings):
            candidates = []
            for binding in bindings:
                kind, name = binding["type"], binding["name"]
                matches = [
                    item for item in connections
                    if item["type"] == kind and item["name"] == name
                ]
                if len(matches) != 1 or matches[0].get("ready") is not True:
                    continue
                source = matches[0]["secretRef"]
                if not (
                    re.fullmatch(r"[a-z0-9]([-a-z0-9]*[a-z0-9])?", source["namespace"])
                    and re.fullmatch(r"[a-z0-9]([-a-z0-9.]*[a-z0-9])?", source["name"])
                ):
                    continue
                target = binding["target"]
                source_name = f"{source['namespace']}/{source['name']}"
                target_name = f"{target['namespace']}/{target['name']}"
                candidates.append((source_name, target_name))
            sources = Counter(source for source, _ in candidates)
            targets = Counter(target for _, target in candidates)
            return {
                source: target
                for source, target in candidates
                if sources[source] == 1 and targets[target] == 1
            }


        def compose(req, rsp):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            instances = (xr.get("spec") or {}).get("vclusters") or {}
            if not instances:
                return
            meta = xr["metadata"]
            name = meta["name"]
            namespace = _runtime_namespace(req, name)
            if not namespace:
                return
            for instance, instance_config in sorted(instances.items()):
                _compose_instance(
                    req,
                    rsp,
                    name,
                    meta.get("namespace") or "default",
                    namespace,
                    instance,
                    instance_config,
                )


        def _compose_instance(
            req, rsp, name, claim_namespace, namespace, instance, instance_config
        ):
            runtime = _resource_name("vcluster", instance, limit=45)
            service_account = f"vc-{runtime}"
            ca_name = f"{runtime}-ca"
            template_values = {
                "runtime": runtime,
                "service_account": service_account,
                "workload_account": f"vc-workload-{runtime}",
                "config_secret": f"vc-config-{runtime}",
                "authentication_name": f"{runtime}-authentication",
                "headless_service": f"{runtime}-headless",
                "data_pvc": f"data-{runtime}-0",
                "ca_name": ca_name,
                "control_policy": f"vc-cp-{runtime}",
                "workload_policy": f"vc-work-{runtime}",
                "dns_policy": f"vc-dns-{runtime}",
                "snapshot_policy": f"vc-snapshot-{runtime}",
                "prefix": f"/.{instance}",
            }
            env = _to_dict(req.context).get("apiextensions.crossplane.io/environment", {}) or {}
            config = env.get("vcluster") or {}
            secret_mappings = _secret_mappings(
                (_to_dict(rsp.desired.composite.resource).get("status") or {}).get("connections") or [],
                instance_config.get("secretBindings") or [],
            )
            iam = env.get("iam") or {}
            route = env.get("httpRoute") or {}
            domain = (env.get("ingress") or {}).get("domain")
            required = {
                "iam.issuerURL": iam.get("issuerURL"),
                "ingress.domain": domain,
                **{
                    f"httpRoute.{key}": route.get(key)
                    for key in ("parentName", "parentNamespace", "sectionName")
                },
            }
            missing = [key for key, value in required.items() if not str(value or "").strip()]
            if missing:
                response.fatal(
                    rsp, "vCluster requires EnvironmentConfig data: " + ", ".join(missing)
                )
                return
            if route.get("enabled") is False:
                response.fatal(
                    rsp,
                    "vCluster requires EnvironmentConfig data.httpRoute.enabled to be true.",
                )
                return
            issuer = str(iam["issuerURL"]).rstrip("/")
            discovery = str(config.get("discoveryURL") or "").strip()
            if not issuer.startswith("https://") or (
                discovery and (not discovery.startswith("https://"))
            ):
                response.fatal(rsp, "vCluster issuerURL and discoveryURL must use HTTPS.")
                return
            hostname = f"{name}.{domain}"
            backend_hostname = f"{runtime}.{namespace}.svc"
            audience = json.dumps(name)
            groups = _vcluster_groups(instance_config)
            roles = [_vcluster_role(instance, group["name"]) for group in groups]
            role_list = json.dumps(roles)
            jwt_issuer = {"url": issuer, "audiences": [name], "audienceMatchPolicy": "MatchAny"}
            if discovery:
                jwt_issuer["discoveryURL"] = discovery
            if config.get("issuerCA"):
                jwt_issuer["certificateAuthority"] = config["issuerCA"]
            authentication = json.dumps(
                _render_template(
                    req,
                    "vcluster/authenticationconfiguration",
                    jwt_issuer=jwt_issuer,
                    jwt_0_claimValidationRules_0_expression=f"has(claims.resource_access) && {audience} in claims.resource_access && has(claims.resource_access[{audience}].roles) && claims.resource_access[{audience}].roles.exists(r, r in {role_list})",
                    jwt_0_claimMappings_username_prefix=f"datalab:{name}:",
                    jwt_0_claimMappings_groups_expression=f"claims.resource_access[{audience}].roles.filter(r, r in {role_list}).map(r, 'datalab:{name}:' + r)",
                    **template_values,
                ),
                sort_keys=True,
            )

            def emit(suffix, manifest, readiness=None):
                key = _resource_name("vcluster", name, instance, suffix)
                rsp.desired.resources[key].resource.update(
                    _render_template(
                        req,
                        "common/object",
                        key=key,
                        xr_namespace=claim_namespace,
                        manifest=manifest,
                        readiness=readiness or {"policy": "SuccessfulCreate"},
                        **template_values,
                    )
                )
                rsp.desired.resources[key].resource["metadata"]["labels"] = {"datalabs.pkg.internal/vcluster": instance}

            emit(
                "authentication",
                _render_template(
                    req,
                    "vcluster/authentication",
                    namespace=namespace,
                    authentication=authentication,
                    **template_values,
                ),
            )
            environment_manifest = (
                _to_dict(rsp.desired.resources[f"workshop-{name}"].resource)
                .get("spec", {})
                .get("forProvider", {})
                .get("manifest", {})
            )
            environment_objects = (
                (environment_manifest.get("spec") or {}).get("environment") or {}
            ).get("objects") or []
            workload_egress = [
                rule
                for policy in environment_objects
                if policy.get("kind") == "NetworkPolicy"
                and policy.get("metadata", {}).get("name")
                in ("allow-external-egress", "allow-internal-egress")
                for rule in policy.get("spec", {}).get("egress", [])
            ]
            storage_config = config.get("storageClasses") or {}
            storage_classes = (
                storage_config.get("allowed") if isinstance(storage_config, dict) else None
            )
            if (
                not isinstance(storage_classes, list)
                or not storage_classes
                or any(
                    (not isinstance(item, str) or not item.strip() for item in storage_classes)
                )
                or (len(set(storage_classes)) != len(storage_classes))
            ):
                response.fatal(
                    rsp,
                    "EnvironmentConfig data.vcluster.storageClasses.allowed must be a non-empty list of unique StorageClass names.",
                )
                return
            default_class = storage_config.get("default") or storage_classes[0]
            storage_class = config.get("storageClassName") or default_class
            if default_class not in storage_classes or storage_class not in storage_classes:
                response.fatal(
                    rsp,
                    "The vcluster default and control-plane StorageClass must be in data.vcluster.storageClasses.allowed.",
                )
                return
            emit(
                "data",
                _render_template(
                    req,
                    "vcluster/data",
                    namespace=namespace,
                    storage_class=storage_class,
                    spec_resources_requests_storage=str(
                        instance_config.get("storage") or config.get("storage") or "5Gi"
                    ),
                    **template_values,
                ),
            )
            policy_name = _resource_name(namespace, instance, "storage-classes")
            emit(
                "storage-policy",
                _render_template(
                    req,
                    "vcluster/storage-policy",
                    policy_name=policy_name,
                    spec_matchConditions_0_expression=f"request.userInfo.username == {json.dumps(f'system:serviceaccount:{namespace}:{service_account}')}",
                    spec_validations_0_expression=f"has(object.spec.storageClassName) && object.spec.storageClassName in {json.dumps(storage_classes)}",
                    **template_values,
                ),
            )
            emit(
                "storage-policy-binding",
                _render_template(
                    req,
                    "vcluster/storage-policy-binding",
                    policy_name=policy_name,
                    namespace=namespace,
                    **template_values,
                ),
            )
            resource_config = config.get("resources") or {}
            resources = {
                "requests": {"cpu": "200m", "memory": "1Gi", "ephemeral-storage": "1Gi"},
                "limits": {"cpu": "4", "memory": "4Gi", "ephemeral-storage": "10Gi"},
            }
            for section in resources:
                resources[section].update(resource_config.get(section) or {})
            configuration = _render_template(
                req,
                "vcluster/configuration",
                namespace=namespace,
                name=_resource_name(name, instance),
                internal_server=f"https://{runtime}.{namespace}:443",
                backend_hostname=backend_hostname,
                storage=str(instance_config.get("storage") or config.get("storage") or "5Gi"),
                storage_class=storage_class,
                resources=resources,
                **template_values,
            )
            embedded = ((config.get("backingStore") or {}).get("database") or {}).get(
                "embedded"
            ) or {}
            configuration["controlPlane"]["backingStore"]["database"]["embedded"].update(
                embedded
            )
            configuration["sync"]["fromHost"]["secrets"] = {
                "enabled": bool(secret_mappings),
                "mappings": {"byName": secret_mappings},
            }
            configuration_json = json.dumps(configuration, sort_keys=True)
            checksum = hashlib.sha256(
                (configuration_json + authentication).encode()
            ).hexdigest()
            emit(
                "config",
                _render_template(
                    req,
                    "vcluster/config-secret",
                    namespace=namespace,
                    configuration_data=base64.b64encode(configuration_json.encode()).decode(),
                    **template_values,
                ),
            )
            for suffix, manifest in (
                (
                    "serviceaccount",
                    _render_template(
                        req, "vcluster/serviceaccount", namespace=namespace, **template_values
                    ),
                ),
                (
                    "workload-serviceaccount",
                    _render_template(
                        req,
                        "vcluster/workload-serviceaccount",
                        namespace=namespace,
                        **template_values,
                    ),
                ),
                (
                    "role",
                    _render_template(
                        req, "vcluster/role", namespace=namespace, **template_values
                    ),
                ),
                (
                    "rolebinding",
                    _render_template(
                        req, "vcluster/rolebinding", namespace=namespace, **template_values
                    ),
                ),
                (
                    "service",
                    _render_template(
                        req, "vcluster/service", namespace=namespace, **template_values
                    ),
                ),
                (
                    "headless-service",
                    _render_template(
                        req, "vcluster/headless-service", namespace=namespace, **template_values
                    ),
                ),
                (
                    "limitrange",
                    _render_template(
                        req, "vcluster/limitrange", namespace=namespace, **template_values
                    ),
                ),
                (
                    "control-plane-networkpolicy",
                    _render_template(
                        req,
                        "vcluster/control-plane-networkpolicy",
                        namespace=namespace,
                        iam_namespace=iam.get("namespace") or "keycloak",
                        **template_values,
                    ),
                ),
                (
                    "dns-networkpolicy",
                    _render_template(
                        req,
                        "vcluster/dns-networkpolicy",
                        namespace=namespace,
                        **template_values,
                    ),
                ),
                (
                    "snapshot-networkpolicy",
                    _render_template(
                        req,
                        "vcluster/snapshot-networkpolicy",
                        namespace=namespace,
                        **template_values,
                    ),
                ),
            ):
                emit(suffix, manifest)
            source_namespaces = {key.split("/")[0] for key in secret_mappings} - {namespace}
            for source_namespace in sorted(source_namespaces):
                reader_name = _resource_name(name, instance, "secret-import")
                reader_values = {
                    **template_values,
                    "namespace": source_namespace,
                    "runtime_namespace": namespace,
                    "reader_name": reader_name,
                }
                for kind, manifest in (
                    ("role", _render_template(req, "vcluster/secret-import-role", **reader_values)),
                    ("rolebinding", _render_template(req, "vcluster/secret-import-rolebinding", **reader_values)),
                ):
                    emit(
                        f"secret-import-{source_namespace}-{kind}",
                        manifest,
                    )
            workload_policy = _render_template(
                req, "vcluster/workload-networkpolicy", namespace=namespace, **template_values
            )
            workload_policy["spec"]["egress"].extend(workload_egress)
            emit("workload-networkpolicy", workload_policy)
            emit(
                "statefulset",
                _render_template(
                    req,
                    "vcluster/statefulset",
                    namespace=namespace,
                    configuration_checksum=checksum,
                    resources=resources,
                    **template_values,
                ),
                {
                    "policy": "DeriveFromCelQuery",
                    "celQuery": "has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration == object.metadata.generation && has(object.status.readyReplicas) && object.status.readyReplicas == object.spec.replicas && has(object.status.currentRevision) && has(object.status.updateRevision) && object.status.currentRevision == object.status.updateRevision",
                },
            )
            virtual_provider = _resource_name(name, "vcluster", instance)
            emit(
                "virtual-providerconfig",
                _render_template(
                    req,
                    "vcluster/virtual-providerconfig",
                    virtual_provider=virtual_provider,
                    claim_namespace=claim_namespace,
                    namespace=namespace,
                    **template_values,
                ),
            )

            def virtual(suffix, manifest, preserve=False):
                key = _resource_name("vcluster", name, instance, "access", suffix)
                body = _render_template(
                    req,
                    "vcluster/body",
                    key=key,
                    claim_namespace=claim_namespace,
                    virtual_provider=virtual_provider,
                    manifest=manifest,
                    **template_values,
                )
                if preserve:
                    body["spec"]["managementPolicies"] = ["Observe", "Create", "Update"]
                body["metadata"].setdefault("labels", {})[
                    "datalabs.pkg.internal/vcluster"
                ] = instance
                rsp.desired.resources[key].resource.update(body)

            for storage_name in storage_classes:
                suffix = hashlib.sha256(storage_name.encode()).hexdigest()[:12]
                emit(
                    f"observe-storageclass-{suffix}",
                    _render_template(
                        req,
                        "vcluster/storageclass",
                        storage_name=storage_name,
                        **template_values,
                    ),
                )
                key = _resource_name(
                    "vcluster", name, instance, f"observe-storageclass-{suffix}"
                )
                rsp.desired.resources[key].resource["spec"]["managementPolicies"] = ["Observe"]
                observed = req.observed.resources.get(key)
                state = (
                    _to_dict(observed.resource).get("status", {}).get("atProvider", {})
                    if observed
                    else {}
                )
                host_class = state.get("manifest") or state.get("raw", {}).get("manifest") or {}
                if not host_class.get("provisioner"):
                    continue
                fields = {
                    key: host_class[key]
                    for key in (
                        "provisioner",
                        "parameters",
                        "reclaimPolicy",
                        "mountOptions",
                        "allowVolumeExpansion",
                        "volumeBindingMode",
                        "allowedTopologies",
                    )
                    if key in host_class
                }
                virtual(
                    f"storageclass-{suffix}",
                    {
                        **_render_template(
                            req,
                            "vcluster/storageclass-2",
                            storage_name=storage_name,
                            metadata_annotations_storageclass_kubernetes_io_is_default_class=str(
                                storage_name == default_class
                            ).lower(),
                            **template_values,
                        ),
                        **fields,
                    },
                )
            for target in sorted({group["namespace"] for group in groups} - {"*"}):
                virtual(
                    f"namespace-{target}",
                    _render_template(
                        req, "vcluster/namespace", target=target, **template_values
                    ),
                    preserve=True,
                )
            for group in groups:
                target = group["namespace"]
                role = group["role"]
                suffix = hashlib.sha256(
                    f"{group['name']}:{target}:{role}".encode()
                ).hexdigest()[:12]
                manifest = _render_template(
                    req,
                    "vcluster/manifest",
                    kind="ClusterRoleBinding" if target == "*" else "RoleBinding",
                    metadata_name=f"datalab-{group['name']}-{role}",
                    role=role,
                    subjects_0_name=f"datalab:{name}:"
                    + _vcluster_role(instance, group["name"]),
                    **template_values,
                )
                if target != "*":
                    manifest["metadata"]["namespace"] = target
                virtual(f"binding-{suffix}", manifest)
            response.require_resources(
                rsp,
                name=ca_name,
                api_version="v1",
                kind="Secret",
                match_name=service_account,
                namespace=namespace,
            )
            ca_secret = request.get_required_resource(req, ca_name) or {}
            ca_source = base64.b64decode(ca_secret.get("data", {}).get("config", "")).decode()
            ca_match = re.search("certificate-authority-data:\\s*([A-Za-z0-9+/=]+)", ca_source)
            ca = base64.b64decode(ca_match[1]).decode() if ca_match else ""
            emit(
                "backend-ca",
                _render_template(
                    req, "vcluster/backend-ca", namespace=namespace, ca=ca, **template_values
                ),
            )
            parent = {
                "name": route["parentName"],
                "namespace": route["parentNamespace"],
                "sectionName": route["sectionName"],
            }
            emit(
                "backend-tls",
                _render_template(
                    req,
                    "vcluster/backend-tls",
                    apiVersion=(config.get("backendTLS") or {}).get("apiVersion")
                    or "gateway.networking.k8s.io/v1",
                    namespace=namespace,
                    backend_hostname=backend_hostname,
                    **template_values,
                ),
                {
                    "policy": "DeriveFromCelQuery",
                    "celQuery": f"has(object.status) && has(object.status.ancestors) && object.status.ancestors.exists(p, p.ancestorRef.name == {json.dumps(parent['name'])} && has(p.ancestorRef.namespace) && p.ancestorRef.namespace == {json.dumps(parent['namespace'])} && has(p.conditions) && p.conditions.exists(c, c.type == 'Accepted' && c.status == 'True' && c.observedGeneration == object.metadata.generation))",
                },
            )
            emit(
                "route",
                _render_template(
                    req,
                    "vcluster/route",
                    namespace=namespace,
                    parent=parent,
                    hostname=hostname,
                    **template_values,
                ),
                {
                    "policy": "DeriveFromCelQuery",
                    "celQuery": f"has(object.status) && has(object.status.parents) && object.status.parents.exists(p, p.parentRef.name == {json.dumps(parent['name'])} && has(p.parentRef.namespace) && p.parentRef.namespace == {json.dumps(parent['namespace'])} && has(p.parentRef.sectionName) && p.parentRef.sectionName == {json.dumps(parent['sectionName'])} && has(p.conditions) && p.conditions.exists(c, c.type == 'Accepted' && c.status == 'True' && c.observedGeneration == object.metadata.generation) && p.conditions.exists(c, c.type == 'ResolvedRefs' && c.status == 'True' && c.observedGeneration == object.metadata.generation))",
                },
            )
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        vcluster/authentication:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${authentication_name}
            namespace: ${namespace}
          data:
            authentication.json: ${authentication}
        vcluster/authenticationconfiguration:
          apiVersion: apiserver.config.k8s.io/v1
          kind: AuthenticationConfiguration
          anonymous:
            enabled: false
          jwt:
          - issuer: ${jwt_issuer}
            claimValidationRules:
            - expression: ${jwt_0_claimValidationRules_0_expression}
              message: A configured Datalab vcluster role is required.
            claimMappings:
              username:
                claim: sub
                prefix: ${jwt_0_claimMappings_username_prefix}
              groups:
                expression: ${jwt_0_claimMappings_groups_expression}
        vcluster/backend-ca:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${ca_name}
            namespace: ${namespace}
          data:
            ca.crt: ${ca}
        vcluster/backend-tls:
          apiVersion: ${apiVersion}
          kind: BackendTLSPolicy
          metadata:
            name: ${runtime}
            namespace: ${namespace}
          spec:
            targetRefs:
            - group: ''
              kind: Service
              name: ${runtime}
            validation:
              hostname: ${backend_hostname}
              caCertificateRefs:
              - group: ''
                kind: ConfigMap
                name: ${ca_name}
        vcluster/body:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${claim_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: ${virtual_provider}
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            watch: true
            readiness:
              policy: SuccessfulCreate
        vcluster/config-secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${config_secret}
            namespace: ${namespace}
          type: Opaque
          data:
            config.yaml: ${configuration_data}
        vcluster/configuration:
          controlPlane:
            advanced:
              cloudControllerManager:
                enabled: true
              defaultImageRegistry: ''
              globalMetadata:
                annotations: {}
              headlessService:
                annotations: {}
                labels: {}
              konnectivity:
                agent:
                  enabled: true
                  extraArgs: []
                  extraEnv: []
                  image: ''
                  imagePullPolicy: ''
                  nodeSelector: {}
                  replicas: 1
                  tolerations: []
                server:
                  enabled: true
                  extraArgs: []
              kubeVip:
                enabled: false
              podDisruptionBudget:
                enabled: false
              registry:
                anonymousPull: true
                config: {}
                enabled: false
              serviceAccount:
                annotations: {}
                enabled: true
                imagePullSecrets: []
                labels: {}
                name: ''
              virtualScheduler:
                enabled: false
              workloadServiceAccount:
                annotations: {}
                enabled: true
                imagePullSecrets: []
                labels: {}
                name: ''
            backingStore:
              database:
                embedded:
                  enabled: false
                  extraArgs: []
                external:
                  caFile: ''
                  certFile: ''
                  connector: ''
                  dataSource: ''
                  enabled: false
                  extraArgs: []
                  identityProvider: ''
                  keyFile: ''
              etcd:
                deploy:
                  enabled: false
                  headlessService:
                    annotations: {}
                  service:
                    annotations: {}
                    enabled: true
                  statefulSet:
                    annotations: {}
                    enableServiceLinks: true
                    enabled: true
                    env: []
                    extraArgs: []
                    highAvailability:
                      replicas: 1
                    image:
                      registry: registry.k8s.io
                      repository: etcd
                      tag: 3.6.8-0
                    imagePullPolicy: ''
                    labels: {}
                    persistence:
                      addVolumeMounts: []
                      addVolumes: []
                      volumeClaim:
                        accessModes:
                        - ReadWriteOnce
                        enabled: true
                        retentionPolicy: Retain
                        size: 5Gi
                        storageClass: ''
                      volumeClaimTemplates: []
                    pods:
                      annotations: {}
                      labels: {}
                    resources:
                      requests:
                        cpu: 20m
                        memory: 150Mi
                    scheduling:
                      affinity: {}
                      nodeSelector: {}
                      podManagementPolicy: Parallel
                      priorityClassName: ''
                      tolerations: []
                      topologySpreadConstraints: []
                    security:
                      containerSecurityContext: {}
                      podSecurityContext: {}
                embedded:
                  enabled: false
                  extraArgs: []
                  migrateFromDeployedEtcd: false
                external:
                  enabled: false
                  endpoint: ''
                  tls:
                    caFile: ''
                    certFile: ''
                    keyFile: ''
            coredns:
              deployment:
                affinity: {}
                annotations: {}
                image: ''
                labels: {}
                nodeSelector: {}
                pods:
                  annotations: {}
                  labels: {}
                replicas: 1
                resources:
                  limits:
                    cpu: 1000m
                    memory: 170Mi
                  requests:
                    cpu: 20m
                    memory: 64Mi
                tolerations: []
                topologySpreadConstraints:
                - labelSelector:
                    matchLabels:
                      k8s-app: vcluster-kube-dns
                  maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
              embedded: false
              enabled: true
              overwriteConfig: ''
              overwriteManifests: ''
              priorityClassName: ''
              security:
                containerSecurityContext: {}
                podSecurityContext: {}
              service:
                annotations: {}
                labels: {}
                spec:
                  type: ClusterIP
            distro:
              k8s:
                apiServer:
                  command: []
                  enabled: true
                  extraArgs:
                  - --authentication-config=/etc/datalab/authentication.json
                controllerManager:
                  command: []
                  enabled: true
                  extraArgs: []
                enabled: true
                env: []
                image:
                  registry: ghcr.io
                  repository: loft-sh/kubernetes
                  tag: v1.36.0
                imagePullPolicy: ''
                resources:
                  limits:
                    cpu: 100m
                    memory: 256Mi
                  requests:
                    cpu: 40m
                    memory: 64Mi
                scheduler:
                  command: []
                  enabled: false
                  extraArgs: []
                securityContext: {}
                version: ''
            ingress:
              annotations:
                nginx.ingress.kubernetes.io/backend-protocol: HTTPS
                nginx.ingress.kubernetes.io/ssl-passthrough: 'true'
                nginx.ingress.kubernetes.io/ssl-redirect: 'true'
              enabled: false
              host: my-host.com
              labels: {}
              pathType: ImplementationSpecific
              spec:
                tls: []
            proxy:
              bindAddress: 0.0.0.0
              extraSANs:
              - ${backend_hostname}
              port: 8443
            service:
              annotations: {}
              enabled: true
              httpsNodePort: 0
              kubeletNodePort: 0
              labels: {}
              spec:
                type: ClusterIP
            serviceMonitor:
              annotations: {}
              enabled: false
              labels: {}
            standalone:
              dataDir: /var/lib/vcluster
              joinNode:
                containerd:
                  enabled: true
                enabled: true
            statefulSet:
              annotations: {}
              args: []
              command: []
              enableServiceLinks: true
              env: []
              highAvailability:
                leaseDuration: 60
                renewDeadline: 40
                replicas: 1
                retryPeriod: 15
              hostAliases: []
              image:
                registry: ghcr.io
                repository: loft-sh/vcluster-oss
                tag: ''
              imagePullPolicy: ''
              initContainers: []
              labels: {}
