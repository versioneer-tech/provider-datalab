  - step: update-datalab-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import base64

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _string_value(value):
            """Keep the literal string for null values in existing resource settings."""
            return str(value).strip()

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_manifest(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return manifest or raw_manifest

        def _extract_data(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return (
                manifest.get("data")
                or manifest.get("stringData")
                or raw_manifest.get("data")
                or raw_manifest.get("stringData")
                or {}
            )

        def _b64get_any(data, keys):
            if not data:
                return None
            for key in keys:
                value = data.get(key)
                if value is None:
                    continue
                try:
                    return base64.b64decode(value, validate=True).decode("utf-8")
                except Exception:
                    return str(value)
            return None

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import re
        from urllib.parse import urlsplit, urlunsplit

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def _store_key(prefix, store_name, suffix):
            clean = re.sub(r"[^A-Za-z0-9]", "_", str(store_name)).upper()
            return f"{prefix}_{clean}_{suffix}"


        def _pg_db_key(host_name, db_name, suffix):
            return _store_key("POSTGRES", f"{host_name}_{db_name}", suffix)


        def _uri_with_database(uri, db_name):
            if not uri:
                return ""
            parts = urlsplit(uri)
            return urlunsplit(
                (parts.scheme, parts.netloc, f"/{db_name}", parts.query, parts.fragment)
            )


        def _external_pg_url(internal_url, external_host):
            if not internal_url or not external_host:
                return ""
            external_url = re.sub(r"@[^/]+", f"@{external_host}", internal_url)
            if "sslmode=" not in external_url:
                external_url += (
                    "&sslmode=require" if "?" in external_url else "?sslmode=require"
                )
            if "sslnegotiation=" not in external_url:
                external_url += (
                    "&sslnegotiation=direct"
                    if "?" in external_url
                    else "?sslnegotiation=direct"
                )
            return external_url


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            storage_env = environment.get("storage") or {}
            observed = getattr(req.observed, "resources", {}) or {}

            environment_manifest = _extract_manifest(
                observed.get(f"workshopenvironment-{xr_name}")
            )
            educates_status = (environment_manifest.get("status") or {}).get("educates") or {}
            workshop_namespace = _string_value(educates_status.get("namespace") or xr_name)

            obs = observed.get(f"observe-storage-secret-{xr_name}")
            data_b64 = _extract_data(obs)

            access_key = _b64get_any(
                data_b64,
                [
                    "AWS_ACCESS_KEY_ID",
                    "accessKey",
                    "username",
                    "CONSOLE_ACCESS_KEY",
                    "attribute.access",
                ],
            )
            secret_key = _b64get_any(
                data_b64,
                [
                    "AWS_SECRET_ACCESS_KEY",
                    "secretKey",
                    "password",
                    "CONSOLE_SECRET_KEY",
                    "attribute.secret",
                ],
            )
            session_token = _b64get_any(data_b64, ["AWS_SESSION_TOKEN", "sessionToken"])
            endpoint = _b64get_any(data_b64, ["AWS_ENDPOINT_URL"]) or storage_env.get(
                "endpoint", ""
            )
            region = _b64get_any(data_b64, ["AWS_REGION"]) or storage_env.get("region", "")
            rtype = storage_env.get("type", "")
            provider = storage_env.get("provider", "")
            force_path_style = str(storage_env.get("forcePathStyle", "true")).lower()

            if not access_key or not secret_key:
                return

            # Build the rclone configuration for the runtime Secret.
            config_data = (
                f"[{access_key}]\n"
                f"type = {rtype}\n"
                f"provider = {provider}\n"
                f"endpoint = {endpoint}\n"
                f"region = {region}\n"
                f"access_key_id = {access_key}\n"
                f"secret_access_key = {secret_key}\n"
                f"force_path_style = {force_path_style}\n"
            )

            manifest = _render_template(
                req,
                "datalab-secret/manifest",
                metadata_name=f"{xr_name}-datalab",
                xr_namespace=xr_namespace,
                access_key=access_key,
                config_data=config_data,
                secret_key=secret_key,
                region=region,
                endpoint=endpoint,
                force_path_style=force_path_style,
            )

            if session_token:
                manifest["stringData"]["AWS_SESSION_TOKEN"] = session_token

            aws_credentials = (
                "[default]\n"
                f"aws_access_key_id = {access_key}\n"
                f"aws_secret_access_key = {secret_key}\n"
            )
            if session_token:
                aws_credentials += f"aws_session_token = {session_token}\n"
            manifest["stringData"]["aws-credentials"] = aws_credentials

            oauth_data = _extract_data(observed.get(f"observe-oauth-client-secret-{xr_name}"))
            client_secret = _b64get_any(
                oauth_data, ["clientSecret", "client_secret", "attribute.client_secret"]
            )
            if client_secret:
                manifest["stringData"]["OAUTH2_CLIENT_ID"] = (
                    _b64get_any(oauth_data, ["clientID", "client_id", "attribute.client_id"])
                    or xr_name
                )
                manifest["stringData"]["OAUTH2_CLIENT_SECRET"] = client_secret

            doc_stores = spec.get("documentStores") or {}
            if isinstance(doc_stores, dict):
                for store_name in sorted(doc_stores.keys()):
                    if not isinstance(store_name, str) or not store_name.strip():
                        continue
                    store = store_name.strip()
                    host = f"mongodb-{store}-svc.{workshop_namespace}.svc"
                    user = f"{store}-app"
                    manifest["stringData"][_store_key("MONGO", store, "HOST")] = host
                    manifest["stringData"][_store_key("MONGO", store, "PORT")] = "27017"
                    manifest["stringData"][_store_key("MONGO", store, "DATABASE")] = store
                    manifest["stringData"][_store_key("MONGO", store, "AUTH_SOURCE")] = "admin"
                    manifest["stringData"][_store_key("MONGO", store, "USER")] = user
                    auth_data = _extract_data(
                        observed.get(f"observe-mongodb-auth-secret-{xr_name}-{store}")
                    )
                    pwd = _b64get_any(auth_data, ["password"])
                    if pwd:
                        manifest["stringData"][_store_key("MONGO", store, "PASSWORD")] = pwd
                        manifest["stringData"][_store_key("MONGO", store, "URI")] = (
                            f"mongodb://{user}:{pwd}@{host}:27017/{store}?authSource=admin"
                        )

            cache_stores = spec.get("cacheStores") or {}
            if isinstance(cache_stores, dict):
                for store_name in sorted(cache_stores.keys()):
                    if not isinstance(store_name, str) or not store_name.strip():
                        continue
                    store = store_name.strip()
                    host = f"{store}.{workshop_namespace}.svc"
                    manifest["stringData"][_store_key("REDIS", store, "HOST")] = host
                    manifest["stringData"][_store_key("REDIS", store, "PORT")] = "6379"
                    manifest["stringData"][_store_key("REDIS", store, "USER")] = "default"
                    manifest["stringData"][_store_key("REDIS", store, "DATABASE")] = "0"
                    auth_data = _extract_data(
                        observed.get(f"observe-redis-auth-secret-{xr_name}-{store}")
                    )
                    pwd = _b64get_any(auth_data, ["password"])
                    if pwd:
                        manifest["stringData"][_store_key("REDIS", store, "PASSWORD")] = pwd
                        manifest["stringData"][_store_key("REDIS", store, "URL")] = (
                            f"redis://default:{pwd}@{host}:6379/0"
                        )

            vector_stores = spec.get("vectorStores") or {}
            if isinstance(vector_stores, dict):
                for store_name in sorted(vector_stores.keys()):
                    if not isinstance(store_name, str) or not store_name.strip():
                        continue
                    store = store_name.strip()
                    host = f"qdrant-{store}.{workshop_namespace}.svc"
                    manifest["stringData"][_store_key("QDRANT", store, "HOST")] = host
                    manifest["stringData"][_store_key("QDRANT", store, "PORT")] = "6333"
                    manifest["stringData"][_store_key("QDRANT", store, "GRPC_PORT")] = "6334"
                    manifest["stringData"][_store_key("QDRANT", store, "URL")] = (
                        f"http://{host}:6333"
                    )
                    auth_data = _extract_data(
                        observed.get(f"observe-qdrant-auth-secret-{xr_name}-{store}")
                    )
                    api_key = _b64get_any(auth_data, ["apiKey"])
                    read_key = _b64get_any(auth_data, ["readApiKey"])
                    if api_key:
                        manifest["stringData"][_store_key("QDRANT", store, "API_KEY")] = api_key
                    if read_key:
                        manifest["stringData"][_store_key("QDRANT", store, "READ_API_KEY")] = (
                            read_key
                        )

            db_hosts = spec.get("databases") or {}
            if isinstance(db_hosts, dict):
                db_env = environment.get("database") or {}
                gateway_env = db_env.get("tlsRoute") or {}

                gateway_parent_name = _string_value(gateway_env.get("parentName") or "")
                gateway_parent_ns = _string_value(gateway_env.get("parentNamespace") or "")
                gateway_section = _string_value(gateway_env.get("sectionName") or "")
                has_gateway_parent = bool(
                    gateway_parent_name and gateway_parent_ns and gateway_section
                )

                ingress_env = environment.get("ingress") or {}
                ingress_domain = ingress_env.get("domain", "default")

                for host_key in sorted(list(db_hosts.keys())):
                    if not isinstance(host_key, str) or not host_key.strip():
                        continue
                    host_cfg = db_hosts.get(host_key) or {}
                    if not isinstance(host_cfg, dict):
                        continue

                    cluster_name = host_key.strip()
                    dbnames = [
                        _string_value(x)
                        for x in list(host_cfg.get("names") or [])
                        if _string_value(x)
                    ]
                    if not dbnames:
                        continue

                    host_obs = observed.get(f"observe-database-secret-{xr_name}-{cluster_name}")
                    host_data_b64 = _extract_data(host_obs)

                    host = (
                        _b64get_any(host_data_b64, ["host"])
                        or f"{cluster_name}-primary.{workshop_namespace}.svc"
                    )
                    port = _b64get_any(host_data_b64, ["port"]) or "5432"
                    user = _b64get_any(host_data_b64, ["user"]) or "postgres"
                    password = _b64get_any(host_data_b64, ["password"]) or ""
                    internal_url = _b64get_any(host_data_b64, ["uri"]) or ""

                    manifest["stringData"][_store_key("POSTGRES", cluster_name, "HOST")] = host
                    manifest["stringData"][_store_key("POSTGRES", cluster_name, "PORT")] = port
                    manifest["stringData"][_store_key("POSTGRES", cluster_name, "USER")] = user
                    manifest["stringData"][_store_key("POSTGRES", cluster_name, "PASSWORD")] = (
                        password
                    )
                    manifest["stringData"][
                        _store_key("POSTGRES", cluster_name, "DATABASES")
                    ] = ",".join(dbnames)

                    host_ext = ""
                    if has_gateway_parent:
                        host_ext = f"{cluster_name}-{workshop_namespace}.{ingress_domain}:443"
                        manifest["stringData"][
                            _store_key("POSTGRES", cluster_name, "HOST_EXTERNAL")
                        ] = host_ext.split(":")[0]

                    for dbname in dbnames:
                        db_url = _uri_with_database(internal_url, dbname)
                        if not db_url and password:
                            db_url = f"postgresql://{user}:{password}@{host}:{port}/{dbname}"
                        if db_url:
                            manifest["stringData"][_pg_db_key(cluster_name, dbname, "URL")] = (
                                db_url
                            )
                        if host_ext and db_url:
                            manifest["stringData"][
                                _pg_db_key(cluster_name, dbname, "URL_EXTERNAL")
                            ] = _external_pg_url(db_url, host_ext)

            key = f"secret-{xr_name}-datalab"
            rsp.desired.resources[key].resource.update(manifest)
            rsp.desired.resources[key].ready = fnv1.READY_TRUE
      templates:
        datalab-secret/manifest:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${metadata_name}
            namespace: ${xr_namespace}
          type: Opaque
          stringData:
            remote: ${access_key}
            remotePath: /
            configData: ${config_data}
            AWS_ACCESS_KEY_ID: ${access_key}
            AWS_SECRET_ACCESS_KEY: ${secret_key}
            AWS_REGION: ${region}
            AWS_ENDPOINT_URL: ${endpoint}
            AWS_S3_FORCE_PATH_STYLE: ${force_path_style}
  - step: update-keycloak-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _boolish(value):
            if isinstance(value, bool):
                return value
            return str(value).lower() in ("true", "1", "yes", "on")

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        def _string_value(value):
            """Keep the literal string for null values in existing resource settings."""
            return str(value).strip()

        def _session_name(session, *, stringify_none=False):
            if isinstance(session, dict):
                return _safe_str(session.get("name") or "")
            return _string_value(session) if stringify_none else _safe_str(session)

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def _distinct(seq):
            return list(dict.fromkeys(seq))


        def _workspace_redirect_uris(xr_name, domain, session_names):
            uris = [f"https://{xr_name}.{domain}/*"]
            for sid in session_names:
                session_host = f"{xr_name}-{sid}"
                uris.extend(
                    [
                        f"https://{session_host}.{domain}/*",
                        f"https://editor-{session_host}.{domain}/*",
                        f"https://{session_host}-editor.{domain}/*",
                        f"https://data-{session_host}.{domain}/*",
                        f"https://{session_host}-data.{domain}/*",
                    ]
                )
            uris.append("http://localhost:*")
            return _distinct(uris)


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            iam_env = environment.get("iam") or {}
            ingress_env = environment.get("ingress") or {}
            realm = iam_env.get("realm", "default")
            extra_audiences_raw = iam_env.get("extraAudiences")
            if isinstance(extra_audiences_raw, str):
                extra_audiences_raw = [extra_audiences_raw]
            elif not isinstance(extra_audiences_raw, list):
                extra_audiences_raw = []
            extra_audiences = _distinct(
                [_safe_str(audience) for audience in extra_audiences_raw if _safe_str(audience)]
            )
            data_enabled = ((environment.get("defaults") or {}).get("data") or {}).get(
                "enabled", True
            )
            s3_enabled = (environment.get("httpRoute") or {}).get("enableS3", False)
            if (data_enabled is None or _boolish(data_enabled)) and _boolish(s3_enabled):
                extra_audiences = _distinct([*extra_audiences, xr_name])
            domain = ingress_env.get("domain", "default")
            url = f"https://{xr_name}.{domain}"
            session_names = [
                _session_name(session)
                for session in (spec.get("sessions") or [])
                if _session_name(session)
            ]
            redirect_uris = _workspace_redirect_uris(xr_name, domain, session_names)

            def put(key_base, body_base, name_override=xr_name):
                key = f"{key_base}-{name_override}"
                body = body_base.copy()
                md = body.setdefault("metadata", {})
                md.setdefault("name", name_override)
                md.setdefault("namespace", xr_namespace)
                ann = md.setdefault("annotations", {})
                ann["crossplane.io/composition-resource-name"] = key
                rsp.desired.resources[key].resource.update(body)

            put(
                "keycloak-group",
                _render_template(
                    req,
                    "keycloak/users-group",
                    xr_name=xr_name,
                    realm=realm,
                ),
            )

            put(
                "keycloak-group-admin",
                _render_template(
                    req,
                    "keycloak/admins-group",
                    display_name=f"{xr_name}-admin",
                    realm=realm,
                ),
                f"{xr_name}-admin",
            )

            put(
                "keycloak-mapper",
                _render_template(
                    req,
                    "keycloak/group-membership-mapper",
                    xr_name=xr_name,
                    realm=realm,
                ),
            )

            put(
                "keycloak-client",
                _render_template(
                    req,
                    "keycloak/client",
                    xr_name=xr_name,
                    url=url,
                    redirect_uris=redirect_uris,
                    realm=realm,
                    connection_secret_name=f"{xr_name}-oauth-client",
                ),
            )

            put(
                "keycloak-role-user",
                _render_template(
                    req,
                    "keycloak/access-role",
                    xr_name=xr_name,
                    realm=realm,
                ),
                f"{xr_name}-ws-access",
            )

            put(
                "keycloak-role-admin",
                _render_template(
                    req,
                    "keycloak/admin-role",
                    xr_name=xr_name,
                    realm=realm,
                ),
                f"{xr_name}-ws-admin",
            )

            put(
                "keycloak-role-api",
                _render_template(
                    req,
                    "keycloak/api-role",
                    xr_name=xr_name,
                    realm=realm,
                ),
                f"{xr_name}-ws-api",
            )

            def put_keycloak_role_mapper(key_base, role_name_override):
                put(
                    key_base,
                    _render_template(
                        req,
                        "keycloak/role-scope-mapper",
                        realm=realm,
                        xr_name=xr_name,
                        role_name_override=role_name_override,
                    ),
                    role_name_override,
                )

            put_keycloak_role_mapper("keycloak-role-mapper-user", f"{xr_name}-ws-access")
            put_keycloak_role_mapper("keycloak-role-mapper-admin", f"{xr_name}-ws-admin")
            put_keycloak_role_mapper("keycloak-role-mapper-api", f"{xr_name}-ws-api")

            for audience in extra_audiences:
                audience_name = (
                    "".join(
                        [char.lower() if char.isalnum() else "-" for char in audience]
                    ).strip("-")
                    or "extra"
                )
                audience_name = (
                    "-".join([part for part in audience_name.split("-") if part])[:48].strip(
                        "-"
                    )
                    or "extra"
                )
                key_base = f"keycloak-extra-audience-{audience_name}"
                put(
                    key_base,
                    _render_template(
                        req,
                        "keycloak/audience-mapper",
                        realm=realm,
                        xr_name=xr_name,
                        display_name=f"{audience_name}-audience",
                        audience=audience,
                    ),
                    f"{xr_name}-{audience_name}-audience",
                )

            put(
                "keycloak-roles-user",
                _render_template(
                    req,
                    "keycloak/user-group-roles",
                    realm=realm,
                    xr_name=xr_name,
                    role_name=f"{xr_name}-ws-access",
                ),
            )

            put(
                "keycloak-roles-admin",
                _render_template(
                    req,
                    "keycloak/admin-group-roles",
                    realm=realm,
                    group_name=f"{xr_name}-admin",
                    role_name=f"{xr_name}-ws-admin",
                ),
                f"{xr_name}-admin",
            )

            # Keep the resolved identity in desired state. Multiple provider
            # reference updates can otherwise remove an earlier resolved field.
            observed_client = (getattr(req.observed, "resources", {}) or {}).get(
                f"keycloak-client-{xr_name}"
            )
            client_state = _to_dict(observed_client.resource) if observed_client else {}
            client_identity = (client_state.get("status") or {}).get("atProvider") or {}
            service_account_inputs = {}
            if _safe_str(client_identity.get("id")) and _safe_str(
                client_identity.get("serviceAccountUserId")
            ):
                service_account_inputs = {
                    "clientId": client_identity["id"],
                    "serviceAccountUserId": client_identity["serviceAccountUserId"],
                    "role": "ws_api",
                }

            put(
                "keycloak-service-account-role-api",
                _render_template(
                    req,
                    "keycloak/service-account-role",
                    role_binding={
                        "realmId": realm,
                        "clientIdRef": {"name": xr_name, "policy": {"resolution": "Required"}},
                        "roleRef": {
                            "name": f"{xr_name}-ws-api",
                            "policy": {"resolution": "Required"},
                        },
                        "serviceAccountUserClientIdRef": {
                            "name": xr_name,
                            "policy": {"resolution": "Required"},
                        },
                        **service_account_inputs,
                    },
                ),
                f"{xr_name}-ws-api",
            )

            users = list(spec.get("users", []) or [])
            userOverrides = spec.get("userOverrides", {}) or {}

            role_admins = [
                u
                for u in users
                if str(((userOverrides.get(u) or {}).get("role") or "")).strip() == "admin"
            ]

            admins = _distinct((users[0:1] or []) + role_admins)

            put(
                "keycloak-memberships-users",
                _render_template(
                    req,
                    "keycloak/user-memberships",
                    xr_name=xr_name,
                    realm=realm,
                    users=users,
                ),
            )

            put(
                "keycloak-memberships-admins",
                _render_template(
                    req,
                    "keycloak/admin-memberships",
                    group_name=f"{xr_name}-admin",
                    realm=realm,
                    admins=admins,
                ),
                f"{xr_name}-admin",
            )
      templates:
        keycloak/access-role:
          apiVersion: role.keycloak.m.crossplane.io/v1alpha1
          kind: Role
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              name: ws_access
              clientIdRef:
                name: ${xr_name}
                policy:
                  resolution: Required
              realmId: ${realm}
        keycloak/admin-group-roles:
          apiVersion: group.keycloak.m.crossplane.io/v1alpha1
          kind: Roles
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              realmId: ${realm}
              groupIdRef:
                name: ${group_name}
                policy:
                  resolution: Required
              roleIdsRefs:
              - name: ${role_name}
                policy:
                  resolution: Required
        keycloak/admin-memberships:
          apiVersion: group.keycloak.m.crossplane.io/v1alpha1
          kind: Memberships
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              groupIdRef:
                name: ${group_name}
                policy:
                  resolution: Required
              realmId: ${realm}
              members: ${admins}
        keycloak/admin-role:
          apiVersion: role.keycloak.m.crossplane.io/v1alpha1
          kind: Role
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              name: ws_admin
              clientIdRef:
                name: ${xr_name}
                policy:
                  resolution: Required
              realmId: ${realm}
        keycloak/admins-group:
          apiVersion: group.keycloak.m.crossplane.io/v1alpha1
          kind: Group
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              name: ${display_name}
              realmId: ${realm}
        keycloak/api-role:
          apiVersion: role.keycloak.m.crossplane.io/v1alpha1
          kind: Role
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              name: ws_api
              clientIdRef:
                name: ${xr_name}
                policy:
                  resolution: Required
              realmId: ${realm}
        keycloak/audience-mapper:
          apiVersion: client.keycloak.m.crossplane.io/v1alpha1
          kind: ProtocolMapper
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              realmId: ${realm}
              clientIdRef:
                name: ${xr_name}
                policy:
                  resolution: Required
              protocol: openid-connect
              protocolMapper: oidc-audience-mapper
              name: ${display_name}
              config:
                included.client.audience: ${audience}
                access.token.claim: 'true'
                id.token.claim: 'false'
                introspection.token.claim: 'true'
                userinfo.token.claim: 'false'
        keycloak/client:
          apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
          kind: Client
          metadata:
            labels:
              crossplane.io/claim-name: ${xr_name}
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              name: ${xr_name}
              clientId: ${xr_name}
              rootUrl: ${url}
              adminUrl: ${url}
              accessType: CONFIDENTIAL
              fullScopeAllowed: false
              standardFlowEnabled: true
              implicitFlowEnabled: false
              directAccessGrantsEnabled: false
              serviceAccountsEnabled: true
              oauth2DeviceAuthorizationGrantEnabled: false
              webOrigins: ${redirect_uris}
              validRedirectUris: ${redirect_uris}
              realmId: ${realm}
            writeConnectionSecretToRef:
              name: ${connection_secret_name}
        keycloak/group-membership-mapper:
          apiVersion: openidgroup.keycloak.m.crossplane.io/v1alpha1
          kind: GroupMembershipProtocolMapper
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              claimName: groups
              clientIdSelector:
                matchLabels:
                  crossplane.io/claim-name: ${xr_name}
              addToAccessToken: false
              addToIdToken: true
              addToUserinfo: false
              fullPath: false
              name: ${xr_name}
              realmId: ${realm}
        keycloak/role-scope-mapper:
          apiVersion: client.keycloak.m.crossplane.io/v1alpha1
          kind: RoleMapper
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              realmId: ${realm}
              clientIdRef:
                name: ${xr_name}
                policy:
                  resolution: Required
              roleIdRef:
                name: ${role_name_override}
                policy:
                  resolution: Required
        keycloak/service-account-role:
          apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
          kind: ClientServiceAccountRole
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider: ${role_binding}
        keycloak/user-group-roles:
          apiVersion: group.keycloak.m.crossplane.io/v1alpha1
          kind: Roles
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              realmId: ${realm}
              groupIdRef:
                name: ${xr_name}
                policy:
                  resolution: Required
              roleIdsRefs:
              - name: ${role_name}
                policy:
                  resolution: Required
        keycloak/user-memberships:
          apiVersion: group.keycloak.m.crossplane.io/v1alpha1
          kind: Memberships
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              groupIdRef:
                name: ${xr_name}
                policy:
                  resolution: Required
              realmId: ${realm}
              members: ${users}
        keycloak/users-group:
          apiVersion: group.keycloak.m.crossplane.io/v1alpha1
          kind: Group
          spec:
            providerConfigRef:
              name: provider-keycloak
              kind: ProviderConfig
            forProvider:
              name: ${xr_name}
              realmId: ${realm}
  - step: update-oauth2-proxy-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import base64

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_manifest(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return manifest or raw_manifest

        def _extract_data(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return (
                manifest.get("data")
                or manifest.get("stringData")
                or raw_manifest.get("data")
                or raw_manifest.get("stringData")
                or {}
            )

        def _b64get_any(data, keys):
            if not data:
                return None
            for key in keys:
                value = data.get(key)
                if value is None:
                    continue
                try:
                    return base64.b64decode(value, validate=True).decode("utf-8")
                except Exception:
                    return str(value)
            return None

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import hashlib as _hashlib

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            observed = getattr(req.observed, "resources", {}) or {}
            oauth_data = _extract_data(observed.get(f"observe-oauth-client-secret-{xr_name}"))
            client_secret = _b64get_any(
                oauth_data, ["clientSecret", "client_secret", "attribute.client_secret"]
            )
            if not client_secret:
                return
            client_id = (
                _b64get_any(oauth_data, ["clientID", "client_id", "attribute.client_id"])
                or xr_name
            )
            cookie_secret = _hashlib.sha256(client_secret.encode("utf-8")).hexdigest()[:32]

            environment_manifest = _extract_manifest(
                observed.get(f"workshopenvironment-{xr_name}")
            )
            educates_status = (environment_manifest.get("status") or {}).get("educates") or {}
            workshop_namespace = _safe_str(educates_status.get("namespace") or xr_name)

            secret_name = f"{xr_name}-oauth2-client"
            key = f"oauth2-client-secret-{xr_name}"
            manifest = _render_template(
                req,
                "oauth2-client-secret/manifest",
                secret_name=secret_name,
                workshop_ns=workshop_namespace,
                client_id=client_id,
                client_secret=client_secret,
                cookie_secret=cookie_secret,
            )
            rsp.desired.resources[key].resource.update(
                _render_template(
                    req,
                    "common/object",
                    key=key,
                    xr_namespace=xr_namespace,
                    manifest=manifest,
                    readiness={"policy": "SuccessfulCreate"},
                )
            )
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        oauth2-client-secret/manifest:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${secret_name}
            namespace: ${workshop_ns}
          type: Opaque
          stringData:
            client_id: ${client_id}
            client_secret: ${client_secret}
            cookie_secret: ${cookie_secret}
  - step: update-educates-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

