  - step: update-oauth2-proxy-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import base64

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _boolish(value):
            if isinstance(value, bool):
                return value
            return str(value).lower() in ("true", "1", "yes", "on")

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_data(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return (
                manifest.get("data")
                or manifest.get("stringData")
                or raw_manifest.get("data")
                or raw_manifest.get("stringData")
                or {}
            )

        def _b64get_any(data, keys):
            if not data:
                return None
            for key in keys:
                value = data.get(key)
                if value is None:
                    continue
                try:
                    return base64.b64decode(value, validate=True).decode("utf-8")
                except Exception:
                    return str(value)
            return None

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import base64 as _base64
        import hashlib as _hashlib

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            environment = _to_dict(req.context).get("apiextensions.crossplane.io/environment") or {}
            data_enabled = ((environment.get("defaults") or {}).get("data") or {}).get("enabled")
            if data_enabled is not None and not _boolish(data_enabled):
                return
            if not (
                _boolish((environment.get("ingress") or {}).get("enabled"))
                or _boolish((environment.get("httpRoute") or {}).get("enabled"))
            ):
                return
            runtime_namespace = xr_name

            observed = getattr(req.observed, "resources", {}) or {}
            oauth_data = _extract_data(observed.get(f"observe-oauth-client-secret-{xr_name}"))
            client_secret = _b64get_any(
                oauth_data, ["clientSecret", "client_secret"]
            )
            if not client_secret:
                return
            client_id = (
                _b64get_any(oauth_data, ["clientID", "client_id", "attribute.client_id"])
                or xr_name
            )
            cookie_secret = _hashlib.sha256(client_secret.encode("utf-8")).hexdigest()[:32]

            secret_name = f"{xr_name}-oauth2-client"
            key = f"oauth2-client-secret-{xr_name}"
            manifest = _render_template(
                req,
                "oauth2-client-secret/manifest",
                secret_name=secret_name,
                runtime_namespace=runtime_namespace,
                data={
                    key: _base64.b64encode(value.encode("utf-8")).decode("ascii")
                    for key, value in {
                        "client_id": client_id,
                        "client_secret": client_secret,
                        "cookie_secret": cookie_secret,
                    }.items()
                },
            )
            rsp.desired.resources[key].resource.update(
                _render_template(
                    req,
                    "common/object",
                    key=key,
                    xr_namespace=xr_namespace,
                    manifest=manifest,
                    readiness={"policy": "SuccessfulCreate"},
                )
            )
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        oauth2-client-secret/manifest:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${secret_name}
            namespace: ${runtime_namespace}
          type: Opaque
          data: ${data}
  - step: update-datalab-resources
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _boolish(value):
            if isinstance(value, bool):
                return value
            return str(value).lower() in ("true", "1", "yes", "on")

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import hashlib as _hashlib
        import ipaddress as _ipaddress
        import json as _json
        from crossplane.function import response


        def _string_list(value):
            return (
                [_safe_str(item) for item in value if _safe_str(item)]
                if isinstance(value, list)
                else []
            )


        def compose(req, rsp):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            meta = xr["metadata"]
            spec = xr.get("spec") or {}
            xr_name = meta["name"]
            xr_namespace = meta.get("namespace") or "default"
            if xr_name == xr_namespace or xr_name == "default" or xr_name.startswith("kube-"):
                response.fatal(
                    rsp,
                    "The Datalab service namespace must differ from its claim namespace and Kubernetes system namespaces.",
                )
                return
            env = _to_dict(req.context).get(
                "apiextensions.crossplane.io/environment", {}
            )
            defaults = env.get("defaults") or {}
            security = defaults.get("security") or {}
            vcluster = bool(spec.get("vclusters"))
            data_enabled = (defaults.get("data") or {}).get("enabled")
            data_enabled = data_enabled is None or _boolish(data_enabled)
            registry_enabled = _boolish((defaults.get("registry") or {}).get("enabled", True))
            policy = security.get("policy") or "baseline"
            overall_storage = str(
                (defaults.get("overallQuota") or {}).get("storage")
                or "100Gi"
            )
            external_egress = security.get("externalEgress")
            if external_egress is None:
                external_egress = True
            external_egress = _boolish(external_egress)

            network_env = env.get("network") or {}
            excluded_network_policies = set(
                _string_list(network_env.get("excludePolicies") or [])
            )
            blacklist_ips = _string_list(network_env.get("blacklistIPs") or [])
            external_egress_cidrs = _string_list(network_env.get("externalEgressCIDRs") or [])
            internal_egress = network_env.get("internalEgress", [])
            internal_ingress = network_env.get("internalIngress", [])
            internal_cidrs = _string_list(network_env.get("podCIDRs") or [])
            service_cidr = _safe_str(network_env.get("serviceCIDR") or "")
            if service_cidr:
                internal_cidrs.append(service_cidr)

            def _dedupe(items):
                result = []
                for item in items:
                    if item not in result:
                        result.append(item)
                return result

            external_egress_exceptions = _dedupe(blacklist_ips + internal_cidrs)

            def _policy_enabled(name):
                return name not in excluded_network_policies

            def _network_policy(name, rules, direction="egress", pod_selector=None):
                return _render_template(
                    req,
                    "datalab-resources/networkpolicy",
                    name=name,
                    spec={
                        "podSelector": pod_selector or {},
                        "policyTypes": [direction.capitalize()],
                        direction: rules,
                    },
                )

            def _cidr_contains(cidr, child):
                try:
                    parent = _ipaddress.ip_network(cidr, strict=False)
                    candidate = _ipaddress.ip_network(child, strict=False)
                except Exception:
                    return False
                return parent.version == candidate.version and candidate.subnet_of(parent)

            def _exceptions_for(cidr):
                return [ip for ip in external_egress_exceptions if _cidr_contains(cidr, ip)]

            def _ip_block(cidr, exceptions):
                block = {"cidr": cidr}
                if exceptions:
                    block["except"] = exceptions
                return {"ipBlock": block}

            def _internal_ports(items):
                return [
                    {
                        key: item[key]
                        for key in ("port", "protocol", "endPort")
                        if item.get(key) is not None
                    }
                    for item in items
                ]

            def _internal_rules(items, peer_key):
                field = "internalIngress" if peer_key == "from" else "internalEgress"
                if not isinstance(items, list):
                    raise ValueError(f"network.{field} must be a list")
                rules = []
                for item in items:
                    if (
                        not isinstance(item, dict)
                        or not isinstance(item.get("namespace"), str)
                        or not item["namespace"].strip()
                    ):
                        raise ValueError(f"network.{field} entries require a namespace")
                    selector = item.get("podSelector", {})
                    ports = item.get("ports", [])
                    if not isinstance(selector, dict):
                        raise ValueError(f"network.{field} selectors must be objects")
                    if not isinstance(ports, list) or any(
                        not isinstance(port, dict) or port.get("port") is None for port in ports
                    ):
                        raise ValueError(
                            f"network.{field} ports must be a list of port objects"
                        )
                    peer = {
                        "namespaceSelector": {
                            "matchLabels": {
                                "kubernetes.io/metadata.name": item["namespace"].strip(),
                            }
                        }
                    }
                    if selector:
                        peer["podSelector"] = selector
                    rule = {peer_key: [peer]}
                    if ports:
                        rule["ports"] = _internal_ports(ports)
                    rules.append(rule)
                return rules

            def _add_policy(policies, name, rules, direction="egress"):
                if _policy_enabled(name):
                    policies.append(_network_policy(name, rules, direction))

            ingress_policies = {}
            for item, rule in zip(internal_ingress, _internal_rules(internal_ingress, "from")):
                target = item.get("targetPodSelector", {})
                if not isinstance(target, dict):
                    raise ValueError("network.internalIngress selectors must be objects")
                name = "allow-internal-ingress"
                if target:
                    selector = _json.dumps(target, sort_keys=True, separators=(",", ":"))
                    name += "-" + _hashlib.sha256(selector.encode()).hexdigest()[:10]
                ingress_policy = ingress_policies.setdefault(
                    name, _network_policy(name, [], "ingress", target)
                )
                if rule not in ingress_policy["spec"]["ingress"]:
                    ingress_policy["spec"]["ingress"].append(rule)

            network_policies = []
            _add_policy(network_policies, "deny-ingress", [], "ingress")
            _add_policy(
                network_policies, "allow-namespace-ingress", [{"from": [{"podSelector": {}}]}], "ingress"
            )
            _add_policy(network_policies, "deny-egress", [])
            _add_policy(
                network_policies, "allow-namespace-egress", [{"to": [{"podSelector": {}}]}]
            )

            if external_egress or vcluster or data_enabled or registry_enabled:
                _add_policy(
                    network_policies,
                    "allow-dns-egress",
                    [
                        {
                            "to": [
                                {
                                    "namespaceSelector": {
                                        "matchLabels": {
                                            "kubernetes.io/metadata.name": "kube-system"
                                        }
                                    }
                                }
                            ],
                            "ports": [
                                {"protocol": "UDP", "port": 53},
                                {"protocol": "TCP", "port": 53},
                            ],
                        }
                    ],
                )

            if external_egress and external_egress_cidrs:
                _add_policy(
                    network_policies,
                    "allow-external-egress",
                    [
                        {"to": [_ip_block(cidr, _exceptions_for(cidr))]}
                        for cidr in external_egress_cidrs
                    ],
                )

            internal_egress_rules = _internal_rules(internal_egress, "to")
            if internal_egress_rules:
                _add_policy(network_policies, "allow-internal-egress", internal_egress_rules)

            def emit(kind, manifest, suffix=""):
                key = f"{kind.lower()}-{xr_name}{('-' + suffix) if suffix else ''}"
                rsp.desired.resources[key].resource.update(
                    _render_template(
                        req,
                        "common/object",
                        key=key,
                        xr_namespace=xr_namespace,
                        manifest=manifest,
                        readiness={"policy": "SuccessfulCreate"},
                    )
                )

            emit(
                "Namespace",
                _render_template(
                    req,
                    "datalab-resources/namespace",
                    xr_name=xr_name,
                    xr_namespace=xr_namespace,
                    policy=policy,
                ),
            )
            emit(
                "ResourceQuota",
                _render_template(
                    req,
                    "datalab-resources/resourcequota",
                    xr_name=xr_name,
                    overall_storage=overall_storage,
                ),
                "overall-storage",
            )
            quota_key = f"resourcequota-{xr_name}-overall-storage"
            rsp.desired.resources[quota_key].resource["spec"]["forProvider"]["manifest"]["spec"]["hard"].update(
                {
                    "requests.cpu": "4",
                    "requests.memory": "8Gi",
                    "limits.cpu": "16",
                    "limits.memory": "32Gi",
                    **((defaults.get("overallQuota") or {}).get("hard") or {}),
                }
            )
            limits = defaults.get("limitRange") or {}
            emit(
                "LimitRange",
                _render_template(
                    req,
                    "datalab-resources/limitrange",
                    xr_name=xr_name,
                    default_limits={
                        "cpu": "1", "memory": "512Mi", "ephemeral-storage": "8Gi",
                        **(limits.get("default") or {}),
                    },
                    default_requests={
                        "cpu": "100m", "memory": "128Mi", "ephemeral-storage": "3Gi",
                        **(limits.get("defaultRequest") or {}),
                    },
                ),
            )
            policies = network_policies + (
                [policy for name, policy in ingress_policies.items() if _policy_enabled(name)]
                if _policy_enabled("allow-internal-ingress")
                else []
            )
            for manifest in policies:
                manifest["metadata"]["namespace"] = xr_name
                emit("NetworkPolicy", manifest, manifest["metadata"]["name"])
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        datalab-resources/limitrange:
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: datalab-limits
            namespace: ${xr_name}
          spec:
            limits:
            - type: Container
              default: ${default_limits}
              defaultRequest: ${default_requests}
        datalab-resources/namespace:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${xr_name}
            labels:
              datalabs.versioneer.at/name: ${xr_name}
              datalabs.versioneer.at/namespace: ${xr_namespace}
              pod-security.kubernetes.io/enforce: ${policy}
        datalab-resources/networkpolicy:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: ${name}
          spec: ${spec}
        datalab-resources/resourcequota:
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: overall-storage
            namespace: ${xr_name}
          spec:
            hard:
              requests.storage: ${overall_storage}
  - step: update-runtime-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _boolish(value):
            if isinstance(value, bool):
                return value
            return str(value).lower() in ("true", "1", "yes", "on")

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0



        def compose(req, rsp):
            rsp.meta.ttl.FromSeconds(300)
            environment = (
                _to_dict(req.context).get("apiextensions.crossplane.io/environment") or {}
            )
            data = (environment.get("defaults") or {}).get("data") or {}
            enabled = data.get("enabled")
            registry_enabled = _boolish(((environment.get("defaults") or {}).get("registry") or {}).get("enabled", True))
            if enabled is not None and not _boolish(enabled) and not registry_enabled:
                return
            meta = _to_dict(req.observed.composite.resource)["metadata"]
            name = meta["name"]
            storage = rsp.desired.resources.get(f"connection-{name}-s3")
            if not storage:
                return
            values = {
                key: value
                for key, value in _to_dict(storage.resource).get("stringData", {}).items()
                if key.startswith("AWS_") or key == "aws-credentials"
            }
            key = f"runtime-storage-secret-{name}"
            rsp.desired.resources[key].resource.update(
                _render_template(
                    req,
                    "common/object",
                    key=key,
                    xr_namespace=meta.get("namespace") or "default",
                    manifest={
                        "apiVersion": "v1",
                        "kind": "Secret",
                        "metadata": {"name": f"{name}-storage", "namespace": name},
                        "type": "Opaque",
                        "stringData": values,
                    },
                    readiness={"policy": "SuccessfulCreate"},
                )
            )
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
  - step: update-vclusters
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import hashlib

        import json

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _resource_name(*parts, limit=63):
            name = "-".join(parts)
            if len(name) <= limit and (
                len(parts) == 1 or all("-" not in part for part in parts)
            ):
                return name
            # Keep component boundaries distinct when instance and profile names have hyphens.
            digest = hashlib.sha256(json.dumps(parts).encode()).hexdigest()[:10]
            return name[: limit - 11].rstrip("-") + "-" + digest

        def _vcluster_role(instance, group):
            return f"vcluster_{instance}_{group}"

        def _vcluster_groups(config):
            groups = {group["name"]: group for group in config.get("groups") or []}
            groups["cluster-admin"] = {
                "name": "cluster-admin", "namespace": "*", "role": "cluster-admin"
            }
            return [groups[name] for name in sorted(groups)]

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import base64
        from collections import Counter
        import hashlib
        import json
        import re
        from crossplane.function import request, response


        def _secret_mappings(connections, bindings):
            candidates = []
            for binding in bindings:
                kind, name = binding["type"], binding["name"]
                matches = [
                    item for item in connections
                    if item["type"] == kind and item["name"] == name
                ]
                if len(matches) != 1 or matches[0].get("ready") is not True:
                    continue
                source = matches[0]["secretRef"]
                if not (
                    re.fullmatch(r"[a-z0-9]([-a-z0-9]*[a-z0-9])?", source["namespace"])
                    and re.fullmatch(r"[a-z0-9]([-a-z0-9.]*[a-z0-9])?", source["name"])
                ):
                    continue
                target = binding["target"]
                source_name = f"{source['namespace']}/{source['name']}"
                target_name = f"{target['namespace']}/{target['name']}"
                candidates.append((source_name, target_name))
            sources = Counter(source for source, _ in candidates)
            targets = Counter(target for _, target in candidates)
            return {
                source: target
                for source, target in candidates
                if sources[source] == 1 and targets[target] == 1
            }


        def compose(req, rsp):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            instances = (xr.get("spec") or {}).get("vclusters") or {}
            sessions = (xr.get("spec") or {}).get("sessions") or []
            if any(session["vcluster"] not in instances for session in sessions):
                response.fatal(rsp, "Each session must select a declared virtual cluster.")
                return
            status = _to_dict(rsp.desired.composite.resource).get("status") or {}
            status["sessions"] = [
                {"name": session["name"], "vcluster": session["vcluster"],
                 "namespace": session.get("namespace", "default"),
                 "pvcName": _resource_name("session", session["name"])}
                for session in sessions
            ]
            rsp.desired.composite.resource.update({"status": status})
            if not instances:
                return
            meta = xr["metadata"]
            name = meta["name"]
            namespace = name
            for instance, instance_config in sorted(instances.items()):
                _compose_instance(
                    req,
                    rsp,
                    name,
                    meta.get("namespace") or "default",
                    namespace,
                    instance,
                    instance_config,
                )


        def _compose_instance(
            req, rsp, name, claim_namespace, namespace, instance, instance_config
        ):
            runtime = _resource_name("vcluster", instance, limit=45)
            service_account = f"vc-{runtime}"
            ca_name = f"{runtime}-ca"
            template_values = {
                "runtime": runtime,
                "service_account": service_account,
                "workload_account": f"vc-workload-{runtime}",
                "config_secret": f"vc-config-{runtime}",
                "authentication_name": f"{runtime}-authentication",
                "headless_service": f"{runtime}-headless",
                "data_pvc": f"data-{runtime}-0",
                "ca_name": ca_name,
                "control_policy": f"vc-cp-{runtime}",
                "workload_policy": f"vc-work-{runtime}",
                "dns_policy": f"vc-dns-{runtime}",
                "snapshot_policy": f"vc-snapshot-{runtime}",
                "prefix": f"/.{instance}",
            }
            env = _to_dict(req.context).get("apiextensions.crossplane.io/environment", {}) or {}
            images = env.get("images") or {}
            config = env.get("vcluster") or {}
            secret_mappings = _secret_mappings(
                (_to_dict(rsp.desired.composite.resource).get("status") or {}).get("connections") or [],
                instance_config.get("secretBindings") or [],
            )
            iam = env.get("iam") or {}
            route = env.get("httpRoute") or {}
            domain = (env.get("ingress") or {}).get("domain")
            required = {
                "iam.issuerURL": iam.get("issuerURL"),
                "ingress.domain": domain,
                **{
                    f"httpRoute.{key}": route.get(key)
                    for key in ("parentName", "parentNamespace", "sectionName")
                },
            }
            missing = [key for key, value in required.items() if not str(value or "").strip()]
            if missing:
                response.fatal(
                    rsp, "vCluster requires EnvironmentConfig data: " + ", ".join(missing)
                )
                return
            if route.get("enabled") is False:
                response.fatal(
                    rsp,
                    "vCluster requires EnvironmentConfig data.httpRoute.enabled to be true.",
                )
                return
            issuer = str(iam["issuerURL"]).rstrip("/")
            discovery = str(config.get("discoveryURL") or "").strip()
            if not issuer.startswith("https://") or (
                discovery and (not discovery.startswith("https://"))
            ):
                response.fatal(rsp, "vCluster issuerURL and discoveryURL must use HTTPS.")
                return
            hostname = f"{name}.{domain}"
            backend_hostname = f"{runtime}.{namespace}.svc"
            audience = json.dumps(name)
            groups = _vcluster_groups(instance_config)
            roles = [_vcluster_role(instance, group["name"]) for group in groups]
            role_list = json.dumps(roles)
            jwt_issuer = {"url": issuer, "audiences": [name], "audienceMatchPolicy": "MatchAny"}
            if discovery:
                jwt_issuer["discoveryURL"] = discovery
            if config.get("issuerCA"):
                jwt_issuer["certificateAuthority"] = config["issuerCA"]
            authentication = json.dumps(
                _render_template(
                    req,
                    "vcluster/authenticationconfiguration",
                    jwt_issuer=jwt_issuer,
                    jwt_0_claimValidationRules_0_expression=f"has(claims.resource_access) && {audience} in claims.resource_access && has(claims.resource_access[{audience}].roles) && claims.resource_access[{audience}].roles.exists(r, r in {role_list})",
                    jwt_0_claimMappings_username_prefix=f"datalab:{name}:",
                    jwt_0_claimMappings_groups_expression=f"claims.resource_access[{audience}].roles.filter(r, r in {role_list}).map(r, 'datalab:{name}:' + r)",
                    **template_values,
                ),
                sort_keys=True,
            )

            def emit(suffix, manifest, readiness=None):
                key = _resource_name("vcluster", name, instance, suffix)
                rsp.desired.resources[key].resource.update(
                    _render_template(
                        req,
                        "common/object",
                        key=key,
                        xr_namespace=claim_namespace,
                        manifest=manifest,
                        readiness=readiness or {"policy": "SuccessfulCreate"},
                        **template_values,
                    )
                )
                rsp.desired.resources[key].resource["metadata"]["labels"] = {"datalabs.versioneer.at/vcluster": instance}

            emit(
                "authentication",
                _render_template(
                    req,
                    "vcluster/authentication",
                    namespace=namespace,
                    authentication=authentication,
                    **template_values,
                ),
            )
            workload_egress = [
                rule
                for key in sorted(rsp.desired.resources)
                for policy in [
                    _to_dict(rsp.desired.resources[key].resource)
                    .get("spec", {})
                    .get("forProvider", {})
                    .get("manifest", {})
                ]
                if policy.get("kind") == "NetworkPolicy"
                and policy.get("metadata", {}).get("name")
                in ("allow-external-egress", "allow-internal-egress")
                for rule in policy.get("spec", {}).get("egress", [])
            ]
            storage_config = config.get("storageClasses") or {}
            storage_classes = (
                storage_config.get("allowed") if isinstance(storage_config, dict) else None
            )
            if (
                not isinstance(storage_classes, list)
                or not storage_classes
                or any(
                    (not isinstance(item, str) or not item.strip() for item in storage_classes)
                )
                or (len(set(storage_classes)) != len(storage_classes))
            ):
                response.fatal(
                    rsp,
                    "EnvironmentConfig data.vcluster.storageClasses.allowed must be a non-empty list of unique StorageClass names.",
                )
                return
            default_class = storage_config.get("default") or storage_classes[0]
            storage_class = config.get("storageClassName") or default_class
            if default_class not in storage_classes or storage_class not in storage_classes:
                response.fatal(
                    rsp,
                    "The vcluster default and control-plane StorageClass must be in data.vcluster.storageClasses.allowed.",
                )
                return
            emit(
                "data",
                _render_template(
                    req,
                    "vcluster/data",
                    namespace=namespace,
                    storage_class=storage_class,
                    spec_resources_requests_storage=str(
                        instance_config.get("storage") or config.get("storage") or "5Gi"
                    ),
                    **template_values,
                ),
            )
            policy_name = _resource_name(namespace, instance, "storage-classes")
            emit(
                "storage-policy",
                _render_template(
                    req,
                    "vcluster/storage-policy",
                    policy_name=policy_name,
                    spec_matchConditions_0_expression=f"request.userInfo.username == {json.dumps(f'system:serviceaccount:{namespace}:{service_account}')}",
                    spec_validations_0_expression=f"has(object.spec.storageClassName) && object.spec.storageClassName in {json.dumps(storage_classes)}",
                    **template_values,
                ),
            )
            emit(
                "storage-policy-binding",
                _render_template(
                    req,
                    "vcluster/storage-policy-binding",
                    policy_name=policy_name,
                    namespace=namespace,
                    **template_values,
                ),
            )
            resource_config = config.get("resources") or {}
            resources = {
                "requests": {"cpu": "200m", "memory": "1Gi", "ephemeral-storage": "1Gi"},
                "limits": {"cpu": "4", "memory": "4Gi", "ephemeral-storage": "10Gi"},
            }
            for section in resources:
                resources[section].update(resource_config.get(section) or {})
            configuration = _render_template(
                req,
                "vcluster/configuration",
                namespace=namespace,
                name=_resource_name(name, instance),
                internal_server=f"https://{runtime}.{namespace}:443",
                backend_hostname=backend_hostname,
                storage=str(instance_config.get("storage") or config.get("storage") or "5Gi"),
                storage_class=storage_class,
                resources=resources,
                **template_values,
            )
            embedded = ((config.get("backingStore") or {}).get("database") or {}).get(
                "embedded"
            ) or {}
            configuration["controlPlane"]["backingStore"]["database"]["embedded"].update(
                embedded
            )
            configuration["sync"]["fromHost"]["secrets"] = {
                "enabled": bool(secret_mappings),
                "mappings": {"byName": secret_mappings},
            }
            sandbox_manifests = _render_template(
                req, "vcluster/sandbox-install"
            )["manifests"]
            sandbox_controller = _render_template(
                req, "vcluster/sandbox-controller",
                controller_image=images.get("sandbox") or "registry.k8s.io/agent-sandbox/agent-sandbox-controller:v1.0.10",
            )
            configuration["experimental"]["deploy"]["vcluster"]["manifests"] = (
                sandbox_manifests + "---\n" + json.dumps(sandbox_controller, sort_keys=True)
            )
            configuration_json = json.dumps(configuration, sort_keys=True)
            checksum = hashlib.sha256(
                (configuration_json + authentication).encode()
            ).hexdigest()
            emit(
                "config",
                _render_template(
                    req,
                    "vcluster/config-secret",
                    namespace=namespace,
                    configuration_data=base64.b64encode(configuration_json.encode()).decode(),
                    **template_values,
                ),
            )
            for suffix, manifest in (
                (
                    "serviceaccount",
                    _render_template(
                        req, "vcluster/serviceaccount", namespace=namespace, **template_values
                    ),
                ),
                (
                    "workload-serviceaccount",
                    _render_template(
                        req,
                        "vcluster/workload-serviceaccount",
                        namespace=namespace,
                        **template_values,
                    ),
                ),
                (
                    "role",
                    _render_template(
                        req, "vcluster/role", namespace=namespace, **template_values
                    ),
                ),
                (
                    "rolebinding",
                    _render_template(
                        req, "vcluster/rolebinding", namespace=namespace, **template_values
                    ),
                ),
                (
                    "service",
                    _render_template(
                        req, "vcluster/service", namespace=namespace, **template_values
                    ),
                ),
                (
                    "headless-service",
                    _render_template(
                        req, "vcluster/headless-service", namespace=namespace, **template_values
                    ),
                ),
                (
                    "control-plane-networkpolicy",
                    _render_template(
                        req,
                        "vcluster/control-plane-networkpolicy",
                        namespace=namespace,
                        iam_namespace=iam.get("namespace") or "keycloak",
                        **template_values,
                    ),
                ),
                (
                    "dns-networkpolicy",
                    _render_template(
                        req,
                        "vcluster/dns-networkpolicy",
                        namespace=namespace,
                        **template_values,
                    ),
                ),
                (
                    "snapshot-networkpolicy",
                    _render_template(
                        req,
                        "vcluster/snapshot-networkpolicy",
                        namespace=namespace,
                        **template_values,
                    ),
                ),
            ):
                emit(suffix, manifest)
            source_namespaces = {key.split("/")[0] for key in secret_mappings} - {namespace}
            for source_namespace in sorted(source_namespaces):
                reader_name = _resource_name(name, instance, "secret-import")
                reader_values = {
                    **template_values,
                    "namespace": source_namespace,
                    "runtime_namespace": namespace,
                    "reader_name": reader_name,
                }
                for kind, manifest in (
                    ("role", _render_template(req, "vcluster/secret-import-role", **reader_values)),
                    ("rolebinding", _render_template(req, "vcluster/secret-import-rolebinding", **reader_values)),
                ):
                    emit(
                        f"secret-import-{source_namespace}-{kind}",
                        manifest,
                    )
            workload_policy = _render_template(
                req, "vcluster/workload-networkpolicy", namespace=namespace, **template_values
            )
            workload_policy["spec"]["egress"].extend(workload_egress)
            emit("workload-networkpolicy", workload_policy)
            emit(
                "statefulset",
                _render_template(
                    req,
                    "vcluster/statefulset",
                    namespace=namespace,
                    configuration_checksum=checksum,
                    resources=resources,
                    **template_values,
                ),
                {
                    "policy": "DeriveFromCelQuery",
                    "celQuery": "has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration == object.metadata.generation && has(object.status.readyReplicas) && object.status.readyReplicas == object.spec.replicas && has(object.status.currentRevision) && has(object.status.updateRevision) && object.status.currentRevision == object.status.updateRevision",
                },
            )
            virtual_provider = _resource_name(name, "vcluster", instance)
            emit(
                "virtual-providerconfig",
                _render_template(
                    req,
                    "vcluster/virtual-providerconfig",
                    virtual_provider=virtual_provider,
                    claim_namespace=claim_namespace,
                    namespace=namespace,
                    **template_values,
                ),
            )

            def virtual(suffix, manifest, preserve=False, readiness=None):
                key = _resource_name("vcluster", name, instance, "access", suffix)
                body = _render_template(
                    req,
                    "vcluster/body",
                    key=key,
                    claim_namespace=claim_namespace,
                    virtual_provider=virtual_provider,
                    manifest=manifest,
                    **template_values,
                )
                if preserve:
                    body["spec"]["managementPolicies"] = ["Observe", "Create", "Update"]
                if readiness:
                    body["spec"]["readiness"] = readiness
                body["metadata"].setdefault("labels", {})[
                    "datalabs.versioneer.at/vcluster"
                ] = instance
                rsp.desired.resources[key].resource.update(body)

            virtual(
                "sandbox-controller",
                {"apiVersion": "apps/v1", "kind": "Deployment", "metadata": {
                    "name": "agent-sandbox-controller", "namespace": "agent-sandbox-system",
                }},
                readiness={
                    "policy": "DeriveFromCelQuery",
                    "celQuery": "has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration >= object.metadata.generation && has(object.status.availableReplicas) && object.status.availableReplicas >= 1",
                },
            )
            controller_key = _resource_name("vcluster", name, instance, "access", "sandbox-controller")
            rsp.desired.resources[controller_key].resource["spec"]["managementPolicies"] = ["Observe"]

            sessions = [
                session for session in (_to_dict(req.observed.composite.resource).get("spec") or {}).get("sessions", [])
                if session["vcluster"] == instance
            ]
            targets = {"default", *(group["namespace"] for group in groups if group["namespace"] != "*"),
                       *(session.get("namespace", "default") for session in sessions)}
            sandbox_image = images.get("sandboxd") or (
                "us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandboxd"
                ":v20261108-v1.0.10-23-g653e16f"
            )
            for target in sorted(targets):
                virtual(
                    f"sandbox-template-{target}",
                    _render_template(req, "vcluster/sandbox-template", target=target, sandbox_image=sandbox_image),
                )
            for session in sessions:
                target = session.get("namespace", "default")
                virtual(
                    f"session-{session['name']}",
                    _render_template(
                        req, "vcluster/session-pvc", target=target,
                        pvc_name=_resource_name("session", session["name"]),
                        storage=session.get("pvcSize") or (env.get("defaults") or {}).get("session", {}).get("pvcSize") or "1Gi",
                        storage_class=default_class,
                    ),
                )

            for storage_name in storage_classes:
                suffix = hashlib.sha256(storage_name.encode()).hexdigest()[:12]
                emit(
                    f"observe-storageclass-{suffix}",
                    _render_template(
                        req,
                        "vcluster/storageclass",
                        storage_name=storage_name,
                        **template_values,
                    ),
                )
                key = _resource_name(
                    "vcluster", name, instance, f"observe-storageclass-{suffix}"
                )
                rsp.desired.resources[key].resource["spec"]["managementPolicies"] = ["Observe"]
                observed = req.observed.resources.get(key)
                state = (
                    _to_dict(observed.resource).get("status", {}).get("atProvider", {})
                    if observed
                    else {}
                )
                host_class = state.get("manifest") or state.get("raw", {}).get("manifest") or {}
                if not host_class.get("provisioner"):
                    continue
                fields = {
                    key: host_class[key]
                    for key in (
                        "provisioner",
                        "parameters",
                        "reclaimPolicy",
                        "mountOptions",
                        "allowVolumeExpansion",
                        "volumeBindingMode",
                        "allowedTopologies",
                    )
                    if key in host_class
                }
                virtual(
                    f"storageclass-{suffix}",
                    {
                        **_render_template(
                            req,
                            "vcluster/storageclass-2",
                            storage_name=storage_name,
                            metadata_annotations_storageclass_kubernetes_io_is_default_class=str(
                                storage_name == default_class
                            ).lower(),
                            **template_values,
                        ),
                        **fields,
                    },
                )
            for target in sorted(targets - {"default"}):
                virtual(
                    f"namespace-{target}",
                    _render_template(
                        req, "vcluster/namespace", target=target, **template_values
                    ),
                    preserve=True,
                )
            for group in groups:
                target = group["namespace"]
                role = group["role"]
                suffix = hashlib.sha256(
                    f"{group['name']}:{target}:{role}".encode()
                ).hexdigest()[:12]
                manifest = _render_template(
                    req,
                    "vcluster/manifest",
                    kind="ClusterRoleBinding" if target == "*" else "RoleBinding",
                    metadata_name=f"datalab-{group['name']}-{role}",
                    role=role,
                    subjects_0_name=f"datalab:{name}:"
                    + _vcluster_role(instance, group["name"]),
                    **template_values,
                )
                if target != "*":
                    manifest["metadata"]["namespace"] = target
                virtual(f"binding-{suffix}", manifest)
            response.require_resources(
                rsp,
                name=ca_name,
                api_version="v1",
                kind="Secret",
                match_name=service_account,
                namespace=namespace,
            )
            ca_secret = request.get_required_resource(req, ca_name) or {}
            ca_source = base64.b64decode(ca_secret.get("data", {}).get("config", "")).decode()
            ca_match = re.search("certificate-authority-data:\\s*([A-Za-z0-9+/=]+)", ca_source)
            ca = base64.b64decode(ca_match[1]).decode() if ca_match else ""
            emit(
                "backend-ca",
                _render_template(
                    req, "vcluster/backend-ca", namespace=namespace, ca=ca, **template_values
                ),
            )
            parent = {
                "name": route["parentName"],
                "namespace": route["parentNamespace"],
                "sectionName": route["sectionName"],
            }
            emit(
                "backend-tls",
                _render_template(
                    req,
                    "vcluster/backend-tls",
                    apiVersion=(config.get("backendTLS") or {}).get("apiVersion")
                    or "gateway.networking.k8s.io/v1",
                    namespace=namespace,
                    backend_hostname=backend_hostname,
                    **template_values,
                ),
                {
                    "policy": "DeriveFromCelQuery",
                    "celQuery": f"has(object.status) && has(object.status.ancestors) && object.status.ancestors.exists(p, p.ancestorRef.name == {json.dumps(parent['name'])} && has(p.ancestorRef.namespace) && p.ancestorRef.namespace == {json.dumps(parent['namespace'])} && has(p.conditions) && p.conditions.exists(c, c.type == 'Accepted' && c.status == 'True' && c.observedGeneration == object.metadata.generation))",
                },
            )
            emit(
                "route",
                _render_template(
                    req,
                    "vcluster/route",
                    namespace=namespace,
                    parent=parent,
                    hostname=hostname,
                    **template_values,
                ),
                {
                    "policy": "DeriveFromCelQuery",
                    "celQuery": f"has(object.status) && has(object.status.parents) && object.status.parents.exists(p, p.parentRef.name == {json.dumps(parent['name'])} && has(p.parentRef.namespace) && p.parentRef.namespace == {json.dumps(parent['namespace'])} && has(p.parentRef.sectionName) && p.parentRef.sectionName == {json.dumps(parent['sectionName'])} && has(p.conditions) && p.conditions.exists(c, c.type == 'Accepted' && c.status == 'True' && c.observedGeneration == object.metadata.generation) && p.conditions.exists(c, c.type == 'ResolvedRefs' && c.status == 'True' && c.observedGeneration == object.metadata.generation))",
                },
            )
