  - step: validate-data-exposure
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import re

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _boolish(value):
            if isinstance(value, bool):
                return value
            return str(value).lower() in ("true", "1", "yes", "on")

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        def _duration_milliseconds(value, setting):
            text = _safe_str(value)
            if not re.fullmatch(r"(?:[0-9]{1,5}(?:ms|h|m|s)){1,4}", text):
                raise ValueError(f"{setting} must be a duration, such as 3600s, 1h30m, or 0s.")
            units = {"h": 3600000, "m": 60000, "s": 1000, "ms": 1}
            return sum(int(number) * units[unit] for number, unit in re.findall(r"([0-9]+)(ms|h|m|s)", text))

        def _http_route_timeouts(environment):
            configured = (environment.get("httpRoute") or {}).get("timeouts")
            if configured is None:
                configured = {}
            if not isinstance(configured, dict):
                raise ValueError("httpRoute.timeouts must contain request and backendRequest durations.")
            request_timeout = _safe_str(configured.get("request", "3600s"))
            timeouts = {"request": request_timeout,
                        "backendRequest": _safe_str(configured.get("backendRequest", request_timeout))}
            request, backend = (
                _duration_milliseconds(timeouts[key], f"httpRoute.timeouts.{key}")
                for key in ("request", "backendRequest")
            )
            if request and backend > request:
                raise ValueError("httpRoute.timeouts.backendRequest must not exceed request; use request: 0s for no request timeout.")
            return timeouts

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        from crossplane.function import response
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            data = (environment.get("defaults") or {}).get("data") or {}
            data_enabled = data.get("enabled")
            if data_enabled is None:
                data_enabled = True
            data_enabled = _boolish(data_enabled)
            registry_enabled = _boolish(((environment.get("defaults") or {}).get("registry") or {}).get("enabled", True))
            if not (data_enabled or registry_enabled):
                return

            iam = environment.get("iam") or {}
            ingress = environment.get("ingress") or {}
            http_route = environment.get("httpRoute") or {}
            ingress_enabled = _boolish(ingress.get("enabled"))
            route_enabled = _boolish(http_route.get("enabled"))
            s3_enabled = _boolish(http_route.get("enableS3"))
            try:
                if route_enabled:
                    _http_route_timeouts(environment)
                if data_enabled:
                    _duration_milliseconds(
                        (environment.get("oauth2Proxy") or {}).get("upstreamTimeout", "3600s"),
                        "oauth2Proxy.upstreamTimeout",
                    )
            except ValueError as error:
                response.fatal(rsp, str(error))
                return
            if ingress_enabled and route_enabled:
                response.fatal(
                    rsp,
                    "Enable only one of EnvironmentConfig data.ingress.enabled and data.httpRoute.enabled.",
                )
                return
            if data_enabled and s3_enabled and not route_enabled:
                response.fatal(
                    rsp,
                    "EnvironmentConfig data.httpRoute.enableS3 requires data.httpRoute.enabled.",
                )
                return
            if not (ingress_enabled or route_enabled):
                return

            required = {"ingress.domain": ingress.get("domain")}
            if data_enabled:
                required.update({"iam.issuerURL": iam.get("issuerURL"), "iam.internalURL": iam.get("internalURL")})
            if route_enabled:
                required.update(
                    {
                        f"httpRoute.{key}": http_route.get(key)
                        for key in (
                            "parentName",
                            "parentNamespace",
                            "sectionName",
                        )
                    }
                )
                if data_enabled:
                    required["httpRoute.httpSectionName"] = http_route.get("httpSectionName")
            else:
                required.update(
                    {
                        "ingress.class": ingress.get("class"),
                        "ingress.secret": ingress.get("secret"),
                    }
                )
            missing = [name for name, value in required.items() if not _safe_str(value)]
            if missing:
                response.fatal(
                    rsp,
                    "EnvironmentConfig enables public services but is missing: "
                    + ", ".join(missing)
                    + ".",
                )
  - step: observe-connection-secrets
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import base64

        import hashlib

        import json

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _boolish(value):
            if isinstance(value, bool):
                return value
            return str(value).lower() in ("true", "1", "yes", "on")

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_manifest(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return manifest or raw_manifest

        def _extract_data(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return (
                manifest.get("data")
                or manifest.get("stringData")
                or raw_manifest.get("data")
                or raw_manifest.get("stringData")
                or {}
            )

        def _b64get_any(data, keys):
            if not data:
                return None
            for key in keys:
                value = data.get(key)
                if value is None:
                    continue
                try:
                    return base64.b64decode(value, validate=True).decode("utf-8")
                except Exception:
                    return str(value)
            return None

        def _resource_name(*parts, limit=63):
            name = "-".join(parts)
            if len(name) <= limit and (
                len(parts) == 1 or all("-" not in part for part in parts)
            ):
                return name
            # Keep component boundaries distinct when instance and profile names have hyphens.
            digest = hashlib.sha256(json.dumps(parts).encode()).hexdigest()[:10]
            return name[: limit - 11].rstrip("-") + "-" + digest

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import base64
        from collections import Counter

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}
            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            observed = getattr(req.observed, "resources", {}) or {}
            environment_manifest = _extract_manifest(
                observed.get(f"workshopenvironment-{xr_name}")
            )
            educates_status = (environment_manifest.get("status") or {}).get("educates") or {}
            runtime_namespace = _safe_str(educates_status.get("namespace"))
            workshop_namespace = _safe_str(educates_status.get("namespace") or xr_name)
            status = _to_dict(rsp.desired.composite.resource).get("status") or xr.get("status") or {}
            connections = []

            def observe(key, secret_name, secret_namespace, kind=None, instance=None):
                rsp.desired.resources[key].resource.update(
                    _render_template(
                        req,
                        "secrets/observer",
                        key=key,
                        xr_namespace=xr_namespace,
                        secret_name=secret_name,
                        secret_namespace=secret_namespace,
                    )
                )
                if kind == "custom":
                    rsp.desired.resources[key].ready = fnv1.READY_TRUE
                if kind and (kind in ("s3", "custom") or educates_status.get("namespace")):
                    source = observed.get(key)
                    body = _to_dict(source.resource) if source else {}
                    conditions = (body.get("status") or {}).get("conditions") or []
                    source_meta = _extract_manifest(source).get("metadata") or {}
                    present = (
                        source_meta.get("name") == secret_name
                        and source_meta.get("namespace") == secret_namespace
                        and not source_meta.get("deletionTimestamp")
                        and not body.get("metadata", {}).get("deletionTimestamp")
                    )
                    if kind == "s3" and not present:
                        return
                    connection = {
                        "name": instance,
                        "type": kind,
                        "secretRef": {"name": secret_name, "namespace": secret_namespace},
                        "ready": (
                            present
                            and any(c.get("type") == "Ready" and c.get("status") == "True" for c in conditions)
                            and not any(c.get("type") == "Synced" and c.get("status") == "False" for c in conditions)
                        ),
                    }
                    if kind in ("postgres", "mongo", "redis", "registry", "custom"):
                        connection = publish_connection(connection, source, present)
                        if kind == "custom" and connection is None:
                            return
                    if kind == "s3":
                        data = _extract_data(source)
                        for field, secret_key in (
                            ("endpoint", "AWS_ENDPOINT_URL"),
                            ("region", "AWS_REGION"),
                        ):
                            value = _b64get_any(data, [secret_key]) or storage_config.get(field)
                            if value:
                                connection[field] = value
                    if kind == "registry":
                        ingress, gateway = environment.get("ingress") or {}, environment.get("httpRoute") or {}
                        public = _boolish(ingress.get("enabled")) or _boolish(gateway.get("enabled"))
                        connection["endpoint"] = (
                            f"https://{xr_name}.{ingress.get('domain', 'default')}/v2/" if public
                            else f"http://registry.{workshop_namespace}.svc:5000/v2/"
                        )
                        keys = [f"registry-deployment-{xr_name}"]
                        if _boolish(gateway.get("enabled")):
                            keys.append(f"registry-route-{xr_name}")
                        elif public:
                            keys.append(f"registry-ingress-{xr_name}")
                        connection["ready"] = connection["ready"] and all(
                            source_ready(_to_dict(observed[key].resource)) if key in observed else False
                            for key in keys
                        )
                    connections.append(connection)

            def publish_connection(connection, source, present):
                kind, instance = connection["type"], connection["name"]
                secret_name = _resource_name(xr_name, kind, instance, "connection")
                key = _resource_name("connection", secret_name)
                source_manifest = _extract_manifest(source)
                data = dict(source_manifest.get("data") or {})
                data.update({name: base64.b64encode(value.encode()).decode()
                             for name, value in (source_manifest.get("stringData") or {}).items()})
                required = {
                    "postgres": ("host", "port", "user", "password", "dbname", "uri"),
                    "mongo": ("user", "password"),
                    "redis": ("user", "password"),
                    "registry": ("user", "password"),
                }.get(kind, ())
                if kind != "custom":
                    data = {name: value for name, value in data.items() if name in required}
                available = (present and connection["ready"] and bool(data)
                             and all(data.get(name) for name in required))
                if kind == "custom" and not available:
                    return None
                connection["secretRef"] = {"name": secret_name, "namespace": xr_namespace}
                connection["ready"] = False
                if available:
                    secret_type = (source_manifest.get("type") or "Opaque") if kind == "custom" else "Opaque"
                    # Token copies must not attach to another namespace's account controller.
                    if secret_type in ("kubernetes.io/service-account-token", "bootstrap.kubernetes.io/token"):
                        secret_type = "Opaque"
                    secret = _render_template(
                        req, "secrets/connection", key=key, name=xr_name,
                        namespace=xr_namespace, secret_name=secret_name,
                        connection_name=_resource_name(kind, instance), values=data,
                    )
                    secret["type"] = secret_type
                    rsp.desired.resources[key].resource.update(secret)
                    published = observed.get(key)
                    body = _to_dict(published.resource) if published else {}
                    # Native Secrets have no Ready condition. Compare their actual data.
                    connection["ready"] = (
                        body.get("apiVersion") == "v1" and body.get("kind") == "Secret"
                        and body.get("metadata", {}).get("name") == secret_name
                        and body.get("metadata", {}).get("namespace") == xr_namespace
                        and not body.get("metadata", {}).get("deletionTimestamp")
                        and body.get("type") == secret_type and body.get("data") == data
                    )
                    rsp.desired.resources[key].ready = (
                        fnv1.READY_TRUE if connection["ready"] else fnv1.READY_FALSE
                    )
                return connection

            storage_config = environment.get("storage") or {}
            observe(
                f"observe-storage-secret-{xr_name}",
                xr_name,
                storage_config.get("secretNamespace") or xr_namespace,
                kind="s3",
                instance="primary",
            )
            observe(
                f"observe-oauth-client-secret-{xr_name}",
                f"{xr_name}-oauth-client",
                xr_namespace,
            )
            status["oauth2"] = []
            client = observed.get(f"keycloak-client-{xr_name}")
            client_body = _to_dict(client.resource) if client else {}
            oauth_source = observed.get(f"observe-oauth-client-secret-{xr_name}")
            oauth_body = _to_dict(oauth_source.resource) if oauth_source else {}
            oauth_meta = _extract_manifest(oauth_source).get("metadata") or {}
            oauth_data = _extract_data(oauth_source)
            credential_id = _b64get_any(oauth_data, ["clientID", "client_id", "attribute.client_id"])
            client_id = _safe_str(
                (client_body.get("status", {}).get("atProvider") or {}).get("clientId")
                or (client_body.get("spec", {}).get("forProvider") or {}).get("clientId")
                or credential_id
            )
            issuer = _safe_str((environment.get("iam") or {}).get("issuerURL")).rstrip("/")
            # A missing Secret can leave its last manifest in the observer status.
            source_missing = any(
                c.get("type") == "Synced" and c.get("status") == "False"
                and "external resource does not exist" in c.get("message", "")
                for c in (oauth_body.get("status") or {}).get("conditions") or []
            )

            def source_ready(body):
                conditions = (body.get("status") or {}).get("conditions") or []
                return (
                    any(c.get("type") == "Ready" and c.get("status") == "True" for c in conditions)
                    and not any(c.get("type") == "Synced" and c.get("status") == "False" for c in conditions)
                )

            if (
                client_body and client_id and issuer
                and not client_body.get("metadata", {}).get("deletionTimestamp")
                and oauth_meta.get("name") == f"{xr_name}-oauth-client"
                and oauth_meta.get("namespace") == xr_namespace
                and not oauth_meta.get("deletionTimestamp")
                and not oauth_body.get("metadata", {}).get("deletionTimestamp")
                and not source_missing
            ):
                status["oauth2"].append({
                    "name": client_id,
                    "type": "client",
                    "issuerUrl": issuer,
                    "secretRef": {"name": f"{xr_name}-oauth-client", "namespace": xr_namespace},
                    "ready": bool(
                        source_ready(client_body) and source_ready(oauth_body)
                        and _b64get_any(oauth_data, ["clientSecret", "client_secret", "attribute.client_secret"])
                        and (not credential_id or credential_id == client_id)
                    ),
                })

            custom_secrets = environment.get("customSecrets") or []
            custom_names = Counter(custom["name"] for custom in custom_secrets)
            for custom in custom_secrets:
                secret_name = custom["name"]
                secret_namespace = custom.get("namespace") or runtime_namespace
                if not secret_namespace or custom_names[secret_name] != 1:
                    continue
                observe(
                    _resource_name("observe-custom-secret", xr_name, secret_namespace, secret_name),
                    secret_name,
                    secret_namespace,
                    kind="custom",
                    instance=secret_name,
                )

            postgres_clusters = spec.get("databases")
            if isinstance(postgres_clusters, dict):
                for name in sorted(postgres_clusters):
                    if isinstance(name, str) and name.strip():
                        cluster_name = name.strip()
                        observe(
                            f"observe-database-secret-{xr_name}-{cluster_name}",
                            f"{cluster_name}-pguser-postgres",
                            workshop_namespace,
                            kind="postgres",
                            instance=cluster_name,
                        )

            for field, backend in (
                ("documentStores", "mongodb"),
                ("cacheStores", "redis"),
            ):
                stores = spec.get(field) or {}
                if isinstance(stores, dict):
                    for name in sorted(stores):
                        if isinstance(name, str) and name.strip():
                            store_name = name.strip()
                            observe(
                                f"observe-{backend}-auth-secret-{xr_name}-{store_name}",
                                f"{store_name}-{backend}-auth",
                                workshop_namespace,
                                kind="mongo" if backend == "mongodb" else "redis",
                                instance=store_name,
                            )

            registry_enabled = _boolish(((environment.get("defaults") or {}).get("registry") or {}).get("enabled", True))
            if registry_enabled:
                observe(f"observe-registry-auth-secret-{xr_name}", "registry-auth", workshop_namespace,
                        kind="registry", instance="primary")

            data_config = (environment.get("defaults") or {}).get("data") or {}
            data_enabled = data_config.get("enabled")
            if data_enabled is None:
                data_enabled = True
            if (_boolish(data_enabled) or registry_enabled) and runtime_namespace:
                observe(
                    f"observe-runtime-storage-secret-{xr_name}",
                    f"{xr_name}-datalab",
                    runtime_namespace,
                )
            status["connections"] = connections + [
                item for item in status.get("connections", []) if item.get("type") == "vcluster"
            ]
            rsp.desired.composite.resource.update({"status": status})
      templates:
        secrets/connection:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${secret_name}
            namespace: ${namespace}
            labels:
              datalabs.pkg.internal/name: ${name}
              datalabs.pkg.internal/connection: ${connection_name}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          type: Opaque
          data: ${values}
        secrets/observer:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            managementPolicies:
            - Observe
            forProvider:
              manifest:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: ${secret_name}
                  namespace: ${secret_namespace}
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            watch: true
  - step: update-datalab-secret
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import base64

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _string_value(value):
            """Keep the literal string for null values in existing resource settings."""
            return str(value).strip()

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_manifest(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return manifest or raw_manifest

        def _extract_data(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return (
                manifest.get("data")
                or manifest.get("stringData")
                or raw_manifest.get("data")
                or raw_manifest.get("stringData")
                or {}
            )

        def _b64get_any(data, keys):
            if not data:
                return None
            for key in keys:
                value = data.get(key)
                if value is None:
                    continue
                try:
                    return base64.b64decode(value, validate=True).decode("utf-8")
                except Exception:
                    return str(value)
            return None

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import re
        from urllib.parse import urlsplit, urlunsplit

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def _store_key(prefix, store_name, suffix):
            clean = re.sub(r"[^A-Za-z0-9]", "_", str(store_name)).upper()
            return f"{prefix}_{clean}_{suffix}"


        def _pg_db_key(host_name, db_name, suffix):
            return _store_key("POSTGRES", f"{host_name}_{db_name}", suffix)


        def _uri_with_database(uri, db_name):
            if not uri:
                return ""
            parts = urlsplit(uri)
            return urlunsplit(
                (parts.scheme, parts.netloc, f"/{db_name}", parts.query, parts.fragment)
            )


        def _external_pg_url(internal_url, external_host):
            if not internal_url or not external_host:
                return ""
            external_url = re.sub(r"@[^/]+", f"@{external_host}", internal_url)
            if "sslmode=" not in external_url:
                external_url += (
                    "&sslmode=require" if "?" in external_url else "?sslmode=require"
                )
            if "sslnegotiation=" not in external_url:
                external_url += (
                    "&sslnegotiation=direct"
                    if "?" in external_url
                    else "?sslnegotiation=direct"
                )
            return external_url


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            storage_env = environment.get("storage") or {}
            observed = getattr(req.observed, "resources", {}) or {}

            environment_manifest = _extract_manifest(
                observed.get(f"workshopenvironment-{xr_name}")
            )
            educates_status = (environment_manifest.get("status") or {}).get("educates") or {}
            workshop_namespace = _string_value(educates_status.get("namespace") or xr_name)

            obs = observed.get(f"observe-storage-secret-{xr_name}")
            data_b64 = _extract_data(obs)

            access_key = _b64get_any(
                data_b64,
                [
                    "AWS_ACCESS_KEY_ID",
                    "accessKey",
                    "username",
                    "CONSOLE_ACCESS_KEY",
                    "attribute.access",
                ],
            )
            secret_key = _b64get_any(
                data_b64,
                [
                    "AWS_SECRET_ACCESS_KEY",
                    "secretKey",
                    "password",
                    "CONSOLE_SECRET_KEY",
                    "attribute.secret",
                ],
            )
            session_token = _b64get_any(data_b64, ["AWS_SESSION_TOKEN", "sessionToken"])
            endpoint = _b64get_any(data_b64, ["AWS_ENDPOINT_URL"]) or storage_env.get(
                "endpoint", ""
            )
            region = _b64get_any(data_b64, ["AWS_REGION"]) or storage_env.get("region", "")
            rtype = storage_env.get("type", "")
            provider = storage_env.get("provider", "")
            force_path_style = str(storage_env.get("forcePathStyle", "true")).lower()

            if not access_key or not secret_key:
                return

            # Build the rclone configuration for the runtime Secret.
            config_data = (
                f"[{access_key}]\n"
                f"type = {rtype}\n"
                f"provider = {provider}\n"
                f"endpoint = {endpoint}\n"
                f"region = {region}\n"
                f"access_key_id = {access_key}\n"
                f"secret_access_key = {secret_key}\n"
                f"force_path_style = {force_path_style}\n"
            )

            manifest = _render_template(
                req,
                "datalab-secret/manifest",
                metadata_name=f"{xr_name}-datalab",
                xr_namespace=xr_namespace,
                access_key=access_key,
                config_data=config_data,
                secret_key=secret_key,
                region=region,
                endpoint=endpoint,
                force_path_style=force_path_style,
            )

            if session_token:
                manifest["stringData"]["AWS_SESSION_TOKEN"] = session_token

            aws_credentials = (
                "[default]\n"
                f"aws_access_key_id = {access_key}\n"
                f"aws_secret_access_key = {secret_key}\n"
            )
            if session_token:
                aws_credentials += f"aws_session_token = {session_token}\n"
            manifest["stringData"]["aws-credentials"] = aws_credentials

            oauth_data = _extract_data(observed.get(f"observe-oauth-client-secret-{xr_name}"))
            client_secret = _b64get_any(
                oauth_data, ["clientSecret", "client_secret", "attribute.client_secret"]
            )
            if client_secret:
                manifest["stringData"]["OAUTH2_CLIENT_ID"] = (
                    _b64get_any(oauth_data, ["clientID", "client_id", "attribute.client_id"])
                    or xr_name
                )
                manifest["stringData"]["OAUTH2_CLIENT_SECRET"] = client_secret

            doc_stores = spec.get("documentStores") or {}
            if isinstance(doc_stores, dict):
                for store_name in sorted(doc_stores.keys()):
                    if not isinstance(store_name, str) or not store_name.strip():
                        continue
                    store = store_name.strip()
                    host = f"mongodb-{store}-svc.{workshop_namespace}.svc"
                    user = f"{store}-app"
                    manifest["stringData"][_store_key("MONGO", store, "HOST")] = host
                    manifest["stringData"][_store_key("MONGO", store, "PORT")] = "27017"
                    manifest["stringData"][_store_key("MONGO", store, "DATABASE")] = store
                    manifest["stringData"][_store_key("MONGO", store, "AUTH_SOURCE")] = "admin"
                    manifest["stringData"][_store_key("MONGO", store, "USER")] = user
                    auth_data = _extract_data(
                        observed.get(f"observe-mongodb-auth-secret-{xr_name}-{store}")
                    )
                    pwd = _b64get_any(auth_data, ["password"])
                    if pwd:
                        manifest["stringData"][_store_key("MONGO", store, "PASSWORD")] = pwd
                        manifest["stringData"][_store_key("MONGO", store, "URI")] = (
                            f"mongodb://{user}:{pwd}@{host}:27017/{store}?authSource=admin"
                        )

            cache_stores = spec.get("cacheStores") or {}
            if isinstance(cache_stores, dict):
                for store_name in sorted(cache_stores.keys()):
                    if not isinstance(store_name, str) or not store_name.strip():
                        continue
                    store = store_name.strip()
                    host = f"{store}.{workshop_namespace}.svc"
                    manifest["stringData"][_store_key("REDIS", store, "HOST")] = host
                    manifest["stringData"][_store_key("REDIS", store, "PORT")] = "6379"
                    manifest["stringData"][_store_key("REDIS", store, "USER")] = "default"
                    manifest["stringData"][_store_key("REDIS", store, "DATABASE")] = "0"
                    auth_data = _extract_data(
                        observed.get(f"observe-redis-auth-secret-{xr_name}-{store}")
                    )
                    pwd = _b64get_any(auth_data, ["password"])
                    if pwd:
                        manifest["stringData"][_store_key("REDIS", store, "PASSWORD")] = pwd
                        manifest["stringData"][_store_key("REDIS", store, "URL")] = (
                            f"redis://default:{pwd}@{host}:6379/0"
                        )

            db_hosts = spec.get("databases") or {}
            if isinstance(db_hosts, dict):
                db_env = environment.get("database") or {}
                gateway_env = db_env.get("tlsRoute") or {}

                gateway_parent_name = _string_value(gateway_env.get("parentName") or "")
                gateway_parent_ns = _string_value(gateway_env.get("parentNamespace") or "")
                gateway_section = _string_value(gateway_env.get("sectionName") or "")
                has_gateway_parent = bool(
                    gateway_parent_name and gateway_parent_ns and gateway_section
                )

                ingress_env = environment.get("ingress") or {}
                ingress_domain = ingress_env.get("domain", "default")

                for host_key in sorted(list(db_hosts.keys())):
                    if not isinstance(host_key, str) or not host_key.strip():
                        continue
                    host_cfg = db_hosts.get(host_key) or {}
                    if not isinstance(host_cfg, dict):
                        continue

                    cluster_name = host_key.strip()
                    dbnames = [
                        _string_value(x)
                        for x in list(host_cfg.get("names") or [])
                        if _string_value(x)
                    ]
                    if not dbnames:
                        continue

                    host_obs = observed.get(f"observe-database-secret-{xr_name}-{cluster_name}")
                    host_data_b64 = _extract_data(host_obs)

                    host = (
                        _b64get_any(host_data_b64, ["host"])
                        or f"{cluster_name}-primary.{workshop_namespace}.svc"
                    )
                    port = _b64get_any(host_data_b64, ["port"]) or "5432"
                    user = _b64get_any(host_data_b64, ["user"]) or "postgres"
                    password = _b64get_any(host_data_b64, ["password"]) or ""
                    internal_url = _b64get_any(host_data_b64, ["uri"]) or ""

                    manifest["stringData"][_store_key("POSTGRES", cluster_name, "HOST")] = host
                    manifest["stringData"][_store_key("POSTGRES", cluster_name, "PORT")] = port
                    manifest["stringData"][_store_key("POSTGRES", cluster_name, "USER")] = user
                    manifest["stringData"][_store_key("POSTGRES", cluster_name, "PASSWORD")] = (
                        password
                    )
                    manifest["stringData"][
                        _store_key("POSTGRES", cluster_name, "DATABASES")
                    ] = ",".join(dbnames)

                    host_ext = ""
                    if has_gateway_parent:
                        host_ext = f"{cluster_name}-{workshop_namespace}.{ingress_domain}:443"
                        manifest["stringData"][
                            _store_key("POSTGRES", cluster_name, "HOST_EXTERNAL")
                        ] = host_ext.split(":")[0]

                    for dbname in dbnames:
                        db_url = _uri_with_database(internal_url, dbname)
                        if not db_url and password:
                            db_url = f"postgresql://{user}:{password}@{host}:{port}/{dbname}"
                        if db_url:
                            manifest["stringData"][_pg_db_key(cluster_name, dbname, "URL")] = (
                                db_url
                            )
                        if host_ext and db_url:
                            manifest["stringData"][
                                _pg_db_key(cluster_name, dbname, "URL_EXTERNAL")
                            ] = _external_pg_url(db_url, host_ext)

            key = f"secret-{xr_name}-datalab"
            rsp.desired.resources[key].resource.update(manifest)
            rsp.desired.resources[key].ready = fnv1.READY_TRUE
      templates:
        datalab-secret/manifest:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${metadata_name}
            namespace: ${xr_namespace}
          type: Opaque
          stringData:
            remote: ${access_key}
            remotePath: /
            configData: ${config_data}
            AWS_ACCESS_KEY_ID: ${access_key}
            AWS_SECRET_ACCESS_KEY: ${secret_key}
            AWS_REGION: ${region}
            AWS_ENDPOINT_URL: ${endpoint}
            AWS_S3_FORCE_PATH_STYLE: ${force_path_style}
  - step: update-keycloak-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import hashlib

        import json

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        def _string_value(value):
            """Keep the literal string for null values in existing resource settings."""
            return str(value).strip()

        def _session_name(session, *, stringify_none=False):
            if isinstance(session, dict):
                return _safe_str(session.get("name") or "")
            return _string_value(session) if stringify_none else _safe_str(session)

        def _resource_name(*parts, limit=63):
            name = "-".join(parts)
            if len(name) <= limit and (
                len(parts) == 1 or all("-" not in part for part in parts)
            ):
                return name
            # Keep component boundaries distinct when instance and profile names have hyphens.
            digest = hashlib.sha256(json.dumps(parts).encode()).hexdigest()[:10]
            return name[: limit - 11].rstrip("-") + "-" + digest

        def _vcluster_profile(name, instance, group):
            return _resource_name(name, "vcluster", instance, group, limit=55)

        def _vcluster_role(instance, group):
            return f"vcluster_{instance}_{group}"

        def _vcluster_groups(config):
            groups = {group["name"]: group for group in config.get("groups") or []}
            groups["cluster-admin"] = {
                "name": "cluster-admin", "namespace": "*", "role": "cluster-admin"
            }
            return [groups[name] for name in sorted(groups)]

        def _vcluster_exchange_groups(config):
            groups = {
                group["name"]: group for group in config.get("groups") or []
                if group["name"] != "cluster-admin"
            }
            return [groups[name] for name in sorted(groups)]

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import json

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def _distinct(seq):
            return list(dict.fromkeys(seq))


        def _workspace_redirect_uris(xr_name, domain, session_names):
            uris = [f"https://{xr_name}.{domain}/*"]
            for sid in session_names:
                session_host = f"{xr_name}-{sid}"
                uris.extend(
                    [
                        f"https://{session_host}.{domain}/*",
                        f"https://editor-{session_host}.{domain}/*",
                        f"https://{session_host}-editor.{domain}/*",
                        f"https://data-{session_host}.{domain}/*",
                        f"https://{session_host}-data.{domain}/*",
                    ]
                )
            uris.append("http://localhost:*")
            return _distinct(uris)


        def _security_ready(req, resources):
            def contains(actual, expected):
                if isinstance(expected, dict):
                    return isinstance(actual, dict) and all(
                        key in actual and contains(actual[key], value)
                        for key, value in expected.items()
                    )
                if isinstance(expected, list):
                    return isinstance(actual, list) and len(actual) == len(expected) and all(
                        any(contains(item, value) for item in actual) for value in expected
                    )
                return actual == expected

            for key, desired in resources.items():
                observed = req.observed.resources.get(key)
                state = _to_dict(observed.resource) if observed else {}
                conditions = {
                    condition.get("type"): condition.get("status")
                    for condition in (state.get("status") or {}).get("conditions") or []
                }
                required_conditions = ("Ready",) if desired["kind"] == "Usage" else ("Ready", "Synced")
                if (state.get("metadata") or {}).get("deletionTimestamp") or any(
                    conditions.get(name) != "True" for name in required_conditions
                ) or not contains(state.get("spec") or {}, desired["spec"]):
                    return False
            return True


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            iam_env = environment.get("iam") or {}
            ingress_env = environment.get("ingress") or {}
            realm = iam_env.get("realm", "default")
            extra_audiences_raw = iam_env.get("extraAudiences")
            if isinstance(extra_audiences_raw, str):
                extra_audiences_raw = [extra_audiences_raw]
            elif not isinstance(extra_audiences_raw, list):
                extra_audiences_raw = []
            extra_audiences = _distinct([
                xr_name,
                *[_safe_str(audience) for audience in extra_audiences_raw if _safe_str(audience)],
            ])
            domain = ingress_env.get("domain", "default")
            url = f"https://{xr_name}.{domain}"
            session_names = [
                _session_name(session)
                for session in (spec.get("sessions") or [])
                if _session_name(session)
            ]
            redirect_uris = _workspace_redirect_uris(xr_name, domain, session_names)

            security_resources = {}
            security_kinds = {
                "ClientScope", "ClientDefaultScopes", "ClientOptionalScopes",
                "RoleMapper", "ProtocolMapper", "ClientPolicyProfile", "ClientPolicyProfilePolicy", "Usage",
            }

            def put(key_base, body_base, name_override=xr_name):
                key = f"{key_base}-{name_override}"
                body = body_base.copy()
                md = body.setdefault("metadata", {})
                md.setdefault("name", name_override)
                md.setdefault("namespace", xr_namespace)
                ann = md.setdefault("annotations", {})
                ann["crossplane.io/composition-resource-name"] = key
                rsp.desired.resources[key].resource.update(body)
                if body["kind"] in security_kinds:
                    security_resources[key] = body

            put(
                "keycloak-group",
                _render_template(
                    req,
                    "keycloak/users-group",
                    xr_name=xr_name,
                    realm=realm,
                ),
            )

            put(
                "keycloak-group-admin",
                _render_template(
                    req,
                    "keycloak/admins-group",
                    display_name=f"{xr_name}-admin",
                    realm=realm,
                ),
                f"{xr_name}-admin",
            )

            put(
                "keycloak-mapper",
                _render_template(
                    req,
                    "keycloak/group-membership-mapper",
                    xr_name=xr_name,
                    realm=realm,
                ),
            )

            put(
                "keycloak-client",
                _render_template(
                    req,
                    "keycloak/client",
                    xr_name=xr_name,
                    url=url,
                    redirect_uris=redirect_uris,
                    realm=realm,
                    connection_secret_name=f"{xr_name}-oauth-client",
                    exchange_enabled=False,
                ),
            )

            put(
                "keycloak-role-user",
                _render_template(
                    req,
                    "keycloak/access-role",
                    xr_name=xr_name,
                    realm=realm,
                ),
                f"{xr_name}-ws-access",
            )

            put(
                "keycloak-role-admin",
                _render_template(
                    req,
                    "keycloak/admin-role",
                    xr_name=xr_name,
                    realm=realm,
                ),
                f"{xr_name}-ws-admin",
            )

            put(
                "keycloak-role-api",
                _render_template(
                    req,
                    "keycloak/api-role",
                    xr_name=xr_name,
                    realm=realm,
                ),
                f"{xr_name}-ws-api",
            )

            def put_keycloak_role_mapper(key_base, role_name_override, name_override=None):
                put(
                    key_base,
                    _render_template(
                        req,
                        "keycloak/role-scope-mapper",
                        realm=realm,
                        xr_name=xr_name,
                        role_name_override=role_name_override,
                    ),
                    name_override or role_name_override,
                )

            put_keycloak_role_mapper("keycloak-role-mapper-api", f"{xr_name}-ws-api")

            def put_selected_role(resource, role, scope_resource=None):
                # Keycloak includes all client-owned roles. Move only selected held roles
                # into the request's realm role set before the claim mapper runs.
                body = _render_template(
                    req, "keycloak/selected-role-mapper", realm=realm,
                    mapper_name=f"selected-{role}", source_role=f"{xr_name}.{role}",
                    role_name=role,
                )
                binding = "clientScopeIdRef" if scope_resource else "clientIdRef"
                body["spec"]["forProvider"][binding] = {
                    "name": scope_resource or xr_name,
                    "policy": {"resolution": "Required", "resolve": "Always"},
                }
                put("keycloak-selected-role", body,
                    _resource_name(scope_resource, resource) if scope_resource else resource)

            put_selected_role(f"{xr_name}-ws-api", "ws_api")

            interactive_scope = f"{xr_name}:interactive"
            interactive_resource = _resource_name(xr_name, "interactive")
            policy_name = _resource_name(xr_name, "reject-interactive-exchange")
            put("keycloak-exchange-policy-profile", _render_template(
                req, "keycloak/exchange-policy-profile", realm=realm, policy_name=policy_name,
            ), policy_name)
            put("keycloak-exchange-policy", _render_template(
                req, "keycloak/exchange-policy", realm=realm, policy_name=policy_name,
                interactive_scopes_json=json.dumps([interactive_scope]),
            ), policy_name)
            for kind, api_version, used_name in (
                ("ClientScope", "openidclient.keycloak.m.crossplane.io/v1alpha1", interactive_resource),
                ("ClientPolicyProfile", "realm.keycloak.m.crossplane.io/v1alpha1", policy_name),
            ):
                put("keycloak-policy-usage", _render_template(
                    req, "keycloak/policy-usage", used_api_version=api_version,
                    used_kind=kind, used_name=used_name, policy_name=policy_name,
                ), _resource_name(xr_name, "exchange-policy-uses", kind.lower()))

            def put_scope(name, resource, roles):
                put("keycloak-optional-scope", _render_template(
                    req, "keycloak/client-scope", realm=realm, scope_name=name,
                ), resource)
                for role, role_name in roles:
                    put("keycloak-optional-role", _render_template(
                        req, "keycloak/optional-role-scope-mapper", realm=realm,
                        scope_resource=resource, role_resource=role,
                    ), _resource_name(resource, role))
                    put_selected_role(role, role_name, resource)

            instances = spec.get("vclusters") or {}
            additional_profiles = [
                (instance, group["name"])
                for instance, config in sorted(instances.items())
                for group in _vcluster_exchange_groups(config)
            ]
            additional_roles = [
                _vcluster_profile(xr_name, instance, group)
                for instance, group in additional_profiles
            ]
            admin_roles = [
                _vcluster_profile(xr_name, instance, "cluster-admin")
                for instance in sorted(instances)
            ]
            put_scope(interactive_scope, interactive_resource, [
                (f"{xr_name}-ws-access", "ws_access"),
                (f"{xr_name}-ws-admin", "ws_admin"),
                *[(_vcluster_profile(xr_name, instance, "cluster-admin"),
                   _vcluster_role(instance, "cluster-admin")) for instance in sorted(instances)],
            ])
            optional_scopes = [interactive_scope]
            for (instance, group), role in zip(additional_profiles, additional_roles):
                scope = f"{xr_name}:vclusters_{instance}_{group}"
                put_scope(scope, _resource_name(role, "scope"), [(role, _vcluster_role(instance, group))])
                optional_scopes.append(scope)

            for kind, field, names in (
                ("ClientDefaultScopes", "defaultScopes", ["basic", "profile", "email"]),
                ("ClientOptionalScopes", "optionalScopes", optional_scopes),
            ):
                put(f"keycloak-{field}", _render_template(
                    req, "keycloak/client-scopes", scope_kind=kind,
                    scope_binding={
                        "realmId": realm,
                        "clientIdRef": {"name": xr_name, "policy": {"resolution": "Required"}},
                        field: names,
                    },
                ))
            claim_client = xr_name.replace(".", "\\.")
            # A separate Kubernetes name keeps the old broad mapper in the deletion gate.
            put("keycloak-selected-roles", _render_template(
                req, "keycloak/selected-roles-mapper", realm=realm, xr_name=xr_name,
                mapper_resource=_resource_name(xr_name, "selected-roles"),
                claim_name=f"resource_access.{claim_client}.roles",
            ))

            for audience in extra_audiences:
                audience_name = (
                    "".join(
                        [char.lower() if char.isalnum() else "-" for char in audience]
                    ).strip("-")
                    or "extra"
                )
                audience_name = (
                    "-".join([part for part in audience_name.split("-") if part])[:48].strip(
                        "-"
                    )
                    or "extra"
                )
                key_base = f"keycloak-extra-audience-{audience_name}"
                put(
                    key_base,
                    _render_template(
                        req,
                        "keycloak/audience-mapper",
                        realm=realm,
                        xr_name=xr_name,
                        display_name=f"{audience_name}-audience",
                        audience=audience,
                    ),
                    f"{xr_name}-{audience_name}-audience",
                )

            put(
                "keycloak-roles-user",
                _render_template(
                    req,
                    "keycloak/user-group-roles",
                    realm=realm,
                    xr_name=xr_name,
                    role_refs=[
                        {"name": role, "policy": {"resolution": "Required", "resolve": "Always"}}
                        for role in [
                            f"{xr_name}-ws-access",
                            f"{xr_name}-ws-api",
                            *additional_roles,
                        ]
                    ],
                ),
            )

            put(
                "keycloak-roles-admin",
                _render_template(
                    req,
                    "keycloak/admin-group-roles",
                    realm=realm,
                    group_name=f"{xr_name}-admin",
                    role_refs=[
                        {"name": role, "policy": {"resolution": "Required", "resolve": "Always"}}
                        for role in [f"{xr_name}-ws-admin", f"{xr_name}-ws-api", *admin_roles, *additional_roles]
                    ],
                ),
                f"{xr_name}-admin",
            )

            # Keep the resolved identity in desired state. Multiple provider
            # reference updates can otherwise remove an earlier resolved field.
            observed_client = (getattr(req.observed, "resources", {}) or {}).get(
                f"keycloak-client-{xr_name}"
            )
            client_state = _to_dict(observed_client.resource) if observed_client else {}
            client_identity = (client_state.get("status") or {}).get("atProvider") or {}
            service_account_inputs = {}
            if _safe_str(client_identity.get("id")) and _safe_str(
                client_identity.get("serviceAccountUserId")
            ):
                service_account_inputs = {
                    "clientId": client_identity["id"],
                    "serviceAccountUserId": client_identity["serviceAccountUserId"],
                    "role": "ws_api",
                }

            put(
                "keycloak-service-account-role-api",
                _render_template(
                    req,
                    "keycloak/service-account-role",
                    role_binding={
                        "realmId": realm,
                        "clientIdRef": {"name": xr_name, "policy": {"resolution": "Required"}},
                        "roleRef": {
                            "name": f"{xr_name}-ws-api",
                            "policy": {"resolution": "Required"},
                        },
                        "serviceAccountUserClientIdRef": {
                            "name": xr_name,
                            "policy": {"resolution": "Required"},
                        },
                        **service_account_inputs,
                    },
                ),
                f"{xr_name}-ws-api",
            )

            for instance, config in sorted((spec.get("vclusters") or {}).items()):
                for group in _vcluster_groups(config):
                    profile = _vcluster_profile(xr_name, instance, group["name"])
                    role_name = _vcluster_role(instance, group["name"])
                    put(
                        "keycloak-vcluster-role",
                        _render_template(
                            req,
                            "vcluster/identity-role",
                            realm=realm,
                            role_name=role_name,
                            xr_name=xr_name,
                        ),
                        profile,
                    )

            users = list(spec.get("users", []) or [])
            userOverrides = spec.get("userOverrides", {}) or {}

            role_admins = [
                u
                for u in users
                if str(((userOverrides.get(u) or {}).get("role") or "")).strip() == "admin"
            ]

            admins = _distinct((users[0:1] or []) + role_admins)

            # The provider rejects an empty member list. Delete its membership resource to clear the group.
            if users:
                put(
                    "keycloak-memberships-users",
                    _render_template(
                        req,
                        "keycloak/user-memberships",
                        xr_name=xr_name,
                        realm=realm,
                        users=users,
                    ),
                )

            if admins:
                put(
                    "keycloak-memberships-admins",
                    _render_template(
                        req,
                        "keycloak/admin-memberships",
                        group_name=f"{xr_name}-admin",
                        realm=realm,
                        admins=admins,
                    ),
                    f"{xr_name}-admin",
                )

            # Wait for scope restrictions and deletion of old broad mappings before exchange.
            stale_security = any(
                key not in security_resources
                and _to_dict(observed.resource).get("kind") in security_kinds
                and (
                    _to_dict(observed.resource).get("kind") != "Usage"
                    or key.startswith("keycloak-policy-usage-")
                )
                for key, observed in req.observed.resources.items()
            )
            rsp.desired.resources[f"keycloak-client-{xr_name}"].resource["spec"]["forProvider"][
                "standardTokenExchangeEnabled"
            ] = not stale_security and _security_ready(req, security_resources)
