        def _string_value(value):
            """Keep the literal string for null values in existing resource settings."""
            return str(value).strip()

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_manifest(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return manifest or raw_manifest

        def _session_name(session, *, stringify_none=False):
            if isinstance(session, dict):
                return _safe_str(session.get("name") or "")
            return _string_value(session) if stringify_none else _safe_str(session)

        def _session_state(session):
            state = (
                _safe_str(session.get("state") or "started").lower()
                if isinstance(session, dict)
                else "started"
            )
            return {"running": "started", "paused": "stopped"}.get(state, state)

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import hashlib as _hashlib
        import ipaddress as _ipaddress
        import json as _json

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def _string_list(v):
            if not isinstance(v, list):
                return []
            return [_string_value(item) for item in v if _string_value(item)]


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            sessions = [
                _session_name(session, stringify_none=True)
                for session in (spec.get("sessions") or [])
                if _session_name(session, stringify_none=True)
            ]
            started_sessions = [
                _session_name(session, stringify_none=True)
                for session in (spec.get("sessions") or [])
                if _session_name(session, stringify_none=True)
                and _session_state(session) == "started"
            ]
            db_service_names = []
            db_hosts = spec.get("databases") or {}
            if isinstance(db_hosts, dict):
                for host_key in sorted(list(db_hosts.keys())):
                    if not isinstance(host_key, str) or not host_key.strip():
                        continue
                    host_cfg = db_hosts.get(host_key) or {}
                    if not isinstance(host_cfg, dict):
                        continue
                    dbnames = [
                        _string_value(x)
                        for x in list(host_cfg.get("names") or [])
                        if _string_value(x)
                    ]
                    db_storage = _string_value(host_cfg.get("storage") or "")
                    backup_storage = _string_value(host_cfg.get("backupStorage") or "")
                    if dbnames and db_storage and backup_storage:
                        db_service_names.append(f"{host_key.strip()}-primary")

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            defaults = environment.get("defaults") or {}
            vcluster = _boolish((defaults.get("vcluster") or {}).get("enabled", True))
            files = defaults.get("files") or []
            quota = defaults.get("quota") or {}
            overall_quota = defaults.get("overallQuota") or {}

            memory = quota.get("memory") or "2Gi"
            storage = quota.get("storage") or "1Gi"
            budget = quota.get("budget") or "medium"
            overall_storage = _string_value(overall_quota.get("storage") or "100Gi")

            env_security = defaults.get("security") or {}

            policy = env_security.get("policy") or "baseline"

            ka = env_security.get("kubernetesAccess")
            if ka is None:
                ka = True
            kubernetes_access = _boolish(ka)

            role = env_security.get("kubernetesRole") or "edit"

            data_cfg = defaults.get("data") or {}
            data_enabled = data_cfg.get("enabled")
            if data_enabled is None:
                data_enabled = True
            data_enabled = _boolish(data_enabled)

            registry_cfg = defaults.get("registry") or {}
            registry_enabled = registry_cfg.get("enabled")
            if registry_enabled is None:
                registry_enabled = True
            registry_enabled = _boolish(registry_enabled)
            registry_storage = str(registry_cfg.get("storage") or "5Gi")

            persistence_cfg = defaults.get("persistence") or {}
            requested_storage_class = _string_value(
                persistence_cfg.get("storageClassName") or ""
            )

            ingress_env = environment.get("ingress") or {}
            storage_classes_env = environment.get("storageClasses") or {}
            allowed_storage_classes = [
                _string_value(sc)
                for sc in (storage_classes_env.get("allowed") or [])
                if _string_value(sc)
            ]
            packages = environment.get("packages") or []

            ingress_class = ingress_env.get("class", "")
            ingress_domain = ingress_env.get("domain", "default")
            ingress_secret = ingress_env.get("secret", "wildcard-tls")
            permanent_access = _boolish(ingress_env.get("enabled")) or _boolish(
                (environment.get("httpRoute") or {}).get("enabled")
            )

            storage_secret_name = f"{xr_name}-datalab"
            persistent_storage_class = ""
            if allowed_storage_classes:
                persistent_storage_class = (
                    requested_storage_class
                    if requested_storage_class in allowed_storage_classes
                    else allowed_storage_classes[0]
                )
            else:
                persistent_storage_class = requested_storage_class

            external_egress = env_security.get("externalEgress")
            if external_egress is None:
                external_egress = True
            external_egress = _boolish(external_egress)

            network_env = environment.get("network") or {}
            excluded_network_policies = set(
                _string_list(network_env.get("excludePolicies") or [])
            )
            blacklist_ips = _string_list(network_env.get("blacklistIPs") or [])
            external_egress_cidrs = _string_list(network_env.get("externalEgressCIDRs") or [])
            internal_egress = network_env.get("internalEgress", [])
            internal_ingress = network_env.get("internalIngress", [])
            internal_cidrs = _string_list(network_env.get("podCIDRs") or [])
            service_cidr = _string_value(network_env.get("serviceCIDR") or "")
            if service_cidr:
                internal_cidrs.append(service_cidr)

            def _dedupe(items):
                result = []
                for item in items:
                    if item not in result:
                        result.append(item)
                return result

            external_egress_exceptions = _dedupe(blacklist_ips + internal_cidrs)

            def _policy_enabled(name):
                return name not in excluded_network_policies

            def _network_policy(name, rules, direction="egress", pod_selector=None):
                return _render_template(
                    req,
                    "educates/network-policy",
                    name=name,
                    spec={
                        "podSelector": pod_selector or {},
                        "policyTypes": [direction.capitalize()],
                        direction: rules,
                    },
                )

            def _cidr_contains(cidr, child):
                try:
                    parent = _ipaddress.ip_network(cidr, strict=False)
                    candidate = _ipaddress.ip_network(child, strict=False)
                except Exception:
                    return False
                return parent.version == candidate.version and candidate.subnet_of(parent)

            def _exceptions_for(cidr):
                return [ip for ip in external_egress_exceptions if _cidr_contains(cidr, ip)]

            def _ip_block(cidr, exceptions):
                block = {"cidr": cidr}
                if exceptions:
                    block["except"] = exceptions
                return {"ipBlock": block}

            def _internal_ports(items):
                return [
                    {
                        key: item[key]
                        for key in ("port", "protocol", "endPort")
                        if item.get(key) is not None
                    }
                    for item in items
                ]

            def _internal_rules(items, peer_key):
                field = "internalIngress" if peer_key == "from" else "internalEgress"
                if not isinstance(items, list):
                    raise ValueError(f"network.{field} must be a list")
                rules = []
                for item in items:
                    if (
                        not isinstance(item, dict)
                        or not isinstance(item.get("namespace"), str)
                        or not item["namespace"].strip()
                    ):
                        raise ValueError(f"network.{field} entries require a namespace")
                    selector = item.get("podSelector", {})
                    ports = item.get("ports", [])
                    if not isinstance(selector, dict):
                        raise ValueError(f"network.{field} selectors must be objects")
                    if not isinstance(ports, list) or any(
                        not isinstance(port, dict) or port.get("port") is None for port in ports
                    ):
                        raise ValueError(
                            f"network.{field} ports must be a list of port objects"
                        )
                    peer = {
                        "namespaceSelector": {
                            "matchLabels": {
                                "kubernetes.io/metadata.name": item["namespace"].strip(),
                            }
                        }
                    }
                    if selector:
                        peer["podSelector"] = selector
                    rule = {peer_key: [peer]}
                    if ports:
                        rule["ports"] = _internal_ports(ports)
                    rules.append(rule)
                return rules

            def _add_policy(policies, name, rules):
                if _policy_enabled(name):
                    policies.append(_network_policy(name, rules))

            ingress_policies = {}
            for item, rule in zip(internal_ingress, _internal_rules(internal_ingress, "from")):
                target = item.get("targetPodSelector", {})
                if not isinstance(target, dict):
                    raise ValueError("network.internalIngress selectors must be objects")
                name = "allow-internal-ingress"
                if target:
                    selector = _json.dumps(target, sort_keys=True, separators=(",", ":"))
                    name += "-" + _hashlib.sha256(selector.encode()).hexdigest()[:10]
                ingress_policy = ingress_policies.setdefault(
                    name, _network_policy(name, [], "ingress", target)
                )
                if rule not in ingress_policy["spec"]["ingress"]:
                    ingress_policy["spec"]["ingress"].append(rule)

            network_policies = []
            _add_policy(network_policies, "deny-egress", [])
            _add_policy(
                network_policies, "allow-namespace-egress", [{"to": [{"podSelector": {}}]}]
            )

            if vcluster:
                _add_policy(
                    network_policies,
                    "allow-vcluster-egress",
                    [
                        {
                            "to": [
                                {
                                    "namespaceSelector": {
                                        "matchLabels": {
                                            "training.educates.dev/environment.name": xr_name,
                                            "training.educates.dev/session.objects": "true",
                                        }
                                    },
                                    "podSelector": {
                                        "matchLabels": {
                                            "app": "vcluster",
                                            "release": "my-vcluster",
                                        }
                                    },
                                }
                            ],
                            "ports": [
                                {"protocol": "TCP", "port": 443},
                                {"protocol": "TCP", "port": 8443},
                            ],
                        }
                    ],
                )

            if external_egress or vcluster or data_enabled:
                _add_policy(
                    network_policies,
                    "allow-dns-egress",
                    [
                        {
                            "to": [
                                {
                                    "namespaceSelector": {
                                        "matchLabels": {
                                            "kubernetes.io/metadata.name": "kube-system"
                                        }
                                    }
                                }
                            ],
                            "ports": [
                                {"protocol": "UDP", "port": 53},
                                {"protocol": "TCP", "port": 53},
                            ],
                        }
                    ],
                )

            if external_egress:
                if external_egress_cidrs:
                    _add_policy(
                        network_policies,
                        "allow-external-egress",
                        [
                            {"to": [_ip_block(cidr, _exceptions_for(cidr))]}
                            for cidr in external_egress_cidrs
                        ],
                    )

            internal_egress_rules = _internal_rules(internal_egress, "to")
            if internal_egress_rules:
                _add_policy(network_policies, "allow-internal-egress", internal_egress_rules)

            vcluster_cfg = {
                "enabled": vcluster,
                "version": "1.34",
                "services": {
                    "fromHost": [
                        {
                            "from": f"$(workshop_namespace)/{host_svc_name}",
                            "to": f"$(workshop_namespace)/{host_svc_name}",
                        }
                        for host_svc_name in db_service_names
                    ]
                },
            }

            workshop = _render_template(
                req,
                "educates/workshop",
                xr_name=xr_name,
                vcluster_cfg=vcluster_cfg,
                workshop_enabled=bool(files),
                memory=memory,
                storage=storage,
                budget=budget,
                role=role,
                policy=policy,
                kubernetes_access=kubernetes_access,
                storage_secret_name=storage_secret_name,
                files=files,
                packages=packages,
                xr_namespace=xr_namespace,
                network_policies=network_policies,
            )

            if sessions:
                workshop["spec"]["session"]["resources"].pop("storage", None)
                workshop["spec"]["session"]["resources"]["volume"] = {
                    "name": "$(session_name)-persistent"
                }

            if data_enabled:
                if permanent_access:
                    workshop["spec"]["session"]["dashboards"].append(
                        {"name": "Data", "url": f"https://{xr_name}.{ingress_domain}/"}
                    )
                else:
                    workshop["spec"]["session"]["dashboards"].append(
                        {
                            "name": "Data",
                            "url": "$(ingress_protocol)://data-$(session_name).$(ingress_domain)/",
                        }
                    )
                    workshop["spec"]["session"]["ingresses"].append(
                        {
                            "name": "data",
                            "authentication": {"type": "session"},
                            "protocol": "http",
                            "host": "package-r.$(workshop_namespace).svc.$(cluster_domain)",
                            "port": 8888,
                            "headers": [{"name": "X-Package-R-User", "value": "datalab"}],
                        }
                    )

            if policy == "privileged":
                workshop["spec"]["session"]["applications"]["docker"] = {
                    "enabled": True,
                    "storage": "20Gi",
                }

            if registry_enabled:
                workshop["spec"]["session"]["applications"]["registry"] = {
                    "enabled": True,
                    "storage": registry_storage,
                }

            if vcluster and service_cidr:
                workshop["spec"]["session"]["objects"].append(
                    _render_template(
                        req,
                        "educates/vcluster-cidr",
                        service_cidr=service_cidr,
                    )
                )

            environment = _render_template(
                req,
                "educates/workshop-environment",
                xr_name=xr_name,
                ingress_class=ingress_class,
                ingress_domain=ingress_domain,
                ingress_secret=ingress_secret,
            )

            def emit(kind, manifest, key_suffix="", readiness=None):
                suffix = f"-{xr_name}{('-' + key_suffix) if key_suffix else ''}"
                key = f"{kind.lower()}{suffix}"
                body = _render_template(
                    req,
                    "common/object",
                    key=key,
                    xr_namespace=xr_namespace,
                    manifest=manifest,
                    readiness=readiness or {"policy": "SuccessfulCreate"},
                )
                rsp.desired.resources[key].resource.update(body)

            emit("Workshop", workshop)
            emit(
                "WorkshopEnvironment",
                environment,
                readiness={
                    "policy": "DeriveFromCelQuery",
                    "celQuery": "has(object.status) && has(object.status.educates) && object.status.educates.phase == 'Running'",
                },
            )

            observed_resources = getattr(req.observed, "resources", {}) or {}
            environment_manifest = _extract_manifest(
                observed_resources.get(f"workshopenvironment-{xr_name}")
            )
            workshop_namespace = _string_value(
                ((environment_manifest.get("status") or {}).get("educates") or {}).get(
                    "namespace"
                )
                or xr_name
            )

            runtime_namespace = (
                (environment_manifest.get("status") or {}).get("educates") or {}
            ).get("namespace")
            if runtime_namespace and _policy_enabled("allow-internal-ingress"):
                for name, manifest in sorted(ingress_policies.items()):
                    if _policy_enabled(name):
                        manifest["metadata"]["namespace"] = runtime_namespace
                        emit("NetworkPolicy", manifest, key_suffix=name)

            if workshop_namespace:
                emit(
                    "ResourceQuota",
                    _render_template(
                        req,
                        "educates/storage-quota",
                        workshop_ns=workshop_namespace,
                        overall_storage=overall_storage,
                    ),
                    key_suffix="overall-storage",
                )

                for sid in sessions:
                    persistent_pvc_name = f"{xr_name}-{sid}-persistent"
                    persistent_pvc_spec = {
                        "accessModes": ["ReadWriteOnce"],
                        "resources": {"requests": {"storage": storage}},
                    }
                    if persistent_storage_class:
                        persistent_pvc_spec["storageClassName"] = persistent_storage_class
                    emit(
                        "PersistentVolumeClaim",
                        _render_template(
                            req,
                            "educates/workspace-pvc",
                            persistent_pvc_name=persistent_pvc_name,
                            workshop_ns=workshop_namespace,
                            persistent_pvc_spec=persistent_pvc_spec,
                        ),
                        key_suffix=f"{sid}-persistent",
                    )

            for sid in started_sessions:
                session_manifest = _render_template(
                    req,
                    "educates/session",
                    metadata_name=f"{xr_name}-{sid}",
                    xr_name=xr_name,
                    session_id=str(sid),
                    ingress_domain=ingress_domain,
                    ingress_secret=ingress_secret,
                    session_environment=[
                        {"name": "SESSION_NAME", "value": f"{xr_name}-{sid}"},
                        {"name": "FRAME_ANCESTORS", "value": ""},
                    ]
                    + (
                        [{"name": "KUBECONFIG", "value": "/opt/kubeconfig/config"}]
                        if vcluster
                        else []
                    ),
                )
                emit(
                    "WorkshopSession",
                    session_manifest,
                    key_suffix=str(sid),
                    readiness={
                        "policy": "DeriveFromCelQuery",
                        "celQuery": "has(object.status) && has(object.status.educates) && object.status.educates.phase == 'Running'",
                    },
                )
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        educates/network-policy:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: ${name}
          spec: ${spec}
        educates/session:
          apiVersion: training.educates.dev/v1beta1
          kind: WorkshopSession
          metadata:
            name: ${metadata_name}
          spec:
            environment:
              name: ${xr_name}
            session:
              id: ${session_id}
              ingress:
                domain: ${ingress_domain}
                secret: ${ingress_secret}
              env: ${session_environment}
        educates/storage-quota:
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: overall-storage
            namespace: ${workshop_ns}
          spec:
            hard:
              requests.storage: ${overall_storage}
        educates/vcluster-cidr:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: vc-cidr-my-vcluster
            namespace: $(session_namespace)-vc
          data:
            cidr: ${service_cidr}
        educates/workshop:
          apiVersion: training.educates.dev/v1beta1
          kind: Workshop
          metadata:
            name: ${xr_name}
          spec:
            title: Default DataLab
            description: A default DataLab environment.
            version: '1.0'
            session:
              applications:
                console:
                  enabled: false
                editor:
                  enabled: true
                slides:
                  enabled: false
                terminal:
                  enabled: true
                vcluster: ${vcluster_cfg}
                workshop:
                  enabled: ${workshop_enabled}
              dashboards: []
              ingresses: []
              resources:
                memory: ${memory}
                storage: ${storage}
              namespaces:
                budget: ${budget}
                role: ${role}
                security:
                  policy: ${policy}
                  token:
                    enabled: ${kubernetes_access}
              envFrom:
              - secretRef:
                  name: ${storage_secret_name}
              objects: []
            workshop:
              files: ${files}
              packages: ${packages}
            environment:
              secrets:
              - name: ${storage_secret_name}
                namespace: ${xr_namespace}
              objects: ${network_policies}
        educates/workshop-environment:
          apiVersion: training.educates.dev/v1beta1
          kind: WorkshopEnvironment
          metadata:
            name: ${xr_name}
          spec:
            analytics:
              amplitude:
                trackingId: ''
            cookies: {}
            environment:
              objects: []
              secrets: []
            request:
              enabled: false
            session:
              ingress:
                class: ${ingress_class}
                domain: ${ingress_domain}
                secret: ${ingress_secret}
            theme:
              name: default-website-theme
            workshop:
              name: ${xr_name}
        educates/workspace-pvc:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ${persistent_pvc_name}
            namespace: ${workshop_ns}
          spec: ${persistent_pvc_spec}
  - step: update-data-objects
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _boolish(value):
            if isinstance(value, bool):
                return value
            return str(value).lower() in ("true", "1", "yes", "on")

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_manifest(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return manifest or raw_manifest

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import copy as _copy
        import hashlib as _hashlib
        import json as _json
        import shlex as _shlex

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1



        def _extract_secret_data(objres):
            manifest = _extract_manifest(objres)
            data = manifest.get("data") or {}
            return data if isinstance(data, dict) else {}


        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            data_config = (environment.get("defaults") or {}).get("data") or {}
            data_enabled = data_config.get("enabled")
            if data_enabled is None:
                data_enabled = True
            if not _boolish(data_enabled):
                return

            read_only = data_config.get("readOnlyMount")
            if read_only is None:
                read_only = False
            write_permission_args = []
            if not _boolish(read_only):
                write_permission_args = [
                    "--perm.create=true",
                    "--perm.delete=true",
                    "--perm.modify=true",
                    "--perm.rename=true",
                ]

            observed = getattr(req.observed, "resources", {}) or {}
            environment_manifest = _extract_manifest(
                observed.get(f"workshopenvironment-{xr_name}")
            )
            educates_status = (environment_manifest.get("status") or {}).get("educates") or {}
            workshop_namespace = _safe_str(educates_status.get("namespace"))
            if not workshop_namespace:
                return

            storage_secret_name = f"{xr_name}-datalab"
            runtime_secret_key = f"observe-runtime-storage-secret-{xr_name}"
            runtime_secret_data = _extract_secret_data(observed.get(runtime_secret_key))
            if not runtime_secret_data:
                return

            checksum_keys = (
                "aws-credentials",
                "AWS_ACCESS_KEY_ID",
                "AWS_SECRET_ACCESS_KEY",
                "AWS_SESSION_TOKEN",
                "AWS_ENDPOINT_URL",
                "AWS_REGION",
            )
            checksum_input = "\n".join(
                f"{key}={_safe_str(runtime_secret_data.get(key))}" for key in checksum_keys
            )
            storage_secret_checksum = _hashlib.sha256(
                checksum_input.encode("utf-8")
            ).hexdigest()

            iam = environment.get("iam") or {}
            ingress = environment.get("ingress") or {}
            storage = environment.get("storage") or {}
            network = environment.get("network") or {}
            excluded_network_policies = {
                _safe_str(name)
                for name in (network.get("excludePolicies") or [])
                if _safe_str(name)
            }
            service_cidr = _safe_str(network.get("serviceCIDR"))
            pod_cidrs = [
                _safe_str(cidr) for cidr in (network.get("podCIDRs") or []) if _safe_str(cidr)
            ]
            realm = _safe_str(iam.get("realm") or "default")
            issuer_url = _safe_str(iam.get("issuerURL"))
            internal_iam_url = _safe_str(iam.get("internalURL"))
            iam_namespace = _safe_str(iam.get("namespace") or "keycloak")
            ingress_class = _safe_str(ingress.get("class"))
            ingress_domain = _safe_str(ingress.get("domain"))
            ingress_secret = _safe_str(ingress.get("secret"))
            ingress_enabled = _boolish(ingress.get("enabled"))
            ingress_annotations = ingress.get("annotations") or {}
            if not isinstance(ingress_annotations, dict):
                ingress_annotations = {}
            gateway = environment.get("httpRoute") or {}
            route_enabled = _boolish(gateway.get("enabled"))
            permanent_access = ingress_enabled or route_enabled
            s3_enabled = _boolish(gateway.get("enableS3"))
            gateway_namespace = _safe_str(gateway.get("parentNamespace"))

            endpoint_env = {
                "name": "AWS_ENDPOINT_URL",
                "valueFrom": {
                    "secretKeyRef": {
                        "name": storage_secret_name,
                        "key": "AWS_ENDPOINT_URL",
                    }
                },
            }

            labels = {
                "app.kubernetes.io/name": "package-r",
                "app.kubernetes.io/instance": xr_name,
            }
            package_r_users = list(
                dict.fromkeys(
                    [
                        *([] if permanent_access else ["datalab"]),
                        *[
                            _safe_str(user)
                            for user in (spec.get("users") or [])
                            if _safe_str(user)
                        ],
                    ]
                )
            )
            user_commands = "\n".join(
                " ".join(
                    _shlex.quote(arg)
                    for arg in ["/package-r", "users", "add", user, "", *write_permission_args]
                )
                for user in package_r_users
            )

            public_share_path = _shlex.quote(f"/{xr_name}/public")

            init_script = f"""set -eu

        database=/state/package-r.db
        work_database=/state/package-r.db.new

        rm -f "$work_database"
        export PACKAGE_R_DATABASE="$work_database"

        /package-r config init \
          --address=0.0.0.0 \
          --port=8888 \
          --cors-allowed-origins='*' \
          --auth.method=proxy \
          --auth.header=X-Forwarded-Preferred-Username \
          --auth.mapper=

        /package-r users add default ""
        {user_commands}
        /package-r shares add default public {public_share_path} \
          --password="" \
          --description="default public share" \
          --catalog-name=catalog.parquet

        mv "$work_database" "$database"
        """

            deployment = _render_template(
                req,
                "data/deployment",
                workshop_namespace=workshop_namespace,
                labels=labels,
                storage_secret_checksum=storage_secret_checksum,
                init_script=init_script,
                containers=[
                    _render_template(
                        req,
                        "data/package-r-container",
                        endpoint_env=endpoint_env,
                        storage_secret_name=storage_secret_name,
                    )
                ]
                + (
                    [
                        _render_template(
                            req,
                            "data/oauth2-proxy-container",
                            args=[
                                "--http-address=0.0.0.0:4180",
                                "--metrics-address=127.0.0.1:44180",
                                "--provider=keycloak-oidc",
                                f"--provider-display-name={realm} realm",
                                f"--client-id={xr_name}",
                                "--client-secret-file=/var/run/datalab/oauth2/client_secret",
                                "--cookie-secret-file=/var/run/datalab/oauth2/cookie_secret",
                                f"--oidc-issuer-url={issuer_url}",
                                "--skip-oidc-discovery=true",
                                f"--login-url={issuer_url}/protocol/openid-connect/auth",
                                f"--redeem-url={internal_iam_url}/protocol/openid-connect/token",
                                f"--oidc-jwks-url={internal_iam_url}/protocol/openid-connect/certs",
                                f"--profile-url={internal_iam_url}/protocol/openid-connect/userinfo",
                                "--insecure-oidc-skip-nonce=false",
                                "--scope=openid email profile",
                                "--code-challenge-method=S256",
                                f"--redirect-url=https://{xr_name}.{ingress_domain}/oauth2/callback",
                                "--upstream=http://127.0.0.1:8888/",
                                "--email-domain=*",
                                f"--allowed-group={xr_name}",
                                "--reverse-proxy=true",
                                *[f"--trusted-proxy-ip={cidr}" for cidr in pod_cidrs],
                                f"--whitelist-domain={xr_name}.{ingress_domain}",
                                "--pass-basic-auth=false",
                                "--pass-access-token=false",
                                "--pass-authorization-header=false",
                                "--pass-user-headers=true",
                                "--skip-provider-button=true",
                                f"--cookie-name=__Host-{xr_name}",
                                "--cookie-secure=true",
                                "--cookie-httponly=true",
                                "--cookie-samesite=lax",
                                "--cookie-refresh=1h",
                                "--cookie-expire=8h",
                                "--cookie-csrf-per-request=true",
                                "--cookie-csrf-per-request-limit=5",
                                "--skip-auth-route=GET=^/api/public(/|$)",
                                "--skip-auth-route=HEAD=^/api/public(/|$)",
                                "--skip-auth-route=OPTIONS=^/api/public(/|$)",
                                "--skip-auth-route=GET=^/public(/|$)",
                                "--skip-auth-route=HEAD=^/public(/|$)",
                                "--skip-auth-route=OPTIONS=^/public(/|$)",
                                "--skip-auth-route=GET=^/share(/|$)",
                                "--skip-auth-route=HEAD=^/share(/|$)",
                                "--skip-auth-route=OPTIONS=^/share(/|$)",
                                "--skip-auth-route=GET=^/static(/|$)",
                                "--skip-auth-route=HEAD=^/static(/|$)",
                                "--skip-auth-route=OPTIONS=^/static(/|$)",
                                "--silence-ping-logging=true",
                            ],
                        )
                    ]
                    if permanent_access
                    else []
                ),
            )

            storage_volume = {
                "name": "storage-credentials",
                "secret": {
                    "secretName": storage_secret_name,
                    "defaultMode": 0o440,
                    "items": [{"key": "aws-credentials", "path": "aws-credentials"}],
                },
            }
            deployment["spec"]["template"]["spec"]["volumes"].append(storage_volume)

            oauth_volume = {
                "name": "oauth2-credentials",
                "secret": {
                    "secretName": f"{xr_name}-oauth2-client",
                    "defaultMode": 0o440,
                    "items": [
                        {"key": key, "path": key} for key in ("client_secret", "cookie_secret")
                    ],
                },
            }
            oauth_cookie_checksum = ""
            if permanent_access:
                deployment["spec"]["template"]["spec"]["volumes"].append(oauth_volume)
                oauth_resource = rsp.desired.resources.get(f"oauth2-client-secret-{xr_name}")
                oauth_object = _to_dict(oauth_resource.resource) if oauth_resource else {}
                oauth_manifest = (
                    (oauth_object.get("spec") or {}).get("forProvider") or {}
                ).get("manifest") or {}
                cookie_secret = (oauth_manifest.get("stringData") or {}).get("cookie_secret")
                if cookie_secret:
                    # The cookie cipher is built at startup, even when a Secret file is used.
                    oauth_cookie_checksum = _hashlib.sha256(
                        cookie_secret.encode("utf-8")
                    ).hexdigest()
                    deployment["spec"]["template"]["metadata"]["annotations"][
                        "datalabs.pkg.internal/oauth2-cookie-checksum"
                    ] = oauth_cookie_checksum

            service = _render_template(
                req,
                "data/service",
                workshop_namespace=workshop_namespace,
                labels=labels,
                ports=(
                    [
                        {
                            "name": "http",
                            "port": 8888,
                            "targetPort": "package-r",
                            "protocol": "TCP",
                        }
                    ]
                    if not permanent_access
                    else []
                )
                + (
                    [
                        {
                            "name": "auth-proxy",
                            "port": 4180,
                            "targetPort": "auth-proxy",
                            "protocol": "TCP",
                        }
                    ]
                    if permanent_access
                    else []
                ),
            )

            network_policy = _render_template(
                req,
                "data/network-policy",
                workshop_namespace=workshop_namespace,
                labels=labels,
                ingress_rules=(
                    [
                        {
                            "from": [
                                {
                                    "podSelector": {
                                        "matchLabels": {
                                            "training.educates.dev/application": "workshop",
                                        }
                                    }
                                }
                            ],
                            "ports": [{"protocol": "TCP", "port": 8888}],
                        }
                    ]
                    if not permanent_access
                    else []
                )
                + (
                    [
                        {
                            "ports": [{"protocol": "TCP", "port": 4180}],
                        }
                    ]
                    if permanent_access
                    else []
                ),
                egress_rules=[
                    {
                        "to": [
                            {
                                "namespaceSelector": {
                                    "matchLabels": {
                                        "kubernetes.io/metadata.name": iam_namespace,
                                    }
                                }
                            }
                        ],
                        "ports": [{"protocol": "TCP", "port": 8080}],
                    }
                ]
                if permanent_access
                else [],
            )

            permanent_ingress = _render_template(
                req,
                "data/permanent-ingress",
                workshop_namespace=workshop_namespace,
                labels=labels,
                ingress_annotations=ingress_annotations,
                ingress_class=ingress_class,
                hostname=f"{xr_name}.{ingress_domain}",
                ingress_secret=ingress_secret,
            )

            s3_labels = {
                "app.kubernetes.io/name": "data-s3",
                "app.kubernetes.io/instance": xr_name,
            }
            s3_deployment = _render_template(
                req,
                "data/s3-deployment",
                workshop_namespace=workshop_namespace,
                s3_labels=s3_labels,
                storage_secret_checksum=storage_secret_checksum,
                auth_key_arg=f"--auth-key={xr_name},{xr_name}",
                s3_environment=[
                    {"name": "RCLONE_CONFIG_UPSTREAM_TYPE", "value": "s3"},
                    {"name": "RCLONE_CONFIG_UPSTREAM_ENV_AUTH", "value": "true"},
                    {
                        "name": "AWS_SHARED_CREDENTIALS_FILE",
                        "value": "/var/run/datalab/storage/aws-credentials",
                    },
                    {
                        "name": "RCLONE_CONFIG_UPSTREAM_PROVIDER",
                        "value": _safe_str(storage.get("provider") or "Other"),
                    },
                    {
                        "name": "RCLONE_CONFIG_UPSTREAM_FORCE_PATH_STYLE",
                        "value": str(storage.get("forcePathStyle", "true")).lower(),
                    },
                    *[
                        {
                            "name": name,
                            "valueFrom": {
                                "secretKeyRef": {
                                    "name": storage_secret_name,
                                    "key": key,
                                    **(
                                        {"optional": True} if key == "AWS_SESSION_TOKEN" else {}
                                    ),
                                }
                            },
                        }
                        for name, key in (
                            ("RCLONE_CONFIG_UPSTREAM_ENDPOINT", "AWS_ENDPOINT_URL"),
                            ("RCLONE_CONFIG_UPSTREAM_REGION", "AWS_REGION"),
                        )
                    ],
                ],
                access_key_arg=f"--s3-access-key-id={xr_name}",
                secret_key_arg=f"--s3-secret-access-key={xr_name}",
            )
            s3_deployment["spec"]["template"]["spec"]["volumes"].append(
                _copy.deepcopy(storage_volume)
            )

            s3_service = _render_template(
                req,
                "data/s3-service",
                workshop_namespace=workshop_namespace,
                s3_labels=s3_labels,
            )
            s3_network_policy = _render_template(
                req,
                "data/s3-network-policy",
                workshop_namespace=workshop_namespace,
                s3_labels=s3_labels,
                ingress_rules=[
                    {
                        "from": [
                            {
                                "namespaceSelector": {
                                    "matchLabels": {
                                        "kubernetes.io/metadata.name": gateway_namespace,
                                    }
                                }
                            }
                        ],
                        "ports": [{"protocol": "TCP", "port": 8080}],
                    }
                ]
                if permanent_access
                else [],
            )
            if s3_enabled:
                s3_network_policy["spec"]["policyTypes"].append("Egress")
                s3_network_policy["spec"]["egress"] = _copy.deepcopy(
                    network_policy["spec"]["egress"]
                )
                auth_proxy = _copy.deepcopy(
                    next(
                        container
                        for container in deployment["spec"]["template"]["spec"]["containers"]
                        if container["name"] == "oauth2-proxy"
                    )
                )
                auth_proxy["args"] = [
                    arg
                    for arg in auth_proxy["args"]
                    if not arg.startswith(
                        (
                            "--upstream=",
                            "--allowed-group=",
                            "--skip-auth-route=",
                            "--http-address=",
                        )
                    )
                ] + [
                    "--http-address=127.0.0.1:4180",
                    "--upstream=static://202",
                    "--skip-jwt-bearer-tokens=true",
                    "--bearer-token-login-fallback=false",
                    "--insecure-oidc-allow-unverified-email=true",
                    *[
                        f"--allowed-role={xr_name}:{role}"
                        for role in ("ws_access", "ws_admin", "ws_api")
                    ],
                    "--request-logging=false",
                    "--auth-logging=false",
                ]
                for key in ("readinessProbe", "livenessProbe", "ports"):
                    auth_proxy.pop(key, None)
                # Keep both original SigV4 headers and the token unchanged for rclone.
                gateway_config = "\n".join(
                    [
                        "pid /tmp/nginx.pid;",
                        "error_log /dev/stderr warn;",
                        "events { worker_connections 1024; }",
                        "http {",
                        "  access_log off;",
                        "  client_body_temp_path /tmp/body; proxy_temp_path /tmp/proxy;",
                        "  fastcgi_temp_path /tmp/fastcgi; uwsgi_temp_path /tmp/uwsgi; scgi_temp_path /tmp/scgi;",
                        "  map $http_authorization $tenant_valid {",
                        "    default 0;",
                        f"    ~^AWS4-HMAC-SHA256\\s+Credential={xr_name}/ 1;",
                        "  }",
                        "  server {",
                        "    listen 8080;",
                        "    location = /_ready { proxy_pass http://127.0.0.1:4180/ready; }",
                        "    location / {",
                        "      if ($tenant_valid = 0) { return 403; }",
                        '      if ($http_x_amz_security_token = "") { return 403; }',
                        "      limit_except GET { deny all; }",
                        "      auth_request /_s3_auth;",
                        "      proxy_set_header Host $http_host;",
                        "      proxy_buffering off; proxy_read_timeout 3600s;",
                        "      proxy_pass http://127.0.0.1:8081;",
                        "    }",
                        "    location = /_s3_auth {",
                        "      internal; proxy_pass_request_body off;",
                        '      proxy_set_header Content-Length "";',
                        '      proxy_set_header Cookie "";',
                        '      proxy_set_header Authorization "Bearer $http_x_amz_security_token";',
                        "      proxy_pass http://127.0.0.1:4180/oauth2/auth?;",
                        "    }",
                        "  }",
                        "}",
                        "",
                    ]
                )
                s3_config = _render_template(
                    req,
                    "data/s3-config",
                    workshop_namespace=workshop_namespace,
                    gateway_config=gateway_config,
                )
                pod = s3_deployment["spec"]["template"]
                pod["spec"]["volumes"].append(_copy.deepcopy(oauth_volume))
                if oauth_cookie_checksum:
                    pod["metadata"]["annotations"][
                        "datalabs.pkg.internal/oauth2-cookie-checksum"
                    ] = oauth_cookie_checksum
                pod["metadata"]["annotations"][
                    "datalabs.pkg.internal/gateway-config-checksum"
                ] = _hashlib.sha256(gateway_config.encode()).hexdigest()
                pod["spec"]["volumes"].append(
                    {"name": "gateway-config", "configMap": {"name": "data-s3"}}
                )
                pod["spec"]["containers"].extend(
                    [
                        auth_proxy,
                        _render_template(
                            req,
                            "data/gateway-container",
                        ),
                    ]
                )

            data_route = _render_template(
                req,
                "data/data-route",
                workshop_namespace=workshop_namespace,
                gateway_name=_safe_str(gateway.get("parentName")),
                gateway_namespace=gateway_namespace,
                gateway_section=_safe_str(gateway.get("sectionName")),
                hostname=f"{xr_name}.{ingress_domain}",
                route_rules=(
                    [
                        {
                            "matches": [
                                {
                                    "headers": [
                                        {
                                            "name": "User-Agent",
                                            "type": "RegularExpression",
                                            "value": "^aws-cli/.*",
                                        }
                                    ]
                                },
                                {
                                    "headers": [
                                        {
                                            "name": "Authorization",
                                            "type": "RegularExpression",
                                            "value": "^AWS4-HMAC-SHA256 .*",
                                        }
                                    ]
                                },
                                {
                                    "queryParams": [
                                        {
                                            "name": "X-Amz-Algorithm",
                                            "value": "AWS4-HMAC-SHA256",
                                        }
                                    ]
                                },
                            ],
                            "backendRefs": [{"name": "data-s3", "port": 8080}],
                            "timeouts": {"request": "3600s"},
                        }
                    ]
                    if s3_enabled
                    else []
                )
                + [
                    {
                        "backendRefs": [{"name": "package-r", "port": 4180}],
                        "timeouts": {"request": "3600s"},
                    }
                ],
            )
            data_redirect = _render_template(
                req,
                "data/data-redirect",
                workshop_namespace=workshop_namespace,
                gateway_name=_safe_str(gateway.get("parentName")),
                gateway_namespace=gateway_namespace,
                gateway_section=_safe_str(gateway.get("httpSectionName")),
                hostname=f"{xr_name}.{ingress_domain}",
            )

            dns_targets = [
                {
                    "namespaceSelector": {
                        "matchLabels": {
                            "kubernetes.io/metadata.name": "kube-system",
                        }
                    }
                }
            ]
            if service_cidr:
                dns_targets.append({"ipBlock": {"cidr": service_cidr}})

            dns_network_policy = _render_template(
                req,
                "data/dns-network-policy",
                workshop_namespace=workshop_namespace,
                labels=labels,
                dns_targets=dns_targets,
            )

            def emit(key, manifest, readiness=None):
                body = _render_template(
                    req,
                    "common/object",
                    key=key,
                    xr_namespace=xr_namespace,
                    manifest=manifest,
                    readiness=readiness or {"policy": "SuccessfulCreate"},
                )
                rsp.desired.resources[key].resource.update(body)

            emit(
                f"data-deployment-{xr_name}",
                deployment,
                readiness={
                    "policy": "DeriveFromCelQuery",
                    "celQuery": "has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration >= object.metadata.generation && has(object.status.availableReplicas) && object.status.availableReplicas >= 1",
                },
            )
            emit(f"data-service-{xr_name}", service)
            emit(f"data-networkpolicy-{xr_name}", network_policy)
            if permanent_access:
                if route_enabled:
                    route_readiness = {
                        "policy": "DeriveFromCelQuery",
                        "celQuery": (
                            "has(object.status) && has(object.status.parents) && "
                            f"object.status.parents.exists(p, p.parentRef.name == {_json.dumps(_safe_str(gateway.get('parentName')))} && "
                            f"has(p.parentRef.namespace) && p.parentRef.namespace == {_json.dumps(gateway_namespace)} && "
                            "has(p.parentRef.sectionName) && p.parentRef.sectionName == object.spec.parentRefs[0].sectionName && "
                            "has(p.conditions) && "
                            "p.conditions.exists(c, c.type == 'Accepted' && c.status == 'True' && "
                            "c.observedGeneration == object.metadata.generation) && "
                            "p.conditions.exists(c, c.type == 'ResolvedRefs' && c.status == 'True' && "
                            "c.observedGeneration == object.metadata.generation))"
                        ),
                    }
                    emit(f"data-route-{xr_name}", data_route, readiness=route_readiness)
                    emit(f"data-redirect-{xr_name}", data_redirect, readiness=route_readiness)
                else:
                    emit(f"data-ingress-{xr_name}", permanent_ingress)
            if s3_enabled:
                emit(f"data-s3-config-{xr_name}", s3_config)
                emit(
                    f"data-s3-deployment-{xr_name}",
                    s3_deployment,
                    readiness={
                        "policy": "DeriveFromCelQuery",
                        "celQuery": "has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration >= object.metadata.generation && has(object.status.availableReplicas) && object.status.availableReplicas >= 1",
                    },
                )
                emit(f"data-s3-service-{xr_name}", s3_service)
                emit(f"data-s3-networkpolicy-{xr_name}", s3_network_policy)
            if "allow-dns-egress" not in excluded_network_policies:
                emit(f"data-dns-networkpolicy-{xr_name}", dns_network_policy)
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        data/data-redirect:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: data-https-redirect
            namespace: ${workshop_namespace}
          spec:
            parentRefs:
            - name: ${gateway_name}
              namespace: ${gateway_namespace}
              sectionName: ${gateway_section}
            hostnames:
            - ${hostname}
            rules:
            - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
        data/data-route:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: data
            namespace: ${workshop_namespace}
          spec:
            parentRefs:
            - name: ${gateway_name}
              namespace: ${gateway_namespace}
              sectionName: ${gateway_section}
            hostnames:
            - ${hostname}
            rules: ${route_rules}
        data/deployment:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: package-r
            namespace: ${workshop_namespace}
            labels: ${labels}
          spec:
            replicas: 1
            revisionHistoryLimit: 2
            strategy:
              type: Recreate
            selector:
              matchLabels: ${labels}
            template:
              metadata:
                labels: ${labels}
