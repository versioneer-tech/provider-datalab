            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")
            xr_namespace = metadata.get("namespace") or "default"

            cache_stores = spec.get("cacheStores")
            if not isinstance(cache_stores, dict) or not cache_stores:
                return

            context = _to_dict(req.context)
            environment = context.get("apiextensions.crossplane.io/environment", {}) or {}
            images = environment.get("images") or {}
            redis_image = _safe_str(images.get("redis")) or "quay.io/opstree/redis:v7.0.15"
            backup_image = _safe_str(images.get("redisBackup")) or "redis:7.0.15"
            redis_env = environment.get("cacheStore") or {}
            redis_storage_class = _string_value(redis_env.get("storageClassName") or "")
            backup_storage_class = _string_value(redis_env.get("backupStorageClassName") or "")

            observed = getattr(req.observed, "resources", None) or {}
            runtime_namespace = xr_name

            for store_key in sorted(list(cache_stores.keys())):
                if not isinstance(store_key, str) or not store_key.strip():
                    continue
                store_cfg = cache_stores.get(store_key) or {}
                if not isinstance(store_cfg, dict):
                    continue

                redis_storage = _string_value(store_cfg.get("storage") or "1Gi")
                if not redis_storage:
                    continue
                store_name = store_key.strip()
                backup_storage = _string_value(store_cfg.get("backupStorage") or "0")
                backups_enabled = _backup_enabled(backup_storage)
                redis_password = _strong_token(
                    f"{xr_name}:{store_name}:redis", suffix="", length=28
                )
                redis_auth_secret_name = f"{store_name}-redis-auth"
                redis_auth_secret = _render_template(
                    req,
                    "redis/auth-secret",
                    redis_auth_secret_name=redis_auth_secret_name,
                    runtime_namespace=runtime_namespace,
                    redis_user="default",
                    redis_password=redis_password,
                )
                auth_key = f"redis-auth-secret-{xr_name}-{store_name}"
                auth_body = _render_template(
                    req,
                    "redis/auth-object",
                    auth_key=auth_key,
                    xr_namespace=xr_namespace,
                    redis_auth_secret=redis_auth_secret,
                )
                rsp.desired.resources[auth_key].resource.update(auth_body)

                redis_acl_secret_name = f"{store_name}-redis-acl"
                acl = f"user default on >{redis_password} ~* +@all\n"
                if backups_enabled:
                    backup_password = _strong_token(f"{xr_name}:{store_name}:redis:backup")
                    acl += f"user backup on >{backup_password} -@all +ping +replconf +sync\n"
                encoded_acl = base64.b64encode(acl.encode()).decode()
                redis_acl_secret = _render_template(
                    req,
                    "redis/acl-secret",
                    redis_acl_secret_name=redis_acl_secret_name,
                    runtime_namespace=runtime_namespace,
                    data_user_acl=encoded_acl,
                )
                acl_key = f"redis-acl-secret-{xr_name}-{store_name}"
                acl_body = _render_template(
                    req,
                    "redis/acl-object",
                    acl_key=acl_key,
                    xr_namespace=xr_namespace,
                    redis_acl_secret=redis_acl_secret,
                )
                rsp.desired.resources[acl_key].resource.update(acl_body)
                # The operator mounts the ACL file with subPath, so changes need a restart.
                observed_acl = _extract_data(observed.get(acl_key)).get("user.acl") or encoded_acl
                acl_checksum = hashlib.sha256(observed_acl.encode()).hexdigest()

                pvc_spec = {
                    "accessModes": ["ReadWriteOnce"],
                    "resources": {"requests": {"storage": redis_storage}},
                }
                if redis_storage_class:
                    pvc_spec["storageClassName"] = redis_storage_class

                storage = {
                    "volumeClaimTemplate": {
                        "metadata": {},
                        "spec": pvc_spec,
                    },
                    "volumeMount": {},
                }
                redis_manifest = _render_template(
                    req,
                    "redis/store",
                    redis_image=redis_image,
                    store_name=store_name,
                    runtime_namespace=runtime_namespace,
                    redis_auth_secret_name=redis_auth_secret_name,
                    redis_acl_secret_name=redis_acl_secret_name,
                    redis_acl_checksum=acl_checksum,
                    storage=storage,
                )

                key = f"redis-cache-{xr_name}-{store_name}"
                body = _render_template(
                    req,
                    "redis/store-object",
                    key=key,
                    xr_namespace=xr_namespace,
                    redis_manifest=redis_manifest,
                )
                rsp.desired.resources[key].resource.update(body)

                if backups_enabled:
                    backup_name = f"redis-{store_name}-backup"
                    backup_secret_name = f"{store_name}-redis-backup-auth"
                    backup_secret = _render_template(
                        req,
                        "redis/auth-secret",
                        redis_auth_secret_name=backup_secret_name,
                        runtime_namespace=runtime_namespace,
                        redis_user="backup",
                        redis_password=backup_password,
                    )
                    backup_vcs = {
                        "accessModes": ["ReadWriteOnce"],
                        "resources": {"requests": {"storage": backup_storage}},
                    }
                    if backup_storage_class:
                        backup_vcs["storageClassName"] = backup_storage_class
                    backup_pvc = _render_template(
                        req,
                        "redis/backup-pvc",
                        backup_name=backup_name,
                        runtime_namespace=runtime_namespace,
                        backup_vcs=backup_vcs,
                    )
                    backup_job = _render_template(
                        req,
                        "redis/backup-cronjob",
                        redis_image=backup_image,
                        backup_name=backup_name,
                        runtime_namespace=runtime_namespace,
                        backup_secret_name=backup_secret_name,
                        backup_host=store_name,
                    )
                    for resource_type, manifest in (
                        ("auth-secret", backup_secret),
                        ("pvc", backup_pvc),
                        ("cronjob", backup_job),
                    ):
                        backup_key = f"redis-backup-{resource_type}-{xr_name}-{store_name}"
                        backup_body = _render_template(
                            req,
                            "common/object",
                            key=backup_key,
                            xr_namespace=xr_namespace,
                            manifest=manifest,
                            readiness={"policy": "SuccessfulCreate"},
                        )
                        if resource_type == "pvc":
                            # Keep completed backups when the schedule is disabled.
                            backup_body["spec"]["managementPolicies"] = [
                                "Observe", "Create", "Update", "LateInitialize"
                            ]
                        rsp.desired.resources[backup_key].resource.update(backup_body)

                pod_key = f"redis-pod-{xr_name}-{store_name}"
                pod_body = _render_template(
                    req,
                    "common/pod-observer",
                    pod_key=pod_key,
                    xr_namespace=xr_namespace,
                    pod_name=f"{store_name}-0",
                    runtime_namespace=runtime_namespace,
                )
                rsp.desired.resources[pod_key].resource.update(pod_body)
      templates:
        common/object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${manifest}
            readiness: ${readiness}
            watch: true
        common/pod-observer:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${pod_key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${pod_key}
          spec:
            managementPolicies:
            - Observe
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest:
                apiVersion: v1
                kind: Pod
                metadata:
                  name: ${pod_name}
                  namespace: ${runtime_namespace}
            readiness:
              policy: DeriveFromCelQuery
              celQuery: has(object.status) && has(object.status.conditions) && object.status.conditions.exists(c,
                c.type == 'Ready' && c.status == 'True')
            watch: true
        redis/acl-object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${acl_key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${acl_key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${redis_acl_secret}
            readiness:
              policy: SuccessfulCreate
            watch: true
        redis/acl-secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${redis_acl_secret_name}
            namespace: ${runtime_namespace}
          type: Opaque
          data:
            user.acl: ${data_user_acl}
        redis/auth-object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${auth_key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${auth_key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${redis_auth_secret}
            readiness:
              policy: SuccessfulCreate
            watch: true
        redis/auth-secret:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${redis_auth_secret_name}
            namespace: ${runtime_namespace}
          type: Opaque
          stringData:
            user: ${redis_user}
            password: ${redis_password}
        redis/backup-cronjob:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: ${backup_name}
            namespace: ${runtime_namespace}
          spec:
            schedule: 0 1 * * *
            timeZone: Etc/UTC
            concurrencyPolicy: Forbid
            startingDeadlineSeconds: 3600
            successfulJobsHistoryLimit: 1
            failedJobsHistoryLimit: 1
            jobTemplate:
              spec:
                backoffLimit: 2
                activeDeadlineSeconds: 3600
                template:
                  spec:
                    restartPolicy: Never
                    automountServiceAccountToken: false
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 999
                      runAsGroup: 999
                      fsGroup: 999
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                    - name: backup
                      image: ${redis_image}
                      command:
                      - /bin/sh
                      - -ec
                      args:
                      - |
                        umask 077
                        archive="/backup/dump-$(date -u +%Y%m%dT%H%M%SZ).rdb"
                        partial="/backup/dump.partial"
                        trap 'rm -f "$partial"' EXIT
                        redis-cli -h "$BACKUP_HOST" --user backup --rdb "$partial"
                        redis-check-rdb "$partial"
                        mv "$partial" "$archive"
                        find /backup -maxdepth 1 -type f -name 'dump-*.rdb' -printf '%f\n' \
                          | sort -r | tail -n +5 | while IFS= read -r old; do rm "/backup/$old"; done
                      env:
                      - name: BACKUP_HOST
                        value: ${backup_host}
                      - name: REDISCLI_AUTH
                        valueFrom:
                          secretKeyRef:
                            name: ${backup_secret_name}
                            key: password
                      resources:
                        requests:
                          cpu: 100m
                          memory: 128Mi
                        limits:
                          memory: 512Mi
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop:
                          - ALL
                      volumeMounts:
                      - name: backup
                        mountPath: /backup
                    volumes:
                    - name: backup
                      persistentVolumeClaim:
                        claimName: ${backup_name}
        redis/backup-pvc:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ${backup_name}
            namespace: ${runtime_namespace}
          spec: ${backup_vcs}
        redis/store:
          apiVersion: redis.redis.opstreelabs.in/v1beta2
          kind: Redis
          metadata:
            name: ${store_name}
            namespace: ${runtime_namespace}
            annotations:
              datalabs.versioneer.at/redis-acl-checksum: ${redis_acl_checksum}
          spec:
            initContainer:
              enabled: true
              image: ${redis_image}
              imagePullPolicy: IfNotPresent
              command:
              - sh
              - -c
              args:
              - mkdir -p /data/appendonlydir && chmod 0777 /data /data/appendonlydir
              securityContext:
                runAsUser: 0
            kubernetesConfig:
              image: ${redis_image}
              imagePullPolicy: IfNotPresent
              redisSecret:
                name: ${redis_auth_secret_name}
                key: password
              updateStrategy: {}
            acl:
              secret:
                secretName: ${redis_acl_secret_name}
            storage: ${storage}
        redis/store-object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${redis_manifest}
            readiness:
              policy: DeriveFromCelQuery
              celQuery: '!has(object.metadata.deletionTimestamp)'
            watch: true
  - step: publish-vcluster-connections
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import hashlib

        import json

        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _resource_name(*parts, limit=63):
            name = "-".join(parts)
            if len(name) <= limit and (
                len(parts) == 1 or all("-" not in part for part in parts)
            ):
                return name
            # Keep component boundaries distinct when instance and profile names have hyphens.
            digest = hashlib.sha256(json.dumps(parts).encode()).hexdigest()[:10]
            return name[: limit - 11].rstrip("-") + "-" + digest

        def _vcluster_profile(name, instance, group):
            return _resource_name(name, "vcluster", instance, group, limit=55)

        def _vcluster_groups(config):
            groups = {group["name"]: group for group in config.get("groups") or []}
            groups["cluster-admin"] = {
                "name": "cluster-admin", "namespace": "*", "role": "cluster-admin"
            }
            return [groups[name] for name in sorted(groups)]

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import base64
        import hashlib
        import json

        CREDENTIAL_HELPER = '#!/usr/bin/env python3\n\n"""Use a caller token or sign in through the Datalab device flow."""\n\nimport argparse\nimport base64\nfrom binascii import Error as Base64Error\nfrom datetime import datetime, timezone\nfrom getpass import getpass, GetPassWarning\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport ssl\nimport sys\nimport tempfile\nimport time\nimport warnings\nfrom urllib.error import HTTPError, URLError\nfrom urllib.parse import urlencode\nfrom urllib.request import Request, urlopen\n\n\nclass OAuthError(ValueError):\n    pass\n\n\ndef token_expiry(token):\n    payload = token.split(\'.\')[1]\n    claims = json.loads(base64.urlsafe_b64decode(payload + \'=\' * (-len(payload) % 4)))\n    # The API validates the JWT. This value controls only local token reuse.\n    return float(claims[\'exp\'])\n\n\ndef post(issuer, endpoint, values, context):\n    request = Request(issuer + \'/protocol/openid-connect/\' + endpoint,\n                      data=urlencode(values).encode())\n    try:\n        with urlopen(request, context=context, timeout=30) as result:\n            return json.load(result)\n    except HTTPError as error:\n        try:\n            code = json.load(error).get(\'error\')\n        except (ValueError, AttributeError):\n            code = None\n        # Do not copy server responses: they can contain credentials.\n        raise OAuthError(code or \'token_request_failed\') from None\n\n\ndef device_login(issuer, client, scope, context):\n    device = post(issuer, \'auth/device\', {**client, \'scope\': scope}, context)\n    print(\'Open \' + device[\'verification_uri\'] + \' and enter code \' + device[\'user_code\']\n          + \' to sign in to \' + client[\'client_id\'] + \'.\', file=sys.stderr)\n    deadline = time.monotonic() + float(device[\'expires_in\'])\n    interval = max(1, float(device.get(\'interval\', 5)))\n    while time.monotonic() + interval < deadline:\n        time.sleep(interval)\n        try:\n            return post(issuer, \'token\', {\n                **client, \'grant_type\': \'urn:ietf:params:oauth:grant-type:device_code\',\n                \'device_code\': device[\'device_code\'],\n            }, context)\n        except OAuthError as error:\n            if str(error) == \'slow_down\':\n                interval += 5\n            elif str(error) != \'authorization_pending\':\n                raise\n    raise OAuthError(\'expired_token\')\n\n\ndef read_cache(path):\n    try:\n        value = json.loads(path.read_text())\n        return value if isinstance(value, dict) else {}\n    except (FileNotFoundError, ValueError):\n        return {}\n\n\ndef save_cache(path, value):\n    # Replace the file only after the complete token response is stored.\n    with tempfile.NamedTemporaryFile(mode=\'w\', dir=path.parent, prefix=\'.datalab-token-cache-\', delete=False) as output:\n        temporary = Path(output.name)\n        try:\n            os.chmod(temporary, 0o600)\n            json.dump(value, output)\n            output.close()\n            os.replace(temporary, path)\n        finally:\n            temporary.unlink(missing_ok=True)\n\n\ndef client_secret(args):\n    if args.client_secret_file:\n        secret = Path(args.client_secret_file).read_text().strip()\n    elif args.client_secret_env:\n        secret = os.environ[args.client_secret_env]\n    else:\n        info = os.environ.get(\'KUBERNETES_EXEC_INFO\')\n        interactive = json.loads(info).get(\'spec\', {}).get(\'interactive\', False) if info else True\n        if not interactive or not sys.stdin.isatty():\n            raise ValueError(\'Client secret input requires an interactive terminal\')\n        # Stop instead of echoing the secret if terminal control is unavailable.\n        with warnings.catch_warnings():\n            warnings.simplefilter(\'error\', GetPassWarning)\n            secret = getpass(\'Client secret for \' + args.client_id + \': \', stream=sys.stderr)\n    if not secret:\n        raise ValueError(\'Empty client secret\')\n    return secret\n\n\ndef login(args):\n    scope = \' \'.join(sorted(set([\'openid\', \'offline_access\', *(args.scope or [args.client_id + \':interactive\'])])))\n    key = hashlib.sha256(json.dumps([args.issuer, args.client_id, scope]).encode()).hexdigest()\n    directory = Path(args.cache_dir).expanduser()\n    directory.mkdir(mode=0o700, parents=True, exist_ok=True)\n    if directory.is_symlink():\n        raise ValueError(\'The token cache directory must not be a symbolic link\')\n    os.chmod(directory, 0o700)\n    path = directory / (key + \'.json\')\n    cached = {} if args.force_login else read_cache(path)\n    try:\n        session_expires = float(cached.get(\'session_expires_at\', 0))\n    except (ValueError, TypeError):\n        session_expires = 0\n    if session_expires <= time.time() + 30:\n        cached = {}\n    try:\n        expires = min(float(cached[\'expires_at\']), token_expiry(cached[\'access_token\']))\n        if expires > time.time() + 30:\n            return cached[\'access_token\'], expires\n    except (ValueError, Base64Error, KeyError, IndexError, TypeError):\n        pass\n\n    ca_data = base64.b64decode(args.issuer_ca_data).decode() if args.issuer_ca_data else None\n    context = ssl.create_default_context(cafile=args.issuer_ca, cadata=ca_data)\n    client = {\'client_id\': args.client_id, \'client_secret\': client_secret(args)}\n    token = None\n    if cached.get(\'refresh_token\'):\n        try:\n            token = post(args.issuer, \'token\', {\n                **client, \'grant_type\': \'refresh_token\', \'refresh_token\': cached[\'refresh_token\'],\n            }, context)\n        except OAuthError as error:\n            if str(error) != \'invalid_grant\':\n                raise\n    if token is None:\n        cached = {}\n        token = device_login(args.issuer, client, scope, context)\n        session_expires = time.time() + 30 * 24 * 60 * 60\n    expires = min(time.time() + float(token[\'expires_in\']), token_expiry(token[\'access_token\']), session_expires)\n    if expires <= time.time() + 30:\n        raise ValueError(\'The issued token has expired\')\n    save_cache(path, {\n        \'access_token\': token[\'access_token\'], \'expires_at\': expires,\n        \'refresh_token\': token.get(\'refresh_token\', cached.get(\'refresh_token\')),\n        \'session_expires_at\': session_expires,\n    })\n    return token[\'access_token\'], expires\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\'--issuer\')\n    parser.add_argument(\'--client-id\')\n    parser.add_argument(\'--token-only\', action=\'store_true\', help=\'Use only a caller token file; never start login.\')\n    source = parser.add_mutually_exclusive_group()\n    source.add_argument(\'--access-token-file\', default=os.environ.get(\'DATALAB_ACCESS_TOKEN_FILE\'))\n    source.add_argument(\'--client-secret-file\')\n    source.add_argument(\'--client-secret-env\')\n    parser.add_argument(\'--scope\', action=\'append\', help=\'OAuth scope; repeat for more scopes. Default: <client-id>:interactive.\')\n    parser.add_argument(\'--cache-dir\', default=os.environ.get(\'DATALAB_TOKEN_CACHE_DIR\') or str(\n        Path(os.environ.get(\'XDG_CACHE_HOME\') or Path.home() / \'.cache\') / \'datalab\' / \'oidc\'))\n    parser.add_argument(\'--force-login\', action=\'store_true\', help=\'Ignore cached tokens and start device login.\')\n    parser.add_argument(\'--issuer-ca\')\n    parser.add_argument(\'--issuer-ca-data\')\n    args = parser.parse_args()\n    if args.token_only:\n        if args.client_secret_file or args.client_secret_env:\n            parser.error(\'--token-only does not accept client credentials.\')\n        if not args.access_token_file:\n            parser.error(\'Supply --access-token-file or set DATALAB_ACCESS_TOKEN_FILE.\')\n    else:\n        args.client_secret_file = args.client_secret_file or os.environ.get(\'DATALAB_CLIENT_SECRET_FILE\')\n    if sum(bool(value) for value in (args.access_token_file, args.client_secret_file, args.client_secret_env)) > 1:\n        parser.error(\'Supply one access token file or client secret source. Set DATALAB_ACCESS_TOKEN_FILE or DATALAB_CLIENT_SECRET_FILE.\')\n    if not args.access_token_file:\n        if not args.issuer or not args.client_id:\n            parser.error(\'Device login requires --issuer and --client-id.\')\n        if not args.issuer.startswith(\'https://\'):\n            parser.error(\'--issuer must use HTTPS\')\n        args.issuer = args.issuer.rstrip(\'/\')\n    try:\n        if args.access_token_file:\n            token = Path(args.access_token_file).read_text().strip()\n            expires = token_expiry(token)\n        else:\n            token, expires = login(args)\n            expires -= 10\n        credential = {\n            \'apiVersion\': \'client.authentication.k8s.io/v1\', \'kind\': \'ExecCredential\',\n            \'status\': {\'token\': token, \'expirationTimestamp\': datetime.fromtimestamp(\n                expires, timezone.utc).isoformat().replace(\'+00:00\', \'Z\')},\n        }\n    except OAuthError as error:\n        message = {\n            \'access_denied\': \'Device login was denied. Run kubectl again to retry.\',\n            \'expired_token\': \'The device code expired. Run kubectl again for a new code.\',\n            \'invalid_client\': \'Keycloak rejected the client credentials. Check the client ID and secret.\',\n            \'unauthorized_client\': \'Keycloak did not allow this login flow. Check the client settings.\',\n            \'invalid_scope\': \'Keycloak rejected the requested login scopes.\',\n            \'invalid_request\': \'Keycloak rejected the request. Check client policies and the server refresh-event support.\',\n        }.get(str(error), \'Keycloak rejected the token request. Check the client and login settings.\')\n        print(message, file=sys.stderr)\n        return 1\n    except (OSError, URLError, ValueError, Base64Error, KeyError, IndexError, TypeError, OverflowError,\n            EOFError, GetPassWarning):\n        print(\'Could not obtain a Datalab API token. Check the token file, client secret, or device login. \'\n              \'Set DATALAB_ACCESS_TOKEN_FILE or DATALAB_CLIENT_SECRET_FILE, or use an interactive terminal. \'\n              \'For a new login, use --force-login.\', file=sys.stderr)\n        return 1\n    print(json.dumps(credential))\n    return 0\n\n\nif __name__ == \'__main__\':\n    sys.exit(main())\n'


        def compose(req, rsp):
            rsp.meta.ttl.FromSeconds(300)
            xr = _to_dict(req.observed.composite.resource)
            spec = xr.get("spec") or {}
            status = (
                _to_dict(rsp.desired.composite.resource).get("status") or xr.get("status") or {}
            )
            instances = spec.get("vclusters") or {}
            if not instances and not any(
                c.get("type") == "vcluster" for c in status.get("connections", [])
            ):
                return
            meta = xr["metadata"]
            name = meta["name"]
            namespace = meta.get("namespace") or "default"
            env = _to_dict(req.context).get("apiextensions.crossplane.io/environment") or {}
            connections = [
                c for c in status.get("connections", []) if c.get("type") != "vcluster"
            ]

            def ready(key):
                observed = req.observed.resources.get(key)
                body = _to_dict(observed.resource) if observed else {}
                return any(
                    c.get("type") == "Ready" and c.get("status") == "True"
                    for c in body.get("status", {}).get("conditions", [])
                )

            for instance, config in sorted(instances.items()):
                endpoint = f"https://{name}.{env['ingress']['domain']}/.{instance}"
                cluster = {"server": endpoint}
                gateway_ca = (env.get("ingress") or {}).get("certificateAuthority")
                if gateway_ca:
                    cluster["certificate-authority-data"] = base64.b64encode(
                        gateway_ca.encode()
                    ).decode()
                issuer = str((env.get("iam") or {})["issuerURL"]).rstrip("/")
                for group in _vcluster_groups(config):
                    profile = _vcluster_profile(name, instance, group["name"])
                    connection_name = _resource_name("vcluster", instance, group["name"])
                    # New names let Crossplane delete old Secrets with stored credentials.
                    secret_name = _resource_name(name, "vcluster", instance, group["name"], "connection")
                    if group["name"] == "cluster-admin":
                        args = ["-c", CREDENTIAL_HELPER, "--issuer", issuer, "--client-id", name]
                        issuer_ca = (env.get("vcluster") or {}).get("issuerCA")
                        if issuer_ca:
                            args += ["--issuer-ca-data", base64.b64encode(issuer_ca.encode()).decode()]
                    else:
                        args = ["-c", CREDENTIAL_HELPER, "--token-only"]
                    binding = hashlib.sha256(
                        f"{group['name']}:{group['namespace']}:{group['role']}".encode()
                    ).hexdigest()[:12]
                    scope_resource = (
                        _resource_name(name, "interactive") if group["name"] == "cluster-admin"
                        else _resource_name(profile, "scope")
                    )
                    complete = all(
                        ready(key)
                        for key in [
                            *(
                                _resource_name("vcluster", name, instance, suffix)
                                for suffix in ("statefulset", "route", "backend-tls")
                            ),
                            _resource_name(
                                "vcluster", name, instance, "access", f"binding-{binding}"
                            ),
                            f"keycloak-client-{name}",
                            f"keycloak-vcluster-role-{profile}",
                            f"keycloak-optional-scope-{scope_resource}",
                            "keycloak-optional-role-" + _resource_name(scope_resource, profile),
                            f"keycloak-defaultScopes-{name}",
                            f"keycloak-optionalScopes-{name}",
                            "keycloak-selected-role-" + _resource_name(scope_resource, profile),
                            f"keycloak-selected-role-{name}-ws-api",
                            f"keycloak-selected-roles-{name}",
                        ]
                    )
                    kubeconfig = _render_template(
                        req,
                        "vcluster/client-config",
                        name=_resource_name(name, instance),
                        cluster=cluster,
                        profile=profile,
                        contexts_0_context_namespace=(
                            "default" if group["namespace"] == "*" else group["namespace"]
                        ),
                        interactive_mode="IfAvailable" if group["name"] == "cluster-admin" else "Never",
                        args=args,
                    )
                    key = _resource_name("connection", secret_name)
                    rsp.desired.resources[key].resource.update(
                        _render_template(
                            req,
                            "secrets/connection",
                            key=key,
                            name=name,
                            namespace=namespace,
                            secret_name=secret_name,
                            connection_name=connection_name,
                            values={key: base64.b64encode(value.encode()).decode() for key, value in {
                                "kubeconfig": json.dumps(kubeconfig, indent=2, sort_keys=True),
                                "client-id": name,
                                "issuer-url": issuer,
                            }.items()},
                        )
                    )
                    connections.append(
                        {
                            "name": connection_name,
                            "type": "vcluster",
                            "instance": instance,
                            "group": group["name"],
                            "targetNamespace": group["namespace"],
                            "role": group["role"],
                            "endpoint": endpoint,
                            "ready": complete,
                            "secretRef": {"name": secret_name, "namespace": namespace},
                        }
                    )
            status["connections"] = connections
            rsp.desired.composite.resource.update({"status": status})
      templates:
        secrets/connection:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${secret_name}
            namespace: ${namespace}
            labels:
              datalabs.versioneer.at/name: ${name}
              datalabs.versioneer.at/connection: ${connection_name}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          type: Opaque
          data: ${values}
        vcluster/client-config:
          apiVersion: v1
          kind: Config
          clusters:
          - name: ${name}
            cluster: ${cluster}
          contexts:
          - name: ${profile}
            context:
              cluster: ${name}
              user: ${profile}
              namespace: ${contexts_0_context_namespace}
          current-context: ${profile}
          users:
          - name: ${profile}
            user:
              exec:
                apiVersion: client.authentication.k8s.io/v1
                interactiveMode: ${interactive_mode}
                command: python3
                args: ${args}
  - step: encode-provider-secrets
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import base64
        from google.protobuf import json_format


        def compose(req, rsp):
            rsp.meta.ttl.FromSeconds(300)
            for desired in rsp.desired.resources.values():
                body = json_format.MessageToDict(desired.resource)
                if body.get("kind") != "Object":
                    continue
                manifest = body.get("spec", {}).get("forProvider", {}).get("manifest", {})
                if manifest.get("kind") != "Secret" or "stringData" not in manifest:
                    continue
                # The provider cannot track write-only stringData through server-side apply.
                manifest.setdefault("data", {}).update(
                    {
                        key: base64.b64encode(value.encode()).decode()
                        for key, value in manifest.pop("stringData").items()
                    }
                )
                desired.resource.Clear()
                desired.resource.update(body)
  - step: protect-vcluster-resources
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        import copy as _template_copy

        import re as _template_re

        from google.protobuf import json_format as _template_json

        def _render_template(req, template_name, /, **values):
            """Fill complete scalar placeholders and preserve each value's type."""
            template = _template_json.MessageToDict(req.input["templates"][template_name])

            def fill(value):
                if isinstance(value, str):
                    match = _template_re.fullmatch(r"\$\{([A-Za-z_][A-Za-z_0-9]*)\}", value)
                    if match:
                        return _template_copy.deepcopy(values[match[1]])
                if isinstance(value, dict):
                    return {key: fill(item) for key, item in value.items()}
                if isinstance(value, list):
                    return [fill(item) for item in value]
                return value

            return fill(template)

        import hashlib

        import json

        def _resource_name(*parts, limit=63):
            name = "-".join(parts)
            if len(name) <= limit and (
                len(parts) == 1 or all("-" not in part for part in parts)
            ):
                return name
            # Keep component boundaries distinct when instance and profile names have hyphens.
            digest = hashlib.sha256(json.dumps(parts).encode()).hexdigest()[:10]
            return name[: limit - 11].rstrip("-") + "-" + digest

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        import hashlib
        from crossplane.function.proto.v1 import run_function_pb2 as fnv1
        from google.protobuf import json_format


        def compose(req, rsp):
            rsp.meta.ttl.FromSeconds(300)
            meta = json_format.MessageToDict(req.observed.composite.resource)["metadata"]
            name = meta["name"]
            namespace = meta.get("namespace", "default")
            resources = set(req.observed.resources) | set(rsp.desired.resources)
            objects = {
                key: json_format.MessageToDict(value.resource)
                for key, value in {**req.observed.resources, **rsp.desired.resources}.items()
            }

            def reference(key):
                body = objects[key]
                return _render_template(
                    req,
                    "protect-vcluster-resources/resource",
                    apiVersion=body["apiVersion"],
                    kind=body["kind"],
                    resourceRef_name=body["metadata"]["name"],
                )

            def protect(suffix, used, by, prefix="vcluster"):
                if used not in resources or by not in resources:
                    return
                key = _resource_name(prefix, "usage", suffix, name, used, by)
                rsp.desired.resources[key].resource.update(
                    _render_template(
                        req,
                        "protect-vcluster-resources/usage",
                        key=key,
                        namespace=namespace,
                        spec_of=reference(used),
                        spec_by=reference(by),
                    )
                )
                rsp.desired.resources[key].ready = fnv1.READY_TRUE

            # Remove a protected resource only after its Usage has cleared the in-use label.
            indexed = {
                (body["apiVersion"], body["kind"], body["metadata"]["name"]): key
                for key, body in objects.items()
            }
            for observed in req.observed.resources.values():
                usage = json_format.MessageToDict(observed.resource)
                if (
                    usage.get("kind") != "Usage"
                    or usage.get("apiVersion") != "protection.crossplane.io/v1beta1"
                ):
                    continue
                target = (usage.get("spec") or {}).get("of") or {}
                key = indexed.get(
                    (
                        target.get("apiVersion"),
                        target.get("kind"),
                        (target.get("resourceRef") or {}).get("name"),
                    )
                )
                if key is None or key in rsp.desired.resources:
                    continue
                body = objects[key]
                metadata = body["metadata"]
                rsp.desired.resources[key].resource.update(
                    _render_template(
                        req,
                        "protect-vcluster-resources/resource-2",
                        apiVersion=body["apiVersion"],
                        kind=body["kind"],
                        metadata_name=metadata["name"],
                        namespace=namespace,
                        key=key,
                        spec=body.get("spec") or {},
                    )
                )

                if metadata.get("labels"):
                    rsp.desired.resources[key].resource["metadata"]["labels"] = metadata[
                        "labels"
                    ]

            for instance in sorted(
                {
                    body.get("metadata", {})
                    .get("labels", {})
                    .get("datalabs.versioneer.at/vcluster")
                    for body in objects.values()
                }
                - {None}
            ):
                control_plane = _resource_name("vcluster", name, instance, "statefulset")
                protect(
                    f"{instance}-quota", f"resourcequota-{name}-overall-storage", control_plane
                )
                for suffix in (
                    "authentication",
                    "config",
                    "data",
                    "serviceaccount",
                    "workload-serviceaccount",
                    "role",
                    "rolebinding",
                    "service",
                    "headless-service",
                    "storage-policy",
                    "storage-policy-binding",
                    "control-plane-networkpolicy",
                    "workload-networkpolicy",
                    "dns-networkpolicy",
                    "snapshot-networkpolicy",
                ):
                    protect(
                        f"{instance}-{suffix}",
                        _resource_name("vcluster", name, instance, suffix),
                        control_plane,
                    )
                for key, body in objects.items():
                    if body.get("metadata", {}).get("labels", {}).get(
                        "datalabs.versioneer.at/vcluster"
                    ) == instance and body.get("spec", {}).get("providerConfigRef", {}).get(
                        "name"
                    ) == _resource_name(
                        name, "vcluster", instance
                    ):
                        suffix = hashlib.sha256(key.encode()).hexdigest()[:12]
                        protect(f"{instance}-control-{suffix}", control_plane, key)
                        protect(
                            f"{instance}-provider-{suffix}",
                            _resource_name(
                                "vcluster", name, instance, "virtual-providerconfig"
                            ),
                            key,
                        )

            identity_refs = {
                "clientId": ("openidclient.keycloak.m.crossplane.io/v1alpha1", "Client"),
                "serviceAccountUserClientId": (
                    "openidclient.keycloak.m.crossplane.io/v1alpha1",
                    "Client",
                ),
                "roleId": ("role.keycloak.m.crossplane.io/v1alpha1", "Role"),
                "role": ("role.keycloak.m.crossplane.io/v1alpha1", "Role"),
                "groupId": ("group.keycloak.m.crossplane.io/v1alpha1", "Group"),
            }
            for key, body in objects.items():
                if (
                    key.startswith("keycloak-vcluster-")
                    or key == f"keycloak-roles-user-{name}"
                ) and ".keycloak.m.crossplane.io/" in body.get("apiVersion", ""):
                    params = body.get("spec", {}).get("forProvider", {})
                    for field, (api_version, kind) in identity_refs.items():
                        refs = [params.get(field + "Ref", {})]
                        if field == "roleId":
                            refs.extend(params.get("roleIdsRefs") or [])
                        labels = (params.get(field + "Selector") or {}).get("matchLabels")
                        for parent, candidate in objects.items():
                            if (
                                candidate.get("apiVersion") != api_version
                                or candidate.get("kind") != kind
                            ):
                                continue
                            metadata = candidate.get("metadata", {})
                            if not any(
                                ref.get("name") == metadata.get("name") for ref in refs
                            ) and not (
                                labels
                                and all(
                                    metadata.get("labels", {}).get(k) == v
                                    for k, v in labels.items()
                                )
                            ):
                                continue
                            suffix = hashlib.sha256(f"{parent}:{key}".encode()).hexdigest()[:12]
                            protect(suffix, parent, key, prefix="keycloak")
                if body.get("kind") != "Object":
                    continue
                manifest = body.get("spec", {}).get("forProvider", {}).get("manifest", {})
                if manifest.get("metadata", {}).get("namespace") == name:
                    suffix = hashlib.sha256(key.encode()).hexdigest()[:12]
                    protect(suffix, f"namespace-{name}", key, prefix="datalab")
      templates:
        protect-vcluster-resources/resource:
          apiVersion: ${apiVersion}
          kind: ${kind}
          resourceRef:
            name: ${resourceRef_name}
        protect-vcluster-resources/resource-2:
          apiVersion: ${apiVersion}
          kind: ${kind}
          metadata:
            name: ${metadata_name}
            namespace: ${namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec: ${spec}
        protect-vcluster-resources/usage:
          apiVersion: protection.crossplane.io/v1beta1
          kind: Usage
          metadata:
            name: ${key}
            namespace: ${namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            replayDeletion: true
            of: ${spec_of}
            by: ${spec_by}
