              enabled: true
              secret:
                name: ${qdrant_auth_secret_name}
                key: readApiKey
            image:
              repository: qdrant/qdrant
              tag: v1.13.4
              pullPolicy: IfNotPresent
            persistence: ${persistence}
        qdrant/store-object:
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: ${key}
            namespace: ${xr_namespace}
            annotations:
              crossplane.io/composition-resource-name: ${key}
          spec:
            providerConfigRef:
              name: provider-kubernetes
              kind: ProviderConfig
            forProvider:
              manifest: ${qdrant}
            readiness:
              policy: DeriveFromCelQuery
              celQuery: '!has(object.metadata.deletionTimestamp)'
            watch: true
  - step: update-session-status
    functionRef:
      name: crossplane-contrib-function-python
    input:
      apiVersion: python.fn.crossplane.io/v1beta1
      kind: Script
      script: |
        from google.protobuf import json_format

        def _to_dict(value):
            if value is None:
                return {}
            if isinstance(value, dict):
                return value
            return json_format.MessageToDict(value, preserving_proto_field_name=True)

        def _safe_str(value):
            return str(value).strip() if value is not None else ""

        def _string_value(value):
            """Keep the literal string for null values in existing resource settings."""
            return str(value).strip()

        def _observed_manifests(observed_resource):
            if not observed_resource or not getattr(observed_resource, "resource", None):
                return {}, {}
            resource = _to_dict(observed_resource.resource)
            at_provider = (resource.get("status") or {}).get("atProvider") or {}
            return (
                at_provider.get("manifest") or {},
                (at_provider.get("raw") or {}).get("manifest") or {},
            )

        def _extract_manifest(observed_resource):
            manifest, raw_manifest = _observed_manifests(observed_resource)
            return manifest or raw_manifest

        def _session_name(session, *, stringify_none=False):
            if isinstance(session, dict):
                return _safe_str(session.get("name") or "")
            return _string_value(session) if stringify_none else _safe_str(session)

        def _session_state(session):
            state = (
                _safe_str(session.get("state") or "started").lower()
                if isinstance(session, dict)
                else "started"
            )
            return {"running": "started", "paused": "stopped"}.get(state, state)

        # Copyright 2026, EOX (https://eox.at) and Versioneer (https://versioneer.at)
        # SPDX-License-Identifier: Apache-2.0

        from crossplane.function.proto.v1 import run_function_pb2 as fnv1
        from google.protobuf import json_format, struct_pb2



        def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
            rsp.meta.ttl.FromSeconds(300)
            observed = getattr(req.observed, "resources", None) or {}
            xr = _to_dict(req.observed.composite.resource)
            metadata = xr.get("metadata", {}) or {}
            spec = xr.get("spec", {}) or {}

            xr_name = metadata.get("name")

            sessions_map = {}

            for session in spec.get("sessions") or []:
                sid = _session_name(session)
                state = _session_state(session)
                if not sid:
                    continue

                sessions_map[sid] = {"state": state}

                if state != "started":
                    continue

                key = f"workshopsession-{xr_name}-{sid}"
                manifest = _extract_manifest(observed.get(key))
                if not manifest:
                    continue

                ws_spec = (manifest.get("spec") or {}).get("session") or {}
                ws_id = str(ws_spec.get("id") or sid)

                educates = (manifest.get("status") or {}).get("educates") or {}
                phase = educates.get("phase")
                url = educates.get("url")
                message = educates.get("message")

                if phase:
                    sessions_map[ws_id]["phase"] = phase
                if message:
                    sessions_map[ws_id]["message"] = message
                if phase == "Running" and url:
                    sessions_map[ws_id]["url"] = url

            cur_status = (xr.get("status") or {}).copy()
            if sessions_map:
                cur_status["sessions"] = sessions_map
            else:
                cur_status.pop("sessions", None)

            status_value = struct_pb2.Value()
            json_format.ParseDict(cur_status, status_value)
            rsp.desired.composite.resource.fields["status"].CopyFrom(status_value)
  - step: check-resource-readiness
    functionRef:
      name: crossplane-contrib-function-auto-ready
    input:
      apiVersion: autoready.fn.crossplane.io/v1beta1
      kind: Input
      ttl: 5m
