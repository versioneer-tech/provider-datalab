name: Tests
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - legacy
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - legacy

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.checks.outputs.docs_only }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select checks
        id: checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            python3 scripts/ci-checks.py >> "${GITHUB_OUTPUT}"
          else
            python3 scripts/ci-checks.py --base "${BASE_REVISION}" --head "${HEAD_REVISION}" >> "${GITHUB_OUTPUT}"
          fi

  documentation:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation tools
        run: python3 -m pip install --only-binary=':all:' --require-hashes -r docs/requirements.txt

      - name: Run file and documentation checks
        run: |
          python3 scripts/install-tools.py actionlint gitleaks
          bash tests/checks.bash

      - name: Retain file security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: file-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/file-security/
          retention-days: 90
          if-no-files-found: error

  runtime_checks:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      PROVIDER_DATALAB_KUBECONFIG: /tmp/provider-datalab-it.kubeconfig
      RUN_INTEGRATION: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: tests/admission/go.sum

      - name: Install test CLIs
        run: |
          python3 scripts/install-tools.py crossplane dyff kind kubectl helm crane trivy govulncheck
          echo "$PWD/build/tools" >> "$GITHUB_PATH"

      - name: Run Composition unit tests
        run: |
          python3 -m pip install --only-binary=':all:' --require-hashes -r scripts/requirements.txt -r tools/requirements.txt
          tests/unit.bash

      - name: Retain test dependency reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-dependencies/
            !build/test-dependencies/**/candidate/**
          retention-days: 90
          if-no-files-found: warn

      - name: Run all Kubernetes integration profiles
        if: env.RUN_INTEGRATION == 'true'
        run: tests/integration/run.bash all --kind

      - name: Collect integration diagnostics
        if: failure() && env.RUN_INTEGRATION == 'true'
        run: tests/integration/diagnostics.bash

      - name: Report deferred integration checks
        if: env.RUN_INTEGRATION != 'true'
        run: echo 'Kubernetes integration checks are deferred for draft pull requests.' >> "$GITHUB_STEP_SUMMARY"

  security_checks:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/build/security-registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install scan tools
        run: |
          mkdir -p "$DOCKER_CONFIG"
          python3 -m pip install --only-binary=':all:' --require-hashes -r scripts/requirements.txt -r tools/requirements.txt
          python3 scripts/install-tools.py crossplane crane trivy gitleaks
      - name: Build production candidate
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/security.py prepare --version "0.0.0-rc.${GITHUB_RUN_NUMBER}" --commit "$SOURCE_COMMIT"
      - name: Save candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/candidate/
          retention-days: 7
          if-no-files-found: error
      - name: Scan saved candidate
        run: python3 scripts/security.py scan
      - name: Show scan summary
        if: always()
        run: |
          if [[ -f build/security/summary.md ]]; then
            cat build/security/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain security reports and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/security/
          retention-days: 90
          if-no-files-found: error

  required_checks:
    needs: [changes, documentation, runtime_checks, security_checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject missing or failed checks
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          DOC_RESULT: ${{ needs.documentation.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUNTIME_RESULT: ${{ needs.runtime_checks.result }}
          SECURITY_RESULT: ${{ needs.security_checks.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGE_RESULT" == success && "$DOC_RESULT" == success ]]
          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$RUNTIME_RESULT" == skipped && "$SECURITY_RESULT" == skipped ]]
          elif [[ "$DOCS_ONLY" == false ]]; then
            [[ "$RUNTIME_RESULT" == success && "$SECURITY_RESULT" == success ]]
          else
            exit 1
          fi
