name: PR
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit_and_datalab_integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PROVIDER_DATALAB_KUBECONFIG: /tmp/provider-datalab-it.kubeconfig
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install test CLIs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/crossplane/crossplane/v2.4.1/install.sh \
            --output /tmp/crossplane-install.sh
          XP_VERSION=v2.4.1 sh /tmp/crossplane-install.sh
          sudo install crossplane /usr/local/bin/crossplane
          go install github.com/homeport/dyff/cmd/dyff@v1.12.0
          sudo install "$(go env GOPATH)/bin/dyff" /usr/local/bin/dyff

      - name: Run Composition unit tests
        run: tests/unit.bash

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: provider-datalab-it
          config: tests/integration/manifests/kind.yaml

      - name: Deploy integration platform
        run: tests/integration/deploy-platform.bash

      - name: Verify Datalab network policy
        run: tests/integration/verify-network.bash

      - name: Verify Datalab registry
        run: tests/integration/verify-registry.bash

      - name: Verify Datalab PostgreSQL
        run: tests/integration/verify-postgres.bash

      - name: Collect integration diagnostics
        if: failure()
        run: tests/integration/diagnostics.bash
