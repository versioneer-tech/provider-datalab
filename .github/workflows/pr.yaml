name: Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - legacy
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - legacy

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.checks.outputs.docs_only }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select checks
        id: checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            python3 scripts/ci-checks.py >> "${GITHUB_OUTPUT}"
          else
            python3 scripts/ci-checks.py --base "${BASE_REVISION}" --head "${HEAD_REVISION}" >> "${GITHUB_OUTPUT}"
          fi

  documentation:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation tools
        run: python3 -m pip install -r docs/requirements.txt pre-commit

      - name: Check test selection
        run: python3 tests/ci-checks.py

      - name: Build documentation
        run: mkdocs build --strict --site-dir /tmp/provider-datalab-docs

      - name: Check repository files
        run: |
          pre-commit run --all-files
          git diff --check

  runtime_checks:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PROVIDER_DATALAB_KUBECONFIG: /tmp/provider-datalab-it.kubeconfig
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install test CLIs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/crossplane/crossplane/v2.4.1/install.sh \
            --output /tmp/crossplane-install.sh
          XP_VERSION=v2.4.1 sh /tmp/crossplane-install.sh
          sudo install crossplane /usr/local/bin/crossplane
          go install github.com/homeport/dyff/cmd/dyff@v1.12.0
          sudo install "$(go env GOPATH)/bin/dyff" /usr/local/bin/dyff

      - name: Run Composition unit tests
        run: |
          python3 -m pip install -r scripts/requirements.txt
          tests/unit.bash

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: provider-datalab-it
          config: tests/integration/manifests/kind.yaml

      - name: Deploy integration platform
        run: |
          tests/integration/deploy-platform.bash
          source tests/integration/lib.bash
          kube apply -f tests/integration/manifests/s3/keycloak.yaml

      - name: Verify Datalab network policy
        run: |
          tests/integration/verify-network.bash
          tests/integration/resource-budget.bash

      - name: Verify Datalab registry
        run: |
          tests/integration/verify-registry.bash
          tests/integration/resource-budget.bash

      - name: Verify Datalab Data service
        run: |
          tests/integration/verify-data.bash
          tests/integration/resource-budget.bash

      - name: Verify Datalab S3 endpoint
        run: |
          tests/integration/verify-s3.bash
          tests/integration/resource-budget.bash

      - name: Verify Datalab PostgreSQL
        run: |
          tests/integration/verify-postgres.bash
          tests/integration/resource-budget.bash

      - name: Verify Datalab MongoDB
        run: |
          tests/integration/verify-mongo.bash
          tests/integration/resource-budget.bash

      - name: Verify Datalab Redis
        run: |
          tests/integration/verify-redis.bash
          tests/integration/resource-budget.bash

      - name: Verify Datalab virtual clusters and STAC catalog
        run: |
          tests/integration/verify-vcluster.bash
          tests/integration/resource-budget.bash

      - name: Collect integration diagnostics
        if: failure()
        run: tests/integration/diagnostics.bash

  unit_and_datalab_integration:
    needs: [changes, documentation, runtime_checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject missing or failed checks
        if: >-
          needs.changes.result != 'success' ||
          needs.documentation.result != 'success' ||
          (needs.changes.outputs.docs_only != 'true' && needs.runtime_checks.result != 'success')
        run: exit 1

      - name: Required checks passed
        run: echo 'Required checks passed.'
