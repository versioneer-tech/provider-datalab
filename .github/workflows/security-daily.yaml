name: Rescan published releases
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      release-tags:
        description: 'Published tags separated by commas; empty selects supported releases'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/build/selection-registry
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python3 -m pip install --only-binary=':all:' --require-hashes -r scripts/requirements.txt
      - name: Read published package tags
        run: |
          mkdir -p "$DOCKER_CONFIG"
          python3 scripts/install-tools.py crane
          build/tools/crane ls ghcr.io/versioneer-tech/provider-datalab > build/published-tags.txt
      - name: Select supported releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ inputs.release-tags }}
        run: |
          set -euo pipefail
          matrix="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" |
            python3 scripts/security.py releases --tags "$RELEASE_TAGS" --published-tags-file build/published-tags.txt)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  scan:
    needs: releases
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/build/release-scan-registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install scan tools
        run: |
          mkdir -p "$DOCKER_CONFIG"
          python3 -m pip install --only-binary=':all:' --require-hashes -r scripts/requirements.txt -r tools/requirements.txt
          python3 scripts/install-tools.py crane trivy gitleaks
      - name: Download and verify published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: python3 scripts/release.py download --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Scan saved release and exact source inputs
        run: python3 scripts/security.py scan
      - name: Show scan summary
        if: always()
        run: |
          if [[ -f build/security/summary.md ]]; then
            cat build/security/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-${{ matrix.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/security/
          retention-days: 90
          if-no-files-found: error
