name: Publish Provider Datalab
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

concurrency:
  group: provider-datalab-publication
  cancel-in-progress: false

jobs:
  verify_release_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python3 -m pip install --only-binary=':all:' --require-hashes -r scripts/requirements.txt
      - name: Require full tests on the protected default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py qualify --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)"

  build_candidate:
    needs: verify_release_commit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      candidate_id: ${{ steps.candidate.outputs.artifact-id }}
      reports_id: ${{ steps.reports.outputs.artifact-id }}
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/build/security-registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: tests/admission/go.sum
      - name: Install reviewed tools
        run: |
          mkdir -p "$DOCKER_CONFIG"
          python3 -m pip install --only-binary=':all:' --require-hashes -r scripts/requirements.txt -r tools/requirements.txt
          python3 scripts/install-tools.py crossplane crane trivy gitleaks govulncheck
      - name: Build versioned package candidate
        run: python3 scripts/security.py prepare --version "$GITHUB_REF_NAME" --commit "$(git rev-parse HEAD)"
      - name: Save checked package and source inputs
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/candidate/
          retention-days: 7
          if-no-files-found: error
      - name: Scan saved artifacts
        run: python3 scripts/security.py scan
      - name: Retain reports and CycloneDX SBOMs
        id: reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/security/
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: [verify_release_commit, build_candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/build/publication-registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build_candidate.outputs.candidate_id }}
          merge-multiple: true
          path: build/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build_candidate.outputs.reports_id }}
          merge-multiple: true
          path: build/security
      - name: Verify saved candidate and scan records
        run: |
          python3 -m pip install --only-binary=':all:' --require-hashes -r scripts/requirements.txt
          python3 scripts/install-tools.py crane
          python3 scripts/security.py verify
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish verified package and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ needs.build_candidate.outputs.candidate_id }}
          REPORTS_ID: ${{ needs.build_candidate.outputs.reports_id }}
        run: |
          python3 scripts/release.py publish --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --commit "$(git rev-parse HEAD)" --candidate-id "$CANDIDATE_ID" --reports-id "$REPORTS_ID" --run-id "$GITHUB_RUN_ID"

  build_docs:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false
      - name: Install documentation tools
        run: |
          python3 -m pip install --only-binary=':all:' --require-hashes -r docs/requirements.txt
          python3 scripts/install-tools.py crdoc
          echo "$PWD/build/tools" >> "$GITHUB_PATH"

      - name: Generate API docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          crd = yaml.safe_load(Path("xrd.yaml").read_text())
          crd["apiVersion"] = "apiextensions.k8s.io/v1"
          crd["kind"] = "CustomResourceDefinition"
          # Document the referenceable API version.
          crd["spec"]["versions"] = [v for v in crd["spec"]["versions"] if v.get("referenceable")]
          Path("/tmp/datalab-api-crd.yaml").write_text(yaml.safe_dump(crd))
          PY
          crdoc -r /tmp/datalab-api-crd.yaml -o docs/reference-guides/api.md

      - name: Replace Crossplane Configuration version with tag
        run: |
          TAG="${GITHUB_REF_NAME##*/}"
          find docs -type f -name "*.md" -exec sed -i "s/<!version!>/${TAG}/g" {} +

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git fetch origin gh-pages --depth=1
          TAG="$GITHUB_REF_NAME"
          newest="$(mike list --branch gh-pages --json | python3 -c '
          import json, re, sys
          versions = [item["version"] for item in json.load(sys.stdin)]
          stable = [value for value in versions if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", value)]
          print(max(stable, key=lambda value: tuple(map(int, value.split(".")))) if stable else "0.0.0")')"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && \
             python3 -c 'import sys; sys.exit(tuple(map(int, sys.argv[1].split("."))) < tuple(map(int, sys.argv[2].split("."))))' "$TAG" "$newest"; then
            mike deploy -b gh-pages "$TAG" latest --update-alias --push
            mike set-default -b gh-pages latest --push
          else
            mike deploy -b gh-pages "$TAG" --push
          fi
