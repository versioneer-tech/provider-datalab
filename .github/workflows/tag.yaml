name: Publish Provider Datalab
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"                # 1.2.3
      - "[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"   # 1.2.3-alpha.1
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"    # 1.2.3-beta.1
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"      # 1.2.3-rc.1

jobs:
  verify_release_commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_branch: ${{ steps.tests.outputs.release_branch }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7

      - name: Verify successful release-branch tests
        id: tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          for release_branch in main legacy; do
            workflow_runs="$(
              curl --fail --silent --show-error --location --get \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-urlencode "branch=${release_branch}" \
                --data-urlencode "event=push" \
                --data-urlencode "head_sha=${release_commit}" \
                --data-urlencode "status=success" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/pr.yaml/runs"
            )"

            if jq -e --arg commit "${release_commit}" --arg branch "${release_branch}" \
              '.workflow_runs | any(.head_sha == $commit and .head_branch == $branch
                and .event == "push" and .conclusion == "success")' \
              <<<"${workflow_runs}" >/dev/null; then
              printf 'release_branch=%s\n' "${release_branch}" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
          done

          printf 'Release commit %s has no successful main or legacy push Tests workflow run.\n' \
            "${release_commit}" >&2
          exit 1

  build_and_publish_configuration_packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: verify_release_commit
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Crossplane CLI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/crossplane/crossplane/v2.4.1/install.sh \
            --output /tmp/crossplane-install.sh
          XP_VERSION=v2.4.1 sh /tmp/crossplane-install.sh
          sudo install crossplane /usr/local/bin/crossplane

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Build and publish datalab Configuration Package
        shell: bash
        run: |
          set -euo pipefail
          ORG="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"; REPO="${REPO,,}"
          TAG="${GITHUB_REF_NAME##*/}"

          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/build-composition.py --check
          package_root="$(mktemp -d)"
          cp xrd.yaml composition.yaml crossplane.yaml "${package_root}/"

          crossplane xpkg build \
            --package-root="${package_root}" \
            --package-file "${package_root}/datalab.xpkg" \
            --verbose

          crossplane xpkg push \
            --package-files="${package_root}/datalab.xpkg" \
            "ghcr.io/${ORG}/${REPO}:${TAG}" \
            --verbose

  build_docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [verify_release_commit, build_and_publish_configuration_packages]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install mkdocs dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Set up Go (for crdoc)
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Install crdoc
        run: go install fybrik.io/crdoc@v0.6.4

      - name: Generate API docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          crd = yaml.safe_load(Path("xrd.yaml").read_text())
          crd["apiVersion"] = "apiextensions.k8s.io/v1"
          crd["kind"] = "CustomResourceDefinition"
          # Document the referenceable API version.
          crd["spec"]["versions"] = [v for v in crd["spec"]["versions"] if v.get("referenceable")]
          Path("/tmp/datalab-api-crd.yaml").write_text(yaml.safe_dump(crd))
          PY
          crdoc -r /tmp/datalab-api-crd.yaml -o docs/reference-guides/api.md

      - name: Replace Crossplane Configuration version with tag
        run: |
          TAG="${GITHUB_REF_NAME##*/}"
          find docs -type f -name "*.md" -exec sed -i "s/<!version!>/${TAG}/g" {} +

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish docs to GitHub Pages (gh-pages via mike)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ needs.verify_release_commit.outputs.release_branch }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1 || true
          TAG="${GITHUB_REF_NAME##*/}"
          if [[ "${RELEASE_BRANCH}" == main && "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            mike deploy -b gh-pages "${TAG}" latest --update-alias --push
            mike set-default -b gh-pages latest --push
          else
            mike deploy -b gh-pages "${TAG}" --push
          fi
