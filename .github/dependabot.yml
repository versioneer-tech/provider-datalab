version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ci
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pip
    directories: [/docs, /scripts, /tools]
    commit-message:
      prefix: chore
    schedule:
      interval: weekly
    groups:
      python:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ['/templates/**']
    commit-message:
      prefix: chore
    schedule:
      interval: cron
      cronjob: '0 5 * * *'
    # The daily report lists majors for separate manual update pull requests.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      runtime-images:
        applies-to: version-updates
        patterns: ['*']
