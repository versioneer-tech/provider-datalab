apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: datalabs.versioneer.at
spec:
  group: versioneer.at
  names:
    kind: Datalab
    plural: datalabs
  scope: Namespaced
  defaultCompositionRef:
    name: datalab
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          description: A Datalab is a tenant-facing, namespaced composite resource. It defines membership, data services, and virtual clusters.
          required:
            - spec
          properties:
            spec:
              type: object
              description: Desired configuration of the datalab.
              required:
                - users
              properties:
                environmentName:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                  description: Optional EnvironmentConfig name. Use a lowercase DNS name with 1 to 63 characters. See the installation guide for selection rules.
                users:
                  type: array
                  description: Users associated with this datalab.
                  items:
                    type: string
                  default: []
                userOverrides:
                  type: object
                  description: >
                    Optional per-user override configuration.
                  additionalProperties:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - admin
                          - user
                        description: Assigned role for the user.
                      grantedAt:
                        type: string
                        format: date-time
                        description: >
                          RFC3339 timestamp indicating when the role became active.
                  default: {}
                volumes:
                  type: object
                  default: {}
                  maxProperties: 50
                  description: Named PVCs with optional CSI snapshots in the Datalab host namespace, independent of virtual clusters.
                  x-kubernetes-validations:
                  - rule: 'self.all(k, size(k) <= 40 && k.matches("^[a-z]([a-z0-9-]*[a-z0-9])?$"))'
                    message: Volume names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens, end with a letter or digit, and have at most 40 characters.
                  additionalProperties:
                    type: object
                    properties:
                      storage:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+|[EPTGMK]i|[EPTGMkmun])?$'
                        description: Volume size. Defaults to the platform volume size, or 1Gi.
                      backups:
                        type: boolean
                        default: false
                        description: Enable scheduled CSI snapshots. The environment sets the class, schedule, and retention.
                      restoreFrom:
                        type: string
                        maxLength: 253
                        pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
                        description: Existing VolumeSnapshot in the Datalab host namespace to restore into this new volume.
                    x-kubernetes-validations:
                    - rule: 'has(self.restoreFrom) == has(oldSelf.restoreFrom) && (!has(self.restoreFrom) || self.restoreFrom == oldSelf.restoreFrom)'
                      message: A volume restore source cannot change after creation.
                vclusters:
                  type: object
                  default: {}
                  maxProperties: 20
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  additionalProperties:
                    type: object
                    description: Virtual Kubernetes clusters keyed by instance name.
                    properties:
                      hibernated:
                        type: boolean
                        default: false
                        description: Stop this instance and its synced Pods. Keep its storage. Set false to resume from the host Datalab.
                      groups:
                        type: array
                        description: Additional profiles granted to Datalab users and administrators. Only Datalab administrators receive the built-in cluster-admin profile.
                        maxItems: 20
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys:
                        - name
                        items:
                          type: object
                          required:
                          - name
                          - namespace
                          - role
                          x-kubernetes-validations:
                          - rule: (self.namespace == "*") == (self.role == "cluster-admin")
                            message: cluster-admin requires namespace '*'; other roles require a namespace.
                          - rule: self.name != "cluster-admin" || (self.namespace == "*" && self.role == "cluster-admin")
                            message: The built-in cluster-admin profile cannot be changed.
                          properties:
                            name:
                              type: string
                              description: Profile name used for its Keycloak role and connection set.
                              maxLength: 40
                              pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                            namespace:
                              type: string
                              description: Virtual namespace to create, or '*' for virtual cluster administration.
                              maxLength: 63
                              pattern: ^(\*|[a-z]([a-z0-9-]*[a-z0-9])?)$
                              x-kubernetes-validations:
                              - rule: self != "default" && !self.startsWith("kube-")
                                message: Select a workload namespace, not a Kubernetes system namespace.
                            role:
                              type: string
                              description: Kubernetes ClusterRole granted to this profile.
                              enum:
                              - view
                              - edit
                              - admin
                              - cluster-admin
                      secretBindings:
                        type: array
                        default: []
                        maxItems: 100
                        description: Datalab connection Secrets to sync into this virtual cluster.
                        items:
                          type: object
                          required: [type, name, target]
                          properties:
                            type:
                              type: string
                              enum: [s3, postgres, redis, registry, custom]
                              description: Datalab connection type.
                            name:
                              type: string
                              maxLength: 253
                              pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                              description: Service instance, primary for storage, or a predefined custom Secret name.
                            target:
                              type: object
                              required: [namespace, name]
                              properties:
                                namespace:
                                  type: string
                                  maxLength: 63
                                  pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                                name:
                                  type: string
                                  maxLength: 253
                                  pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      volumeBindings:
                        type: array
                        default: []
                        maxItems: 50
                        description: Named host volumes to expose as PVCs in this virtual cluster. Requires host mutating admission policies.
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys: [name]
                        items:
                          type: object
                          required: [name, target]
                          properties:
                            name:
                              type: string
                              maxLength: 40
                              pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                              description: A name declared in spec.volumes.
                            target:
                              type: object
                              required: [namespace, name]
                              properties:
                                namespace:
                                  type: string
                                  maxLength: 63
                                  pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                                  x-kubernetes-validations:
                                  - rule: '!self.startsWith("kube-")'
                                    message: A volume binding must use a workload namespace.
                                name:
                                  type: string
                                  maxLength: 63
                                  pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                                  description: PVC name in the virtual namespace.
                      storage:
                        type: string
                        description: Control-plane PVC size. The environment default is used when omitted.
                stores:
                  type: object
                  default: {}
                  maxProperties: 100
                  description: Managed service instances keyed by name. Names below each instance select PostgreSQL databases, or Redis key prefixes.
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  additionalProperties:
                    type: object
                    required: [type, storage]
                    properties:
                      type:
                        type: string
                        enum: [postgres, redis]
                        description: Service type, also used in status.connections.
                        x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: Store type cannot change. Use a new instance name for another service type.
                      names:
                        type: array
                        default: [default]
                        minItems: 1
                        maxItems: 100
                        x-kubernetes-list-type: atomic
                        items:
                          type: string
                          minLength: 1
                        description: PostgreSQL database names, or Redis key prefixes without the final colon. Defaults to one name, default. Names share the instance credentials; Redis prefixes are not an access boundary.
                      storage:
                        type: string
                        pattern: '^\+?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$'
                        description: Data PVC size as a Kubernetes quantity, such as 1Gi.
                      backups:
                        type: boolean
                        default: false
                        description: Enable CSI snapshots. The environment sets the class, schedule, and retention. PostgreSQL pauses the instance; Redis pauses writes and saves an RDB file. There is no point-in-time recovery.
            status:
              type: object
              description: Current observed state of the datalab.
              properties:
                vclusters:
                  type: array
                  description: Instance lifecycle state. Hibernated means the control plane and synced host Pods are gone.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, phase, message]
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                        enum: [Starting, Running, Hibernating, Hibernated, Resuming, Failed]
                      message:
                        type: string
                      cleanupJob:
                        type: string
                      cleanupGeneration:
                        type: integer
                        format: int64
                      observedGeneration:
                        type: integer
                        format: int64
                volumes:
                  type: array
                  description: Host PVC state and completed snapshot backups for each named volume.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, pvcRef, phase]
                    properties:
                      name:
                        type: string
                      pvcRef:
                        type: object
                        required: [name, namespace]
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                      phase:
                        type: string
                        enum: [Pending, Bound, Lost]
                      backup:
                        type: object
                        required: [readySnapshots]
                        properties:
                          readySnapshots:
                            type: integer
                            minimum: 0
                            description: Ready snapshots for the current PVC UID, excluding snapshots being deleted.
                          lastSuccessfulTime:
                            type: string
                            format: date-time
                            description: Creation time of the latest ready snapshot. Absent until a snapshot is ready.
                oauth2:
                  type: array
                  description: OAuth2 discovery by client ID. Contains metadata and Secret references only.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type, issuerUrl, secretRef, ready]
                    properties:
                      name:
                        type: string
                        description: OAuth2 client ID.
                      type:
                        type: string
                        enum: [client]
                      issuerUrl:
                        type: string
                      secretRef:
                        type: object
                        required: [name, namespace]
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                      ready:
                        type: boolean
                connections:
                  type: array
                  description: Service and virtual API connection metadata. Managed service and custom connections are ready when their published Secret in the Datalab namespace matches the available source. Readiness does not confirm delivery into a virtual cluster or caller authorization.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type, name]
                  items:
                    type: object
                    required: [name, type, ready, secretRef]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [s3, postgres, redis, registry, custom, vcluster]
                      names:
                        type: array
                        items:
                          type: string
                        description: Logical database names or Redis key prefixes for a managed store instance.
                      instance:
                        type: string
                      group:
                        type: string
                      targetNamespace:
                        type: string
                      role:
                        type: string
                      endpoint:
                        type: string
                      region:
                        type: string
                        description: S3 region, when configured.
                      ready:
                        type: boolean
                      secretRef:
                        type: object
                        required: [name, namespace]
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
