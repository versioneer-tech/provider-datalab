apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: datalabs.versioneer.at
spec:
  group: versioneer.at
  names:
    kind: Datalab
    plural: datalabs
  scope: Namespaced
  defaultCompositionRef:
    name: datalab
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          description: A Datalab is a tenant-facing, namespaced composite resource. It defines membership, data services, and virtual clusters.
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              description: Desired configuration of the datalab.
              required:
                - users
              x-kubernetes-validations:
              - rule: '!has(self.sessions) || self.sessions.all(s, has(self.vclusters) && s.vcluster in self.vclusters)'
                message: Each session must select a declared virtual cluster.
              properties:
                users:
                  type: array
                  description: Users associated with this datalab.
                  items:
                    type: string
                  default: []
                userOverrides:
                  type: object
                  description: >
                    Optional per-user override configuration.
                  additionalProperties:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - admin
                          - user
                        description: Assigned role for the user.
                      grantedAt:
                        type: string
                        format: date-time
                        description: >
                          RFC3339 timestamp indicating when the role became active.
                  default: {}
                sessions:
                  type: array
                  default: []
                  maxItems: 50
                  description: Durable workspace PVCs inside named virtual clusters. Workloads use the PVC independently; public session URLs are not provided.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, vcluster]
                    properties:
                      name:
                        type: string
                        maxLength: 40
                        pattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
                      vcluster:
                        type: string
                        maxLength: 63
                        x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: A session cannot move to another virtual cluster.
                      namespace:
                        type: string
                        default: default
                        maxLength: 63
                        pattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
                        x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: A session cannot move to another namespace.
                        - rule: '!self.startsWith("kube-") && self != "agent-sandbox-system"'
                          message: Sessions must use a workload namespace.
                      pvcSize:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+|[EPTGMK]i|[EPTGMkmun])?$'
                        description: PVC size. Defaults to the platform session size, or 1Gi.
                vclusters:
                  type: object
                  default: {}
                  maxProperties: 20
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  additionalProperties:
                    type: object
                    description: Virtual Kubernetes clusters keyed by instance name.
                    properties:
                      groups:
                        type: array
                        description: Additional profiles granted to Datalab users and administrators. Only Datalab administrators receive the built-in cluster-admin profile.
                        maxItems: 20
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys:
                        - name
                        items:
                          type: object
                          required:
                          - name
                          - namespace
                          - role
                          x-kubernetes-validations:
                          - rule: (self.namespace == "*") == (self.role == "cluster-admin")
                            message: cluster-admin requires namespace '*'; other roles require a namespace.
                          - rule: self.name != "cluster-admin" || (self.namespace == "*" && self.role == "cluster-admin")
                            message: The built-in cluster-admin profile cannot be changed.
                          properties:
                            name:
                              type: string
                              description: Profile name used for its Keycloak role and connection set.
                              maxLength: 40
                              pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                            namespace:
                              type: string
                              description: Virtual namespace to create, or '*' for virtual cluster administration.
                              maxLength: 63
                              pattern: ^(\*|[a-z]([a-z0-9-]*[a-z0-9])?)$
                              x-kubernetes-validations:
                              - rule: self != "default" && !self.startsWith("kube-")
                                message: Select a workload namespace, not a Kubernetes system namespace.
                            role:
                              type: string
                              description: Kubernetes ClusterRole granted to this profile.
                              enum:
                              - view
                              - edit
                              - admin
                              - cluster-admin
                      secretBindings:
                        type: array
                        default: []
                        maxItems: 100
                        description: Datalab connection Secrets to sync into this virtual cluster.
                        items:
                          type: object
                          required: [type, name, target]
                          properties:
                            type:
                              type: string
                              enum: [s3, postgres, mongo, redis, registry, custom]
                              description: Datalab connection type.
                            name:
                              type: string
                              maxLength: 253
                              pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                              description: Service instance, primary for storage, or a predefined custom Secret name.
                            target:
                              type: object
                              required: [namespace, name]
                              properties:
                                namespace:
                                  type: string
                                  maxLength: 63
                                  pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                                name:
                                  type: string
                                  maxLength: 253
                                  pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      storage:
                        type: string
                        description: Control-plane PVC size. The environment default is used when omitted.
                databases:
                  type: object
                  maxProperties: 100
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  description: >-
                    PostgreSQL clusters with data storage, optional backup storage, and named databases.
                    The operator creates the databases for the postgres account and adds logins from spec.users.
                    Application setup manages additional ownership and grants.
                  additionalProperties:
                    type: object
                    properties:
                      names:
                        type: array
                        description: >-
                          Logical PostgreSQL database names to create within this host (e.g., "prod", "dev").
                        items:
                          type: string
                        minItems: 1
                      type:
                        type: string
                        description: Service type.
                        enum: [postgres]
                        default: postgres
                      storage:
                        type: string
                        description: >-
                          Storage size for the PostgreSQL data PVC of this PostgresCluster as a Kubernetes quantity
                          (e.g., "1Gi", "10Gi").
                      backupStorage:
                        type: string
                        default: "0"
                        pattern: '^\+?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$'
                        description: >-
                          Storage size for the pgBackRest repository PVC (backup volume, including WAL archive) as a
                          Kubernetes quantity (e.g., "10Gi", "100Gi"). Zero or an omitted value disables backups.
                    required:
                      - type
                      - names
                      - storage
                  default: {}
                documentStores:
                  type: object
                  maxProperties: 100
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  description: >-
                    Optional document stores for this datalab, implemented via MongoDB
                    and managed through the MongoDB Kubernetes operator.
                  default: {}
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Service type.
                        enum: [mongo]
                        default: mongo
                      storage:
                        type: string
                        description: >-
                          Storage size for MongoDB persistent data volume as a Kubernetes quantity
                          (e.g., "5Gi", "20Gi"). Effective default: "10Gi".
                      backupStorage:
                        type: string
                        default: "0"
                        pattern: '^\+?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$'
                        description: >-
                          Storage size for the MongoDB backup PVC as a Kubernetes quantity.
                          A positive value enables daily full backups with mongodump and the oplog.
                          Zero or an omitted value disables backups.
                    required:
                      - type
                      - storage
                cacheStores:
                  type: object
                  maxProperties: 100
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  description: >-
                    Optional cache stores for this datalab, implemented via Redis
                    and managed through the Redis Kubernetes operator.
                  default: {}
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Service type.
                        enum: [redis]
                        default: redis
                      storage:
                        type: string
                        description: >-
                          Storage size for Redis persistent data volume as a Kubernetes quantity
                          (e.g., "1Gi", "10Gi"). Effective default: "1Gi".
                      backupStorage:
                        type: string
                        default: "0"
                        pattern: '^\+?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$'
                        description: >-
                          Storage size for the Redis backup PVC as a Kubernetes quantity.
                          A positive value enables daily full RDB snapshots.
                          Zero or an omitted value disables backups.
                    required:
                      - type
                      - storage
            status:
              type: object
              description: Current observed state of the datalab.
              properties:
                sessions:
                  type: array
                  description: Session PVC references inside virtual clusters.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, vcluster, namespace, pvcName]
                    properties:
                      name:
                        type: string
                      vcluster:
                        type: string
                      namespace:
                        type: string
                      pvcName:
                        type: string
                oauth2:
                  type: array
                  description: OAuth2 discovery by client ID. Contains metadata and Secret references only.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type, issuerUrl, secretRef, ready]
                    properties:
                      name:
                        type: string
                        description: OAuth2 client ID.
                      type:
                        type: string
                        enum: [client]
                      issuerUrl:
                        type: string
                      secretRef:
                        type: object
                        required: [name, namespace]
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                      ready:
                        type: boolean
                connections:
                  type: array
                  description: Service and virtual API connection metadata. Managed service and custom connections are ready when their published Secret in the Datalab namespace matches the available source. Readiness does not confirm delivery into a virtual cluster or caller authorization.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type, name]
                  items:
                    type: object
                    required: [name, type, ready, secretRef]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [s3, postgres, mongo, redis, registry, custom, vcluster]
                      instance:
                        type: string
                      group:
                        type: string
                      targetNamespace:
                        type: string
                      role:
                        type: string
                      endpoint:
                        type: string
                      region:
                        type: string
                        description: S3 region, when configured.
                      ready:
                        type: boolean
                      secretRef:
                        type: object
                        required: [name, namespace]
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
