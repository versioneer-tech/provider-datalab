apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: datalabs.pkg.internal
spec:
  group: pkg.internal
  names:
    kind: Datalab
    plural: datalabs
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      referenceable: false
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
    - name: v1beta2
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          description: A Datalab is a tenant-facing, namespaced composite resource. It defines membership, sessions, and data services.
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              description: Desired configuration of the datalab.
              required:
                - users
              properties:
                secretName:
                  type: string
                  description: >-
                    Name of the Secret containing the credentials to access the
                    storage associated with this Datalab. If omitted, the
                    Datalab name is used. The Secret is read from the namespace
                    configured in EnvironmentConfig.data.storage.secretNamespace,
                    which is usually the same namespace as the Datalab.
                users:
                  type: array
                  description: Users associated with this datalab.
                  items:
                    type: string
                  default: []
                userOverrides:
                  type: object
                  description: >
                    Optional per-user override configuration.
                  additionalProperties:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - admin
                          - user
                        description: Assigned role for the user.
                      grantedAt:
                        type: string
                        format: date-time
                        description: >
                          RFC3339 timestamp indicating when the role became active.
                  default: {}
                sessions:
                  type: array
                  description: Sessions declared for this datalab.
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: Session name.
                      state:
                        type: string
                        description: >
                          Desired runtime lifecycle for this session. Started sessions create an
                          active runtime session. Stopped sessions keep their Datalab-owned
                          workspace PVC but do not create a runtime.
                        enum:
                          - started
                          - stopped
                        default: started
                  default: []
                databases:
                  type: object
                  description: >-
                    Optional PostgreSQL hosts (PostgresCluster instances) to provision for this datalab.
                    Each host defines a data volume size and a pgBackRest repository size, plus a list of
                    logical PostgreSQL databases to create inside that cluster. Ownership and privileges are
                    derived from spec.users by the Composition.
                  additionalProperties:
                    type: object
                    properties:
                      names:
                        type: array
                        description: >-
                          Logical PostgreSQL database names to create within this host (e.g., "prod", "dev").
                        items:
                          type: string
                        minItems: 1
                      type:
                        type: string
                        description: Service type.
                        enum: [postgres]
                        default: postgres
                      storage:
                        type: string
                        description: >-
                          Storage size for the PostgreSQL data PVC of this PostgresCluster as a Kubernetes quantity
                          (e.g., "1Gi", "10Gi").
                      backupStorage:
                        type: string
                        description: >-
                          Storage size for the pgBackRest repository PVC (backup volume, including WAL archive) as a
                          Kubernetes quantity (e.g., "10Gi", "100Gi").
                    required:
                      - type
                      - names
                      - storage
                      - backupStorage
                  default: {}
                documentStores:
                  type: object
                  description: >-
                    Optional document stores for this datalab, implemented via MongoDB
                    and managed through the MongoDB Kubernetes operator.
                  default: {}
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Service type.
                        enum: [mongo]
                        default: mongo
                      storage:
                        type: string
                        description: >-
                          Storage size for MongoDB persistent data volume as a Kubernetes quantity
                          (e.g., "5Gi", "20Gi"). Effective default: "10Gi".
                    required:
                      - type
                      - storage
                cacheStores:
                  type: object
                  description: >-
                    Optional cache stores for this datalab, implemented via Redis
                    and managed through the Redis Kubernetes operator.
                  default: {}
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Service type.
                        enum: [redis]
                        default: redis
                      storage:
                        type: string
                        description: >-
                          Storage size for Redis persistent data volume as a Kubernetes quantity
                          (e.g., "1Gi", "10Gi"). Effective default: "1Gi".
                    required:
                      - type
                      - storage
                vectorStores:
                  type: object
                  description: >-
                    Optional vector stores for this datalab, implemented via Qdrant
                    and managed through the Qdrant Kubernetes operator.
                  default: {}
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Service type.
                        enum: [qdrant]
                        default: qdrant
                      storage:
                        type: string
                        description: >-
                          Storage size for Qdrant persistent data volume as a Kubernetes quantity
                          (e.g., "1Gi", "10Gi"). Effective default: "1Gi".
                    required:
                      - type
                      - storage
            status:
              type: object
              description: Current observed state of the datalab.
              properties:
                sessions:
                  type: object
                  description: Map of session IDs and their lifecycle state and runtime details.
                  additionalProperties:
                    type: object
                    description: Observed state of a single datalab session.
                    properties:
                      state:
                        type: string
                        description: Desired lifecycle state for the declared session.
                        enum:
                          - started
                          - stopped
                      phase:
                        type: string
                        description: Latest observed lifecycle phase for the session runtime.
                      message:
                        type: string
                        description: Latest observed status message for the session runtime.
                      url:
                        type: string
                        description: Public URL of the active session.
                connections:
                  type: array
                  description: Reserved connection sets. The Educates runtime does not populate this field.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type, ready, secretRef]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [s3, postgres, mongo, redis, qdrant, vcluster]
                      group:
                        type: string
                      targetNamespace:
                        type: string
                      role:
                        type: string
                      endpoint:
                        type: string
                      ready:
                        type: boolean
                      secretRef:
                        type: object
                        required: [name, namespace]
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
