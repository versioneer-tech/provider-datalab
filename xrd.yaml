apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: datalabs.pkg.internal
spec:
  group: pkg.internal
  names:
    kind: Datalab
    plural: datalabs
  scope: Namespaced
  defaultCompositionRef:
    name: datalab
  versions:
    - name: v1beta1
      served: true
      referenceable: false
      deprecated: true
      deprecationWarning: pkg.internal/v1beta1 Datalab is deprecated; use pkg.internal/v1.
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
    - name: v1beta2
      served: true
      referenceable: false
      deprecated: true
      deprecationWarning: pkg.internal/v1beta2 Datalab is deprecated; use pkg.internal/v1.
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          description: A Datalab is a tenant-facing, namespaced composite resource. It defines membership, storage access, managed data services, and virtual clusters.
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              description: Desired configuration of the datalab.
              required:
                - users
              properties:
                secretName:
                  type: string
                  description: >-
                    Name of the Secret containing the credentials to access the
                    storage associated with this Datalab. If omitted, the
                    Datalab name is used. The Secret is read from the namespace
                    configured in EnvironmentConfig.data.storage.secretNamespace,
                    which is usually the same namespace as the Datalab.
                users:
                  type: array
                  description: Users associated with this datalab.
                  items:
                    type: string
                  default: []
                userOverrides:
                  type: object
                  description: >
                    Optional per-user override configuration.
                  additionalProperties:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - admin
                          - user
                        description: Assigned role for the user.
                      grantedAt:
                        type: string
                        format: date-time
                        description: >
                          RFC3339 timestamp indicating when the role became active.
                  default: {}
                vclusters:
                  type: object
                  default: {}
                  maxProperties: 20
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  additionalProperties:
                    type: object
                    description: Virtual Kubernetes clusters keyed by instance name.
                    properties:
                      groups:
                        type: array
                        description: Access profiles with separate kubeconfigs and Kubernetes RBAC.
                        maxItems: 20
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys:
                        - name
                        items:
                          type: object
                          required:
                          - name
                          - namespace
                          - role
                          x-kubernetes-validations:
                          - rule: (self.namespace == "*") == (self.role == "cluster-admin")
                            message: cluster-admin requires namespace '*'; other roles require a namespace.
                          properties:
                            name:
                              type: string
                              description: Profile name used for its Keycloak role and connection set.
                              maxLength: 40
                              pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                            namespace:
                              type: string
                              description: Virtual namespace to create, or '*' for virtual cluster administration.
                              maxLength: 63
                              pattern: ^(\*|[a-z]([a-z0-9-]*[a-z0-9])?)$
                              x-kubernetes-validations:
                              - rule: self != "default" && !self.startsWith("kube-")
                                message: Select a workload namespace, not a Kubernetes system namespace.
                            role:
                              type: string
                              description: Kubernetes ClusterRole granted to this profile.
                              enum:
                              - view
                              - edit
                              - admin
                              - cluster-admin
                        minItems: 1
                      secretBindings:
                        type: object
                        description: Selected operator-approved Secrets delivered into virtual namespaces.
                        default: {}
                        maxProperties: 100
                        x-kubernetes-validations:
                        - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                          message: Binding names must be Kubernetes label names.
                        additionalProperties:
                          type: object
                          required:
                          - export
                          - target
                          - keys
                          properties:
                            export:
                              type: string
                              maxLength: 63
                              pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                              description: Export alias in EnvironmentConfig.data.secretExports.
                            target:
                              type: object
                              required:
                              - namespace
                              - name
                              properties:
                                namespace:
                                  type: string
                                  maxLength: 63
                                  pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                                  x-kubernetes-validations:
                                  - rule: self != "default" && !self.startsWith("kube-")
                                    message: Select a workload namespace, not a Kubernetes system namespace.
                                name:
                                  type: string
                                  maxLength: 63
                                  pattern: ^[a-z]([a-z0-9-]*[a-z0-9])?$
                            keys:
                              type: object
                              minProperties: 1
                              maxProperties: 100
                              x-kubernetes-validations:
                              - rule: self.all(k, k.matches('^[-._a-zA-Z0-9]+$'))
                                message: Source keys must be valid Secret data keys.
                              additionalProperties:
                                type: string
                                minLength: 1
                                maxLength: 253
                                pattern: ^[-._a-zA-Z0-9]+$
                      storage:
                        type: string
                        description: Control-plane PVC size. The environment default is used when omitted.
                    required:
                    - groups
                databases:
                  type: object
                  maxProperties: 100
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  description: >-
                    Optional PostgreSQL hosts (PostgresCluster instances) to provision for this datalab.
                    Each host defines a data volume size and an optional pgBackRest repository size, plus a list of
                    logical PostgreSQL databases to create inside that cluster. Ownership and privileges are
                    derived from spec.users by the Composition.
                  additionalProperties:
                    type: object
                    properties:
                      names:
                        type: array
                        description: >-
                          Logical PostgreSQL database names to create within this host (e.g., "prod", "dev").
                        items:
                          type: string
                        minItems: 1
                      type:
                        type: string
                        description: Service type.
                        enum: [postgres]
                        default: postgres
                      storage:
                        type: string
                        description: >-
                          Storage size for the PostgreSQL data PVC of this PostgresCluster as a Kubernetes quantity
                          (e.g., "1Gi", "10Gi").
                      backupStorage:
                        type: string
                        default: "0"
                        pattern: '^\+?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$'
                        description: >-
                          Storage size for the pgBackRest repository PVC (backup volume, including WAL archive) as a
                          Kubernetes quantity (e.g., "10Gi", "100Gi"). Zero or an omitted value disables backups.
                    required:
                      - type
                      - names
                      - storage
                  default: {}
                documentStores:
                  type: object
                  maxProperties: 100
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  description: >-
                    Optional document stores for this datalab, implemented via MongoDB
                    and managed through the MongoDB Kubernetes operator.
                  default: {}
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Service type.
                        enum: [mongo]
                        default: mongo
                      storage:
                        type: string
                        description: >-
                          Storage size for MongoDB persistent data volume as a Kubernetes quantity
                          (e.g., "5Gi", "20Gi"). Effective default: "10Gi".
                      backupStorage:
                        type: string
                        default: "0"
                        pattern: '^\+?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$'
                        description: >-
                          Storage size for the MongoDB backup PVC as a Kubernetes quantity.
                          A positive value enables daily full backups with mongodump and the oplog.
                          Zero or an omitted value disables backups.
                    required:
                      - type
                      - storage
                cacheStores:
                  type: object
                  maxProperties: 100
                  x-kubernetes-validations:
                  - rule: self.all(k, size(k) <= 63 && k.matches('^[a-z]([a-z0-9-]*[a-z0-9])?$'))
                    message: Instance names must start with a lowercase letter, contain only lowercase letters, digits, or hyphens,
                      end with a letter or digit, and have at most 63 characters.
                  description: >-
                    Optional cache stores for this datalab, implemented via Redis
                    and managed through the Redis Kubernetes operator.
                  default: {}
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Service type.
                        enum: [redis]
                        default: redis
                      storage:
                        type: string
                        description: >-
                          Storage size for Redis persistent data volume as a Kubernetes quantity
                          (e.g., "1Gi", "10Gi"). Effective default: "1Gi".
                      backupStorage:
                        type: string
                        default: "0"
                        pattern: '^\+?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eE][+-]?[0-9]+|[numkMGTPE]|[KMGTPE]i)?$'
                        description: >-
                          Storage size for the Redis backup PVC as a Kubernetes quantity.
                          A positive value enables daily full RDB snapshots.
                          Zero or an omitted value disables backups.
                    required:
                      - type
                      - storage
            status:
              type: object
              description: Current observed state of the datalab.
              properties:
                secretBindings:
                  type: array
                  description: Observed delivery of approved Secrets into virtual namespaces.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                  - instance
                  - name
                  items:
                    type: object
                    required:
                    - instance
                    - name
                    - export
                    - target
                    - ready
                    - reason
                    properties:
                      instance:
                        type: string
                      name:
                        type: string
                      export:
                        type: string
                      target:
                        type: object
                        required:
                        - namespace
                        - name
                        properties:
                          namespace:
                            type: string
                          name:
                            type: string
                      ready:
                        type: boolean
                      reason:
                        type: string
                connections:
                  type: array
                  description: Connection references for storage, managed services, and virtual clusters.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type, ready, secretRef]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [s3, postgres, mongo, redis, vcluster]
                      instance:
                        type: string
                      group:
                        type: string
                      targetNamespace:
                        type: string
                      role:
                        type: string
                      endpoint:
                        type: string
                      ready:
                        type: boolean
                      secretRef:
                        type: object
                        required: [name, namespace]
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
