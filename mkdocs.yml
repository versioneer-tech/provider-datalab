site_name: provider-datalab
site_url: https://versioneer-tech.github.io/provider-datalab/
repo_url: https://github.com/versioneer-tech/provider-datalab
repo_name: versioneer-tech/provider-datalab
copyright: "Copyright &copy; 2026, Versioneer"
nav:
  - Home: index.md
  - How-to guides:
    - Installation: how-to-guides/installation.md
    - Use a Datalab: how-to-guides/usage_concepts.md
    - Authentication: how-to-guides/authentication.md
    - S3 client access: how-to-guides/s3-access.md
    - Connections: how-to-guides/connections.md
    - Virtual clusters: how-to-guides/vcluster.md
    - Additional services: how-to-guides/additional_services.md
  - Security:
    - Overview: security/index.md
    - Workload access: security/workload-access.md
    - Network policies: security/sandbox-controls.md
  - Reference guides:
    - API: reference-guides/api.md
    - Architecture:
      - ADR-001 Datalab as the Public Contract: architecture/0001-use-the-datalab-crd-as-the-workspace-contract.md
      - ADR-002 Managed Database Services: architecture/0002-provide-managed-database-services.md
      - ADR-003 Team Isolation and Service Secrets: architecture/0003-isolate-teams-and-bind-service-secrets.md
plugins:
  - search
  - mike
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
theme:
  name: material
  language: en
  features:
    - content.code.copy
    - search.suggest
    - toc.follow
    - toc.permalink
  logo: imgs/logo.png
  favicon: imgs/favicon.ico
  palette:
    - scheme: default
      primary: white
extra:
  version:
    provider: mike
