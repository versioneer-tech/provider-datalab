apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: ${key}
  namespace: ${xr_namespace}
  annotations:
    crossplane.io/composition-resource-name: ${key}
spec:
  providerConfigRef:
    name: provider-kubernetes
    kind: ProviderConfig
  forProvider:
    manifest: ${valkey_manifest}
  readiness:
    policy: DeriveFromCelQuery
    celQuery: '!has(object.metadata.deletionTimestamp) && has(object.status) && has(object.status.observedGeneration) && object.status.observedGeneration >= object.metadata.generation && has(object.status.readyReplicas) && object.status.readyReplicas == 1 && has(object.status.currentRevision) && has(object.status.updateRevision) && object.status.currentRevision == object.status.updateRevision'
  watch: true
