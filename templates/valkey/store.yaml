apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${workload_name}
  namespace: ${runtime_namespace}
spec:
  replicas: 1
  serviceName: ${workload_name}
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: ${store_name}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: ${store_name}
      annotations:
        datalabs.versioneer.at/valkey-acl-checksum: ${valkey_acl_checksum}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Secret projection can lag behind the StatefulSet update.
      initContainers:
      - name: wait-for-acl
        image: ${valkey_image}
        command:
        - sh
        - -ec
        - |
          attempt=0
          while [ "$attempt" -lt 180 ]; do
            actual="$(base64 "$2" | tr -d '\n' | sha256sum)"
            [ "${actual%% *}" != "$1" ] || exit 0
            attempt=$((attempt + 1))
            sleep 1
          done
          printf 'The current Valkey ACL was not mounted before the deadline.\n' >&2
          exit 1
        - wait-for-acl
        - ${valkey_acl_checksum}
        - /etc/valkey/user.acl
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 32Mi}
        volumeMounts:
        - name: acl
          mountPath: /etc/valkey
          readOnly: true
      containers:
      - name: valkey
        image: ${valkey_image}
        args:
        - valkey-server
        - --bind
        - 0.0.0.0
        - --protected-mode
        - 'yes'
        - --dir
        - /data
        - --maxmemory
        - 256mb
        - --maxmemory-policy
        - noeviction
        - --appendonly
        - 'yes'
        - --appendfsync
        - everysec
        - --save
        - ''
        - --aclfile
        - /etc/valkey/user.acl
        env:
        - name: VALKEYCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: ${valkey_auth_secret_name}
              key: password
        ports:
        - name: valkey
          containerPort: 6379
        startupProbe:
          exec:
            command: [sh, -ec, 'test "$(valkey-cli -h 127.0.0.1 ping)" = PONG']
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        readinessProbe:
          exec:
            command: [sh, -ec, 'test "$(valkey-cli -h 127.0.0.1 ping)" = PONG']
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: [sh, -ec, 'test "$(valkey-cli -h 127.0.0.1 ping)" = PONG']
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: '1', memory: 512Mi}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: acl
          mountPath: /etc/valkey
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ${pvc_name}
      - name: acl
        secret:
          secretName: ${valkey_acl_secret_name}
