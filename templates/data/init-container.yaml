name: ${name}
image: ${package_r_image}
imagePullPolicy: IfNotPresent
command:
- /package-r
args: ${args}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 1000
  runAsGroup: 100
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
volumeMounts:
- name: state
  mountPath: /state
- name: tmp
  mountPath: /tmp
env:
- name: HOME
  value: /tmp
- name: PACKAGE_R_DATABASE
  value: /state/package-r.db
