apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: package-r-dns
  namespace: ${workshop_namespace}
  labels: ${labels}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to: ${dns_targets}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
