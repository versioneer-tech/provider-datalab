name: gateway
image: nginxinc/nginx-unprivileged:1.28-alpine
command:
- nginx
args:
- -g
- daemon off;
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
ports:
- name: s3-gateway
  containerPort: 8080
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 250m
    memory: 64Mi
readinessProbe:
  httpGet:
    path: /_ready
    port: s3-gateway
volumeMounts:
- name: tmp
  mountPath: /tmp
- name: gateway-config
  mountPath: /etc/nginx/nginx.conf
  subPath: nginx.conf
  readOnly: true
