name: gateway
image: nginx/nginx-unprivileged:1.30.8-alpine-slim@sha256:04c98c78c1de60ddeada00d7d2207dcd146ecd07b61b9941c9a5799cfb258d28
command:
- nginx
args:
- -g
- daemon off;
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
ports:
- name: s3-gateway
  containerPort: 8080
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 250m
    memory: 64Mi
readinessProbe:
  httpGet:
    path: /_ready
    port: s3-gateway
startupProbe:
  httpGet:
    path: /_live
    port: s3-gateway
  periodSeconds: 5
  failureThreshold: 30
livenessProbe:
  httpGet:
    path: /_live
    port: s3-gateway
  periodSeconds: 20
  timeoutSeconds: 3
volumeMounts:
- name: tmp
  mountPath: /tmp
- name: gateway-config
  mountPath: /etc/nginx/nginx.conf
  subPath: nginx.conf
  readOnly: true
