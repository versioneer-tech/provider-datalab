name: gateway
image: nginx/nginx-unprivileged:1.30.8-alpine@sha256:637c35e46af7bc0dd3d3bcf7162e004e13ab3b370fde7cd416e2ac410b5a985a
command:
- nginx
args:
- -g
- daemon off;
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
ports:
- name: s3-gateway
  containerPort: 8080
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 250m
    memory: 64Mi
readinessProbe:
  httpGet:
    path: /_ready
    port: s3-gateway
startupProbe:
  httpGet:
    path: /_live
    port: s3-gateway
  periodSeconds: 5
  failureThreshold: 30
livenessProbe:
  httpGet:
    path: /_live
    port: s3-gateway
  periodSeconds: 20
  timeoutSeconds: 3
volumeMounts:
- name: tmp
  mountPath: /tmp
- name: gateway-config
  mountPath: /etc/nginx/nginx.conf
  subPath: nginx.conf
  readOnly: true
