apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: package-r
  namespace: ${runtime_namespace}
  labels: ${labels}
  annotations: ${ingress_annotations}
spec:
  ingressClassName: ${ingress_class}
  rules:
  - host: ${hostname}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: package-r
            port:
              number: 4180
  tls:
  - hosts:
    - ${hostname}
    secretName: ${ingress_secret}
