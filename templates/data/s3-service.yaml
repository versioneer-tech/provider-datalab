apiVersion: v1
kind: Service
metadata:
  name: data-s3
  namespace: ${runtime_namespace}
  labels: ${s3_labels}
spec:
  selector: ${s3_labels}
  ports:
  - name: s3
    port: 8080
    targetPort: s3-gateway
