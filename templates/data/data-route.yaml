apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: data
  namespace: ${workshop_namespace}
spec:
  parentRefs:
  - name: ${gateway_name}
    namespace: ${gateway_namespace}
    sectionName: ${gateway_section}
  hostnames:
  - ${hostname}
  rules: ${route_rules}
