apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: package-r
  namespace: ${runtime_namespace}
  labels: ${labels}
spec:
  podSelector:
    matchLabels: ${labels}
  policyTypes:
  - Ingress
  - Egress
  ingress: ${ingress_rules}
  egress: ${egress_rules}
