apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${backup_name}
  namespace: ${workshop_ns}
spec:
  schedule: 0 1 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ${mongo_image}
            command: [/bin/sh, -ec]
            args:
            - |
              umask 077
              archive="/backup/dump-$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
              partial="/backup/dump.partial"
              trap 'rm -f "$partial"' EXIT
              mongodump --host="$BACKUP_HOST" --username="$BACKUP_USER" \
                --authenticationDatabase=admin --config=/auth/config.yaml \
                --oplog --gzip --archive="$partial"
              mv "$partial" "$archive"
              find /backup -maxdepth 1 -type f -name 'dump-*.archive.gz' -printf '%f\n' \
                | sort -r | tail -n +5 | while IFS= read -r old; do rm "/backup/$old"; done
            env:
            - name: BACKUP_HOST
              value: ${backup_host}
            - name: BACKUP_USER
              value: ${backup_username}
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            volumeMounts:
            - name: backup
              mountPath: /backup
            - name: auth
              mountPath: /auth
              readOnly: true
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: ${backup_name}
          - name: auth
            secret:
              secretName: ${backup_secret_name}
              defaultMode: 0440
              items:
              - key: config.yaml
                path: config.yaml
