apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: ${pod_key}
  namespace: ${xr_namespace}
  annotations:
    crossplane.io/composition-resource-name: ${pod_key}
spec:
  managementPolicies:
  - Observe
  providerConfigRef:
    name: provider-kubernetes
    kind: ProviderConfig
  forProvider:
    manifest:
      apiVersion: v1
      kind: Pod
      metadata:
        name: ${pod_name}
        namespace: ${workshop_ns}
  readiness:
    policy: DeriveFromCelQuery
    celQuery: has(object.status) && has(object.status.conditions) && object.status.conditions.exists(c, c.type ==
      'Ready' && c.status == 'True')
  watch: true
