apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ${database_resource}
  namespace: ${runtime_namespace}
spec:
  name: ${database_name}
  owner: postgres
  databaseReclaimPolicy: retain
  cluster:
    name: ${cluster_name}
