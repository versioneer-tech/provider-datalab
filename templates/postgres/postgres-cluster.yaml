apiVersion: postgres-operator.crunchydata.com/v1
kind: PostgresCluster
metadata:
  name: ${cluster_name}
  namespace: ${workshop_ns}
spec:
  postgresVersion: 17
  postGISVersion: '3.5'
  databaseInitSQL:
    name: ${cm_name}
    key: init.sql
  instances:
  - name: primary
    replicas: 1
    dataVolumeClaimSpec: ${data_vcs}
