apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${cluster_name}
  namespace: ${runtime_namespace}
spec:
  imageName: ${postgres_image}
  instances: 1
  enableSuperuserAccess: true
  storage: ${storage}
  bootstrap:
    initdb:
      database: ${database_name}
      owner: datalab
