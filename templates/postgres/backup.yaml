apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${backup_name}
  namespace: ${target}
spec:
  schedule: ${schedule}
  backupOwnerReference: cluster
  cluster:
    name: ${cluster_name}
  method: volumeSnapshot
  online: false
  target: primary
