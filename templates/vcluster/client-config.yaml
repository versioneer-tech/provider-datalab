apiVersion: v1
kind: Config
clusters:
- name: ${name}
  cluster: ${cluster}
contexts:
- name: ${profile}
  context:
    cluster: ${name}
    user: ${profile}
    namespace: ${contexts_0_context_namespace}
current-context: ${profile}
users:
- name: ${profile}
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      interactiveMode: Never
      command: python3
      args: ${args}
      env:
      - name: DATALAB_CLIENT_SECRET
        value: ${secret}
