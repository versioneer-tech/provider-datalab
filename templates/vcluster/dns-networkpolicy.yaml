apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${dns_policy}
  namespace: ${namespace}
  annotations: {}
  labels:
    app: ${runtime}
    release: ${runtime}
spec:
  podSelector:
    matchLabels:
      k8s-app: vcluster-kube-dns
      vcluster.loft.sh/managed-by: ${runtime}
  policyTypes:
  - Egress
  - Ingress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - ports:
    - port: 8443
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          release: ${runtime}
  ingress:
  - ports:
    - port: 1053
      protocol: TCP
    - port: 1053
      protocol: UDP
    from:
    - podSelector:
        matchLabels:
          vcluster.loft.sh/managed-by: ${runtime}
