apiVersion: v1
kind: LimitRange
metadata:
  name: ${service_account}
  namespace: ${namespace}
  labels:
    app: ${runtime}
    release: ${runtime}
spec:
  limits:
  - default:
      cpu: '1'
      ephemeral-storage: 8Gi
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      ephemeral-storage: 3Gi
      memory: 128Mi
    type: Container
