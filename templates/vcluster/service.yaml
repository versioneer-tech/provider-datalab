apiVersion: v1
kind: Service
metadata:
  name: ${runtime}
  namespace: ${namespace}
  labels:
    app: ${runtime}
    release: ${runtime}
    vcluster.loft.sh/service: 'true'
spec:
  type: ClusterIP
  ports:
  - name: https
    port: 443
    targetPort: 8443
    nodePort: 0
    protocol: TCP
  - name: kubelet
    port: 10250
    targetPort: 8443
    nodePort: 0
    protocol: TCP
  selector:
    app: ${runtime}
    release: ${runtime}
