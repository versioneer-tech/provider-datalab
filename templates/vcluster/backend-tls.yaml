apiVersion: ${apiVersion}
kind: BackendTLSPolicy
metadata:
  name: ${runtime}
  namespace: ${namespace}
spec:
  targetRefs:
  - group: ''
    kind: Service
    name: ${runtime}
  validation:
    hostname: ${backend_hostname}
    caCertificateRefs:
    - group: ''
      kind: ConfigMap
      name: ${ca_name}
