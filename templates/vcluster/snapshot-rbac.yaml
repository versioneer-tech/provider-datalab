resources:
  snapshot-binding:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: ${snapshot_role}
    subjects:
    - kind: ServiceAccount
      name: ${service_account}
      namespace: ${namespace}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: datalab-vcluster-volume-snapshots
