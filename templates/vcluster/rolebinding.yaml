kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ${service_account}
  namespace: ${namespace}
  labels:
    app: ${runtime}
    release: ${runtime}
subjects:
- kind: ServiceAccount
  name: ${service_account}
  namespace: ${namespace}
roleRef:
  kind: Role
  name: ${service_account}
  apiGroup: rbac.authorization.k8s.io
