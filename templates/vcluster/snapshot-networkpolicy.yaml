apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${snapshot_policy}
  namespace: ${namespace}
  annotations: {}
  labels:
    app: ${runtime}
    release: ${runtime}
spec:
  podSelector:
    matchLabels:
      app: vcluster-snapshot
  policyTypes:
  - Egress
  - Ingress
  egress:
  - to:
    - podSelector:
        matchLabels:
          release: ${runtime}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - ports:
    - port: 443
      protocol: TCP
    - port: 8443
      protocol: TCP
    - port: 6443
      protocol: TCP
