apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${reader_name}
  namespace: ${namespace}
subjects:
- kind: ServiceAccount
  name: ${service_account}
  namespace: ${runtime_namespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${reader_name}
