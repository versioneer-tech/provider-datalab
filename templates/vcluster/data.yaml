apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${data_pvc}
  namespace: ${namespace}
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ${storage_class}
  resources:
    requests:
      storage: ${spec_resources_requests_storage}
