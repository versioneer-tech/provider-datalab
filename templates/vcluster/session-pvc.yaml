apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${pvc_name}
  namespace: ${target}
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ${storage_class}
  resources:
    requests:
      storage: ${storage}
