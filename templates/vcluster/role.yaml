kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ${service_account}
  namespace: ${namespace}
  labels:
    app: ${runtime}
    release: ${runtime}
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - secrets
  - services
  - pods
  - pods/attach
  - pods/portforward
  - pods/exec
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - patch
  - update
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/status
  - pods/ephemeralcontainers
  verbs:
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - pods/resize
  verbs:
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - statefulsets
  - replicasets
  - deployments
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - endpoints
  - pods/log
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - endpoints
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - create
  - list
  - get
  - delete
  - patch
  - update
  - watch
