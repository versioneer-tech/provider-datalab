apiVersion: v1
kind: Service
metadata:
  name: ${headless_service}
  namespace: ${namespace}
  labels:
    app: ${runtime}
    release: ${runtime}
spec:
  publishNotReadyAddresses: true
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  clusterIP: None
  selector:
    app: ${runtime}
    release: ${runtime}
