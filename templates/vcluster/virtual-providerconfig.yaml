apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: ${virtual_provider}
  namespace: ${claim_namespace}
spec:
  credentials:
    source: Secret
    secretRef:
      name: ${service_account}
      namespace: ${namespace}
      key: config
