apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${workload_policy}
  namespace: ${namespace}
  annotations: {}
  labels:
    app: ${runtime}
    release: ${runtime}
spec:
  podSelector:
    matchLabels:
      vcluster.loft.sh/managed-by: ${runtime}
  policyTypes:
  - Egress
  - Ingress
  egress:
  - ports:
    - port: 1053
      protocol: UDP
    - port: 1053
      protocol: TCP
    - port: 8443
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          release: ${runtime}
  - to:
    - podSelector:
        matchLabels:
          vcluster.loft.sh/managed-by: ${runtime}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          release: ${runtime}
  - from:
    - podSelector:
        matchLabels:
          vcluster.loft.sh/managed-by: ${runtime}
