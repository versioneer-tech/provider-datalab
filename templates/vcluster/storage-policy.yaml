apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ${policy_name}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - persistentvolumeclaims
  matchConditions:
  - name: vcluster-syncer
    expression: ${spec_matchConditions_0_expression}
  validations:
  - expression: ${spec_validations_0_expression}
    message: The PVC must use an allowed Datalab vcluster StorageClass.
