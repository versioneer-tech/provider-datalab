apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${control_policy}
  namespace: ${namespace}
  annotations: {}
  labels:
    app: ${runtime}
    release: ${runtime}
spec:
  podSelector:
    matchLabels:
      release: ${runtime}
  policyTypes:
  - Egress
  - Ingress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - ports:
    - port: 443
      protocol: TCP
    - port: 8443
      protocol: TCP
    - port: 6443
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          release: ${runtime}
  - to:
    - podSelector:
        matchLabels:
          vcluster.loft.sh/managed-by: ${runtime}
  - to:
    - podSelector:
        matchLabels:
          app: loft
      namespaceSelector: {}
  - ports:
    - port: 8080
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ${iam_namespace}
  ingress:
  - ports:
    - port: 8443
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          release: ${runtime}
  - ports:
    - port: 1053
      protocol: UDP
    - port: 1053
      protocol: TCP
    - port: 8443
      protocol: TCP
    from:
    - podSelector:
        matchLabels:
          vcluster.loft.sh/managed-by: ${runtime}
  - from:
    - podSelector:
        matchLabels:
          app: vcluster-snapshot
  - from:
    - podSelector:
        matchLabels:
          app: loft
      namespaceSelector: {}
