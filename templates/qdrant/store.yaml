apiVersion: qdrant.io/v1alpha1
kind: QdrantCluster
metadata:
  name: ${store_name}
  namespace: ${workshop_ns}
spec:
  antiAffinity: true
  apiKey:
    enabled: true
    secret:
      name: ${qdrant_auth_secret_name}
      key: apiKey
  readApiKey:
    enabled: true
    secret:
      name: ${qdrant_auth_secret_name}
      key: readApiKey
  image:
    repository: qdrant/qdrant
    tag: v1.13.4
    pullPolicy: IfNotPresent
  persistence: ${persistence}
