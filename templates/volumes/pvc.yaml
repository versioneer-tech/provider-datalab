apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${pvc_name}
  namespace: ${target}
  labels:
    datalabs.versioneer.at/volume: ${volume_name}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: ${storage}
