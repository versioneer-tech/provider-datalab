apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: RoleMapper
spec:
  providerConfigRef:
    name: provider-keycloak
    kind: ProviderConfig
  forProvider:
    realmId: ${realm}
    clientScopeIdRef:
      name: ${scope_resource}
      policy:
        resolution: Required
        resolve: Always
    roleIdRef:
      name: ${role_resource}
      policy:
        resolution: Required
        resolve: Always
