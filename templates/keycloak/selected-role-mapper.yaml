apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
spec:
  providerConfigRef:
    name: provider-keycloak
    kind: ProviderConfig
  forProvider:
    realmId: ${realm}
    protocol: openid-connect
    protocolMapper: oidc-role-name-mapper
    name: ${mapper_name}
    config:
      role: ${source_role}
      new.role.name: ${role_name}
