apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: RoleMapper
spec:
  providerConfigRef:
    name: provider-keycloak
    kind: ProviderConfig
  forProvider:
    realmId: ${realm}
    clientIdRef:
      name: ${xr_name}
      policy:
        resolution: Required
    roleIdRef:
      name: ${role_name_override}
      policy:
        resolution: Required
