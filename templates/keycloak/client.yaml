apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  labels:
    crossplane.io/claim-name: ${xr_name}
spec:
  providerConfigRef:
    name: provider-keycloak
    kind: ProviderConfig
  forProvider:
    name: ${xr_name}
    clientId: ${xr_name}
    rootUrl: ${url}
    adminUrl: ${url}
    accessType: CONFIDENTIAL
    fullScopeAllowed: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    standardTokenExchangeEnabled: ${exchange_enabled}
    oauth2DeviceAuthorizationGrantEnabled: true
    clientOfflineSessionIdleTimeout: '2592000'
    clientOfflineSessionMaxLifespan: '2592000'
    allowRefreshTokenInStandardTokenExchange: 'NO'
    webOrigins: ${redirect_uris}
    validRedirectUris: ${redirect_uris}
    realmId: ${realm}
  writeConnectionSecretToRef:
    name: ${connection_secret_name}
