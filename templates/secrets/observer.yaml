apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: ${key}
  namespace: ${xr_namespace}
  annotations:
    crossplane.io/composition-resource-name: ${key}
spec:
  managementPolicies:
  - Observe
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ${secret_name}
        namespace: ${secret_namespace}
  providerConfigRef:
    name: provider-kubernetes
    kind: ProviderConfig
  watch: true
